et, regardez dans le trou de la serrure.","pause":750,"fx":null,"afterFx":0},{"text":"Au bout d’une avenue parfaitement encadrée par les haies apparaît la coupole de Saint-Pierre.","pause":850,"fx":null,"afterFx":0},{"text":"L’effet ressemble presque à une longue-vue.","pause":700,"fx":null,"afterFx":0},{"text":"L’Ordre de Malte précise qu’il n’est pas certain que Piranèse ait délibérément conçu exactement cette vue.","pause":850,"fx":null,"afterFx":0},{"text":"Mais avant son intervention, des rangées d’arbres encadraient déjà la coupole, et Piranèse remplaça ensuite ce dispositif par des haies de laurier qui accentuent l’effet de tunnel.","pause":900,"fx":null,"afterFx":0},{"text":"Le résultat produit même une petite illusion : lorsqu’on avance dans l’allée vers Saint-Pierre, la coupole semble paradoxalement s’éloigner.","pause":850,"fx":null,"afterFx":0},{"text":"Vous entendrez aussi parfois dire qu’on voit ici trois États d’un seul regard.","pause":800,"fx":null,"afterFx":0},{"text":"La formule vient du fait que le Vatican apparaît au loin, que vous êtes à Rome en Italie, et que la Villa Magistrale bénéficie de droits d’extraterritorialité.","pause":900,"fx":null,"afterFx":0},{"text":"C’est une jolie manière de raconter la vue, mais ne transformez pas pour autant le jardin de la Villa en troisième pays ordinaire sur une carte.","pause":900,"fx":null,"afterFx":0},{"text":"Et maintenant, regardez une dernière fois.","pause":750,"fx":null,"afterFx":0},{"text":"Après une journée de monuments gigantesques, Rome termine votre après-midi avec quelque chose d’à peine plus grand qu’un trou de serrure.","pause":900,"fx":null,"afterFx":0}]}];
const CLIVUS_CELIO=[{"title":"1. Une rue où Rome devient soudain silencieuse","cues":[{"text":"En arrivant sur le Clivus Scauri, remarquez d’abord ce qui change autour de vous.","pause":750,"fx":null,"afterFx":0},{"text":"Le Colisée n’est pas très loin.","pause":650,"fx":null,"afterFx":0},{"text":"Le Circus Maximus non plus.","pause":650,"fx":null,"afterFx":0},{"text":"Et pourtant, l’atmosphère devient presque immédiatement plus calme.","pause":800,"fx":null,"afterFx":0},{"text":"C’est l’une des promenades les plus étonnantes du Cælius.","pause":700,"fx":null,"afterFx":0},{"text":"Le mot clivus désigne une rue en pente.","pause":700,"fx":null,"afterFx":0},{"text":"Et celle-ci suivait déjà dans l’Antiquité l’axe principal de cette partie de la colline.","pause":800,"fx":null,"afterFx":0},{"text":"Vous ne traversez donc pas une reconstitution.","pause":700,"fx":null,"afterFx":0},{"text":"Vous suivez encore, dans une large mesure, le tracé d’une vraie rue de la Rome impériale.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. Même la rue a gardé son nom antique","cues":[{"text":"Le détail le plus rare est peut-être son nom.","pause":700,"fx":null,"afterFx":0},{"text":"Clivus Scauri est attesté dès l’époque romaine.","pause":750,"fx":null,"afterFx":0},{"text":"Et le nom continue d’apparaître dans les sources médiévales à partir du huitième siècle.","pause":800,"fx":null,"afterFx":0},{"text":"Peu de rues de Rome peuvent revendiquer une telle continuité de tracé et de dénomination.","pause":850,"fx":null,"afterFx":0},{"text":"L’origine du nom est généralement reliée à la puissante famille des Aemilii Scauri.","pause":800,"fx":null,"afterFx":0},{"text":"On l’associe souvent à Marcus Aemilius Scaurus, consul en cent-quinze avant notre ère puis censeur quelques années plus tard.","pause":850,"fx":null,"afterFx":0},{"text":"L’identification exacte reste cependant une attribution traditionnelle, pas une plaque de rue signée de sa main.","pause":850,"fx":null,"afterFx":0},{"text":"Mais la continuité du nom, elle, est bien réelle.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. Les arches ont l’air romaines… mais presque toutes ne le sont pas","cues":[{"text":"Regardez maintenant les grandes arches de briques qui enjambent la rue.","pause":750,"fx":null,"afterFx":0},{"text":"Tout vous pousse à penser : voilà des arcades romaines parfaitement conservées.","pause":800,"fx":null,"afterFx":0},{"text":"Et c’est justement le piège.","pause":700,"fx":null,"afterFx":0},{"text":"La quasi-totalité de ces arches est médiévale.","pause":750,"fx":null,"afterFx":0},{"text":"Elles ont remplacé ou complété des structures plus anciennes afin de soutenir les bâtiments installés au-dessus de la rue.","pause":850,"fx":null,"afterFx":0},{"text":"Une seule appartient à une phase de l’Antiquité tardive.","pause":750,"fx":null,"afterFx":0},{"text":"Et jusqu’au seizième siècle, un second étage d’arcades se dressait encore au-dessus des premières.","pause":850,"fx":null,"afterFx":0},{"text":"Le décor que vous trouvez si romain est donc en réalité un excellent résumé de Rome.","pause":800,"fx":null,"afterFx":0},{"text":"Une rue antique…","pause":950,"fx":null,"afterFx":0},{"text":"Sous des arches surtout médiévales.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. Le Cælius au IVe siècle — un quartier de grandes demeures","cues":[{"text":"Pendant que vous montez, imaginez maintenant le Cælius au quatrième siècle.","pause":750,"fx":null,"afterFx":0},{"text":"La colline était alors l’un des quartiers résidentiels les plus prestigieux de Rome.","pause":800,"fx":null,"afterFx":0},{"text":"De riches familles y possédaient de vastes demeures entourées de jardins.","pause":750,"fx":null,"afterFx":0},{"text":"Le contraste avec les quartiers populaires très denses de la ville devait être considérable.","pause":800,"fx":null,"afterFx":0},{"text":"Et sous vos pieds, une partie de cette histoire est toujours conservée.","pause":750,"fx":null,"afterFx":0},{"text":"Sous la basilique des Saints-Jean-et-Paul se trouvent aujourd’hui les Maisons romaines du Cælius.","pause":800,"fx":null,"afterFx":0},{"text":"Le complexe conserve une vingtaine de pièces appartenant à plusieurs bâtiments datés du premier au quatrième siècle.","pause":850,"fx":null,"afterFx":0},{"text":"On y retrouve des boutiques, des logements, des salles décorées et même un petit établissement de bains privé.","pause":850,"fx":null,"afterFx":0},{"text":"C’est presque un morceau de quartier romain qui a glissé sous la basilique.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. Une découverte faite seulement en 1887","cues":[{"text":"Ces espaces souterrains n’étaient pourtant plus connus à l’époque moderne.","pause":750,"fx":null,"afterFx":0},{"text":"Ils sont redécouverts en mille-huit-cent-quatre-vingt-sept par le père Germano di San Stanislao, alors recteur de la basilique.","pause":850,"fx":null,"afterFx":0},{"text":"Les fouilles révèlent des salles décorées de fresques et plusieurs phases d’habitation superposées.","pause":800,"fx":null,"afterFx":0},{"text":"On passe d’une demeure dotée de bains privés à une insula avec boutiques, puis à une résidence beaucoup plus luxueuse de l’Antiquité tardive.","pause":900,"fx":null,"afterFx":0},{"text":"Au milieu du quatrième siècle, une partie de l’ensemble prend également une fonction chrétienne.","pause":800,"fx":null,"afterFx":0},{"text":"C’est ce qui rend le lieu particulièrement intéressant.","pause":700,"fx":null,"afterFx":0},{"text":"On ne voit pas simplement un bâtiment païen remplacé brutalement par un bâtiment chrétien.","pause":800,"fx":null,"afterFx":0},{"text":"On voit plusieurs siècles de transformations, d’usages et de croyances qui se superposent.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. Jean et Paul — ce que raconte la tradition","cues":[{"text":"La basilique au-dessus de vous est dédiée aux saints Jean et Paul.","pause":750,"fx":null,"afterFx":0},{"text":"Selon la tradition chrétienne, ils auraient été deux hauts personnages de la cour impériale.","pause":800,"fx":null,"afterFx":0},{"text":"Sous l’empereur Julien, au quatrième siècle, ils auraient refusé d’abandonner leur foi chrétienne.","pause":850,"fx":null,"afterFx":0},{"text":"Ils auraient alors été exécutés et enterrés dans leur propre maison.","pause":800,"fx":null,"afterFx":0},{"text":"C’est précisément cette maison que la tradition identifie avec une partie du complexe archéologique situé sous la basilique.","pause":850,"fx":null,"afterFx":0},{"text":"Il faut ici conserver une distinction nette.","pause":700,"fx":null,"afterFx":0},{"text":"Les bâtiments romains, leurs différentes phases et leur transformation en lieu chrétien sont archéologiquement documentés.","pause":850,"fx":null,"afterFx":0},{"text":"L’identification de ces pièces comme la maison personnelle et le lieu exact du martyre de Jean et Paul relève, elle, de la tradition religieuse.","pause":900,"fx":null,"afterFx":0},{"text":"À Rome, les deux niveaux d’histoire vivent souvent dans le même sous-sol.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. Vers San Gregorio — une autre mémoire du Cælius","cues":[{"text":"En descendant ensuite vers San Gregorio al Celio, vous changez encore de période.","pause":750,"fx":null,"afterFx":0},{"text":"Le secteur est traditionnellement associé à Grégoire le Grand, futur pape à la fin du sixième siècle.","pause":800,"fx":null,"afterFx":0},{"text":"La tradition situe ici une propriété familiale qu’il aurait transformée en monastère.","pause":800,"fx":null,"afterFx":0},{"text":"Le complexe devint ensuite un important centre religieux et d’assistance.","pause":750,"fx":null,"afterFx":0},{"text":"Vous passez donc, en quelques centaines de mètres, d’une rue de la République et de l’Empire…","pause":950,"fx":null,"afterFx":0},{"text":"À des demeures aristocratiques de l’Antiquité tardive…","pause":800,"fx":null,"afterFx":0},{"text":"Puis à la mémoire des premiers siècles chrétiens et du haut Moyen Âge.","pause":800,"fx":null,"afterFx":0},{"text":"C’est exactement ce qui fait le charme du Cælius.","pause":700,"fx":null,"afterFx":0},{"text":"Rien ici n’est spectaculaire à la manière du Colisée.","pause":750,"fx":null,"afterFx":0},{"text":"Mais presque chaque mur appartient à une époque différente.","pause":850,"fx":null,"afterFx":0},{"text":"Vous pouvez maintenant poursuivre vers le Circus Maximus.","pause":900,"fx":null,"afterFx":0}]}];
const QUATTRO_CORONATI=[{"title":"1. Une basilique qui ressemble à une forteresse","cues":[{"text":"En arrivant devant Santi Quattro Coronati, regardez d’abord l’ensemble avant de chercher une façade d’église.","pause":800,"fx":null,"afterFx":0},{"text":"Le bâtiment ressemble presque davantage à une petite forteresse médiévale.","pause":750,"fx":null,"afterFx":0},{"text":"Et ce n’est pas un hasard.","pause":650,"fx":null,"afterFx":0},{"text":"Le complexe occupe un site religieux très ancien, établi au milieu du cinquième siècle sur les vestiges d’une résidence romaine.","pause":850,"fx":null,"afterFx":0},{"text":"Au neuvième siècle, le pape Léon Quatre le reconstruit à une échelle beaucoup plus monumentale.","pause":800,"fx":null,"afterFx":0},{"text":"Puis, au treizième siècle, un puissant palais cardinalice fortifié vient encore renforcer son aspect défensif.","pause":850,"fx":null,"afterFx":0},{"text":"La proximité du Latran, alors résidence pontificale, explique une grande partie de cette importance.","pause":800,"fx":null,"afterFx":0},{"text":"Vous n’entrez donc pas simplement dans une église.","pause":700,"fx":null,"afterFx":0},{"text":"Vous entrez dans un morceau de Rome chrétienne qui a aussi été un lieu de pouvoir.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. Pourquoi « les Quatre Saints Couronnés » ? C’est plus compliqué que quatre","cues":[{"text":"Le nom de l’église paraît simple : les Quatre Saints Couronnés.","pause":750,"fx":null,"afterFx":0},{"text":"Mais derrière ce nom se cachent en réalité plusieurs traditions de martyrs.","pause":800,"fx":null,"afterFx":0},{"text":"Une tradition parle de soldats romains convertis au christianisme qui refusèrent de rendre un culte à une divinité païenne.","pause":850,"fx":null,"afterFx":0},{"text":"Une autre raconte l’histoire de tailleurs de pierre de Pannonie qui auraient refusé de sculpter une statue d’Esculape pour l’empereur Dioclétien.","pause":900,"fx":null,"afterFx":0},{"text":"Selon les versions, le nombre de ces artisans varie lui-même dans les récits transmis.","pause":800,"fx":null,"afterFx":0},{"text":"Avec le temps, ces traditions se sont entremêlées dans le culte des saints.","pause":800,"fx":null,"afterFx":0},{"text":"C’est notamment pour cette raison que les tailleurs de pierre et les marbriers ont développé une dévotion particulière envers eux.","pause":850,"fx":null,"afterFx":0},{"text":"Le nom semble donc parfaitement précis.","pause":650,"fx":null,"afterFx":0},{"text":"La légende, elle, est beaucoup moins bien rangée.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. L’incendie de 1084 — pourquoi l’église paraît emboîtée dans elle-même","cues":[{"text":"En avançant dans le complexe, prêtez attention aux deux cours successives.","pause":750,"fx":null,"afterFx":0},{"text":"Elles racontent une catastrophe médiévale.","pause":700,"fx":null,"afterFx":0},{"text":"En mille-quatre-vingt-quatre, les troupes normandes de Robert Guiscard entrent dans Rome pour soutenir le pape Grégoire Sept contre l’empereur Henri Quatre.","pause":900,"fx":null,"afterFx":0},{"text":"Une partie de la ville est incendiée et Santi Quattro Coronati est gravement détruite.","pause":800,"fx":null,"afterFx":0},{"text":"Quelques années plus tard, le pape Pascal Deux la fait reconstruire.","pause":750,"fx":null,"afterFx":0},{"text":"Mais la nouvelle église est plus petite que celle du neuvième siècle.","pause":750,"fx":null,"afterFx":0},{"text":"Résultat : une partie de l’ancienne nef devient une nouvelle cour.","pause":800,"fx":null,"afterFx":0},{"text":"C’est la raison pour laquelle vous avez aujourd’hui cette succession inhabituelle de deux espaces avant d’atteindre l’église.","pause":850,"fx":null,"afterFx":0},{"text":"L’architecture a gardé la mémoire du bâtiment perdu.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. Le palais cardinalice — quand un homme d’Église construit presque un château","cues":[{"text":"Au début du treizième siècle, le complexe change encore d’échelle.","pause":750,"fx":null,"afterFx":0},{"text":"Le cardinal Stefano Conti, alors très proche du pouvoir pontifical, fait construire ici un palais fortifié.","pause":850,"fx":null,"afterFx":0},{"text":"Regardez la massive Torre Maggiore qui domine l’entrée.","pause":750,"fx":null,"afterFx":0},{"text":"Elle appartient à cette transformation.","pause":700,"fx":null,"afterFx":0},{"text":"Le palais comprenait des appartements, des espaces de représentation, une chapelle privée et la grande salle que nous appelons aujourd’hui la Salle gothique.","pause":900,"fx":null,"afterFx":0},{"text":"Nous sommes dans une période où la frontière entre résidence religieuse, centre administratif et bâtiment défensif peut être très mince.","pause":850,"fx":null,"afterFx":0},{"text":"Le Cælius n’était donc pas seulement tranquille et monastique.","pause":750,"fx":null,"afterFx":0},{"text":"Il pouvait aussi être très politique.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. La chapelle Saint-Sylvestre — une fresque raconte un faux célèbre","cues":[{"text":"Si la chapelle Saint-Sylvestre est ouverte, prenez le temps d’observer les fresques consacrées au pape Sylvestre et à l’empereur Constantin.","pause":900,"fx":null,"afterFx":0},{"text":"Le cycle raconte une tradition médiévale selon laquelle Constantin aurait été guéri et converti grâce au pape.","pause":850,"fx":null,"afterFx":0},{"text":"Puis vient la scène la plus célèbre : la Donation de Constantin.","pause":800,"fx":null,"afterFx":0},{"text":"Selon ce récit, l’empereur aurait accordé au pape Sylvestre Rome et de vastes territoires d’Occident.","pause":850,"fx":null,"afterFx":0},{"text":"Le document qui prétendait enregistrer cette donation a longtemps été utilisé pour soutenir les prétentions temporelles de la papauté.","pause":850,"fx":null,"afterFx":0},{"text":"Mais il y a un problème considérable.","pause":750,"fx":null,"afterFx":0},{"text":"Le document est un faux médiéval.","pause":800,"fx":null,"afterFx":0},{"text":"Il n’a pas été rédigé sous Constantin au quatrième siècle, mais plusieurs siècles plus tard, probablement au huitième ou au neuvième siècle.","pause":900,"fx":null,"afterFx":0},{"text":"Vous êtes donc devant une œuvre médiévale montrant comme vérité historique un événement qui n’a jamais eu lieu de cette manière.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. Lorenzo Valla — démonter un faux avec des mots","cues":[{"text":"La manière dont la supercherie a été démontée est presque aussi intéressante que le faux lui-même.","pause":800,"fx":null,"afterFx":0},{"text":"Au quinzième siècle, l’humaniste Lorenzo Valla examine le texte de la Donation.","pause":750,"fx":null,"afterFx":0},{"text":"Il remarque que son latin, son vocabulaire et certaines institutions mentionnées ne correspondent pas au monde de Constantin.","pause":850,"fx":null,"afterFx":0},{"text":"En mille-quatre-cent-quarante, il produit une critique détaillée montrant que le document ne peut pas être authentique.","pause":850,"fx":null,"afterFx":0},{"text":"Pas besoin de carbone quatorze.","pause":650,"fx":null,"afterFx":0},{"text":"Le faux se trahit par sa langue.","pause":750,"fx":null,"afterFx":0},{"text":"C’est l’un des grands épisodes de l’histoire de la critique des textes.","pause":800,"fx":null,"afterFx":0},{"text":"Et cela rend la chapelle particulièrement savoureuse.","pause":700,"fx":null,"afterFx":0},{"text":"Elle conserve magnifiquement l’image d’une histoire à laquelle le Moyen Âge voulait croire…","pause":950,"fx":null,"afterFx":0},{"text":"Alors que quelques siècles plus tard, un philologue allait la démonter mot par mot.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. La Salle gothique — huit cents ans cachée sous de la peinture bleue","cues":[{"text":"La découverte la plus spectaculaire du complexe est beaucoup plus récente.","pause":750,"fx":null,"afterFx":0},{"text":"En mille-neuf-cent-quatre-vingt-seize, pendant une intervention qui n’avait rien d’une grande fouille spectaculaire, des peintures apparaissent sous les enduits.","pause":900,"fx":null,"afterFx":0},{"text":"Elles étaient dissimulées sous plusieurs couches de peinture bleue depuis des siècles.","pause":800,"fx":null,"afterFx":0},{"text":"Au total, environ trois-cents mètres carrés de fresques du treizième siècle sont remis au jour dans la Salle gothique.","pause":900,"fx":null,"afterFx":0},{"text":"Le programme est étonnant : saisons, arts, signes du zodiaque, constellations, vices, vertus et figures symboliques.","pause":850,"fx":null,"afterFx":0},{"text":"Salomon y apparaît comme figure du juge par excellence.","pause":750,"fx":null,"afterFx":0},{"text":"La fonction exacte de la salle n’est pas absolument certaine.","pause":700,"fx":null,"afterFx":0},{"text":"Elle a peut-être servi à des fonctions de représentation ou de justice dans le palais cardinalice.","pause":800,"fx":null,"afterFx":0},{"text":"La Salle gothique n’est ouverte que certains jours sur réservation.","pause":800,"fx":null,"afterFx":0},{"text":"Donc, même si vous ne la voyez pas aujourd’hui, sachez qu’au-dessus de vous se cache l’un des ensembles picturaux médiévaux les plus extraordinaires de Rome.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. Un monastère toujours vivant — et quelques règles de visite","cues":[{"text":"Le complexe n’est pas seulement un monument historique.","pause":700,"fx":null,"afterFx":0},{"text":"Depuis le seizième siècle, il est lié aux moniales augustines.","pause":750,"fx":null,"afterFx":0},{"text":"En mille-cinq-cent-soixante-quatre, le pape Pie Quatre confie ici un orphelinat de jeunes filles à une communauté de religieuses cloîtrées.","pause":850,"fx":null,"afterFx":0},{"text":"Les moniales vivent encore aujourd’hui dans le monastère.","pause":750,"fx":null,"afterFx":0},{"text":"C’est pourquoi la visite doit rester particulièrement discrète.","pause":750,"fx":null,"afterFx":0},{"text":"Pour votre visite du lundi après-midi, gardez également un détail pratique en tête.","pause":800,"fx":null,"afterFx":0},{"text":"La basilique est normalement accessible l’après-midi, mais l’ouverture de l’oratoire de Saint-Sylvestre entre seize heures et dix-sept heures trente n’est pas garantie.","pause":900,"fx":null,"afterFx":0},{"text":"Il faut sonner à la porterie du monastère si vous souhaitez tenter la visite.","pause":800,"fx":null,"afterFx":0},{"text":"Donc si une porte reste fermée, ne concluez pas que vous avez raté quelque chose dans votre itinéraire.","pause":850,"fx":null,"afterFx":0},{"text":"Une partie du charme du lieu tient précisément au fait qu’il reste un monastère habité et non un musée entièrement ouvert.","pause":900,"fx":null,"afterFx":0},{"text":"Vous pouvez maintenant poursuivre vers San Pietro in Vincoli.","pause":900,"fx":null,"afterFx":0}]}];
const SAN_PIETRO_VINCOLI=[{"title":"1. Une église construite autour de chaînes","cues":[{"text":"Vous êtes maintenant dans la basilique San Pietro in Vincoli : Saint-Pierre-aux-Liens.","pause":800,"fx":null,"afterFx":0},{"text":"Son nom vous donne immédiatement la raison principale de sa construction.","pause":750,"fx":null,"afterFx":0},{"text":"Vincoli vient du latin vincula : les liens, les chaînes.","pause":750,"fx":null,"afterFx":0},{"text":"La basilique actuelle trouve son origine au cinquième siècle et est également appelée basilique eudoxienne.","pause":850,"fx":null,"afterFx":0},{"text":"Ce nom rappelle Licinia Eudoxia, épouse de l’empereur Valentinien Trois.","pause":800,"fx":null,"afterFx":0},{"text":"La tradition raconte que sa mère, l’impératrice Eudocie, lui envoya de Jérusalem des chaînes associées à l’emprisonnement de saint Pierre.","pause":900,"fx":null,"afterFx":0},{"text":"À Rome, le pape Léon le Grand possédait déjà d’autres chaînes que la tradition reliait à la captivité romaine de l’apôtre.","pause":900,"fx":null,"afterFx":0},{"text":"Et c’est là que commence le miracle qui a donné son identité au lieu.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. Le miracle des deux chaînes","cues":[{"text":"Selon la tradition médiévale, les deux ensembles de chaînes furent approchés l’un de l’autre devant le pape.","pause":850,"fx":null,"afterFx":0},{"text":"Ils se seraient alors réunis miraculeusement pour ne former qu’une seule chaîne.","pause":850,"fx":null,"afterFx":0},{"text":"C’est pour conserver et célébrer cette relique que la basilique fut développée.","pause":800,"fx":null,"afterFx":0},{"text":"Les chaînes sont aujourd’hui conservées sous le maître-autel.","pause":750,"fx":null,"afterFx":0},{"text":"Le premier août, jour traditionnel de la fête de Saint-Pierre-aux-Liens, elles font l’objet d’une vénération particulière.","pause":850,"fx":null,"afterFx":0},{"text":"Il faut bien distinguer ici histoire et tradition religieuse.","pause":750,"fx":null,"afterFx":0},{"text":"L’existence ancienne du culte des chaînes et de la basilique est documentée.","pause":800,"fx":null,"afterFx":0},{"text":"La fusion miraculeuse des chaînes appartient, elle, à la tradition du sanctuaire.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. Jules II commande un tombeau gigantesque","cues":[{"text":"Dirigez maintenant votre regard vers le monument de Jules Deux, dans le bras droit du transept.","pause":850,"fx":null,"afterFx":0},{"text":"En mille-cinq-cent-cinq, le pape Jules Deux confie à Michel-Ange la réalisation de son monument funéraire.","pause":850,"fx":null,"afterFx":0},{"text":"Le premier projet est immense.","pause":700,"fx":null,"afterFx":0},{"text":"Il devait être un mausolée autonome, peuplé de nombreuses statues et conçu à une échelle presque architecturale.","pause":850,"fx":null,"afterFx":0},{"text":"Mais Jules Deux se passionne bientôt davantage pour un autre chantier : la reconstruction de la basilique Saint-Pierre du Vatican.","pause":900,"fx":null,"afterFx":0},{"text":"Le projet du tombeau est réduit, remanié, reporté, renégocié puis réduit encore.","pause":850,"fx":null,"afterFx":0},{"text":"Cette affaire accompagnera Michel-Ange pendant près de quarante ans.","pause":800,"fx":null,"afterFx":0},{"text":"Il la décrira comme sa « tragédie de la sépulture ».","pause":900,"fx":null,"afterFx":0}]},{"title":"4. Le Moïse — regardez-le avant de chercher les détails","cues":[{"text":"Au centre du monument, regardez maintenant le Moïse.","pause":800,"fx":null,"afterFx":0},{"text":"Michel-Ange le sculpte au début des années quinze-cent-dix.","pause":750,"fx":null,"afterFx":0},{"text":"Moïse est assis, les Tables de la Loi sous le bras.","pause":700,"fx":null,"afterFx":0},{"text":"Mais il ne paraît absolument pas au repos.","pause":700,"fx":null,"afterFx":0},{"text":"Regardez la tension du corps, les muscles, les veines de la main et le mouvement de la barbe.","pause":850,"fx":null,"afterFx":0},{"text":"Le personnage semble retenir une énergie considérable.","pause":750,"fx":null,"afterFx":0},{"text":"La scène est traditionnellement comprise comme le moment où Moïse, revenu du Sinaï, découvre que les Hébreux adorent le veau d’or.","pause":900,"fx":null,"afterFx":0},{"text":"Il n’est donc pas calme.","pause":650,"fx":null,"afterFx":0},{"text":"Il essaie de le devenir.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. Pourquoi Moïse a-t-il des cornes ?","cues":[{"text":"Maintenant, regardez sa tête.","pause":700,"fx":null,"afterFx":0},{"text":"Oui : Moïse a bien deux petites cornes.","pause":750,"fx":null,"afterFx":0},{"text":"Ce n’est ni une plaisanterie de Michel-Ange, ni un symbole diabolique.","pause":800,"fx":null,"afterFx":0},{"text":"L’explication vient d’un passage de l’Exode décrivant le visage de Moïse après sa rencontre avec Dieu.","pause":850,"fx":null,"afterFx":0},{"text":"Le texte hébreu emploie un verbe lié à l’idée de rayonnement.","pause":750,"fx":null,"afterFx":0},{"text":"Dans la Vulgate latine de saint Jérôme, le passage a été rendu avec une expression pouvant faire comprendre que son visage était cornu.","pause":900,"fx":null,"afterFx":0},{"text":"Une longue tradition artistique occidentale a donc représenté Moïse avec des cornes.","pause":800,"fx":null,"afterFx":0},{"text":"On résume souvent l’histoire en parlant d’une simple erreur de traduction.","pause":750,"fx":null,"afterFx":0},{"text":"C’est un peu trop simple : le problème tient aussi aux possibilités de lecture du texte hébreu et à toute une tradition d’interprétation.","pause":900,"fx":null,"afterFx":0},{"text":"Michel-Ange n’invente donc pas ce détail.","pause":700,"fx":null,"afterFx":0},{"text":"Il hérite d’une iconographie déjà ancienne.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. « Pourquoi ne parles-tu pas ? » — la légende de Michel-Ange","cues":[{"text":"Le réalisme du Moïse a donné naissance à une anecdote devenue presque aussi célèbre que la statue.","pause":850,"fx":null,"afterFx":0},{"text":"Selon la légende, Michel-Ange, contemplant son œuvre achevée, aurait été frappé par son apparence presque vivante.","pause":850,"fx":null,"afterFx":0},{"text":"Il aurait alors donné un coup de marteau sur le genou de la statue en lançant : « Pourquoi ne parles-tu pas ? »","pause":900,"fx":null,"afterFx":0},{"text":"On montre parfois une marque sur le genou comme preuve de la scène.","pause":800,"fx":null,"afterFx":0},{"text":"Mais aucun témoignage contemporain solide ne permet de vérifier cette histoire.","pause":800,"fx":null,"afterFx":0},{"text":"Elle appartient à la légende de Michel-Ange, construite autour de l’idée que son talent pouvait presque donner vie au marbre.","pause":900,"fx":null,"afterFx":0},{"text":"Et devant ce Moïse, on comprend assez facilement pourquoi cette légende a survécu.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. Le tombeau de Jules II… sans Jules II","cues":[{"text":"Voici maintenant le détail le plus ironique de toute l’histoire.","pause":750,"fx":null,"afterFx":0},{"text":"Vous êtes devant le monument funéraire de Jules Deux.","pause":700,"fx":null,"afterFx":0},{"text":"Mais Jules Deux n’est pas enterré ici.","pause":800,"fx":null,"afterFx":0},{"text":"Le pape meurt en mille-cinq-cent-treize, longtemps avant l’achèvement définitif du monument.","pause":850,"fx":null,"afterFx":0},{"text":"Il est enterré dans la basilique Saint-Pierre au Vatican.","pause":750,"fx":null,"afterFx":0},{"text":"Le monument de San Pietro in Vincoli, achevé sous une forme très réduite par rapport au projet initial, reste donc essentiellement commémoratif.","pause":900,"fx":null,"afterFx":0},{"text":"Après quarante ans de négociations, de projets et de frustrations…","pause":950,"fx":null,"afterFx":0},{"text":"Le tombeau est finalement vide.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. Une basilique où une relique médiévale rencontre la Renaissance","cues":[{"text":"Avant de sortir, prenez quelques secondes pour regarder l’église dans son ensemble.","pause":800,"fx":null,"afterFx":0},{"text":"San Pietro in Vincoli réunit deux attractions qui appartiennent à des mondes très différents.","pause":800,"fx":null,"afterFx":0},{"text":"Sous l’autel, une relique liée à l’une des grandes traditions du christianisme ancien.","pause":750,"fx":null,"afterFx":0},{"text":"Dans le transept, l’un des chefs-d’œuvre les plus célèbres de la Renaissance.","pause":750,"fx":null,"afterFx":0},{"text":"Et entre les deux, près de quinze siècles d’histoire de Rome chrétienne.","pause":800,"fx":null,"afterFx":0},{"text":"C’est aussi un bon endroit pour se rappeler qu’à Rome, un monument peut être célèbre pour deux raisons totalement différentes.","pause":850,"fx":null,"afterFx":0},{"text":"Ici : des chaînes…","pause":950,"fx":null,"afterFx":0},{"text":"Et un morceau de marbre qui refuse obstinément de parler.","pause":900,"fx":null,"afterFx":0},{"text":"Vous pouvez maintenant poursuivre vers Monti.","pause":900,"fx":null,"afterFx":0}]}];
const MONTI=[{"title":"1. Monti — le premier rione de Rome","cues":[{"text":"Vous entrez maintenant dans Monti.","pause":700,"fx":null,"afterFx":0},{"text":"Administrativement, c’est le rione numéro un de Rome.","pause":750,"fx":null,"afterFx":0},{"text":"Son nom vient des monti, les collines sur lesquelles il s’est développé : surtout l’Esquilin, le Viminal et une partie du Quirinal.","pause":850,"fx":null,"afterFx":0},{"text":"Aujourd’hui, Monti est un mélange de petites rues, de restaurants, d’ateliers, de bars et de boutiques.","pause":800,"fx":null,"afterFx":0},{"text":"Mais sous cette apparence très contemporaine se cache l’un des quartiers les plus anciens de la ville.","pause":800,"fx":null,"afterFx":0},{"text":"Une partie de ce secteur correspond à l’ancienne Suburra.","pause":750,"fx":null,"afterFx":0},{"text":"Et la Suburra n’avait absolument rien du quartier tranquille que vous venez de quitter sur le Cælius.","pause":850,"fx":null,"afterFx":0},{"text":"C’était une Rome dense, populaire et extrêmement vivante.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. La Suburra — l’autre visage de Rome antique","cues":[{"text":"Imaginez maintenant le quartier à l’époque romaine.","pause":700,"fx":null,"afterFx":0},{"text":"Des immeubles d’habitation, des boutiques, des ateliers et des tavernes occupent les rues étroites.","pause":800,"fx":null,"afterFx":0},{"text":"La population y est beaucoup plus mêlée que dans les quartiers aristocratiques du Palatin ou du Cælius.","pause":850,"fx":null,"afterFx":0},{"text":"C’est une zone de commerce, de logement et de passage.","pause":700,"fx":null,"afterFx":0},{"text":"Les constructions serrées et l’emploi abondant du bois rendent aussi les incendies particulièrement redoutables.","pause":850,"fx":null,"afterFx":0},{"text":"Les sources antiques donnent à la Suburra une réputation de quartier bruyant et populaire.","pause":800,"fx":null,"afterFx":0},{"text":"Mais il faut éviter d’en faire une caricature de bas-fonds.","pause":750,"fx":null,"afterFx":0},{"text":"C’était avant tout un morceau extrêmement dense de la ville réelle, où vivaient et travaillaient des milliers de Romains.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. Une muraille pour protéger le Forum d’Auguste du quartier","cues":[{"text":"En vous rapprochant du secteur des Forums impériaux, regardez les grandes maçonneries antiques qui coupent le paysage.","pause":800,"fx":null,"afterFx":0},{"text":"Le Forum d’Auguste était séparé de la Suburra par un mur gigantesque, atteignant par endroits plus de trente mètres de haut.","pause":850,"fx":null,"afterFx":0},{"text":"Ce mur n’était pas seulement monumental.","pause":700,"fx":null,"afterFx":0},{"text":"Il servait aussi de protection.","pause":650,"fx":null,"afterFx":0},{"text":"La pierre employée était notamment choisie pour sa résistance au feu.","pause":750,"fx":null,"afterFx":0},{"text":"D’un côté : le forum officiel, ordonné, monumental et lié au pouvoir impérial.","pause":800,"fx":null,"afterFx":0},{"text":"De l’autre : la Suburra, dense et pleine de constructions privées.","pause":800,"fx":null,"afterFx":0},{"text":"C’est presque une frontière architecturale entre deux manières de vivre Rome.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. Via Baccina — la meilleure chose à faire ici est simplement marcher","cues":[{"text":"En descendant dans les petites rues de Monti, prenez votre temps.","pause":750,"fx":null,"afterFx":0},{"text":"Via Baccina est l’un de ces axes où le quartier se comprend mieux à pied qu’avec une liste de monuments.","pause":850,"fx":null,"afterFx":0},{"text":"La rue suit le tissu serré du vieux quartier entre les Forums et les hauteurs de Monti.","pause":800,"fx":null,"afterFx":0},{"text":"Aujourd’hui, elle mélange logements, petites adresses et commerces de proximité.","pause":750,"fx":null,"afterFx":0},{"text":"Elle accueille aussi le marché couvert de Monti, aménagé en mille-neuf-cent-trente-trois puis restauré à la fin du vingtième siècle.","pause":850,"fx":null,"afterFx":0},{"text":"Mais l’intérêt principal n’est pas de cocher un bâtiment précis.","pause":700,"fx":null,"afterFx":0},{"text":"C’est de sentir que les dimensions du quartier sont restées celles d’une ville faite pour être parcourue à pied.","pause":850,"fx":null,"afterFx":0},{"text":"Après le Colisée et le Circus Maximus, ça fait presque bizarre de revenir à une échelle humaine.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. Madonna dei Monti — une image retrouvée dans un mur","cues":[{"text":"En arrivant vers la Piazza della Madonna dei Monti, regardez l’église Santa Maria ai Monti.","pause":800,"fx":null,"afterFx":0},{"text":"Elle doit son existence à une histoire qui commence en avril mille-cinq-cent-soixante-dix-neuf.","pause":850,"fx":null,"afterFx":0},{"text":"À cet emplacement se trouvait un ancien couvent de Clarisses transformé en habitations.","pause":800,"fx":null,"afterFx":0},{"text":"La tradition raconte que le bâtiment fut secoué par d’étranges vibrations que les habitants prirent pour des phénomènes surnaturels.","pause":850,"fx":null,"afterFx":0},{"text":"Dans une ancienne remise, un ouvrier aurait ensuite entendu une voix lui dire de ne pas la blesser.","pause":850,"fx":null,"afterFx":0},{"text":"En ouvrant le mur, on découvrit une fresque de la Vierge à l’Enfant accompagnée de saints.","pause":800,"fx":null,"afterFx":0},{"text":"La population commença rapidement à attribuer des guérisons miraculeuses à l’image.","pause":800,"fx":null,"afterFx":0},{"text":"Nous sommes ici dans la tradition religieuse du quartier, pas dans un événement que l’on peut vérifier comme un dossier de police.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. Quand le quartier refuse de laisser partir sa Madone","cues":[{"text":"L’histoire ne s’arrête pas à la découverte de l’image.","pause":700,"fx":null,"afterFx":0},{"text":"Le pape Grégoire Treize décide d’abord de la transférer dans une autre église voisine.","pause":800,"fx":null,"afterFx":0},{"text":"Mais dans la nuit du huit mai mille-cinq-cent-quatre-vingts, les hommes venus effectuer le transfert rencontrent l’opposition énergique des habitants.","pause":900,"fx":null,"afterFx":0},{"text":"Le quartier refuse de laisser partir sa Madone.","pause":750,"fx":null,"afterFx":0},{"text":"Finalement, l’image reste sur place.","pause":700,"fx":null,"afterFx":0},{"text":"Une nouvelle église est construite pour elle à partir de mille-cinq-cent-quatre-vingts.","pause":800,"fx":null,"afterFx":0},{"text":"Le projet est confié à Giacomo Della Porta.","pause":700,"fx":null,"afterFx":0},{"text":"C’est un joli renversement.","pause":650,"fx":null,"afterFx":0},{"text":"Au lieu de déplacer l’image vers une église…","pause":950,"fx":null,"afterFx":0},{"text":"On construit finalement l’église autour de l’image.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. La fontaine des Catéchumènes — le salon du quartier","cues":[{"text":"Regardez maintenant la fontaine au centre de la place.","pause":700,"fx":null,"afterFx":0},{"text":"Elle est elle aussi dessinée par Giacomo Della Porta.","pause":750,"fx":null,"afterFx":0},{"text":"Elle est réalisée entre mille-cinq-cent-quatre-vingt-huit et mille-cinq-cent-quatre-vingt-neuf sous Sixte Cinq.","pause":850,"fx":null,"afterFx":0},{"text":"Son bassin octogonal en travertin était conçu pour un usage très concret par les habitants du quartier.","pause":800,"fx":null,"afterFx":0},{"text":"Le nom de fontaine des Catéchumènes vient du collège voisin consacré à l’éducation de convertis au christianisme.","pause":850,"fx":null,"afterFx":0},{"text":"La place devint aussi un espace de marché.","pause":700,"fx":null,"afterFx":0},{"text":"Et aujourd’hui encore, les marches autour de la fontaine servent presque de salon public à Monti.","pause":800,"fx":null,"afterFx":0},{"text":"Autre petite anecdote : le compositeur Ottorino Respighi venait volontiers observer cette fontaine lorsqu’il travaillait sur son poème symphonique Les Fontaines de Rome.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. Monti aujourd’hui — la Suburra a changé, mais le quartier reste vivant","cues":[{"text":"Avant de terminer, regardez simplement les gens autour de vous.","pause":700,"fx":null,"afterFx":0},{"text":"Monti est aujourd’hui l’un des quartiers les plus animés du centre de Rome.","pause":750,"fx":null,"afterFx":0},{"text":"Restaurants, bars à vin, ateliers, galeries et boutiques occupent les rues où se trouvait autrefois une partie de la Suburra.","pause":850,"fx":null,"afterFx":0},{"text":"Évidemment, deux mille ans séparent ces deux villes.","pause":700,"fx":null,"afterFx":0},{"text":"Mais une continuité reste perceptible.","pause":650,"fx":null,"afterFx":0},{"text":"Monti est toujours un quartier que l’on habite, où l’on mange, où l’on travaille et où l’on se rencontre.","pause":850,"fx":null,"afterFx":0},{"text":"C’est sans doute la meilleure manière de terminer cette promenade.","pause":750,"fx":null,"afterFx":0},{"text":"Après une journée consacrée aux empereurs, aux martyrs, aux basiliques et aux monuments…","pause":950,"fx":null,"afterFx":0},{"text":"vous revenez simplement dans un quartier vivant.","pause":800,"fx":null,"afterFx":0},{"text":"Vous pouvez maintenant arrêter l’audioguide et profiter de Monti à votre rythme.","pause":900,"fx":null,"afterFx":0}]}];

     wakeLockSentinel=await navigator.wakeLock.request('screen');
     wakeLockSentinel.addEventListener('release',()=>{wakeLockSentinel=null});
   }
 }catch(e){}
}
async function releaseWakeLock(){
 try{
   if(wakeLockSentinel){
     const w=wakeLockSentinel;
     wakeLockSentinel=null;
     await w.release();
   }
 }catch(e){}
}
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='visible' && running && !paused)requestWakeLock();
});
function loadVoices(){voices=synth.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith('fr'));$('voice').innerHTML='';voices.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v.name;if(/Audrey|Thomas|Marie|Amélie|Siri/i.test(v.name)&&!$('voice').dataset.p){o.selected=true;$('voice').dataset.p='1'}$('voice').appendChild(o)})}
loadVoices();if('onvoiceschanged'in synth)synth.onvoiceschanged=loadVoices;

function renderTabs(){$('tabs').innerHTML='';ROUTES.forEach((r,i)=>{const b=document.createElement('button');b.className='tab'+(i===day?' active':'');b.textContent=r.day||r.name;b.onclick=()=>{day=i;renderTabs();renderStops()};$('tabs').appendChild(b)})}
function renderStops(){$('stops').innerHTML='';ROUTES[day].stops.forEach(s=>{const a=document.createElement('article');a.className='stop'+(s.immersive?' special':'');a.innerHTML=`${s.immersive?'<div class="badge">✦ visite immersive</div>':''}<h2>${s.title}</h2><p>${s.immersive?'Narration guidée + ambiances synchronisées':'Audioguide du lieu'}</p><div class="actions"><button class="play">${s.immersive?'Commencer':'Écouter'}</button><a class="map" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lon}">⌖</a></div>`;a.querySelector('.play').onclick=()=>s.immersive?openImmersive(s):openNormal(s);$('stops').appendChild(a)})}
renderTabs();renderStops();

function openPanel(s){$('panel').classList.add('open');$('controls').classList.add('show');$('panelTitle').textContent=s.title;$('title').textContent=s.title;document.body.style.overflow='hidden'}
function closePanel(){stopAll();$('panel').classList.remove('open');$('controls').classList.remove('show');document.body.style.overflow='';mode=null}
$('back').onclick=closePanel;

function openImmersive(s){
 mode='immersive';
 currentStop=s;
 openPanel(s);
 flat=[];
 const dataset=IMMERSIVES[s.immersiveKey||'colisee']||IMMERSIVE;
 dataset.forEach((sec,si)=>sec.cues.forEach((c,ci)=>flat.push({...c,section:sec.title,si,ci})));
 idx=0;
 transitionShownFor=-1;
 $('kicker').textContent='Visite immersive';
 $('fulltext').innerHTML=dataset.map((x,si)=>`<details class="chapterdetail" data-si="${si}"><summary>${x.title}</summary><p>${x.cues.map(c=>c.text).join(' ')}</p></details>`).join('');
 document.querySelectorAll('.chapterdetail').forEach(d=>{
   d.addEventListener('toggle',()=>{
     if(d.open)selectChapterFromText(Number(d.dataset.si));
   });
 });
 markSelectedChapter(0);
 update();
}
function openNormal(s){mode='normal';currentStop=s;openPanel(s);$('kicker').textContent='Audioguide';$('chapter').textContent='Prêt';$('currentText').textContent=s.text;$('fulltext').innerHTML=`<details open><summary>Texte</summary><p>${s.text}</p></details>`;$('bar').style.width='0';$('pos').textContent='';$('pct').textContent='';$('playpause').textContent='▶︎'}

function ensureCtx(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}
function stopFx(){nodes.forEach(n=>{try{n.stop()}catch(e){}});nodes=[];$('ambience').textContent=''}
function gain(v){const g=ctx.createGain();g.gain.value=v*Number($('fxvol').value||.55);g.connect(ctx.destination);return g}
function osc(f,d,v=.12,type='sine',when=0){const o=ctx.createOscillator(),g=gain(v);o.type=type;o.frequency.value=f;o.connect(g);const t=ctx.currentTime+when;g.gain.setValueAtTime(v*Number($('fxvol').value||.55),t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d);nodes.push(o)}
function noise(d,v=.1,low=900,when=0){const len=Math.floor(ctx.sampleRate*d),b=ctx.createBuffer(1,len,ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<len;i++)a[i]=Math.random()*2-1;const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=gain(v);f.type='lowpass';f.frequency.value=low;s.buffer=b;s.connect(f);f.connect(g);const t=ctx.currentTime+when;s.start(t);s.stop(t+d);nodes.push(s)}
async function fx(name,id){
if(id!==runId)return;
if(REAL_SOUND_URLS[name]){
  stopFx();
  const a=getRealSound(name);
  if(!a)return;
  $('ambience').textContent='Son réel…';
  try{
    a.pause();a.currentTime=0;
    a.volume=Math.max(0,Math.min(1,Number($('fxvol').value||.55)));
    await a.play();
    await sleep(REAL_SOUND_DURATIONS[name]||2600);
    a.pause();a.currentTime=0;
  }catch(e){}
  if(id===runId){$('ambience').textContent='';await sleep(120)}
  return;
}
ensureCtx();stopFx();$('ambience').textContent='Ambiance sonore…';let d=1.5;
if(name==='fanfare'){d=2.1;[261,329,392,523].forEach((f,k)=>osc(f,.7,.10,'sawtooth',k*.32))}
else if(name==='crowd'||name==='crowd_big'){d=2;noise(d,name==='crowd_big'?.15:.10,1200);[115,155,205,260].forEach((f,k)=>osc(f,d,.016,'sine',k*.05))}
else if(name==='steps_crowd'){d=1.8;noise(d,.07,850);[.15,.45,.75,1.05,1.35].forEach(t=>osc(80,.1,.10,'sine',t))}
else if(name==='gate'){d=1.3;[.05,.38,.75].forEach((t,k)=>osc([620,430,300][k],.35,.15,'square',t))}
else if(name==='roar'){d=1.5;noise(d,.15,270);osc(62,d,.07,'sawtooth')}
else if(name==='swords'){d=1.1;[.08,.48].forEach(t=>{osc(1500,.2,.10,'square',t);osc(2400,.17,.07,'sine',t)})}
else if(name==='wind'){d=1.7;noise(d,.10,550)}
else if(name==='drum'){d=1.5;osc(70,.65,.17,'sine',.05);osc(58,.65,.15,'sine',.72)}
else if(name==='applause'){d=1.9;noise(d,.13,1800)}
else if(name==='finale'){d=2.2;noise(d,.09,1000);[261,329,392,523].forEach((f,k)=>osc(f,.6,.07,'sawtooth',1+k*.27))}
else if(name==='church'){d=2.0;[220,277,330].forEach((f,k)=>osc(f,1.65,.035,'sine',k*.08));osc(660,1.3,.022,'sine',.15)}
else if(name==='stone_steps'){d=1.6;[.12,.42,.72,1.02,1.32].forEach((t,k)=>osc(82-k*3,.13,.105,'sine',t))}
else if(name==='bell'){d=1.8;osc(440,1.55,.075,'sine',.02);osc(880,1.15,.035,'sine',.02);osc(1320,.85,.018,'sine',.02)}
else if(name==='underground'){d=1.8;noise(d,.055,300);osc(54,d,.022,'sine',0)}
else if(name==='metal'){d=1.25;[.08,.58].forEach(t=>{osc(980,.22,.08,'square',t);osc(1760,.18,.035,'sine',t)})}
else if(name==='water'){d=2.4;noise(d,.06,2400);[.22,.66,1.08,1.55,1.96].forEach((t,k)=>osc(1150+k*90,.09,.024,'sine',t))}
else if(name==='fire_soft'){d=1.8;noise(d,.035,500);[.18,.52,.91,1.27,1.53].forEach((t,k)=>osc(95+k*6,.08,.025,'sine',t))}
else if(name==='fire_fade'){d=2.2;noise(d,.028,420);osc(78,1.7,.018,'sine',.05)}
else if(name==='cloth_release'){d=1.2;noise(d,.018,1400);osc(180,.35,.025,'sine',.35)}
await sleep(d*1000);if(id===runId){stopFx();await sleep(120)}}
function speak(text,id){return new Promise(res=>{if(id!==runId)return res();const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=Number($('rate').value)||.96;const v=voices[Number($('voice').value)||0];if(v)u.voice=v;u.onend=res;u.onerror=res;synth.speak(u)})}
function markSelectedChapter(si){
 document.querySelectorAll('.chapterdetail').forEach(d=>{
   d.classList.toggle('selected-chapter',Number(d.dataset.si)===si);
 });
}
function selectChapterFromText(si){
 if(mode!=='immersive'||!flat.length)return;
 if(running||paused)stopAll();
 idx=chapterStart(si);
 transitionShownFor=-1;
 markSelectedChapter(si);
 update();
}
function chapterCount(){
 if(!flat.length)return 0;
 return Math.max(...flat.map(x=>x.si))+1;
}
function currentChapterIndex(){
 if(!flat.length)return 0;
 const safe=Math.min(idx,flat.length-1);
 return flat[safe]?.si??0;
}
function chapterStart(si){
 const n=flat.findIndex(x=>x.si===si);
 return n<0?0:n;
}
function update(){
 if(mode!=='immersive')return;
 const total=flat.length;
 const p=total?Math.round(idx/total*100):0;
 const chapters=chapterCount();
 const si=currentChapterIndex();
 $('bar').style.width=p+'%';
 $('pos').textContent='Chapitre '+Math.min(si+1,chapters)+' / '+chapters;
 $('pct').textContent=p+' %';
 if(idx<total){
   $('chapter').textContent=flat[idx].section;
   $('currentText').textContent=flat[idx].text;
 }
}
async function showChapterTransition(si,id){
 if(id!==runId||transitionShownFor===si)return;
 transitionShownFor=si;
 markSelectedChapter(si);
 const chapters=chapterCount();
 const cue=flat[chapterStart(si)];
 if(!cue)return;
 const scene=document.querySelector('.scene');
 scene.classList.add('chapter-transition');
 $('chapter').textContent='Étape '+(si+1)+' sur '+chapters;
 $('currentText').textContent=cue.section;
 $('ambience').textContent='Nouvelle étape';
 await sleep(si===0?1200:2400);
 if(id!==runId)return;
 scene.classList.remove('chapter-transition');
 $('ambience').textContent='';
 update();
}
async function runImmersive(){
 if(running)return;
 ensureCtx();
 requestWakeLock();
 // Sur iPhone, la première synthèse doit partir directement du geste utilisateur.
 // On évite donc tout délai AVANT la première phrase de la session.
 try{synth.resume()}catch(e){}
 running=true;
 paused=false;
 $('playpause').textContent='Ⅱ';
 const id=runId;
 let firstCueOfSession=true;
 while(idx<flat.length&&id===runId){
   const c=flat[idx];
   if(c.ci===0){
     if(firstCueOfSession){
       // Le titre reste affiché à l'écran, mais on lance la voix immédiatement.
       transitionShownFor=c.si;
     }else{
       await showChapterTransition(c.si,id);
     }
   }
   if(id!==runId)break;
   update();
   await speak(c.text,id);
   firstCueOfSession=false;
   if(id!==runId)break;
   await sleep(c.pause||650);
   if(c.fx){
     await fx(c.fx,id);
     if(id!==runId)break;
     await sleep(c.afterFx||350);
   }
   idx++;
   if(idx<flat.length && flat[idx].si!==c.si){
     // Respiration supplémentaire avant l'écran de transition du chapitre suivant.
     await sleep(900);
   }
   update();
 }
 if(id===runId){
   running=false;
   releaseWakeLock();
   $('playpause').textContent='▶︎';
   if(idx>=flat.length){
     $('chapter').textContent='Visite terminée';
     $('currentText').textContent=(currentStop&&currentStop.endText)||'Visite terminée.';
     $('pos').textContent='Terminé';
     $('pct').textContent='100 %';
     $('bar').style.width='100%';
   }
 }
}
function runNormal(){
 synth.cancel();ensureCtx();requestWakeLock();
 const u=new SpeechSynthesisUtterance(currentStop.text);
 u.lang='fr-FR';u.rate=Number($('rate').value)||.96;
 const v=voices[Number($('voice').value)||0];if(v)u.voice=v;
 running=true;$('playpause').textContent='Ⅱ';
 u.onend=()=>{running=false;releaseWakeLock();$('playpause').textContent='▶︎';$('bar').style.width='100%'};
 synth.speak(u)
}
function stopAll(){
 runId++;
 synth.cancel();
 releaseWakeLock();
 stopFx();
 running=false;
 paused=false;
 $('playpause').textContent='▶︎';
 const scene=document.querySelector('.scene');
 if(scene)scene.classList.remove('chapter-transition');
}
function toggle(){
 ensureCtx();
 primeRealSounds();
 if(running&&!paused){
   paused=true;
   synth.pause();
   releaseWakeLock();
   $('playpause').textContent='▶︎';
   return;
 }
 if(running&&paused){
   paused=false;
   synth.resume();
   requestWakeLock();
   $('playpause').textContent='Ⅱ';
   return;
 }
 mode==='immersive'?runImmersive():runNormal()
}
function goChapter(delta){
 if(mode!=='immersive'||!flat.length)return;
 const wasPlaying=running&&!paused;
 const chapters=chapterCount();
 const current=currentChapterIndex();
 const target=Math.max(0,Math.min(chapters-1,current+delta));
 if(target===current && delta<0){
   // "Previous" at the first chapter simply restarts it.
   stopAll();
   idx=chapterStart(current);
   transitionShownFor=-1;
   markSelectedChapter(current);
   update();
   if(wasPlaying)setTimeout(runImmersive,80);
   return;
 }
 if(target===current)return;
 stopAll();
 idx=chapterStart(target);
 transitionShownFor=-1;
 markSelectedChapter(target);
 update();
 if(wasPlaying)setTimeout(runImmersive,80);
}
$('playpause').onclick=toggle;
$('prev').onclick=()=>goChapter(-1);
$('next').onclick=()=>goChapter(1);
</script>
</body></html>
