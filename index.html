, gardez-la dans votre champ de vision.","pause":750,"fx":null,"afterFx":0},{"text":"La basilique remonte au cinquième siècle et reste l’un des grands témoignages de l’architecture chrétienne ancienne à Rome.","pause":850,"fx":null,"afterFx":0},{"text":"Son extérieur est très sobre comparé aux grandes façades baroques que vous rencontrerez ailleurs dans la ville.","pause":800,"fx":null,"afterFx":0},{"text":"Cette simplicité est justement une partie de son intérêt.","pause":700,"fx":null,"afterFx":0},{"text":"Vous êtes ici dans un secteur où l’Antiquité tardive, le Moyen Âge, les Dominicains et la Rome moderne se touchent presque sans transition.","pause":850,"fx":null,"afterFx":0},{"text":"C’est aussi ce qui explique que l’Aventin donne parfois l’impression d’être hors du temps.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. Piranèse transforme une petite place en décor","cues":[{"text":"En quittant le Jardin des Orangers, continuez vers la Piazza dei Cavalieri di Malta.","pause":800,"fx":null,"afterFx":0},{"text":"La petite place doit son aspect actuel à Giovanni Battista Piranèse.","pause":750,"fx":null,"afterFx":0},{"text":"En mille-sept-cent-soixante-cinq, l’artiste et architecte réaménage cet espace ainsi que l’église de la Villa Magistrale de l’Ordre de Malte.","pause":850,"fx":null,"afterFx":0},{"text":"Regardez les murs et les portes.","pause":650,"fx":null,"afterFx":0},{"text":"Le décor accumule symboles, trophées et références à l’histoire des chevaliers.","pause":750,"fx":null,"afterFx":0},{"text":"La place fonctionne presque comme une antichambre théâtrale avant même d’atteindre la villa.","pause":800,"fx":null,"afterFx":0},{"text":"Et pourtant, ce n’est pas le décor que presque tout le monde vient voir.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. Le trou de serrure — Saint-Pierre transformé en illusion d’optique","cues":[{"text":"Cherchez maintenant le portail du numéro trois.","pause":700,"fx":null,"afterFx":0},{"text":"Et si la file le permet, regardez dans le trou de la serrure.","pause":750,"fx":null,"afterFx":0},{"text":"Au bout d’une avenue parfaitement encadrée par les haies apparaît la coupole de Saint-Pierre.","pause":850,"fx":null,"afterFx":0},{"text":"L’effet ressemble presque à une longue-vue.","pause":700,"fx":null,"afterFx":0},{"text":"L’Ordre de Malte précise qu’il n’est pas certain que Piranèse ait délibérément conçu exactement cette vue.","pause":850,"fx":null,"afterFx":0},{"text":"Mais avant son intervention, des rangées d’arbres encadraient déjà la coupole, et Piranèse remplaça ensuite ce dispositif par des haies de laurier qui accentuent l’effet de tunnel.","pause":900,"fx":null,"afterFx":0},{"text":"Le résultat produit même une petite illusion : lorsqu’on avance dans l’allée vers Saint-Pierre, la coupole semble paradoxalement s’éloigner.","pause":850,"fx":null,"afterFx":0},{"text":"Vous entendrez aussi parfois dire qu’on voit ici trois États d’un seul regard.","pause":800,"fx":null,"afterFx":0},{"text":"La formule vient du fait que le Vatican apparaît au loin, que vous êtes à Rome en Italie, et que la Villa Magistrale bénéficie de droits d’extraterritorialité.","pause":900,"fx":null,"afterFx":0},{"text":"C’est une jolie manière de raconter la vue, mais ne transformez pas pour autant le jardin de la Villa en troisième pays ordinaire sur une carte.","pause":900,"fx":null,"afterFx":0},{"text":"Et maintenant, regardez une dernière fois.","pause":750,"fx":null,"afterFx":0},{"text":"Après une journée de monuments gigantesques, Rome termine votre après-midi avec quelque chose d’à peine plus grand qu’un trou de serrure.","pause":900,"fx":null,"afterFx":0}]}];
const CLIVUS_CELIO=[{"title":"1. Une rue où Rome devient soudain silencieuse","cues":[{"text":"En arrivant sur le Clivus Scauri, remarquez d’abord ce qui change autour de vous.","pause":750,"fx":null,"afterFx":0},{"text":"Le Colisée n’est pas très loin.","pause":650,"fx":null,"afterFx":0},{"text":"Le Circus Maximus non plus.","pause":650,"fx":null,"afterFx":0},{"text":"Et pourtant, l’atmosphère devient presque immédiatement plus calme.","pause":800,"fx":null,"afterFx":0},{"text":"C’est l’une des promenades les plus étonnantes du Cælius.","pause":700,"fx":null,"afterFx":0},{"text":"Le mot clivus désigne une rue en pente.","pause":700,"fx":null,"afterFx":0},{"text":"Et celle-ci suivait déjà dans l’Antiquité l’axe principal de cette partie de la colline.","pause":800,"fx":null,"afterFx":0},{"text":"Vous ne traversez donc pas une reconstitution.","pause":700,"fx":null,"afterFx":0},{"text":"Vous suivez encore, dans une large mesure, le tracé d’une vraie rue de la Rome impériale.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. Même la rue a gardé son nom antique","cues":[{"text":"Le détail le plus rare est peut-être son nom.","pause":700,"fx":null,"afterFx":0},{"text":"Clivus Scauri est attesté dès l’époque romaine.","pause":750,"fx":null,"afterFx":0},{"text":"Et le nom continue d’apparaître dans les sources médiévales à partir du huitième siècle.","pause":800,"fx":null,"afterFx":0},{"text":"Peu de rues de Rome peuvent revendiquer une telle continuité de tracé et de dénomination.","pause":850,"fx":null,"afterFx":0},{"text":"L’origine du nom est généralement reliée à la puissante famille des Aemilii Scauri.","pause":800,"fx":null,"afterFx":0},{"text":"On l’associe souvent à Marcus Aemilius Scaurus, consul en cent-quinze avant notre ère puis censeur quelques années plus tard.","pause":850,"fx":null,"afterFx":0},{"text":"L’identification exacte reste cependant une attribution traditionnelle, pas une plaque de rue signée de sa main.","pause":850,"fx":null,"afterFx":0},{"text":"Mais la continuité du nom, elle, est bien réelle.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. Les arches ont l’air romaines… mais presque toutes ne le sont pas","cues":[{"text":"Regardez maintenant les grandes arches de briques qui enjambent la rue.","pause":750,"fx":null,"afterFx":0},{"text":"Tout vous pousse à penser : voilà des arcades romaines parfaitement conservées.","pause":800,"fx":null,"afterFx":0},{"text":"Et c’est justement le piège.","pause":700,"fx":null,"afterFx":0},{"text":"La quasi-totalité de ces arches est médiévale.","pause":750,"fx":null,"afterFx":0},{"text":"Elles ont remplacé ou complété des structures plus anciennes afin de soutenir les bâtiments installés au-dessus de la rue.","pause":850,"fx":null,"afterFx":0},{"text":"Une seule appartient à une phase de l’Antiquité tardive.","pause":750,"fx":null,"afterFx":0},{"text":"Et jusqu’au seizième siècle, un second étage d’arcades se dressait encore au-dessus des premières.","pause":850,"fx":null,"afterFx":0},{"text":"Le décor que vous trouvez si romain est donc en réalité un excellent résumé de Rome.","pause":800,"fx":null,"afterFx":0},{"text":"Une rue antique…","pause":950,"fx":null,"afterFx":0},{"text":"Sous des arches surtout médiévales.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. Le Cælius au IVe siècle — un quartier de grandes demeures","cues":[{"text":"Pendant que vous montez, imaginez maintenant le Cælius au quatrième siècle.","pause":750,"fx":null,"afterFx":0},{"text":"La colline était alors l’un des quartiers résidentiels les plus prestigieux de Rome.","pause":800,"fx":null,"afterFx":0},{"text":"De riches familles y possédaient de vastes demeures entourées de jardins.","pause":750,"fx":null,"afterFx":0},{"text":"Le contraste avec les quartiers populaires très denses de la ville devait être considérable.","pause":800,"fx":null,"afterFx":0},{"text":"Et sous vos pieds, une partie de cette histoire est toujours conservée.","pause":750,"fx":null,"afterFx":0},{"text":"Sous la basilique des Saints-Jean-et-Paul se trouvent aujourd’hui les Maisons romaines du Cælius.","pause":800,"fx":null,"afterFx":0},{"text":"Le complexe conserve une vingtaine de pièces appartenant à plusieurs bâtiments datés du premier au quatrième siècle.","pause":850,"fx":null,"afterFx":0},{"text":"On y retrouve des boutiques, des logements, des salles décorées et même un petit établissement de bains privé.","pause":850,"fx":null,"afterFx":0},{"text":"C’est presque un morceau de quartier romain qui a glissé sous la basilique.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. Une découverte faite seulement en 1887","cues":[{"text":"Ces espaces souterrains n’étaient pourtant plus connus à l’époque moderne.","pause":750,"fx":null,"afterFx":0},{"text":"Ils sont redécouverts en mille-huit-cent-quatre-vingt-sept par le père Germano di San Stanislao, alors recteur de la basilique.","pause":850,"fx":null,"afterFx":0},{"text":"Les fouilles révèlent des salles décorées de fresques et plusieurs phases d’habitation superposées.","pause":800,"fx":null,"afterFx":0},{"text":"On passe d’une demeure dotée de bains privés à une insula avec boutiques, puis à une résidence beaucoup plus luxueuse de l’Antiquité tardive.","pause":900,"fx":null,"afterFx":0},{"text":"Au milieu du quatrième siècle, une partie de l’ensemble prend également une fonction chrétienne.","pause":800,"fx":null,"afterFx":0},{"text":"C’est ce qui rend le lieu particulièrement intéressant.","pause":700,"fx":null,"afterFx":0},{"text":"On ne voit pas simplement un bâtiment païen remplacé brutalement par un bâtiment chrétien.","pause":800,"fx":null,"afterFx":0},{"text":"On voit plusieurs siècles de transformations, d’usages et de croyances qui se superposent.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. Jean et Paul — ce que raconte la tradition","cues":[{"text":"La basilique au-dessus de vous est dédiée aux saints Jean et Paul.","pause":750,"fx":null,"afterFx":0},{"text":"Selon la tradition chrétienne, ils auraient été deux hauts personnages de la cour impériale.","pause":800,"fx":null,"afterFx":0},{"text":"Sous l’empereur Julien, au quatrième siècle, ils auraient refusé d’abandonner leur foi chrétienne.","pause":850,"fx":null,"afterFx":0},{"text":"Ils auraient alors été exécutés et enterrés dans leur propre maison.","pause":800,"fx":null,"afterFx":0},{"text":"C’est précisément cette maison que la tradition identifie avec une partie du complexe archéologique situé sous la basilique.","pause":850,"fx":null,"afterFx":0},{"text":"Il faut ici conserver une distinction nette.","pause":700,"fx":null,"afterFx":0},{"text":"Les bâtiments romains, leurs différentes phases et leur transformation en lieu chrétien sont archéologiquement documentés.","pause":850,"fx":null,"afterFx":0},{"text":"L’identification de ces pièces comme la maison personnelle et le lieu exact du martyre de Jean et Paul relève, elle, de la tradition religieuse.","pause":900,"fx":null,"afterFx":0},{"text":"À Rome, les deux niveaux d’histoire vivent souvent dans le même sous-sol.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. Vers San Gregorio — une autre mémoire du Cælius","cues":[{"text":"En descendant ensuite vers San Gregorio al Celio, vous changez encore de période.","pause":750,"fx":null,"afterFx":0},{"text":"Le secteur est traditionnellement associé à Grégoire le Grand, futur pape à la fin du sixième siècle.","pause":800,"fx":null,"afterFx":0},{"text":"La tradition situe ici une propriété familiale qu’il aurait transformée en monastère.","pause":800,"fx":null,"afterFx":0},{"text":"Le complexe devint ensuite un important centre religieux et d’assistance.","pause":750,"fx":null,"afterFx":0},{"text":"Vous passez donc, en quelques centaines de mètres, d’une rue de la République et de l’Empire…","pause":950,"fx":null,"afterFx":0},{"text":"À des demeures aristocratiques de l’Antiquité tardive…","pause":800,"fx":null,"afterFx":0},{"text":"Puis à la mémoire des premiers siècles chrétiens et du haut Moyen Âge.","pause":800,"fx":null,"afterFx":0},{"text":"C’est exactement ce qui fait le charme du Cælius.","pause":700,"fx":null,"afterFx":0},{"text":"Rien ici n’est spectaculaire à la manière du Colisée.","pause":750,"fx":null,"afterFx":0},{"text":"Mais presque chaque mur appartient à une époque différente.","pause":850,"fx":null,"afterFx":0},{"text":"Vous pouvez maintenant poursuivre vers le Circus Maximus.","pause":900,"fx":null,"afterFx":0}]}];
const QUATTRO_CORONATI=[{"title":"1. Une basilique qui ressemble à une forteresse","cues":[{"text":"En arrivant devant Santi Quattro Coronati, regardez d’abord l’ensemble avant de chercher une façade d’église.","pause":800,"fx":null,"afterFx":0},{"text":"Le bâtiment ressemble presque davantage à une petite forteresse médiévale.","pause":750,"fx":null,"afterFx":0},{"text":"Et ce n’est pas un hasard.","pause":650,"fx":null,"afterFx":0},{"text":"Le complexe occupe un site religieux très ancien, établi au milieu du cinquième siècle sur les vestiges d’une résidence romaine.","pause":850,"fx":null,"afterFx":0},{"text":"Au neuvième siècle, le pape Léon Quatre le reconstruit à une échelle beaucoup plus monumentale.","pause":800,"fx":null,"afterFx":0},{"text":"Puis, au treizième siècle, un puissant palais cardinalice fortifié vient encore renforcer son aspect défensif.","pause":850,"fx":null,"afterFx":0},{"text":"La proximité du Latran, alors résidence pontificale, explique une grande partie de cette importance.","pause":800,"fx":null,"afterFx":0},{"text":"Vous n’entrez donc pas simplement dans une église.","pause":700,"fx":null,"afterFx":0},{"text":"Vous entrez dans un morceau de Rome chrétienne qui a aussi été un lieu de pouvoir.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. Pourquoi « les Quatre Saints Couronnés » ? C’est plus compliqué que quatre","cues":[{"text":"Le nom de l’église paraît simple : les Quatre Saints Couronnés.","pause":750,"fx":null,"afterFx":0},{"text":"Mais derrière ce nom se cachent en réalité plusieurs traditions de martyrs.","pause":800,"fx":null,"afterFx":0},{"text":"Une tradition parle de soldats romains convertis au christianisme qui refusèrent de rendre un culte à une divinité païenne.","pause":850,"fx":null,"afterFx":0},{"text":"Une autre raconte l’histoire de tailleurs de pierre de Pannonie qui auraient refusé de sculpter une statue d’Esculape pour l’empereur Dioclétien.","pause":900,"fx":null,"afterFx":0},{"text":"Selon les versions, le nombre de ces artisans varie lui-même dans les récits transmis.","pause":800,"fx":null,"afterFx":0},{"text":"Avec le temps, ces traditions se sont entremêlées dans le culte des saints.","pause":800,"fx":null,"afterFx":0},{"text":"C’est notamment pour cette raison que les tailleurs de pierre et les marbriers ont développé une dévotion particulière envers eux.","pause":850,"fx":null,"afterFx":0},{"text":"Le nom semble donc parfaitement précis.","pause":650,"fx":null,"afterFx":0},{"text":"La légende, elle, est beaucoup moins bien rangée.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. L’incendie de 1084 — pourquoi l’église paraît emboîtée dans elle-même","cues":[{"text":"En avançant dans le complexe, prêtez attention aux deux cours successives.","pause":750,"fx":null,"afterFx":0},{"text":"Elles racontent une catastrophe médiévale.","pause":700,"fx":null,"afterFx":0},{"text":"En mille-quatre-vingt-quatre, les troupes normandes de Robert Guiscard entrent dans Rome pour soutenir le pape Grégoire Sept contre l’empereur Henri Quatre.","pause":900,"fx":null,"afterFx":0},{"text":"Une partie de la ville est incendiée et Santi Quattro Coronati est gravement détruite.","pause":800,"fx":null,"afterFx":0},{"text":"Quelques années plus tard, le pape Pascal Deux la fait reconstruire.","pause":750,"fx":null,"afterFx":0},{"text":"Mais la nouvelle église est plus petite que celle du neuvième siècle.","pause":750,"fx":null,"afterFx":0},{"text":"Résultat : une partie de l’ancienne nef devient une nouvelle cour.","pause":800,"fx":null,"afterFx":0},{"text":"C’est la raison pour laquelle vous avez aujourd’hui cette succession inhabituelle de deux espaces avant d’atteindre l’église.","pause":850,"fx":null,"afterFx":0},{"text":"L’architecture a gardé la mémoire du bâtiment perdu.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. Le palais cardinalice — quand un homme d’Église construit presque un château","cues":[{"text":"Au début du treizième siècle, le complexe change encore d’échelle.","pause":750,"fx":null,"afterFx":0},{"text":"Le cardinal Stefano Conti, alors très proche du pouvoir pontifical, fait construire ici un palais fortifié.","pause":850,"fx":null,"afterFx":0},{"text":"Regardez la massive Torre Maggiore qui domine l’entrée.","pause":750,"fx":null,"afterFx":0},{"text":"Elle appartient à cette transformation.","pause":700,"fx":null,"afterFx":0},{"text":"Le palais comprenait des appartements, des espaces de représentation, une chapelle privée et la grande salle que nous appelons aujourd’hui la Salle gothique.","pause":900,"fx":null,"afterFx":0},{"text":"Nous sommes dans une période où la frontière entre résidence religieuse, centre administratif et bâtiment défensif peut être très mince.","pause":850,"fx":null,"afterFx":0},{"text":"Le Cælius n’était donc pas seulement tranquille et monastique.","pause":750,"fx":null,"afterFx":0},{"text":"Il pouvait aussi être très politique.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. La chapelle Saint-Sylvestre — une fresque raconte un faux célèbre","cues":[{"text":"Si la chapelle Saint-Sylvestre est ouverte, prenez le temps d’observer les fresques consacrées au pape Sylvestre et à l’empereur Constantin.","pause":900,"fx":null,"afterFx":0},{"text":"Le cycle raconte une tradition médiévale selon laquelle Constantin aurait été guéri et converti grâce au pape.","pause":850,"fx":null,"afterFx":0},{"text":"Puis vient la scène la plus célèbre : la Donation de Constantin.","pause":800,"fx":null,"afterFx":0},{"text":"Selon ce récit, l’empereur aurait accordé au pape Sylvestre Rome et de vastes territoires d’Occident.","pause":850,"fx":null,"afterFx":0},{"text":"Le document qui prétendait enregistrer cette donation a longtemps été utilisé pour soutenir les prétentions temporelles de la papauté.","pause":850,"fx":null,"afterFx":0},{"text":"Mais il y a un problème considérable.","pause":750,"fx":null,"afterFx":0},{"text":"Le document est un faux médiéval.","pause":800,"fx":null,"afterFx":0},{"text":"Il n’a pas été rédigé sous Constantin au quatrième siècle, mais plusieurs siècles plus tard, probablement au huitième ou au neuvième siècle.","pause":900,"fx":null,"afterFx":0},{"text":"Vous êtes donc devant une œuvre médiévale montrant comme vérité historique un événement qui n’a jamais eu lieu de cette manière.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. Lorenzo Valla — démonter un faux avec des mots","cues":[{"text":"La manière dont la supercherie a été démontée est presque aussi intéressante que le faux lui-même.","pause":800,"fx":null,"afterFx":0},{"text":"Au quinzième siècle, l’humaniste Lorenzo Valla examine le texte de la Donation.","pause":750,"fx":null,"afterFx":0},{"text":"Il remarque que son latin, son vocabulaire et certaines institutions mentionnées ne correspondent pas au monde de Constantin.","pause":850,"fx":null,"afterFx":0},{"text":"En mille-quatre-cent-quarante, il produit une critique détaillée montrant que le document ne peut pas être authentique.","pause":850,"fx":null,"afterFx":0},{"text":"Pas besoin de carbone quatorze.","pause":650,"fx":null,"afterFx":0},{"text":"Le faux se trahit par sa langue.","pause":750,"fx":null,"afterFx":0},{"text":"C’est l’un des grands épisodes de l’histoire de la critique des textes.","pause":800,"fx":null,"afterFx":0},{"text":"Et cela rend la chapelle particulièrement savoureuse.","pause":700,"fx":null,"afterFx":0},{"text":"Elle conserve magnifiquement l’image d’une histoire à laquelle le Moyen Âge voulait croire…","pause":950,"fx":null,"afterFx":0},{"text":"Alors que quelques siècles plus tard, un philologue allait la démonter mot par mot.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. La Salle gothique — huit cents ans cachée sous de la peinture bleue","cues":[{"text":"La découverte la plus spectaculaire du complexe est beaucoup plus récente.","pause":750,"fx":null,"afterFx":0},{"text":"En mille-neuf-cent-quatre-vingt-seize, pendant une intervention qui n’avait rien d’une grande fouille spectaculaire, des peintures apparaissent sous les enduits.","pause":900,"fx":null,"afterFx":0},{"text":"Elles étaient dissimulées sous plusieurs couches de peinture bleue depuis des siècles.","pause":800,"fx":null,"afterFx":0},{"text":"Au total, environ trois-cents mètres carrés de fresques du treizième siècle sont remis au jour dans la Salle gothique.","pause":900,"fx":null,"afterFx":0},{"text":"Le programme est étonnant : saisons, arts, signes du zodiaque, constellations, vices, vertus et figures symboliques.","pause":850,"fx":null,"afterFx":0},{"text":"Salomon y apparaît comme figure du juge par excellence.","pause":750,"fx":null,"afterFx":0},{"text":"La fonction exacte de la salle n’est pas absolument certaine.","pause":700,"fx":null,"afterFx":0},{"text":"Elle a peut-être servi à des fonctions de représentation ou de justice dans le palais cardinalice.","pause":800,"fx":null,"afterFx":0},{"text":"La Salle gothique n’est ouverte que certains jours sur réservation.","pause":800,"fx":null,"afterFx":0},{"text":"Donc, même si vous ne la voyez pas aujourd’hui, sachez qu’au-dessus de vous se cache l’un des ensembles picturaux médiévaux les plus extraordinaires de Rome.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. Un monastère toujours vivant — et quelques règles de visite","cues":[{"text":"Le complexe n’est pas seulement un monument historique.","pause":700,"fx":null,"afterFx":0},{"text":"Depuis le seizième siècle, il est lié aux moniales augustines.","pause":750,"fx":null,"afterFx":0},{"text":"En mille-cinq-cent-soixante-quatre, le pape Pie Quatre confie ici un orphelinat de jeunes filles à une communauté de religieuses cloîtrées.","pause":850,"fx":null,"afterFx":0},{"text":"Les moniales vivent encore aujourd’hui dans le monastère.","pause":750,"fx":null,"afterFx":0},{"text":"C’est pourquoi la visite doit rester particulièrement discrète.","pause":750,"fx":null,"afterFx":0},{"text":"Pour votre visite du lundi après-midi, gardez également un détail pratique en tête.","pause":800,"fx":null,"afterFx":0},{"text":"La basilique est normalement accessible l’après-midi, mais l’ouverture de l’oratoire de Saint-Sylvestre entre seize heures et dix-sept heures trente n’est pas garantie.","pause":900,"fx":null,"afterFx":0},{"text":"Il faut sonner à la porterie du monastère si vous souhaitez tenter la visite.","pause":800,"fx":null,"afterFx":0},{"text":"Donc si une porte reste fermée, ne concluez pas que vous avez raté quelque chose dans votre itinéraire.","pause":850,"fx":null,"afterFx":0},{"text":"Une partie du charme du lieu tient précisément au fait qu’il reste un monastère habité et non un musée entièrement ouvert.","pause":900,"fx":null,"afterFx":0},{"text":"Vous pouvez maintenant poursuivre vers San Pietro in Vincoli.","pause":900,"fx":null,"afterFx":0}]}];
const SAN_PIETRO_VINCOLI=[{"title":"1. Une église construite autour de chaînes","cues":[{"text":"Vous êtes maintenant dans la basilique San Pietro in Vincoli : Saint-Pierre-aux-Liens.","pause":800,"fx":null,"afterFx":0},{"text":"Son nom vous donne immédiatement la raison principale de sa construction.","pause":750,"fx":null,"afterFx":0},{"text":"Vincoli vient du latin vincula : les liens, les chaînes.","pause":750,"fx":null,"afterFx":0},{"text":"La basilique actuelle trouve son origine au cinquième siècle et est également appelée basilique eudoxienne.","pause":850,"fx":null,"afterFx":0},{"text":"Ce nom rappelle Licinia Eudoxia, épouse de l’empereur Valentinien Trois.","pause":800,"fx":null,"afterFx":0},{"text":"La tradition raconte que sa mère, l’impératrice Eudocie, lui envoya de Jérusalem des chaînes associées à l’emprisonnement de saint Pierre.","pause":900,"fx":null,"afterFx":0},{"text":"À Rome, le pape Léon le Grand possédait déjà d’autres chaînes que la tradition reliait à la captivité romaine de l’apôtre.","pause":900,"fx":null,"afterFx":0},{"text":"Et c’est là que commence le miracle qui a donné son identité au lieu.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. Le miracle des deux chaînes","cues":[{"text":"Selon la tradition médiévale, les deux ensembles de chaînes furent approchés l’un de l’autre devant le pape.","pause":850,"fx":null,"afterFx":0},{"text":"Ils se seraient alors réunis miraculeusement pour ne former qu’une seule chaîne.","pause":850,"fx":null,"afterFx":0},{"text":"C’est pour conserver et célébrer cette relique que la basilique fut développée.","pause":800,"fx":null,"afterFx":0},{"text":"Les chaînes sont aujourd’hui conservées sous le maître-autel.","pause":750,"fx":null,"afterFx":0},{"text":"Le premier août, jour traditionnel de la fête de Saint-Pierre-aux-Liens, elles font l’objet d’une vénération particulière.","pause":850,"fx":null,"afterFx":0},{"text":"Il faut bien distinguer ici histoire et tradition religieuse.","pause":750,"fx":null,"afterFx":0},{"text":"L’existence ancienne du culte des chaînes et de la basilique est documentée.","pause":800,"fx":null,"afterFx":0},{"text":"La fusion miraculeuse des chaînes appartient, elle, à la tradition du sanctuaire.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. Jules II commande un tombeau gigantesque","cues":[{"text":"Dirigez maintenant votre regard vers le monument de Jules Deux, dans le bras droit du transept.","pause":850,"fx":null,"afterFx":0},{"text":"En mille-cinq-cent-cinq, le pape Jules Deux confie à Michel-Ange la réalisation de son monument funéraire.","pause":850,"fx":null,"afterFx":0},{"text":"Le premier projet est immense.","pause":700,"fx":null,"afterFx":0},{"text":"Il devait être un mausolée autonome, peuplé de nombreuses statues et conçu à une échelle presque architecturale.","pause":850,"fx":null,"afterFx":0},{"text":"Mais Jules Deux se passionne bientôt davantage pour un autre chantier : la reconstruction de la basilique Saint-Pierre du Vatican.","pause":900,"fx":null,"afterFx":0},{"text":"Le projet du tombeau est réduit, remanié, reporté, renégocié puis réduit encore.","pause":850,"fx":null,"afterFx":0},{"text":"Cette affaire accompagnera Michel-Ange pendant près de quarante ans.","pause":800,"fx":null,"afterFx":0},{"text":"Il la décrira comme sa « tragédie de la sépulture ».","pause":900,"fx":null,"afterFx":0}]},{"title":"4. Le Moïse — regardez-le avant de chercher les détails","cues":[{"text":"Au centre du monument, regardez maintenant le Moïse.","pause":800,"fx":null,"afterFx":0},{"text":"Michel-Ange le sculpte au début des années quinze-cent-dix.","pause":750,"fx":null,"afterFx":0},{"text":"Moïse est assis, les Tables de la Loi sous le bras.","pause":700,"fx":null,"afterFx":0},{"text":"Mais il ne paraît absolument pas au repos.","pause":700,"fx":null,"afterFx":0},{"text":"Regardez la tension du corps, les muscles, les veines de la main et le mouvement de la barbe.","pause":850,"fx":null,"afterFx":0},{"text":"Le personnage semble retenir une énergie considérable.","pause":750,"fx":null,"afterFx":0},{"text":"La scène est traditionnellement comprise comme le moment où Moïse, revenu du Sinaï, découvre que les Hébreux adorent le veau d’or.","pause":900,"fx":null,"afterFx":0},{"text":"Il n’est donc pas calme.","pause":650,"fx":null,"afterFx":0},{"text":"Il essaie de le devenir.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. Pourquoi Moïse a-t-il des cornes ?","cues":[{"text":"Maintenant, regardez sa tête.","pause":700,"fx":null,"afterFx":0},{"text":"Oui : Moïse a bien deux petites cornes.","pause":750,"fx":null,"afterFx":0},{"text":"Ce n’est ni une plaisanterie de Michel-Ange, ni un symbole diabolique.","pause":800,"fx":null,"afterFx":0},{"text":"L’explication vient d’un passage de l’Exode décrivant le visage de Moïse après sa rencontre avec Dieu.","pause":850,"fx":null,"afterFx":0},{"text":"Le texte hébreu emploie un verbe lié à l’idée de rayonnement.","pause":750,"fx":null,"afterFx":0},{"text":"Dans la Vulgate latine de saint Jérôme, le passage a été rendu avec une expression pouvant faire comprendre que son visage était cornu.","pause":900,"fx":null,"afterFx":0},{"text":"Une longue tradition artistique occidentale a donc représenté Moïse avec des cornes.","pause":800,"fx":null,"afterFx":0},{"text":"On résume souvent l’histoire en parlant d’une simple erreur de traduction.","pause":750,"fx":null,"afterFx":0},{"text":"C’est un peu trop simple : le problème tient aussi aux possibilités de lecture du texte hébreu et à toute une tradition d’interprétation.","pause":900,"fx":null,"afterFx":0},{"text":"Michel-Ange n’invente donc pas ce détail.","pause":700,"fx":null,"afterFx":0},{"text":"Il hérite d’une iconographie déjà ancienne.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. « Pourquoi ne parles-tu pas ? » — la légende de Michel-Ange","cues":[{"text":"Le réalisme du Moïse a donné naissance à une anecdote devenue presque aussi célèbre que la statue.","pause":850,"fx":null,"afterFx":0},{"text":"Selon la légende, Michel-Ange, contemplant son œuvre achevée, aurait été frappé par son apparence presque vivante.","pause":850,"fx":null,"afterFx":0},{"text":"Il aurait alors donné un coup de marteau sur le genou de la statue en lançant : « Pourquoi ne parles-tu pas ? »","pause":900,"fx":null,"afterFx":0},{"text":"On montre parfois une marque sur le genou comme preuve de la scène.","pause":800,"fx":null,"afterFx":0},{"text":"Mais aucun témoignage contemporain solide ne permet de vérifier cette histoire.","pause":800,"fx":null,"afterFx":0},{"text":"Elle appartient à la légende de Michel-Ange, construite autour de l’idée que son talent pouvait presque donner vie au marbre.","pause":900,"fx":null,"afterFx":0},{"text":"Et devant ce Moïse, on comprend assez facilement pourquoi cette légende a survécu.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. Le tombeau de Jules II… sans Jules II","cues":[{"text":"Voici maintenant le détail le plus ironique de toute l’histoire.","pause":750,"fx":null,"afterFx":0},{"text":"Vous êtes devant le monument funéraire de Jules Deux.","pause":700,"fx":null,"afterFx":0},{"text":"Mais Jules Deux n’est pas enterré ici.","pause":800,"fx":null,"afterFx":0},{"text":"Le pape meurt en mille-cinq-cent-treize, longtemps avant l’achèvement définitif du monument.","pause":850,"fx":null,"afterFx":0},{"text":"Il est enterré dans la basilique Saint-Pierre au Vatican.","pause":750,"fx":null,"afterFx":0},{"text":"Le monument de San Pietro in Vincoli, achevé sous une forme très réduite par rapport au projet initial, reste donc essentiellement commémoratif.","pause":900,"fx":null,"afterFx":0},{"text":"Après quarante ans de négociations, de projets et de frustrations…","pause":950,"fx":null,"afterFx":0},{"text":"Le tombeau est finalement vide.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. Une basilique où une relique médiévale rencontre la Renaissance","cues":[{"text":"Avant de sortir, prenez quelques secondes pour regarder l’église dans son ensemble.","pause":800,"fx":null,"afterFx":0},{"text":"San Pietro in Vincoli réunit deux attractions qui appartiennent à des mondes très différents.","pause":800,"fx":null,"afterFx":0},{"text":"Sous l’autel, une relique liée à l’une des grandes traditions du christianisme ancien.","pause":750,"fx":null,"afterFx":0},{"text":"Dans le transept, l’un des chefs-d’œuvre les plus célèbres de la Renaissance.","pause":750,"fx":null,"afterFx":0},{"text":"Et entre les deux, près de quinze siècles d’histoire de Rome chrétienne.","pause":800,"fx":null,"afterFx":0},{"text":"C’est aussi un bon endroit pour se rappeler qu’à Rome, un monument peut être célèbre pour deux raisons totalement différentes.","pause":850,"fx":null,"afterFx":0},{"text":"Ici : des chaînes…","pause":950,"fx":null,"afterFx":0},{"text":"Et un morceau de marbre qui refuse obstinément de parler.","pause":900,"fx":null,"afterFx":0},{"text":"Vous pouvez maintenant poursuivre vers Monti.","pause":900,"fx":null,"afterFx":0}]}];
const MONTI=[{"title":"1. Monti — le premier rione de Rome","cues":[{"text":"Vous entrez maintenant dans Monti.","pause":700,"fx":null,"afterFx":0},{"text":"Administrativement, c’est le rione numéro un de Rome.","pause":750,"fx":null,"afterFx":0},{"text":"Son nom vient des monti, les collines sur lesquelles il s’est développé : surtout l’Esquilin, le Viminal et une partie du Quirinal.","pause":850,"fx":null,"afterFx":0},{"text":"Aujourd’hui, Monti est un mélange de petites rues, de restaurants, d’ateliers, de bars et de boutiques.","pause":800,"fx":null,"afterFx":0},{"text":"Mais sous cette apparence très contemporaine se cache l’un des quartiers les plus anciens de la ville.","pause":800,"fx":null,"afterFx":0},{"text":"Une partie de ce secteur correspond à l’ancienne Suburra.","pause":750,"fx":null,"afterFx":0},{"text":"Et la Suburra n’avait absolument rien du quartier tranquille que vous venez de quitter sur le Cælius.","pause":850,"fx":null,"afterFx":0},{"text":"C’était une Rome dense, populaire et extrêmement vivante.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. La Suburra — l’autre visage de Rome antique","cues":[{"text":"Imaginez maintenant le quartier à l’époque romaine.","pause":700,"fx":null,"afterFx":0},{"text":"Des immeubles d’habitation, des boutiques, des ateliers et des tavernes occupent les rues étroites.","pause":800,"fx":null,"afterFx":0},{"text":"La population y est beaucoup plus mêlée que dans les quartiers aristocratiques du Palatin ou du Cælius.","pause":850,"fx":null,"afterFx":0},{"text":"C’est une zone de commerce, de logement et de passage.","pause":700,"fx":null,"afterFx":0},{"text":"Les constructions serrées et l’emploi abondant du bois rendent aussi les incendies particulièrement redoutables.","pause":850,"fx":null,"afterFx":0},{"text":"Les sources antiques donnent à la Suburra une réputation de quartier bruyant et populaire.","pause":800,"fx":null,"afterFx":0},{"text":"Mais il faut éviter d’en faire une caricature de bas-fonds.","pause":750,"fx":null,"afterFx":0},{"text":"C’était avant tout un morceau extrêmement dense de la ville réelle, où vivaient et travaillaient des milliers de Romains.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. Une muraille pour protéger le Forum d’Auguste du quartier","cues":[{"text":"En vous rapprochant du secteur des Forums impériaux, regardez les grandes maçonneries antiques qui coupent le paysage.","pause":800,"fx":null,"afterFx":0},{"text":"Le Forum d’Auguste était séparé de la Suburra par un mur gigantesque, atteignant par endroits plus de trente mètres de haut.","pause":850,"fx":null,"afterFx":0},{"text":"Ce mur n’était pas seulement monumental.","pause":700,"fx":null,"afterFx":0},{"text":"Il servait aussi de protection.","pause":650,"fx":null,"afterFx":0},{"text":"La pierre employée était notamment choisie pour sa résistance au feu.","pause":750,"fx":null,"afterFx":0},{"text":"D’un côté : le forum officiel, ordonné, monumental et lié au pouvoir impérial.","pause":800,"fx":null,"afterFx":0},{"text":"De l’autre : la Suburra, dense et pleine de constructions privées.","pause":800,"fx":null,"afterFx":0},{"text":"C’est presque une frontière architecturale entre deux manières de vivre Rome.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. Via Baccina — la meilleure chose à faire ici est simplement marcher","cues":[{"text":"En descendant dans les petites rues de Monti, prenez votre temps.","pause":750,"fx":null,"afterFx":0},{"text":"Via Baccina est l’un de ces axes où le quartier se comprend mieux à pied qu’avec une liste de monuments.","pause":850,"fx":null,"afterFx":0},{"text":"La rue suit le tissu serré du vieux quartier entre les Forums et les hauteurs de Monti.","pause":800,"fx":null,"afterFx":0},{"text":"Aujourd’hui, elle mélange logements, petites adresses et commerces de proximité.","pause":750,"fx":null,"afterFx":0},{"text":"Elle accueille aussi le marché couvert de Monti, aménagé en mille-neuf-cent-trente-trois puis restauré à la fin du vingtième siècle.","pause":850,"fx":null,"afterFx":0},{"text":"Mais l’intérêt principal n’est pas de cocher un bâtiment précis.","pause":700,"fx":null,"afterFx":0},{"text":"C’est de sentir que les dimensions du quartier sont restées celles d’une ville faite pour être parcourue à pied.","pause":850,"fx":null,"afterFx":0},{"text":"Après le Colisée et le Circus Maximus, ça fait presque bizarre de revenir à une échelle humaine.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. Madonna dei Monti — une image retrouvée dans un mur","cues":[{"text":"En arrivant vers la Piazza della Madonna dei Monti, regardez l’église Santa Maria ai Monti.","pause":800,"fx":null,"afterFx":0},{"text":"Elle doit son existence à une histoire qui commence en avril mille-cinq-cent-soixante-dix-neuf.","pause":850,"fx":null,"afterFx":0},{"text":"À cet emplacement se trouvait un ancien couvent de Clarisses transformé en habitations.","pause":800,"fx":null,"afterFx":0},{"text":"La tradition raconte que le bâtiment fut secoué par d’étranges vibrations que les habitants prirent pour des phénomènes surnaturels.","pause":850,"fx":null,"afterFx":0},{"text":"Dans une ancienne remise, un ouvrier aurait ensuite entendu une voix lui dire de ne pas la blesser.","pause":850,"fx":null,"afterFx":0},{"text":"En ouvrant le mur, on découvrit une fresque de la Vierge à l’Enfant accompagnée de saints.","pause":800,"fx":null,"afterFx":0},{"text":"La population commença rapidement à attribuer des guérisons miraculeuses à l’image.","pause":800,"fx":null,"afterFx":0},{"text":"Nous sommes ici dans la tradition religieuse du quartier, pas dans un événement que l’on peut vérifier comme un dossier de police.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. Quand le quartier refuse de laisser partir sa Madone","cues":[{"text":"L’histoire ne s’arrête pas à la découverte de l’image.","pause":700,"fx":null,"afterFx":0},{"text":"Le pape Grégoire Treize décide d’abord de la transférer dans une autre église voisine.","pause":800,"fx":null,"afterFx":0},{"text":"Mais dans la nuit du huit mai mille-cinq-cent-quatre-vingts, les hommes venus effectuer le transfert rencontrent l’opposition énergique des habitants.","pause":900,"fx":null,"afterFx":0},{"text":"Le quartier refuse de laisser partir sa Madone.","pause":750,"fx":null,"afterFx":0},{"text":"Finalement, l’image reste sur place.","pause":700,"fx":null,"afterFx":0},{"text":"Une nouvelle église est construite pour elle à partir de mille-cinq-cent-quatre-vingts.","pause":800,"fx":null,"afterFx":0},{"text":"Le projet est confié à Giacomo Della Porta.","pause":700,"fx":null,"afterFx":0},{"text":"C’est un joli renversement.","pause":650,"fx":null,"afterFx":0},{"text":"Au lieu de déplacer l’image vers une église…","pause":950,"fx":null,"afterFx":0},{"text":"On construit finalement l’église autour de l’image.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. La fontaine des Catéchumènes — le salon du quartier","cues":[{"text":"Regardez maintenant la fontaine au centre de la place.","pause":700,"fx":null,"afterFx":0},{"text":"Elle est elle aussi dessinée par Giacomo Della Porta.","pause":750,"fx":null,"afterFx":0},{"text":"Elle est réalisée entre mille-cinq-cent-quatre-vingt-huit et mille-cinq-cent-quatre-vingt-neuf sous Sixte Cinq.","pause":850,"fx":null,"afterFx":0},{"text":"Son bassin octogonal en travertin était conçu pour un usage très concret par les habitants du quartier.","pause":800,"fx":null,"afterFx":0},{"text":"Le nom de fontaine des Catéchumènes vient du collège voisin consacré à l’éducation de convertis au christianisme.","pause":850,"fx":null,"afterFx":0},{"text":"La place devint aussi un espace de marché.","pause":700,"fx":null,"afterFx":0},{"text":"Et aujourd’hui encore, les marches autour de la fontaine servent presque de salon public à Monti.","pause":800,"fx":null,"afterFx":0},{"text":"Autre petite anecdote : le compositeur Ottorino Respighi venait volontiers observer cette fontaine lorsqu’il travaillait sur son poème symphonique Les Fontaines de Rome.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. Monti aujourd’hui — la Suburra a changé, mais le quartier reste vivant","cues":[{"text":"Avant de terminer, regardez simplement les gens autour de vous.","pause":700,"fx":null,"afterFx":0},{"text":"Monti est aujourd’hui l’un des quartiers les plus animés du centre de Rome.","pause":750,"fx":null,"afterFx":0},{"text":"Restaurants, bars à vin, ateliers, galeries et boutiques occupent les rues où se trouvait autrefois une partie de la Suburra.","pause":850,"fx":null,"afterFx":0},{"text":"Évidemment, deux mille ans séparent ces deux villes.","pause":700,"fx":null,"afterFx":0},{"text":"Mais une continuité reste perceptible.","pause":650,"fx":null,"afterFx":0},{"text":"Monti est toujours un quartier que l’on habite, où l’on mange, où l’on travaille et où l’on se rencontre.","pause":850,"fx":null,"afterFx":0},{"text":"C’est sans doute la meilleure manière de terminer cette promenade.","pause":750,"fx":null,"afterFx":0},{"text":"Après une journée consacrée aux empereurs, aux martyrs, aux basiliques et aux monuments…","pause":950,"fx":null,"afterFx":0},{"text":"vous revenez simplement dans un quartier vivant.","pause":800,"fx":null,"afterFx":0},{"text":"Vous pouvez maintenant arrêter l’audioguide et profiter de Monti à votre rythme.","pause":900,"fx":null,"afterFx":0}]}];
const MARCHES_TRAJAN=[{"title":"1. Première surprise — ce ne sont probablement pas des « marchés »","cues":[{"text":"Commencez la visite dans la Grande Aula, juste après l’entrée du musée.","pause":800,"fx":null,"afterFx":0},{"text":"Et oubliez tout de suite l’image d’un centre commercial romain rempli de boutiques sur plusieurs étages.","pause":850,"fx":null,"afterFx":0},{"text":"Le nom « Marchés de Trajan » est moderne.","pause":700,"fx":null,"afterFx":0},{"text":"Il a été popularisé lors du dégagement du complexe entre mille-neuf-cent-vingt-six et mille-neuf-cent-trente-quatre.","pause":850,"fx":null,"afterFx":0},{"text":"Les nombreuses pièces qui ressemblent à des boutiques ont longtemps renforcé cette interprétation.","pause":800,"fx":null,"afterFx":0},{"text":"Mais aujourd’hui, les archéologues sont beaucoup plus prudents.","pause":750,"fx":null,"afterFx":0},{"text":"Ces locaux pouvaient avoir des usages variés : bureaux, archives, services administratifs et peut-être certaines activités commerciales.","pause":900,"fx":null,"afterFx":0},{"text":"Le meilleur résumé serait donc plutôt : un vaste complexe polyvalent au service du Forum de Trajan.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. Pourquoi construire six niveaux contre une colline ?","cues":[{"text":"Pour comprendre l’architecture, imaginez d’abord le paysage avant le Forum de Trajan.","pause":800,"fx":null,"afterFx":0},{"text":"Le Quirinal et le Capitole étaient reliés par un relief qui occupait une partie de l’espace nécessaire au nouveau forum.","pause":850,"fx":null,"afterFx":0},{"text":"On a donc littéralement entaillé les pentes pour créer l’immense complexe monumental.","pause":850,"fx":null,"afterFx":0},{"text":"Les travaux préparatoires pourraient avoir commencé dès le règne de Domitien, avant Trajan.","pause":800,"fx":null,"afterFx":0},{"text":"Les bâtiments que vous visitez remplissent une fonction essentielle : ils habillent et soutiennent cette énorme découpe du Quirinal.","pause":900,"fx":null,"afterFx":0},{"text":"Voilà pourquoi tout semble monter, tourner et s’emboîter.","pause":750,"fx":null,"afterFx":0},{"text":"Le complexe se développe sur six niveaux différents.","pause":700,"fx":null,"afterFx":0},{"text":"Ce n’est pas une fantaisie architecturale.","pause":650,"fx":null,"afterFx":0},{"text":"C’est une réponse extrêmement intelligente à un problème de terrain.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. La Grande Aula — l’ingénierie avant la décoration","cues":[{"text":"Regardez maintenant le grand espace central de la Grande Aula.","pause":750,"fx":null,"afterFx":0},{"text":"Il mesure environ trente-deux mètres de long pour huit mètres de large.","pause":750,"fx":null,"afterFx":0},{"text":"Autour de vous, des pièces s’ouvrent à plusieurs niveaux.","pause":700,"fx":null,"afterFx":0},{"text":"Les voûtes et les murs utilisent largement le béton romain revêtu de briques.","pause":800,"fx":null,"afterFx":0},{"text":"Ici, ce qui impressionne n’est pas une forêt de marbre ou de colonnes précieuses.","pause":800,"fx":null,"afterFx":0},{"text":"C’est la capacité des architectes à fabriquer un bâtiment complexe, robuste et parfaitement adapté à la pente.","pause":900,"fx":null,"afterFx":0},{"text":"Les Marchés de Trajan montrent donc une autre face de l’architecture impériale.","pause":750,"fx":null,"afterFx":0},{"text":"Moins décorative que le Forum en contrebas…","pause":950,"fx":null,"afterFx":0},{"text":"Mais techniquement redoutable.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. Le musée — regardez les fragments comme des morceaux d’architecture","cues":[{"text":"La Grande Aula accueille aujourd’hui le Musée des Forums impériaux.","pause":750,"fx":null,"afterFx":0},{"text":"Ne vous sentez pas obligés de vous arrêter devant chaque fragment.","pause":700,"fx":null,"afterFx":0},{"text":"L’idée générale du musée est plus intéressante que la collection pièce par pièce.","pause":800,"fx":null,"afterFx":0},{"text":"De nombreux éléments architecturaux provenant des Forums de César, d’Auguste, de Nerva et de Trajan ont été retrouvés démontés ou fragmentaires.","pause":900,"fx":null,"afterFx":0},{"text":"Le musée les remonte partiellement avec des fragments originaux, des moulages et des compléments réversibles.","pause":850,"fx":null,"afterFx":0},{"text":"Cela permet de retrouver l’échelle des corniches, des chapiteaux et des décors sans prétendre reconstruire artificiellement tout le monument.","pause":900,"fx":null,"afterFx":0},{"text":"Regardez donc surtout les dimensions.","pause":700,"fx":null,"afterFx":0},{"text":"Un fragment qui paraît énorme ici se trouvait parfois très haut sur une façade encore plus gigantesque.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. Via Biberatica — la rue romaine qui porte un nom moderne","cues":[{"text":"Quand le parcours vous conduit dehors, rejoignez la Via Biberatica.","pause":800,"fx":null,"afterFx":0},{"text":"C’est l’un des endroits les plus évocateurs du complexe.","pause":750,"fx":null,"afterFx":0},{"text":"Sous vos pieds, la rue est pavée de grandes dalles de pierre.","pause":750,"fx":null,"afterFx":0},{"text":"De chaque côté s’ouvrent des locaux avec leurs seuils, linteaux et montants en travertin.","pause":850,"fx":null,"afterFx":0},{"text":"Mais petite surprise : « Via Biberatica » n’est pas son nom antique connu.","pause":800,"fx":null,"afterFx":0},{"text":"Le nom est moderne et dériverait probablement du latin bibere, boire.","pause":800,"fx":null,"afterFx":0},{"text":"On l’a parfois relié à l’idée de tavernes ou de débits de boisson.","pause":750,"fx":null,"afterFx":0},{"text":"Mais le nom ne constitue évidemment pas la preuve que toute la rue était consacrée aux bars.","pause":850,"fx":null,"afterFx":0},{"text":"Même à Rome, une rue peut avoir un nom séduisant sans fournir la fiche de poste de tous ses habitants.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. Le Grand Hémicycle — un bâtiment qui retient littéralement la colline","cues":[{"text":"En descendant vers le Grand Hémicycle, regardez sa forme courbe.","pause":750,"fx":null,"afterFx":0},{"text":"Elle répond directement à la grande exèdre du Forum de Trajan qui se trouvait en contrebas.","pause":850,"fx":null,"afterFx":0},{"text":"Le bâtiment se développe ici sur trois niveaux.","pause":700,"fx":null,"afterFx":0},{"text":"Son rôle n’est pas seulement de fournir des pièces utilisables.","pause":700,"fx":null,"afterFx":0},{"text":"Toute cette masse bâtie participe aussi au soutènement du Quirinal après l’excavation de la colline.","pause":850,"fx":null,"afterFx":0},{"text":"Autrement dit, vous marchez dans un bâtiment qui est en même temps une architecture et un gigantesque mur de soutènement habitable.","pause":900,"fx":null,"afterFx":0},{"text":"Profitez des ouvertures vers le Forum.","pause":700,"fx":null,"afterFx":0},{"text":"Elles permettent de comprendre que les « Marchés » et le Forum n’étaient pas deux monuments indépendants.","pause":800,"fx":null,"afterFx":0},{"text":"Ils formaient les deux faces d’un même réaménagement urbain.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. À quoi servaient réellement toutes ces pièces ?","cues":[{"text":"Voici la question que tout le monde se pose devant les petites salles : qu’est-ce qu’on faisait ici ?","pause":850,"fx":null,"afterFx":0},{"text":"La réponse la plus correcte est : pas une seule chose.","pause":750,"fx":null,"afterFx":0},{"text":"La disposition des pièces, leurs liaisons et leurs différents accès indiquent des fonctions multiples.","pause":800,"fx":null,"afterFx":0},{"text":"Les chercheurs privilégient aujourd’hui des usages publics et administratifs : bureaux, archives et services liés au Forum voisin.","pause":900,"fx":null,"afterFx":0},{"text":"Certaines pièces du Corps Central pourraient même avoir accueilli le procurateur chargé du Forum du divin Trajan.","pause":850,"fx":null,"afterFx":0},{"text":"La forme de taberna de nombreux locaux ne suffit donc pas à dire : boutique.","pause":800,"fx":null,"afterFx":0},{"text":"C’est un bon rappel pour toute l’archéologie romaine.","pause":700,"fx":null,"afterFx":0},{"text":"Une porte ressemble à une boutique.","pause":600,"fx":null,"afterFx":0},{"text":"Cela ne signifie pas forcément qu’un Romain y vendait des sandales.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. Deux mille ans de réutilisations ont sauvé le bâtiment","cues":[{"text":"Les Marchés de Trajan n’ont pas survécu parce qu’on les a enfermés sous une cloche après l’Antiquité.","pause":850,"fx":null,"afterFx":0},{"text":"Au contraire, ils ont été continuellement réutilisés.","pause":750,"fx":null,"afterFx":0},{"text":"Certaines zones sont transformées dès l’époque romaine tardive.","pause":750,"fx":null,"afterFx":0},{"text":"Au Moyen Âge, le complexe accueille de nouvelles constructions et des installations défensives.","pause":800,"fx":null,"afterFx":0},{"text":"La Torre delle Milizie, visible au-dessus du secteur, date principalement du treizième siècle.","pause":850,"fx":null,"afterFx":0},{"text":"Plus tard, une partie du monument est occupée par le couvent de Sainte-Catherine de Sienne.","pause":800,"fx":null,"afterFx":0},{"text":"Certaines pièces antiques deviennent même des caves ou sont adaptées aux nouveaux niveaux de circulation.","pause":850,"fx":null,"afterFx":0},{"text":"Comme souvent à Rome, le meilleur conservateur d’un bâtiment antique a parfois été quelqu’un qui avait simplement besoin d’un bâtiment.","pause":900,"fx":null,"afterFx":0}]},{"title":"9. Le monument antique que le XXe siècle a en partie recréé","cues":[{"text":"Avant de terminer, regardez le complexe une dernière fois en pensant à son apparence actuelle.","pause":800,"fx":null,"afterFx":0},{"text":"Entre mille-neuf-cent-vingt-six et mille-neuf-cent-trente-quatre, de grands travaux dégagent les structures antiques.","pause":850,"fx":null,"afterFx":0},{"text":"Des constructions plus récentes sont supprimées et certaines parties antiques sont restaurées ou complétées.","pause":850,"fx":null,"afterFx":0},{"text":"C’est à cette époque que le nom de « Marchés de Trajan » s’impose largement.","pause":800,"fx":null,"afterFx":0},{"text":"La visite moderne est donc elle aussi une couche de l’histoire du monument.","pause":750,"fx":null,"afterFx":0},{"text":"Si le parcours est ouvert dans son ensemble, terminez par les terrasses et le secteur du Jardin des Milices.","pause":850,"fx":null,"afterFx":0},{"text":"De là, regardez les Forums impériaux en contrebas.","pause":750,"fx":null,"afterFx":0},{"text":"Vous comprenez alors ce que ce bâtiment fait réellement dans le paysage.","pause":750,"fx":null,"afterFx":0},{"text":"Il ne se contente pas d’occuper la pente.","pause":650,"fx":null,"afterFx":0},{"text":"Il transforme une colline taillée en architecture.","pause":850,"fx":null,"afterFx":0},{"text":"En sortant, dirigez-vous vers la Colonne de Trajan.","pause":900,"fx":null,"afterFx":0}]}];
const COLONNE_TRAJAN=[{"title":"1. Une colonne coincée entre deux mondes","cues":[{"text":"Placez-vous de façon à voir la colonne du socle jusqu’à la statue de saint Pierre.","pause":800,"fx":null,"afterFx":0},{"text":"Aujourd’hui, elle paraît isolée dans un espace ouvert.","pause":700,"fx":null,"afterFx":0},{"text":"Dans l’Antiquité, l’impression était très différente.","pause":750,"fx":null,"afterFx":0},{"text":"La Colonne de Trajan se dressait dans une cour relativement étroite, derrière l’immense Basilique Ulpienne.","pause":850,"fx":null,"afterFx":0},{"text":"Elle était encadrée par deux bâtiments généralement interprétés comme des bibliothèques.","pause":800,"fx":null,"afterFx":0},{"text":"Le Forum de Trajan avait été inauguré en cent-douze.","pause":700,"fx":null,"afterFx":0},{"text":"La colonne le fut l’année suivante, en cent-treize.","pause":750,"fx":null,"afterFx":0},{"text":"Vous regardez donc le monument qui a survécu presque intact au cœur d’un ensemble monumental largement disparu autour de lui.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. Cent pieds romains pour mesurer une colline disparue","cues":[{"text":"Avant de regarder les sculptures, regardez la hauteur du monument.","pause":750,"fx":null,"afterFx":0},{"text":"Le fût avec sa base et son chapiteau atteint cent pieds romains, soit un peu moins de trente mètres.","pause":850,"fx":null,"afterFx":0},{"text":"Avec le grand piédestal et la partie supérieure, l’ensemble approche quarante mètres.","pause":800,"fx":null,"afterFx":0},{"text":"L’inscription gravée sur la base explique aussi pourquoi cette hauteur compte.","pause":750,"fx":null,"afterFx":0},{"text":"Elle rappelle l’énorme quantité de terrain retirée pour créer le Forum de Trajan entre le Quirinal et le Capitole.","pause":850,"fx":null,"afterFx":0},{"text":"La colonne fonctionnait donc comme une sorte de repère monumental des travaux de terrassement.","pause":800,"fx":null,"afterFx":0},{"text":"Le forum ne s’est pas simplement posé dans un espace libre.","pause":700,"fx":null,"afterFx":0},{"text":"Rome a remodelé la géographie pour lui faire de la place.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. Un rouleau de pierre de presque deux cents mètres","cues":[{"text":"Regardez maintenant la grande bande sculptée qui s’enroule autour du fût.","pause":750,"fx":null,"afterFx":0},{"text":"Elle effectue vingt-trois tours autour de la colonne.","pause":700,"fx":null,"afterFx":0},{"text":"Si on pouvait la dérouler, elle mesurerait près de deux cents mètres.","pause":800,"fx":null,"afterFx":0},{"text":"Environ deux-mille-cinq-cents personnages y sont représentés.","pause":750,"fx":null,"afterFx":0},{"text":"Le principe ressemble à un immense récit continu sculpté dans le marbre.","pause":800,"fx":null,"afterFx":0},{"text":"Le début se trouve en bas.","pause":650,"fx":null,"afterFx":0},{"text":"Puis l’histoire monte progressivement vers le sommet en tournant autour du monument.","pause":750,"fx":null,"afterFx":0},{"text":"C’est probablement l’une des raisons pour lesquelles on compare si souvent la colonne à un livre ou à un rouleau de pierre.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. Deux guerres contre les Daces","cues":[{"text":"Le récit représente les deux campagnes menées par Trajan contre les Daces.","pause":750,"fx":null,"afterFx":0},{"text":"La première se déroule en cent-un et cent-deux.","pause":700,"fx":null,"afterFx":0},{"text":"La seconde en cent-cinq et cent-six.","pause":700,"fx":null,"afterFx":0},{"text":"La Dacie correspond en grande partie à l’actuelle Roumanie.","pause":750,"fx":null,"afterFx":0},{"text":"Au milieu de la spirale, cherchez une figure féminine ailée.","pause":750,"fx":null,"afterFx":0},{"text":"C’est la Victoire, occupée à écrire sur un bouclier.","pause":800,"fx":null,"afterFx":0},{"text":"Elle marque la séparation entre les deux campagnes.","pause":750,"fx":null,"afterFx":0},{"text":"Le récit se termine avec la défaite des Daces et la mort de leur roi Décébale.","pause":850,"fx":null,"afterFx":0},{"text":"Mais la colonne ne raconte évidemment pas la guerre comme le ferait un historien neutre.","pause":850,"fx":null,"afterFx":0},{"text":"C’est un monument élevé par Rome pour célébrer la victoire de Rome.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. Étrangement, il y a moins de batailles qu’on ne l’imagine","cues":[{"text":"Si vous pouviez examiner toutes les scènes à hauteur des yeux, une chose vous surprendrait.","pause":800,"fx":null,"afterFx":0},{"text":"Les batailles ne représentent qu’une partie du récit.","pause":750,"fx":null,"afterFx":0},{"text":"On voit très souvent les soldats construire des camps.","pause":700,"fx":null,"afterFx":0},{"text":"Abattre des arbres.","pause":600,"fx":null,"afterFx":0},{"text":"Tracer des routes.","pause":600,"fx":null,"afterFx":0},{"text":"Franchir des cours d’eau.","pause":600,"fx":null,"afterFx":0},{"text":"Bâtir des fortifications ou assister à des cérémonies.","pause":750,"fx":null,"afterFx":0},{"text":"Le message est très efficace.","pause":700,"fx":null,"afterFx":0},{"text":"L’armée romaine n’est pas seulement montrée comme violente.","pause":750,"fx":null,"afterFx":0},{"text":"Elle est surtout présentée comme disciplinée, organisée et capable de transformer le territoire qu’elle traverse.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. Trajan apparaît partout… mais presque jamais en héros de mêlée","cues":[{"text":"L’empereur Trajan apparaît près de soixante fois dans le relief.","pause":750,"fx":null,"afterFx":0},{"text":"Il est donc l’un des meilleurs repères pour suivre le récit.","pause":700,"fx":null,"afterFx":0},{"text":"Mais regardez le rôle qu’on lui donne.","pause":700,"fx":null,"afterFx":0},{"text":"Il reçoit des délégations.","pause":600,"fx":null,"afterFx":0},{"text":"Il parle à ses soldats.","pause":600,"fx":null,"afterFx":0},{"text":"Il préside des sacrifices.","pause":600,"fx":null,"afterFx":0},{"text":"Il supervise les opérations.","pause":650,"fx":null,"afterFx":0},{"text":"Il n’est pratiquement jamais montré comme un guerrier lançant personnellement son épée au milieu de la bataille.","pause":850,"fx":null,"afterFx":0},{"text":"La propagande construit donc un chef idéal : calme, pieux, présent partout et maître de la situation.","pause":850,"fx":null,"afterFx":0},{"text":"L’empereur gagne surtout parce que tout fonctionne correctement autour de lui.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. Mais comment pouvait-on lire quelque chose aussi haut ?","cues":[{"text":"À ce stade, vous avez probablement identifié le problème principal.","pause":750,"fx":null,"afterFx":0},{"text":"Les scènes les plus hautes sont presque impossibles à lire depuis le sol.","pause":800,"fx":null,"afterFx":0},{"text":"Et dans l’Antiquité, la colonne était encore plus enfermée par les bâtiments voisins.","pause":800,"fx":null,"afterFx":0},{"text":"Les architectes en étaient évidemment conscients.","pause":700,"fx":null,"afterFx":0},{"text":"La hauteur de la bande sculptée augmente progressivement en montant pour compenser en partie la distance.","pause":850,"fx":null,"afterFx":0},{"text":"Les étages des bâtiments voisins pouvaient aussi offrir des points de vue plus élevés sur certaines parties du relief.","pause":850,"fx":null,"afterFx":0},{"text":"Mais personne ne pouvait probablement suivre tranquillement les deux cents mètres du récit comme une bande dessinée moderne.","pause":900,"fx":null,"afterFx":0},{"text":"Le monument devait d’abord impressionner par sa richesse, sa hauteur et l’abondance presque infinie de détails.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. À l’intérieur, un escalier monte jusqu’au sommet","cues":[{"text":"La colonne n’est pas pleine.","pause":650,"fx":null,"afterFx":0},{"text":"Un escalier en spirale est creusé à l’intérieur même des énormes blocs de marbre.","pause":800,"fx":null,"afterFx":0},{"text":"Il comporte cent-quatre-vingt-cinq marches.","pause":700,"fx":null,"afterFx":0},{"text":"De petites ouvertures pratiquées dans le fût apportent de la lumière pendant la montée.","pause":750,"fx":null,"afterFx":0},{"text":"L’escalier permettait d’atteindre une plateforme au sommet.","pause":750,"fx":null,"afterFx":0},{"text":"Imaginez l’exploit technique : il fallait empiler d’immenses tambours de marbre tout en alignant parfaitement l’escalier intérieur.","pause":900,"fx":null,"afterFx":0},{"text":"La sculpture extérieure n’est donc qu’une moitié de la prouesse.","pause":750,"fx":null,"afterFx":0},{"text":"L’autre moitié est cachée à l’intérieur.","pause":900,"fx":null,"afterFx":0}]},{"title":"9. Un monument de victoire devenu tombeau, puis monument chrétien","cues":[{"text":"Regardez enfin le grand piédestal à la base.","pause":700,"fx":null,"afterFx":0},{"text":"Il est décoré d’armes et d’équipements daces sculptés dans le marbre.","pause":750,"fx":null,"afterFx":0},{"text":"Après la mort de Trajan en cent-dix-sept, ses cendres furent déposées dans une chambre aménagée dans cette base.","pause":850,"fx":null,"afterFx":0},{"text":"La colonne devint donc également son monument funéraire.","pause":750,"fx":null,"afterFx":0},{"text":"Au sommet se trouvait à l’origine une statue en bronze doré de Trajan.","pause":800,"fx":null,"afterFx":0},{"text":"Elle disparut probablement au Moyen Âge.","pause":700,"fx":null,"afterFx":0},{"text":"En mille-cinq-cent-quatre-vingt-sept, le pape Sixte Cinq la remplaça par la statue de saint Pierre que vous voyez aujourd’hui.","pause":900,"fx":null,"afterFx":0},{"text":"Regardez maintenant la colonne une dernière fois du bas vers le haut.","pause":800,"fx":null,"afterFx":0},{"text":"Le terrain remodelé de Rome.","pause":550,"fx":null,"afterFx":0},{"text":"Les armes des vaincus.","pause":550,"fx":null,"afterFx":0},{"text":"Deux cents mètres de conquête sculptée.","pause":600,"fx":null,"afterFx":0},{"text":"Les cendres de l’empereur dans la base.","pause":600,"fx":null,"afterFx":0},{"text":"Puis saint Pierre tout en haut.","pause":650,"fx":null,"afterFx":0},{"text":"Deux mille ans d’histoire romaine tiennent ici dans une seule ligne verticale.","pause":900,"fx":null,"afterFx":0},{"text":"Vous pouvez maintenant poursuivre vers Largo di Torre Argentina.","pause":900,"fx":null,"afterFx":0}]}];
const LARGO_ARGENTINA=[{"title":"1. Le chantier qui devait construire du neuf… et a découvert la République","cues":[{"text":"Commencez par regarder l’ensemble de l’aire archéologique avant de descendre.","pause":800,"fx":null,"afterFx":0},{"text":"Le site n’a pas été découvert parce qu’on cherchait spécialement les temples de la Rome républicaine.","pause":850,"fx":null,"afterFx":0},{"text":"En mille-neuf-cent-vingt-six, on démolit l’ancien quartier pour réaliser de nouveaux aménagements urbains.","pause":850,"fx":null,"afterFx":0},{"text":"Et sous les bâtiments apparaissent les vestiges d’une immense place sacrée.","pause":800,"fx":null,"afterFx":0},{"text":"Les fouilles se poursuivent jusqu’en mille-neuf-cent-vingt-huit, puis reprennent à plusieurs reprises au vingtième siècle.","pause":850,"fx":null,"afterFx":0},{"text":"Ce que vous voyez est aujourd’hui le plus vaste ensemble de temples de l’époque républicaine encore visible au cœur de Rome.","pause":900,"fx":null,"afterFx":0},{"text":"C’est une Rome plus ancienne que celle du Colisée, de Trajan ou même d’Auguste.","pause":850,"fx":null,"afterFx":0},{"text":"Ici, on remonte plusieurs siècles avant l’Empire.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. Pourquoi les temples s’appellent simplement A, B, C et D","cues":[{"text":"Les quatre temples sont désignés par les lettres A, B, C et D.","pause":750,"fx":null,"afterFx":0},{"text":"Ce n’est pas parce que les archéologues manquaient d’imagination.","pause":700,"fx":null,"afterFx":0},{"text":"C’est parce que leur identification exacte reste en partie incertaine.","pause":800,"fx":null,"afterFx":0},{"text":"Le temple C est le plus ancien.","pause":700,"fx":null,"afterFx":0},{"text":"Il date de la fin du quatrième ou du début du troisième siècle avant notre ère et était probablement consacré à Feronia.","pause":850,"fx":null,"afterFx":0},{"text":"Le temple A, plus petit, date du milieu du troisième siècle et pourrait être celui de Juturne.","pause":850,"fx":null,"afterFx":0},{"text":"Le temple D, le plus vaste, est construit au début du deuxième siècle avant notre ère.","pause":800,"fx":null,"afterFx":0},{"text":"On l’attribue aux Lares Permarini, ou selon une autre hypothèse aux Nymphes.","pause":850,"fx":null,"afterFx":0},{"text":"Autrement dit, quand l’archéologie hésite, le guide doit hésiter avec elle.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. Le temple rond — la Fortune du jour présent","cues":[{"text":"Cherchez maintenant le temple B.","pause":700,"fx":null,"afterFx":0},{"text":"Vous le reconnaîtrez facilement : c’est le seul de plan circulaire.","pause":750,"fx":null,"afterFx":0},{"text":"Il est construit après le grand incendie de cent-onze avant notre ère, lorsque toute la place est réorganisée.","pause":850,"fx":null,"afterFx":0},{"text":"La plupart des chercheurs l’identifient au temple de Fortuna huiusce diei.","pause":800,"fx":null,"afterFx":0},{"text":"La Fortune du jour présent.","pause":700,"fx":null,"afterFx":0},{"text":"Le sanctuaire aurait célébré la victoire romaine sur les Cimbres à la fin du deuxième siècle avant notre ère.","pause":850,"fx":null,"afterFx":0},{"text":"Une immense statue féminine occupait le temple.","pause":750,"fx":null,"afterFx":0},{"text":"Sa tête, ses bras et ses pieds étaient en marbre, tandis que le reste du corps utilisait d’autres matériaux.","pause":850,"fx":null,"afterFx":0},{"text":"Des fragments de cette statue sont aujourd’hui conservés à la Centrale Montemartini.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. Les incendies ont littéralement fait monter le sol","cues":[{"text":"En regardant les temples, essayez maintenant de repérer leurs différences de niveau.","pause":800,"fx":null,"afterFx":0},{"text":"Le sol de la place n’est pas resté à la même hauteur pendant toute l’Antiquité.","pause":750,"fx":null,"afterFx":0},{"text":"Après l’incendie de cent-onze avant notre ère, les gravats sont utilisés pour rehausser la zone de plus d’un mètre.","pause":850,"fx":null,"afterFx":0},{"text":"Un nouveau pavement unifie alors les temples plus anciens.","pause":750,"fx":null,"afterFx":0},{"text":"Puis, en quatre-vingts de notre ère, un autre grand incendie ravage une partie du Champ de Mars.","pause":800,"fx":null,"afterFx":0},{"text":"Sous Domitien, on nivelle encore les destructions et on installe un nouveau pavement en travertin.","pause":850,"fx":null,"afterFx":0},{"text":"Donc, ici, un incendie ne laisse pas seulement une couche noire dans le sol.","pause":800,"fx":null,"afterFx":0},{"text":"Il change la hauteur même de la ville.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. Jules César n’est pas mort au Sénat du Forum","cues":[{"text":"Nous arrivons maintenant à la raison pour laquelle Largo Argentina est connu bien au-delà de l’archéologie des temples.","pause":850,"fx":null,"afterFx":0},{"text":"Le quinze mars quarante-quatre avant notre ère, Jules César est assassiné pendant une séance du Sénat.","pause":850,"fx":null,"afterFx":0},{"text":"Mais pas dans la Curie que vous avez vue sur le Forum romain.","pause":800,"fx":null,"afterFx":0},{"text":"À cette date, la Curie du Forum est en travaux.","pause":750,"fx":null,"afterFx":0},{"text":"Le Sénat se réunit donc dans la Curie de Pompée, intégrée au vaste complexe du Théâtre de Pompée.","pause":850,"fx":null,"afterFx":0},{"text":"Et une partie de cette Curie se trouve précisément ici.","pause":800,"fx":null,"afterFx":0},{"text":"Derrière les temples B et C, cherchez le grand soubassement rectangulaire en tuf.","pause":850,"fx":null,"afterFx":0},{"text":"Il appartient au bâtiment dans lequel César fut poignardé aux Ides de mars.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. Le détail presque théâtral — mourir au pied de Pompée","cues":[{"text":"Il y a dans cette histoire une ironie que les auteurs antiques n’ont pas manqué de souligner.","pause":850,"fx":null,"afterFx":0},{"text":"La Curie appartenait au complexe construit par Pompée le Grand.","pause":750,"fx":null,"afterFx":0},{"text":"Pompée avait été l’allié, puis le grand rival de César pendant la guerre civile.","pause":800,"fx":null,"afterFx":0},{"text":"Il avait été vaincu par César et assassiné en Égypte plusieurs années auparavant.","pause":800,"fx":null,"afterFx":0},{"text":"Selon plusieurs récits antiques, César s’effondre près de la statue de Pompée après avoir reçu les coups des conjurés.","pause":900,"fx":null,"afterFx":0},{"text":"La scène est presque trop parfaite pour un dramaturge.","pause":700,"fx":null,"afterFx":0},{"text":"Le vainqueur de Pompée meurt dans le bâtiment de Pompée, au pied de l’image de Pompée.","pause":850,"fx":null,"afterFx":0},{"text":"Nous connaissons l’existence de la Curie et l’assassinat ici.","pause":750,"fx":null,"afterFx":0},{"text":"Les détails précis des derniers instants nous viennent, eux, des récits littéraires antiques et doivent être lus comme tels.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. « Argentina » n’a rien à voir avec l’Argentine","cues":[{"text":"Le nom du lieu réserve lui aussi une surprise.","pause":700,"fx":null,"afterFx":0},{"text":"Largo di Torre Argentina n’a aucun rapport avec le pays d’Amérique du Sud.","pause":800,"fx":null,"afterFx":0},{"text":"Le mot vient d’Argentoratum, le nom latin de Strasbourg.","pause":750,"fx":null,"afterFx":0},{"text":"À la fin du quinzième siècle, Johannes Burckardt, maître des cérémonies du pape Alexandre Six Borgia, possède un palais tout près d’ici.","pause":850,"fx":null,"afterFx":0},{"text":"Burckardt est originaire de Strasbourg.","pause":700,"fx":null,"afterFx":0},{"text":"Comme il est associé à Argentoratum, il appelle sa tour « Argentina ».","pause":800,"fx":null,"afterFx":0},{"text":"Le nom finit par désigner tout le secteur.","pause":750,"fx":null,"afterFx":0},{"text":"Donc, au milieu de Rome, « Argentina » signifie en quelque sorte : Strasbourg.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. Un temple devient une église","cues":[{"text":"Après l’Antiquité, les temples ne disparaissent pas d’un seul coup.","pause":750,"fx":null,"afterFx":0},{"text":"À partir du cinquième siècle, la zone se transforme progressivement.","pause":750,"fx":null,"afterFx":0},{"text":"Entre le huitième et le neuvième siècle, de nouvelles constructions occupent l’ancienne aire sacrée.","pause":800,"fx":null,"afterFx":0},{"text":"Et le temple A reçoit une nouvelle fonction particulièrement romaine.","pause":750,"fx":null,"afterFx":0},{"text":"Une église est installée directement à l’intérieur.","pause":800,"fx":null,"afterFx":0},{"text":"En onze-cent-trente-deux, elle est dédiée à saint Nicolas.","pause":750,"fx":null,"afterFx":0},{"text":"On peut encore reconnaître des éléments médiévaux, notamment une abside, des restes de pavement cosmatesque et un autel.","pause":850,"fx":null,"afterFx":0},{"text":"Même ici, un temple républicain finit donc par devenir le support matériel d’une église médiévale.","pause":900,"fx":null,"afterFx":0}]},{"title":"9. Les habitants les plus célèbres aujourd’hui ont quatre pattes","cues":[{"text":"Avant de quitter le site, vous avez peut-être déjà remarqué certains habitants beaucoup plus récents.","pause":800,"fx":null,"afterFx":0},{"text":"Largo Argentina est célèbre pour sa colonie de chats.","pause":750,"fx":null,"afterFx":0},{"text":"Ils vivent depuis longtemps parmi les ruines et sont aujourd’hui pris en charge par une association de protection animale installée à proximité.","pause":850,"fx":null,"afterFx":0},{"text":"Je ne vais pas leur ajouter un miaulement dans vos écouteurs.","pause":750,"fx":null,"afterFx":0},{"text":"S’ils sont là, ils sont parfaitement capables de fournir eux-mêmes la bande-son.","pause":900,"fx":null,"afterFx":0},{"text":"Pour votre visite, retenez surtout le contraste.","pause":700,"fx":null,"afterFx":0},{"text":"Quatre temples de la République.","pause":550,"fx":null,"afterFx":0},{"text":"Le lieu où César fut assassiné.","pause":550,"fx":null,"afterFx":0},{"text":"Une église médiévale.","pause":550,"fx":null,"afterFx":0},{"text":"Et une colonie de chats au milieu de la circulation moderne.","pause":750,"fx":null,"afterFx":0},{"text":"Difficile de faire plus romain.","pause":800,"fx":null,"afterFx":0},{"text":"Vous pouvez maintenant poursuivre vers le Panthéon.","pause":900,"fx":null,"afterFx":0}]}];
const PANTHEON=[{"title":"1. Avant d’entrer — Agrippa signe un bâtiment construit cent cinquante ans plus tard","cues":[{"text":"Avant d’entrer, restez quelques instants sur la Piazza della Rotonda et regardez la façade.","pause":800,"fx":null,"afterFx":0},{"text":"Le portique classique avec ses grandes colonnes de granit donne l’impression d’un temple parfaitement traditionnel.","pause":850,"fx":null,"afterFx":0},{"text":"Levez maintenant les yeux vers la grande inscription.","pause":700,"fx":null,"afterFx":0},{"text":"Elle commence par Marcus Agrippa.","pause":700,"fx":null,"afterFx":0},{"text":"Et elle affirme qu’Agrippa, consul pour la troisième fois, a construit le monument.","pause":800,"fx":null,"afterFx":0},{"text":"Sauf que le Panthéon que vous allez visiter n’est pas celui d’Agrippa.","pause":850,"fx":null,"afterFx":0},{"text":"Le premier édifice date de vingt-sept avant notre ère.","pause":750,"fx":null,"afterFx":0},{"text":"L’actuel est reconstruit sous Hadrien entre environ cent-dix-huit et cent-vingt-cinq de notre ère.","pause":850,"fx":null,"afterFx":0},{"text":"Hadrien a pourtant conservé sur la façade le nom d’Agrippa plutôt que d’inscrire le sien.","pause":850,"fx":null,"afterFx":0},{"text":"Dès l’entrée, le Panthéon vous avertit donc : à Rome, une inscription peut être plus ancienne que le bâtiment qui la porte.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. Passez la porte — le rectangle devient soudain un cercle","cues":[{"text":"Entrez maintenant sous le portique puis franchissez les grandes portes.","pause":800,"fx":null,"afterFx":0},{"text":"Le changement d’espace est l’un des grands effets du monument.","pause":750,"fx":null,"afterFx":0},{"text":"De l’extérieur, vous voyez surtout un temple rectangulaire à colonnes.","pause":750,"fx":null,"afterFx":0},{"text":"À l’intérieur, vous entrez brutalement dans une immense rotonde.","pause":850,"fx":null,"afterFx":0},{"text":"Le diamètre intérieur est d’un peu plus de quarante-trois mètres.","pause":800,"fx":null,"afterFx":0},{"text":"Et du sol jusqu’au sommet de la coupole, la hauteur est pratiquement la même.","pause":800,"fx":null,"afterFx":0},{"text":"Autrement dit, une sphère parfaite d’environ quarante-trois mètres de diamètre pourrait théoriquement tenir exactement à l’intérieur.","pause":900,"fx":null,"afterFx":0},{"text":"C’est cette géométrie simple qui donne au lieu cette impression étonnante d’équilibre.","pause":850,"fx":null,"afterFx":0},{"text":"Vous êtes dans un bâtiment gigantesque qui réussit malgré tout à ne pas paraître écrasant.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. La coupole — le béton romain poussé presque à sa limite","cues":[{"text":"Levez maintenant les yeux vers la coupole.","pause":750,"fx":null,"afterFx":0},{"text":"Elle est toujours la plus grande coupole en béton non armé jamais construite.","pause":850,"fx":null,"afterFx":0},{"text":"Elle repose sur une rotonde dont les murs dépassent six mètres d’épaisseur à certains endroits.","pause":850,"fx":null,"afterFx":0},{"text":"Mais les ingénieurs romains ne se sont pas contentés d’empiler énormément de matière.","pause":800,"fx":null,"afterFx":0},{"text":"En montant, ils allègent progressivement la construction.","pause":750,"fx":null,"afterFx":0},{"text":"Les agrégats du béton deviennent plus légers vers le sommet.","pause":750,"fx":null,"afterFx":0},{"text":"L’épaisseur de la coupole diminue elle aussi.","pause":700,"fx":null,"afterFx":0},{"text":"Et les grands caissons que vous voyez ne sont pas seulement décoratifs : ils contribuent à réduire le poids de la voûte.","pause":900,"fx":null,"afterFx":0},{"text":"La prouesse n’est donc pas de construire lourd.","pause":700,"fx":null,"afterFx":0},{"text":"C’est de savoir exactement où l’on peut se permettre d’être plus léger.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. Les vingt-huit caissons — quand les mathématiques deviennent décor","cues":[{"text":"Regardez maintenant les caissons de la coupole.","pause":700,"fx":null,"afterFx":0},{"text":"Ils sont organisés en cinq anneaux concentriques.","pause":750,"fx":null,"afterFx":0},{"text":"Chaque anneau comporte vingt-huit caissons.","pause":700,"fx":null,"afterFx":0},{"text":"Le nombre vingt-huit était considéré dans l’Antiquité comme un nombre parfait, parce qu’il est égal à la somme de ses diviseurs : un, deux, quatre, sept et quatorze.","pause":900,"fx":null,"afterFx":0},{"text":"Certains chercheurs et auteurs ont proposé des interprétations astronomiques ou cosmologiques de cette organisation.","pause":850,"fx":null,"afterFx":0},{"text":"Elles sont séduisantes, mais il vaut mieux les considérer comme des interprétations plutôt que comme le mode d’emploi officiel laissé par Hadrien.","pause":900,"fx":null,"afterFx":0},{"text":"Ce qui est incontestable, c’est l’effet visuel.","pause":700,"fx":null,"afterFx":0},{"text":"En se rétrécissant vers le sommet, les caissons dirigent votre regard vers l’oculus.","pause":850,"fx":null,"afterFx":0},{"text":"Tout le plafond semble aspiré vers le ciel.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. L’oculus — oui, il pleut vraiment dans le Panthéon","cues":[{"text":"Regardez maintenant le grand cercle ouvert au sommet.","pause":750,"fx":null,"afterFx":0},{"text":"C’est l’oculus.","pause":650,"fx":null,"afterFx":0},{"text":"Il mesure environ huit mètres quatre-vingt-douze de diamètre.","pause":750,"fx":null,"afterFx":0},{"text":"Et il n’y a pas de vitre.","pause":700,"fx":null,"afterFx":0},{"text":"C’est la seule source de lumière naturelle directe de la rotonde.","pause":750,"fx":null,"afterFx":0},{"text":"Vous entendrez parfois dire que la circulation de l’air empêche la pluie d’entrer.","pause":800,"fx":null,"afterFx":0},{"text":"C’est faux.","pause":700,"fx":null,"afterFx":0},{"text":"Quand il pleut, il pleut réellement à l’intérieur du Panthéon.","pause":800,"fx":null,"afterFx":0},{"text":"Le sol est légèrement conçu pour évacuer l’eau et comporte vingt-deux petits trous de dr
