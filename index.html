<script>
const ROUTES=[{"id":"lundi","name":"Lundi 26 - Colisée et San Clemente","color":"#c94139","stops":[{"title":"Le Colisée · 8 h 45","text":"Visite immersive en neuf séquences : extérieur, entrée, arène, souterrains, gladiateurs, point de vue depuis l’arène, spectacles, empereur et conclusion. La narration utilise la voix française de l’iPhone avec des respirations et des effets sonores insérés uniquement dans les silences.","lat":41.8902102,"lon":12.4922309,"n":1,"immersive":true,"immersiveKey":"colisee","endText":"Vous pouvez maintenant poursuivre vers l’arc de Constantin, juste à côté du Colisée."},{"title":"L’arc de Constantin","text":"Regardez l’arc de Constantin, juste à côté du Colisée. Il célèbre la victoire de l’empereur Constantin sur Maxence, en 312. Les reliefs réutilisent des éléments de monuments plus anciens : les souverains changeaient, mais les images de prestige conservaient leur force. Vous le voyez depuis l’espace public, sans billet. Ne vous attardez pas si vous avez votre rendez-vous à San Clemente à onze heures.","lat":41.88975,"lon":12.49065,"n":2},{"title":"Les fouilles de San Clemente · 11 h","text":"Visite immersive en huit séquences : basilique supérieure, première descente, ancienne basilique, saint Cyrille, niveau romain, mithraeum, rue antique et eau souterraine.","lat":41.88934,"lon":12.49752,"n":3,"immersive":true,"immersiveKey":"san_clemente","endText":"La visite de San Clemente est terminée. Remontez tranquillement vers la basilique supérieure avant de poursuivre votre parcours."}]},{"id":"lundi_a","name":"Lundi 26 - Après-midi A : Cælius et Aventin","color":"#d76a27","stops":[{"title":"Le Clivus Scauri et le Cælius","text":"En quittant San Clemente, longez les rues du Cælius jusqu’au Clivus Scauri. Les murs et les arches qui enjambent la voie racontent l’épaisseur d’une ville transformée sans être effacée. Vous passez près de la basilique des Saints-Jean-et-Paul : la visite de l’église est distincte des maisons romaines souterraines, qui demandent un autre billet. Ce parcours reste une promenade extérieure et libre.","lat":41.88585,"lon":12.4925,"n":1},{"title":"Le Circo Massimo","text":"Le Circo Massimo n’était pas un amphithéâtre : cette immense piste accueillait surtout les courses de chars. Imaginez les équipes tournant autour de la longue barrière centrale, sous les regards d’une foule répartie sur des gradins aujourd’hui disparus. La forme allongée du terrain reste parfaitement lisible depuis les abords. Vous pouvez vous arrêter ici gratuitement, puis monter vers l’Aventin.","lat":41.8853,"lon":12.4853,"n":2},{"title":"Le jardin des Orangers","text":"Vous êtes sur l'Aventin, l'une des sept collines de Rome. Le jardin des Orangers, officiellement parc Savello, occupe l'emplacement d'une ancienne forteresse médiévale. Les orangers et les allées symétriques créent une pause très différente des ruines monumentales.\n\nAvancez vers la terrasse. La vue suit le Tibre et rejoint la coupole de Saint-Pierre. Observez comment les différentes hauteurs de Rome se répondent : le Janicule au loin, les quartiers autour du fleuve et les dômes qui émergent des toits. En fin de journée, la lumière rend ce panorama particulièrement agréable.\n\nÀ proximité se trouve la basilique Sainte-Sabine, remarquable pour son architecture paléochrétienne. Un peu plus loin, le célèbre trou de serrure du prieuré de l'ordre de Malte cadre parfaitement la coupole de Saint-Pierre. La file d'attente peut être longue ; considérez-le comme un complément, non comme une obligation. Ce jardin marque surtout un changement de rythme : après Caracalla et le Cirque Maxime, prenez le temps de vous asseoir et de regarder Rome comme un paysage.","lat":41.8851338,"lon":12.48039,"n":3}]},{"id":"lundi_b","name":"Lundi 26 - Après-midi B : Monti","color":"#3164bd","stops":[{"title":"Santi Quattro Coronati","text":"Cette basilique fortifiée a une allure presque défensive. Ses cours successives et ses murs massifs font sentir le passage de la Rome antique à la Rome médiévale. Entrez dans l’église si elle est ouverte ; le cloître peut avoir des horaires ou une contribution distincts. Le détour est facultatif si vous préférez déjeuner plus tôt.","lat":41.88875,"lon":12.4984,"n":1},{"title":"San Pietro in Vincoli","text":"La basilique conserve le célèbre Moïse sculpté par Michel-Ange pour le tombeau du pape Jules deux. Regardez la tension des bras, le mouvement de la barbe et cette impression que le personnage pourrait se lever. Le monument funéraire réalisé est beaucoup plus modeste que le projet gigantesque imaginé au départ. La visite de l’église vous mène ensuite naturellement vers les rues de Monti.","lat":41.89333,"lon":12.49297,"n":2},{"title":"Le quartier de Monti","text":"Vous terminez le parcours dans Monti, un quartier qui permet de passer de la Rome monumentale à la ville habitée. Son nom signifie les monts, car l'ancien district s'étendait sur plusieurs collines. Dans l'Antiquité, une partie de cette zone appartenait à la Subure, quartier dense, populaire, bruyant et souvent mal famé, où se mêlaient logements, ateliers, boutiques et tavernes.\n\nEn marchant dans les rues étroites, observez le contraste avec les grandes perspectives impériales. Les façades colorées, les escaliers, les plantes aux fenêtres et les petites places racontent une autre Rome, construite par couches successives. La piazza della Madonna dei Monti constitue un bon point de pause. Sa fontaine attire encore les habitants comme les visiteurs.\n\nMonti n'est pas un site antique figé, mais il aide à comprendre une réalité essentielle : autour des forums et des palais vivaient des dizaines de milliers de personnes ordinaires. Prenez le temps de vous arrêter dans une rue calme, puis regardez en direction des forums. En quelques centaines de mètres, vous êtes passé de la résidence des empereurs à l'échelle quotidienne d'un quartier romain.","lat":41.8947077,"lon":12.4925226,"n":3}]},{"id":"mardi","name":"Mardi 27 - Palatin et Forum, sans musée","color":"#15835f","stops":[{"title":"Le Palatin","text":"Visite immersive en huit chapitres : les origines de Rome, les cabanes dites de Romulus, le quartier aristocratique, Auguste, les palais impériaux, la Domus Flavia, le stade palatin et la vue sur le Forum et le Circus Maximus.","lat":41.8886559,"lon":12.4875481,"n":1,"immersive":true,"immersiveKey":"palatin","endText":"La visite générale du Palatin est terminée. Vous pouvez maintenant poursuivre vers la Maison d’Auguste, qui aura son propre audioguide consacré à ses pièces et à ses décors."},{"title":"La maison d’Auguste","text":"Visite immersive en neuf chapitres : le choix du Palatin, l’image de simplicité, les espaces privés et publics, la Salle des Masques, les Festons de pin, l’oecus, le studiolo, le temple d’Apollon et la transformation du Palatin.","lat":41.88788,"lon":12.48565,"n":2,"immersive":true,"immersiveKey":"maison_auguste","endText":"La visite de la Maison d’Auguste est terminée. Vous pouvez poursuivre votre parcours sur le Palatin puis descendre vers le Forum et l’arc de Titus."},{"title":"L’arc de Titus","text":"Visite immersive en six chapitres : l’arc et le triomphe, la menorah, Titus divinisé, la propagande flavienne, la fortification médiévale et le grand démontage-restauration du XIXe siècle.","lat":41.8907044,"lon":12.4885842,"n":3,"immersive":true,"immersiveKey":"arc_titus","endText":"La visite de l’Arc de Titus est terminée. Vous pouvez maintenant descendre la Via Sacra vers la Maison des Vestales."},{"title":"La maison des Vestales","text":"Visite immersive en huit chapitres : le temple de Vesta, la sélection des Vestales, le feu sacré, leurs privilèges, la discipline, la maison, les statues et la fin du collège.","lat":41.8914083,"lon":12.4866391,"n":4,"immersive":true,"immersiveKey":"vestales","endText":"La visite de la Maison des Vestales est terminée. Vous pouvez poursuivre vers le temple de Saturne et le reste du Forum."},{"title":"Le temple de Saturne","text":"Visite immersive en sept chapitres : l’un des plus anciens sanctuaires du Forum, Saturne, le trésor public, la statue liée de laine, les Saturnales, l’inscription de restauration et ce que les huit colonnes racontent encore aujourd’hui.","lat":41.8925403,"lon":12.4842589,"n":5,"immersive":true,"immersiveKey":"saturne","endText":"La visite du Temple de Saturne est terminée. Vous pouvez maintenant poursuivre vers le Capitole."},{"title":"Le Capitole, vue extérieure","text":"Vous êtes sur la place du Capitole, redessinée à partir du seizième siècle selon un projet de Michel-Ange. Remarquez un détail essentiel : la place tourne le dos au Forum antique et s'ouvre vers la ville moderne et le Vatican. Ce changement d'orientation traduit le passage de la Rome antique à la Rome pontificale.\n\nAu centre se trouve une copie de la statue équestre de Marc Aurèle ; l'original est conservé dans les musées. La statue a survécu au Moyen Âge parce qu'on la croyait alors associée à l'empereur chrétien Constantin. Regardez le pavement en étoile, les façades ordonnées et le grand escalier d'accès, la Cordonata. Tout est conçu pour transformer une colline irrégulière en scène cérémonielle.\n\nLes musées du Capitole occupent les palais qui bordent la place. Leur origine remonte à la donation d'un ensemble de bronzes antiques au peuple romain en 1471, ce qui en fait l'une des plus anciennes collections publiques du monde. Même sans tout visiter, retenez que le Capitole fut successivement le centre religieux de la Rome antique, un symbole civique médiéval et une grande composition de la Renaissance.","lat":41.8929428,"lon":12.4825577,"n":6},{"title":"Le théâtre de Marcellus","text":"Devant vous se dresse le théâtre de Marcellus, commencé sous Jules César et inauguré par Auguste. Il porte le nom de Marcellus, neveu et gendre d'Auguste, mort très jeune. À première vue, sa façade peut rappeler le Colisée, mais ce monument est plus ancien et sa forme est différente : un théâtre romain est un demi-cercle, alors qu'un amphithéâtre est une ellipse complète.\n\nLes spectateurs regardaient des pièces, des spectacles musicaux et des cérémonies. La façade associait des arcades à différents ordres architecturaux. Au fil des siècles, le bâtiment changea totalement de fonction. Il devint forteresse, puis palais. Regardez les étages supérieurs : ils appartiennent à des aménagements résidentiels construits au-dessus des structures antiques. C'est un exemple spectaculaire de réutilisation plutôt que de disparition.\n\nÀ proximité, le portique d'Octavie rappelle que ce secteur était autrefois un vaste ensemble monumental. Plus tard, il fut intégré au quartier juif de Rome. En quelques pas, vous pouvez donc lire plusieurs villes superposées : la Rome d'Auguste, la ville médiévale fortifiée, les palais aristocratiques et la Rome contemporaine.","lat":41.8919308,"lon":12.4799083,"n":7},{"title":"Le portique d’Octavie","text":"Le portique d’Octavie fut consacré par Auguste à sa sœur. Ses vestiges ont traversé deux mille ans de changements et se trouvent aujourd’hui au cœur de l’ancien quartier juif. Ici, histoire de Rome antique et histoire des habitants de Rome se rejoignent. Giggetto se situe tout près si vous choisissez d’y déjeuner ; prenez le temps de regarder le monument avant de poursuivre vers l’île Tibérine.","lat":41.89202,"lon":12.47843,"n":8}]},{"id":"mercredi","name":"Mercredi 28 - Marchés, Panthéon, château","color":"#7747ae","stops":[{"title":"Les marchés de Trajan · 9 h 30","text":"Cet ensemble à étages épouse la pente de la colline du Quirinal. Son nom de marchés évoque des boutiques, mais les chercheurs débattent des fonctions exactes de ses différents espaces : commerces, administrations et services y ont probablement coexisté. Observez les voûtes en briques et la grande rue intérieure, la Via Biberatica. À travers les ouvertures, replacer ces bâtiments face au forum de Trajan permet de mesurer l’ampleur du projet impérial. Vous avez un billet pour neuf heures trente ; explorez les lieux comme un morceau de ville ancienne, sans obligation de vous attarder devant chaque vitrine.","lat":41.8967,"lon":12.486,"n":1},{"title":"La colonne de Trajan","text":"Levez les yeux vers la colonne de Trajan. Haute d'environ trente mètres pour son fût, elle fut inaugurée au début du deuxième siècle et raconte les guerres menées par l'empereur contre les Daces, dans l'actuelle Roumanie. Une frise sculptée s'enroule autour du monument comme un rouleau de pierre. Si on la déroulait, elle mesurerait près de deux cents mètres.\n\nTrajan apparaît de nombreuses fois, mais le récit ne montre pas seulement les batailles. On voit les soldats construire des camps, franchir des fleuves, bâtir des ponts, négocier et accomplir des cérémonies. L'armée romaine est présentée comme une force disciplinée, organisée et presque invincible. Les scènes étaient probablement peintes, ce qui les rendait beaucoup plus lisibles qu'aujourd'hui.\n\nÀ l'intérieur, un escalier en spirale monte jusqu'au sommet. La base accueillait les cendres de Trajan et de son épouse Plotine. La statue actuelle de saint Pierre a remplacé au seizième siècle celle de l'empereur. Observez aussi le niveau du sol : la colonne indiquait symboliquement la hauteur de la colline qui avait été excavée pour aménager le forum de Trajan. C'est donc à la fois un récit militaire, un tombeau impérial et un repère des gigantesques travaux urbains.","lat":41.895833,"lon":12.484299,"n":2},{"title":"Largo di Torre Argentina","text":"Depuis le bord de la place, regardez en contrebas les quatre temples républicains. Ils sont désignés par les lettres A, B, C et D, car leurs dédicaces ne sont pas toutes connues avec certitude. Ces sanctuaires sont antérieurs à une grande partie des monuments impériaux visités le premier jour. Le niveau antique se trouve plusieurs mètres sous la ville actuelle, ce qui montre combien Rome s'est élevée au fil des siècles.\n\nLe lieu est surtout associé à la mort de Jules César. Il ne fut pas assassiné exactement au milieu des temples, mais dans la curie de Pompée, qui appartenait au grand complexe voisin. Le 15 mars de l'an 44 avant notre ère, un groupe de sénateurs le frappa de plusieurs coups de poignard. Cet événement déclencha une nouvelle période de guerres civiles et favorisa finalement l'ascension d'Octave, le futur Auguste.\n\nLe site est aussi célèbre pour ses chats, pris en charge depuis longtemps par une association installée à proximité des ruines. Ce contraste entre un épisode majeur de l'histoire politique et la vie quotidienne des animaux donne au lieu une atmosphère très romaine : ici, l'Antiquité n'est jamais totalement séparée du présent.","lat":41.8960403,"lon":12.4768916,"n":3},{"title":"Le Panthéon · 12 h","text":"Placez-vous d'abord sur la place pour observer le portique du Panthéon. L'inscription attribue le monument à Agrippa, proche d'Auguste, mais l'édifice actuel date principalement du règne d'Hadrien, au deuxième siècle. Il a conservé le nom et la dédicace du bâtiment antérieur.\n\nEntrez et laissez votre regard monter vers la coupole. Son diamètre est presque égal à la hauteur intérieure, ce qui donne l'impression d'être dans une sphère parfaite. Au centre, l'oculus de neuf mètres environ est la seule grande source de lumière naturelle. Il est ouvert : lorsqu'il pleut, l'eau tombe réellement à l'intérieur et s'écoule grâce à de petits drains dans le sol. Les caissons de la coupole allègent la structure, tandis que le béton devient progressivement plus léger en montant.\n\nLe Panthéon a été remarquablement préservé parce qu'il fut transformé en église au début du septième siècle. Il abrite notamment les tombeaux de Raphaël et de plusieurs rois d'Italie. Regardez les marbres colorés du sol et des parois, puis la lumière qui se déplace avec le soleil. Plus qu'un simple exploit technique, l'édifice met en scène une image du cosmos : la coupole évoque la voûte céleste et l'oculus ouvre le bâtiment vers le ciel.","lat":41.8986108,"lon":12.4768729,"n":4},{"title":"Piazza Navona · selon le temps disponible","text":"Regardez la forme très allongée de la place : elle conserve exactement le plan du stade de Domitien, construit au premier siècle pour des compétitions athlétiques. Les immeubles actuels ont pris place sur les anciennes tribunes, ce qui explique les courbes des extrémités.\n\nAu centre, la fontaine des Quatre-Fleuves fut réalisée par le Bernin au dix-septième siècle. Les quatre figures personnifient de grands fleuves associés aux continents alors connus des Européens : le Danube, le Gange, le Nil et le Rio de la Plata. Au-dessus s'élève un obélisque antique réutilisé dans une composition baroque spectaculaire. En face, la façade de l'église Sainte-Agnès-en-Agone est liée notamment à Borromini, souvent présenté comme le grand rival du Bernin.\n\nUne légende raconte que l'une des statues détourne son regard de l'église par peur qu'elle ne s'effondre. L'histoire est amusante mais impossible : la fontaine fut achevée avant la façade actuelle. La place rappelle ainsi que Rome adore transformer les rivalités artistiques en anecdotes. Faites lentement le tour de la fontaine pour voir comment l'eau, les rochers, les animaux et les figures créent un théâtre de pierre au cœur de la ville.","lat":41.8991328,"lon":12.4732921,"n":5},{"title":"Le château Saint-Ange · 15 h","text":"Le château Saint-Ange était à l'origine le mausolée de l'empereur Hadrien, construit au deuxième siècle. Imaginez-le couvert de marbre, surmonté de statues et relié à la ville par un pont monumental. Au Moyen Âge, sa position près du Tibre et du Vatican en fit une forteresse idéale.\n\nLe bâtiment fut intégré aux défenses pontificales et relié au Vatican par le Passetto di Borgo, un passage surélevé permettant au pape de se réfugier dans le château. Lors du sac de Rome de 1527, le pape Clément VII l'emprunta pour échapper aux troupes impériales. Le monument servit aussi de prison et de résidence.\n\nSon nom vient d'une tradition selon laquelle l'archange Michel serait apparu au sommet, rengainant son épée pour annoncer la fin d'une épidémie. La statue de l'ange rappelle cette histoire. Depuis le pont, observez la masse cylindrique du mausolée enveloppée par les fortifications. Peu de monuments résument aussi clairement les transformations de Rome : tombeau impérial, forteresse médiévale, refuge des papes, prison puis musée.","lat":41.9030632,"lon":12.466276,"n":6},{"title":"La place Saint-Pierre, vue extérieure","text":"Restez au centre de la place et regardez les deux grandes colonnades dessinées par le Bernin au dix-septième siècle. Elles forment comme deux bras ouverts, image voulue d'une Église accueillant les fidèles. Les quatre rangées de colonnes créent un effet spectaculaire. Cherchez au sol l'un des disques marquant le centre géométrique d'une colonnade : placé dessus, vous verrez les quatre rangées s'aligner et donner l'impression de n'en former qu'une seule.\n\nL'obélisque au centre est antique. Il fut transporté d'Égypte à Rome et se trouvait autrefois dans le cirque de Néron. Son déplacement jusqu'à la place actuelle, au seizième siècle, fut une prouesse technique. Les deux fontaines équilibrent la composition et accompagnent le mouvement de la colonnade.\n\nLa façade de la basilique est l'œuvre de Carlo Maderno. Depuis certains points de la place, la coupole de Michel-Ange paraît partiellement masquée par cette façade, conséquence des transformations successives du projet. Sans entrer dans le Vatican, vous pouvez déjà lire la place comme une immense scène : l'architecture organise les foules, cadre les cérémonies et conduit naturellement le regard vers le balcon central et la basilique.","lat":41.9022225,"lon":12.4567283,"n":7}]},{"id":"soir","name":"Un soir - La fontaine de Trevi","color":"#a26516","stops":[{"title":"La fontaine de Trevi","text":"La fontaine de Trevi occupe la façade du palais Poli. Au centre, l’Océan se tient sur son char ; les chevaux marins et les cascades transforment la petite place en scène de théâtre. Le monument célèbre l’arrivée de l’eau par l’aqueduc de l’Aqua Virgo, commencé dans l’Antiquité. Regardez comment l’architecture semble surgir de la roche. De nuit, la lumière rend la façade particulièrement spectaculaire. Depuis deux mille vingt-six, l’accès à la zone basse près de l’eau coûte deux euros pour les visiteurs non résidents pendant les horaires de visite, avec dernier accès à vingt et une heures ; depuis la place, la fontaine reste visible gratuitement, y compris après vingt-deux heures. Le lundi vingt-six octobre, l’accès au périmètre intérieur ne commence exceptionnellement qu’à quatorze heures.","lat":41.90092,"lon":12.48333,"n":1}]}];
const IMMERSIVE=[{"title":"1. Devant le Colisée","cues":[{"text":"Prenez quelques secondes pour regarder le Colisée dans son ensemble.","pause":750,"fx":null,"afterFx":0},{"text":"Oui…","pause":950,"fx":null,"afterFx":0},{"text":"Même après près de deux mille ans, il sait encore faire son petit effet.","pause":700,"fx":null,"afterFx":0},{"text":"Son vrai nom est l’amphithéâtre Flavien.","pause":650,"fx":null,"afterFx":0},{"text":"Le nom « Colisée » est venu plus tard, probablement à cause d’une immense statue de Néron qui se dressait autrefois tout près d’ici.","pause":750,"fx":null,"afterFx":0},{"text":"La construction commence sous l’empereur Vespasien, vers l’an soixante-dix de notre ère.","pause":650,"fx":null,"afterFx":0},{"text":"Le bâtiment est inauguré par son fils Titus, en l’an quatre-vingts.","pause":300,"fx":"fanfare","afterFx":650},{"text":"À l’époque, vous n’auriez pas vu cette pierre beige un peu romantique.","pause":650,"fx":null,"afterFx":0},{"text":"Une grande partie de la façade était recouverte de travertin clair.","pause":600,"fx":null,"afterFx":0},{"text":"Des statues occupaient les arcades, et du marbre décorait l’intérieur.","pause":750,"fx":null,"afterFx":0},{"text":"Bref…","pause":950,"fx":null,"afterFx":0},{"text":"Beaucoup moins « ruine antique ».","pause":650,"fx":null,"afterFx":0},{"text":"Beaucoup plus « vitrine impériale flambant neuve ».","pause":750,"fx":null,"afterFx":0},{"text":"Regardez maintenant les différents étages.","pause":650,"fx":null,"afterFx":0},{"text":"Les trois premiers niveaux sont formés de grandes arcades.","pause":600,"fx":null,"afterFx":0},{"text":"Les architectes ont superposé plusieurs styles de colonnes, du plus simple au plus décoré.","pause":700,"fx":null,"afterFx":0},{"text":"Les Romains avaient donc déjà compris qu’un bâtiment de plusieurs étages pouvait être fonctionnel…","pause":1000,"fx":null,"afterFx":0},{"text":"Sans ressembler à un parking.","pause":750,"fx":null,"afterFx":0},{"text":"Le Colisée pouvait accueillir des dizaines de milliers de spectateurs.","pause":300,"fx":"crowd_big","afterFx":600},{"text":"Et tout ce monde n’entrait pas par une seule porte.","pause":650,"fx":null,"afterFx":0},{"text":"Il existait de nombreuses entrées numérotées, reliées à un réseau de couloirs et d’escaliers.","pause":650,"fx":null,"afterFx":0},{"text":"Un système vieux de près de deux mille ans…","pause":1000,"fx":null,"afterFx":0},{"text":"Que nos grands stades utilisent encore aujourd’hui.","pause":850,"fx":null,"afterFx":0}]},{"title":"2. En entrant","cues":[{"text":"Une fois à l’intérieur, regardez la pente des gradins.","pause":700,"fx":null,"afterFx":0},{"text":"Dans la Rome antique, votre place dépendait directement de votre position dans la société.","pause":700,"fx":null,"afterFx":0},{"text":"Les sénateurs et les personnages les plus importants étaient installés tout près de l’arène.","pause":650,"fx":null,"afterFx":0},{"text":"Plus on montait, plus on descendait dans l’échelle sociale.","pause":750,"fx":null,"afterFx":0},{"text":"Les spectateurs disposaient de billets ou de jetons indiquant leur entrée et leur secteur.","pause":650,"fx":null,"afterFx":0},{"text":"Imaginez donc des dizaines de milliers de Romains circulant dans les couloirs, chacun à la recherche de sa place.","pause":300,"fx":"steps_crowd","afterFx":550},{"text":"Et, statistiquement, il devait déjà y avoir quelqu’un pour dire : « Je suis sûr que c’est par là. »","pause":800,"fx":null,"afterFx":0},{"text":"Alors que non.","pause":850,"fx":null,"afterFx":0},{"text":"Le Colisée était conçu pour faire entrer, répartir puis faire sortir une foule considérable avec une efficacité remarquable.","pause":850,"fx":null,"afterFx":0}]},{"title":"3. Regardez l’arène","cues":[{"text":"Regardez maintenant le centre du Colisée.","pause":700,"fx":null,"afterFx":0},{"text":"Aujourd’hui, vous voyez une grande partie des structures souterraines.","pause":650,"fx":null,"afterFx":0},{"text":"Dans l’Antiquité, elles étaient presque entièrement cachées sous un plancher de bois recouvert de sable.","pause":700,"fx":null,"afterFx":0},{"text":"C’est d’ailleurs de ce sable que vient notre mot « arène ».","pause":700,"fx":null,"afterFx":0},{"text":"Le sable absorbait les liquides et pouvait être remplacé rapidement entre les spectacles.","pause":650,"fx":null,"afterFx":0},{"text":"Et, compte tenu du programme de certaines journées…","pause":1000,"fx":null,"afterFx":0},{"text":"Disons simplement que ce n’était pas un détail inutile.","pause":800,"fx":null,"afterFx":0},{"text":"Sous le plancher se trouvait l’hypogée.","pause":300,"fx":"gate","afterFx":550},{"text":"C’était l’immense espace technique du Colisée.","pause":650,"fx":null,"afterFx":0},{"text":"On y préparait les animaux, les décors, les accessoires et les combattants.","pause":700,"fx":null,"afterFx":0},{"text":"Le public, lui, ne devait voir que le résultat final.","pause":650,"fx":null,"afterFx":0},{"text":"Les coulisses restaient cachées.","pause":850,"fx":null,"afterFx":0}]},{"title":"4. Dans les souterrains","cues":[{"text":"Vous êtes maintenant dans l’une des parties les plus fascinantes du Colisée : les souterrains.","pause":800,"fx":null,"afterFx":0},{"text":"Imaginez cet endroit beaucoup plus sombre.","pause":750,"fx":null,"afterFx":0},{"text":"Au-dessus de votre tête se trouvait le plancher de l’arène.","pause":650,"fx":null,"afterFx":0},{"text":"Autour de vous circulaient les hommes chargés d’organiser les spectacles, mais aussi les animaux et les combattants qui attendaient leur entrée.","pause":750,"fx":null,"afterFx":0},{"text":"Des couloirs, des cages, des monte-charges et des trappes permettaient de faire apparaître hommes, animaux et décors directement dans l’arène.","pause":700,"fx":null,"afterFx":0},{"text":"À certains endroits, des plateformes étaient hissées grâce à des mécanismes actionnés par plusieurs hommes.","pause":700,"fx":null,"afterFx":0},{"text":"Imaginez maintenant la scène depuis les gradins.","pause":750,"fx":null,"afterFx":0},{"text":"Vous voyez seulement du sable.","pause":700,"fx":null,"afterFx":0},{"text":"Puis une trappe s’ouvre.","pause":250,"fx":"gate","afterFx":450},{"text":"Et soudain…","pause":950,"fx":null,"afterFx":0},{"text":"Un animal surgit.","pause":250,"fx":"roar","afterFx":600},{"text":"Effet garanti.","pause":750,"fx":null,"afterFx":0},{"text":"Pas d’écran géant.","pause":600,"fx":null,"afterFx":0},{"text":"Pas d’effets numériques.","pause":600,"fx":null,"afterFx":0},{"text":"Mais les Romains savaient déjà parfaitement fabriquer une entrée spectaculaire.","pause":800,"fx":null,"afterFx":0},{"text":"Les animaux pouvaient venir de très loin dans l’Empire.","pause":650,"fx":null,"afterFx":0},{"text":"Lions, léopards, ours, sangliers, autruches et bien d’autres espèces.","pause":800,"fx":null,"afterFx":0},{"text":"Faire arriver ici un animal exotique était aussi une démonstration de puissance.","pause":700,"fx":null,"afterFx":0},{"text":"Le message était assez simple…","pause":1000,"fx":null,"afterFx":0},{"text":"Rome peut aller le chercher très loin…","pause":1000,"fx":null,"afterFx":0},{"text":"Et vous le montrer ici.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. Les gladiateurs","cues":[{"text":"Parlons maintenant des stars du lieu : les gladiateurs.","pause":300,"fx":"swords","afterFx":500},{"text":"Première idée à oublier.","pause":750,"fx":null,"afterFx":0},{"text":"Un combat de gladiateurs ne se terminait pas systématiquement par la mort de l’un des deux hommes.","pause":700,"fx":null,"afterFx":0},{"text":"Former un bon gladiateur demandait du temps et coûtait cher.","pause":650,"fx":null,"afterFx":0},{"text":"Le perdre à chaque spectacle aurait été une assez mauvaise politique de gestion.","pause":800,"fx":null,"afterFx":0},{"text":"Les gladiateurs étaient entraînés dans des écoles spécialisées.","pause":650,"fx":null,"afterFx":0},{"text":"La plus célèbre de Rome se trouvait juste à côté du Colisée : le Ludus Magnus.","pause":750,"fx":null,"afterFx":0},{"text":"Il existait plusieurs catégories de combattants, avec des armes et des protections différentes.","pause":650,"fx":null,"afterFx":0},{"text":"Certains portaient un grand bouclier.","pause":600,"fx":null,"afterFx":0},{"text":"D’autres combattaient plus légèrement.","pause":600,"fx":null,"afterFx":0},{"text":"Certains utilisaient même un filet et un trident.","pause":700,"fx":null,"afterFx":0},{"text":"Les affrontements étaient organisés de manière à opposer des styles différents.","pause":650,"fx":null,"afterFx":0},{"text":"Le but était bien sûr de gagner.","pause":600,"fx":null,"afterFx":0},{"text":"Mais il fallait surtout offrir un bon spectacle.","pause":750,"fx":null,"afterFx":0},{"text":"Certains gladiateurs devenaient extrêmement populaires.","pause":650,"fx":null,"afterFx":0},{"text":"Leur nom pouvait être gravé sur les murs, et le public avait ses favoris.","pause":700,"fx":null,"afterFx":0},{"text":"Les champions, les supporters, la célébrité…","pause":1000,"fx":null,"afterFx":0},{"text":"Finalement, nous n’avons pas tout inventé.","pause":650,"fx":null,"afterFx":0},{"text":"Nous avons surtout remplacé le glaive par le maillot.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. Sur l’arène","cues":[{"text":"Si vous avez accès au plancher de l’arène, avancez de quelques mètres.","pause":750,"fx":null,"afterFx":0},{"text":"Puis arrêtez-vous.","pause":700,"fx":null,"afterFx":0},{"text":"Et regardez autour de vous.","pause":800,"fx":null,"afterFx":0},{"text":"Essayez maintenant d’oublier les ruines.","pause":750,"fx":null,"afterFx":0},{"text":"Imaginez les gradins entièrement reconstruits.","pause":650,"fx":null,"afterFx":0},{"text":"Des dizaines de milliers de personnes.","pause":250,"fx":"crowd_big","afterFx":500},{"text":"Le bruit.","pause":600,"fx":null,"afterFx":0},{"text":"Les cris.","pause":600,"fx":null,"afterFx":0},{"text":"La chaleur.","pause":700,"fx":null,"afterFx":0},{"text":"Et vous…","pause":1000,"fx":null,"afterFx":0},{"text":"Au milieu.","pause":900,"fx":null,"afterFx":0},{"text":"Vu depuis les gradins, le Colisée est impressionnant.","pause":650,"fx":null,"afterFx":0},{"text":"Vu depuis l’arène, il devient beaucoup plus intimidant.","pause":800,"fx":null,"afterFx":0},{"text":"Les spectateurs dominaient littéralement la scène.","pause":650,"fx":null,"afterFx":0},{"text":"Au-dessus d’eux, une immense toile appelée le velum pouvait protéger une partie du public du soleil.","pause":250,"fx":"wind","afterFx":500},{"text":"Elle était fixée à des mâts installés au sommet du bâtiment et manipulée par des équipes spécialisées, probablement avec l’aide de marins habitués aux cordages.","pause":750,"fx":null,"afterFx":0},{"text":"Imaginez un parasol assez grand pour couvrir une partie du Colisée.","pause":700,"fx":null,"afterFx":0},{"text":"Puis imaginez devoir le replier correctement.","pause":750,"fx":null,"afterFx":0},{"text":"On comprend assez vite pourquoi il fallait des professionnels.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. Les spectacles","cues":[{"text":"Les combats de gladiateurs ne représentaient qu’une partie du programme.","pause":700,"fx":null,"afterFx":0},{"text":"Le public pouvait également assister à de grandes chasses avec des animaux sauvages.","pause":250,"fx":"roar","afterFx":500},{"text":"Des chasseurs spécialisés affrontaient certaines de ces bêtes dans l’arène.","pause":700,"fx":null,"afterFx":0},{"text":"Il y avait aussi des exécutions publiques.","pause":700,"fx":null,"afterFx":0},{"text":"Certaines pouvaient être mises en scène comme de véritables spectacles, parfois inspirés de récits mythologiques.","pause":750,"fx":null,"afterFx":0},{"text":"Aujourd’hui, cette violence nous paraît évidemment difficile à concevoir comme un divertissement.","pause":800,"fx":null,"afterFx":0},{"text":"Mais pour comprendre le Colisée, il faut aussi comprendre ce qu’il représentait pour la société romaine.","pause":700,"fx":null,"afterFx":0},{"text":"Ces spectacles mettaient en scène l’ordre du monde romain.","pause":650,"fx":null,"afterFx":0},{"text":"La puissance de l’empereur.","pause":600,"fx":null,"afterFx":0},{"text":"La domination de Rome sur ses territoires.","pause":600,"fx":null,"afterFx":0},{"text":"La victoire.","pause":550,"fx":null,"afterFx":0},{"text":"La discipline.","pause":550,"fx":null,"afterFx":0},{"text":"Et parfois la mort.","pause":250,"fx":"drum","afterFx":650},{"text":"Le Colisée était donc beaucoup plus qu’un stade.","pause":700,"fx":null,"afterFx":0},{"text":"C’était à la fois un lieu de spectacle, un théâtre politique et une gigantesque vitrine de la puissance impériale.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. L’empereur entre en scène","cues":[{"text":"Cherchez maintenant la zone où se trouvait la tribune impériale.","pause":700,"fx":null,"afterFx":0},{"text":"Lorsque l’empereur assistait aux jeux, il ne venait pas simplement passer une bonne après-midi.","pause":700,"fx":null,"afterFx":0},{"text":"Sa présence faisait partie du spectacle.","pause":250,"fx":"fanfare","afterFx":500},{"text":"Offrir des jeux permettait au pouvoir de montrer sa générosité envers le peuple.","pause":650,"fx":null,"afterFx":0},{"text":"Les spectacles étaient généralement gratuits pour le public.","pause":650,"fx":null,"afterFx":0},{"text":"Mais, évidemment, quelqu’un les finançait.","pause":750,"fx":null,"afterFx":0},{"text":"Et celui qui les finançait ne manquait pas de rappeler à qui l’on devait cette magnifique journée de divertissement.","pause":700,"fx":null,"afterFx":0},{"text":"Communication politique, version Empire romain.","pause":750,"fx":null,"afterFx":0},{"text":"Pas de réseaux sociaux.","pause":700,"fx":null,"afterFx":0},{"text":"Mais des dizaines de milliers de personnes réunies au même endroit…","pause":300,"fx":"applause","afterFx":550},{"text":"Ce n’est déjà pas un mauvais taux d’engagement.","pause":900,"fx":null,"afterFx":0}]},{"title":"9. Avant de quitter le Colisée","cues":[{"text":"Avant de repartir, regardez une dernière fois l’ensemble du monument.","pause":750,"fx":null,"afterFx":0},{"text":"Essayez maintenant de ne plus voir seulement une ruine.","pause":750,"fx":null,"afterFx":0},{"text":"Imaginez les murs recouverts de marbre.","pause":600,"fx":null,"afterFx":0},{"text":"Les statues.","pause":500,"fx":null,"afterFx":0},{"text":"Les tissus.","pause":500,"fx":null,"afterFx":0},{"text":"Les gradins remplis.","pause":500,"fx":null,"afterFx":0},{"text":"Les vendeurs.","pause":500,"fx":null,"afterFx":0},{"text":"Les gardes.","pause":500,"fx":null,"afterFx":0},{"text":"Les animaux.","pause":500,"fx":null,"afterFx":0},{"text":"Les gladiateurs.","pause":700,"fx":null,"afterFx":0},{"text":"Et, sous l’arène, toute cette mécanique invisible qui faisait fonctionner le spectacle.","pause":800,"fx":null,"afterFx":0},{"text":"Le Colisée réunit deux choses que Rome maîtrisait particulièrement bien : l’ingénierie…","pause":1000,"fx":null,"afterFx":0},{"text":"Et la mise en scène.","pause":800,"fx":null,"afterFx":0},{"text":"C’est probablement ce qui le rend toujours aussi impressionnant aujourd’hui.","pause":700,"fx":null,"afterFx":0},{"text":"Près de deux mille ans plus tard, le bâtiment est partiellement détruit.","pause":650,"fx":null,"afterFx":0},{"text":"Le marbre a presque entièrement disparu.","pause":600,"fx":null,"afterFx":0},{"text":"Les gradins aussi.","pause":650,"fx":null,"afterFx":0},{"text":"Les empereurs, heureusement, ne posent plus de problème de circulation.","pause":850,"fx":null,"afterFx":0},{"text":"Mais le Colisée continue de remplir sa fonction la plus élémentaire.","pause":650,"fx":null,"afterFx":0},{"text":"Faire lever les yeux aux gens qui arrivent devant lui.","pause":750,"fx":null,"afterFx":0},{"text":"Et visiblement…","pause":1000,"fx":null,"afterFx":0},{"text":"Ça fonctionne encore très bien.","pause":300,"fx":"finale","afterFx":700},{"text":"Vous pouvez maintenant poursuivre vers l’arc de Constantin, juste à côté du Colisée.","pause":900,"fx":null,"afterFx":0}]}];
const SAN_CLEMENTE=[{"title":"1. Avant de descendre — commencez par lever les yeux","cues":[{"text":"Avant de filer vers les escaliers, prenez quelques secondes pour regarder la basilique actuelle.","pause":750,"fx":null,"afterFx":0},{"text":"Parce que le piège de San Clemente, c’est justement de vouloir descendre tout de suite.","pause":700,"fx":null,"afterFx":0},{"text":"Et ce serait dommage.","pause":800,"fx":null,"afterFx":0},{"text":"Vous êtes dans une basilique construite au début du douzième siècle.","pause":650,"fx":"church","afterFx":500},{"text":"Regardez le sol de marbre aux motifs géométriques, puis l’abside au fond de l’église.","pause":700,"fx":null,"afterFx":0},{"text":"La grande mosaïque est l’un des éléments les plus spectaculaires du lieu.","pause":650,"fx":null,"afterFx":0},{"text":"Mais regardez aussi la clôture de marbre qui encadre le chœur.","pause":650,"fx":null,"afterFx":0},{"text":"Elle a quelque chose de particulier…","pause":1000,"fx":null,"afterFx":0},{"text":"Elle est plus ancienne que l’église dans laquelle vous vous trouvez.","pause":750,"fx":null,"afterFx":0},{"text":"Une partie de ces marbres provient de la basilique précédente, située juste en dessous.","pause":700,"fx":null,"afterFx":0},{"text":"San Clemente annonce donc la couleur dès le départ.","pause":650,"fx":null,"afterFx":0},{"text":"Ici, rien ne disparaît vraiment.","pause":650,"fx":null,"afterFx":0},{"text":"On démonte.","pause":500,"fx":null,"afterFx":0},{"text":"On récupère.","pause":500,"fx":null,"afterFx":0},{"text":"On remplit.","pause":500,"fx":null,"afterFx":0},{"text":"On reconstruit dessus.","pause":700,"fx":null,"afterFx":0},{"text":"Bienvenue à Rome.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. Premier escalier — vous venez de perdre huit siècles","cues":[{"text":"Commencez maintenant à descendre.","pause":350,"fx":"stone_steps","afterFx":450},{"text":"Quelques marches seulement…","pause":1000,"fx":null,"afterFx":0},{"text":"Et vous venez de remonter près de huit cents ans.","pause":750,"fx":null,"afterFx":0},{"text":"Sous la basilique actuelle se trouve une autre église.","pause":650,"fx":null,"afterFx":0},{"text":"Une basilique construite autour de l’an quatre cents, puis utilisée pendant plusieurs siècles.","pause":700,"fx":null,"afterFx":0},{"text":"Vers l’an onze cents, elle est abandonnée.","pause":650,"fx":null,"afterFx":0},{"text":"Et plutôt que de la démolir complètement, les Romains font quelque chose de beaucoup plus romain.","pause":750,"fx":null,"afterFx":0},{"text":"Ils la remplissent.","pause":650,"fx":null,"afterFx":0},{"text":"De terre.","pause":500,"fx":null,"afterFx":0},{"text":"De gravats.","pause":650,"fx":null,"afterFx":0},{"text":"Puis ils utilisent ses murs comme fondations pour construire la nouvelle basilique au-dessus.","pause":750,"fx":null,"afterFx":0},{"text":"Autrement dit, le bâtiment dans lequel vous étiez il y a une minute repose littéralement sur celui dans lequel vous entrez maintenant.","pause":800,"fx":null,"afterFx":0},{"text":"Ce qui explique aussi pourquoi Rome est parfois assez fatigante à visiter.","pause":650,"fx":null,"afterFx":0},{"text":"La ville a une fâcheuse tendance à avoir plusieurs rez-de-chaussée.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. La basilique souterraine — une capsule temporelle","cues":[{"text":"Arrêtez-vous un instant et essayez de retrouver la forme de l’ancienne basilique.","pause":750,"fx":null,"afterFx":0},{"text":"Ce n’est pas évident.","pause":650,"fx":null,"afterFx":0},{"text":"Les murs construits plus tard pour soutenir l’église supérieure brouillent aujourd’hui son plan.","pause":700,"fx":null,"afterFx":0},{"text":"Mais imaginez une nef centrale, des bas-côtés et une abside.","pause":750,"fx":null,"afterFx":0},{"text":"Cette église a connu la fin de l’Empire romain, le haut Moyen Âge puis la Rome médiévale.","pause":750,"fx":null,"afterFx":0},{"text":"Et ses murs ont conservé une succession de fresques peintes entre le huitième et le onzième siècle.","pause":700,"fx":null,"afterFx":0},{"text":"Cherchez notamment les scènes les mieux conservées.","pause":650,"fx":null,"afterFx":0},{"text":"L’une des plus célèbres raconte l’histoire de Sisinnius.","pause":650,"fx":null,"afterFx":0},{"text":"Et elle contient un détail délicieux.","pause":700,"fx":null,"afterFx":0},{"text":"Dans les inscriptions, les personnages ne s’expriment plus seulement dans le latin solennel des monuments.","pause":700,"fx":null,"afterFx":0},{"text":"On voit apparaître une forme très ancienne d’italien parlé.","pause":700,"fx":null,"afterFx":0},{"text":"Et ce premier italien écrit n’est pas exactement une déclaration d’amour.","pause":750,"fx":null,"afterFx":0},{"text":"Il contient des ordres assez grossiers lancés par un personnage particulièrement énervé.","pause":750,"fx":null,"afterFx":0},{"text":"Plusieurs siècles d’histoire religieuse…","pause":1000,"fx":null,"afterFx":0},{"text":"Et même ici, quelqu’un finit par perdre patience.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. Saint Cyrille — Rome rencontre le monde slave","cues":[{"text":"Dans cette ancienne basilique se trouve également un lieu important pour de nombreux visiteurs venus d’Europe centrale et orientale.","pause":750,"fx":null,"afterFx":0},{"text":"Il est associé à saint Cyrille.","pause":300,"fx":"bell","afterFx":500},{"text":"Cyrille et son frère Méthode furent missionnaires auprès des peuples slaves au neuvième siècle.","pause":700,"fx":null,"afterFx":0},{"text":"Cyrille mourut à Rome en huit cent soixante-neuf.","pause":700,"fx":null,"afterFx":0},{"text":"Une précision au passage.","pause":650,"fx":null,"afterFx":0},{"text":"On lui attribue traditionnellement la création de l’alphabet glagolitique, utilisé pour traduire les textes chrétiens en langue slave.","pause":750,"fx":null,"afterFx":0},{"text":"L’alphabet que nous appelons aujourd’hui cyrillique a été développé plus tard dans le milieu de ses disciples.","pause":750,"fx":null,"afterFx":0},{"text":"Son nom lui rend donc hommage, mais il ne l’a probablement pas dessiné lui-même.","pause":750,"fx":null,"afterFx":0},{"text":"Sous une église italienne se trouve ainsi aussi un morceau essentiel de l’histoire culturelle du monde slave.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. Deuxième descente — la Rome impériale","cues":[{"text":"Cherchez maintenant l’escalier qui descend encore.","pause":350,"fx":"stone_steps","afterFx":450},{"text":"Cette fois, le changement est beaucoup plus radical.","pause":750,"fx":null,"afterFx":0},{"text":"Vous quittez la Rome chrétienne.","pause":650,"fx":null,"afterFx":0},{"text":"Et vous arrivez dans la Rome impériale.","pause":300,"fx":"underground","afterFx":500},{"text":"Au premier siècle, le niveau du sol de ce quartier était beaucoup plus bas qu’aujourd’hui.","pause":700,"fx":null,"afterFx":0},{"text":"Les fouilles ont révélé ici des constructions romaines très anciennes, liées aux transformations du secteur après le grand incendie de Rome de l’an soixante-quatre.","pause":800,"fx":null,"afterFx":0},{"text":"Vous êtes désormais à un niveau proche de celui de la ville dans laquelle vivaient les contemporains de Néron.","pause":750,"fx":null,"afterFx":0},{"text":"Et regardez autour de vous.","pause":700,"fx":null,"afterFx":0},{"text":"Le décor change complètement.","pause":650,"fx":null,"afterFx":0},{"text":"Plus de grande nef.","pause":550,"fx":null,"afterFx":0},{"text":"Des couloirs.","pause":500,"fx":null,"afterFx":0},{"text":"Des pièces.","pause":500,"fx":null,"afterFx":0},{"text":"Des murs beaucoup plus anciens.","pause":700,"fx":null,"afterFx":0},{"text":"Vous venez de changer non seulement d’époque…","pause":1000,"fx":null,"afterFx":0},{"text":"Mais aussi de monde.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. Le mithraeum — un culte dans la pénombre","cues":[{"text":"Vous arrivez maintenant dans l’une des parties les plus étranges du complexe.","pause":750,"fx":null,"afterFx":0},{"text":"Cet espace appartenait à l’origine au niveau semi-enterré d’une maison romaine.","pause":700,"fx":null,"afterFx":0},{"text":"Vers la fin du deuxième siècle, une partie de ces pièces est transformée en mithraeum.","pause":750,"fx":null,"afterFx":0},{"text":"Un sanctuaire dédié au dieu Mithra.","pause":300,"fx":"underground","afterFx":500},{"text":"Regardez sa forme.","pause":650,"fx":null,"afterFx":0},{"text":"La pièce est longue, étroite, presque comme une petite salle à manger souterraine.","pause":700,"fx":null,"afterFx":0},{"text":"Le long des côtés se trouvaient des banquettes.","pause":650,"fx":null,"afterFx":0},{"text":"Les membres du culte pouvaient s’y installer pour partager des repas rituels.","pause":750,"fx":null,"afterFx":0},{"text":"Au centre, l’autel représente Mithra mettant à mort un taureau.","pause":750,"fx":null,"afterFx":0},{"text":"Le culte de Mithra reste encore partiellement mystérieux.","pause":700,"fx":null,"afterFx":0},{"text":"Il nous a laissé beaucoup d’images, mais peu de textes expliquant directement ses rites.","pause":750,"fx":null,"afterFx":0},{"text":"Imaginez maintenant cet espace sans éclairage moderne.","pause":750,"fx":null,"afterFx":0},{"text":"Quelques lampes à huile.","pause":600,"fx":null,"afterFx":0},{"text":"Un peu de fumée.","pause":600,"fx":null,"afterFx":0},{"text":"Des ombres sur les murs.","pause":700,"fx":null,"afterFx":0},{"text":"Nous sommes à quelques centaines de mètres du Colisée…","pause":1000,"fx":null,"afterFx":0},{"text":"Mais l’ambiance ne pourrait pas être plus différente.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. Traversez la ruelle — et changez encore de bâtiment","cues":[{"text":"En quittant la maison romaine, vous traversez ce qui était autrefois une petite rue.","pause":750,"fx":null,"afterFx":0},{"text":"Essayez de garder cela en tête.","pause":650,"fx":null,"afterFx":0},{"text":"Vous ne passez pas simplement d’une salle à une autre.","pause":700,"fx":null,"afterFx":0},{"text":"Vous traversez une rue de la Rome antique.","pause":750,"fx":"stone_steps","afterFx":450},{"text":"De l’autre côté se trouve un bâtiment très différent.","pause":650,"fx":null,"afterFx":0},{"text":"Les murs sont massifs.","pause":550,"fx":null,"afterFx":0},{"text":"De grands blocs de tuf.","pause":550,"fx":null,"afterFx":0},{"text":"Des pièces voûtées.","pause":650,"fx":null,"afterFx":0},{"text":"Un ensemble beaucoup plus fonctionnel que la maison que vous venez de quitter.","pause":750,"fx":null,"afterFx":0},{"text":"Les chercheurs ont proposé qu’il puisse avoir été lié à la Moneta, la monnaie impériale.","pause":700,"fx":null,"afterFx":0},{"text":"Mais cette identification reste une hypothèse, pas une certitude absolue.","pause":300,"fx":"metal","afterFx":500},{"text":"Et c’est justement intéressant.","pause":650,"fx":null,"afterFx":0},{"text":"L’archéologie ne consiste pas à regarder une vieille pierre et à déclarer immédiatement : bureau numéro douze de la Monnaie impériale.","pause":800,"fx":null,"afterFx":0},{"text":"On rassemble des indices.","pause":550,"fx":null,"afterFx":0},{"text":"On compare.","pause":550,"fx":null,"afterFx":0},{"text":"On propose une interprétation.","pause":650,"fx":null,"afterFx":0},{"text":"Et parfois, une nouvelle découverte oblige tout le monde à revoir sa copie.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. Écoutez — la ville antique coule encore sous vos pieds","cues":[{"text":"Avant de remonter, arrêtez-vous.","pause":750,"fx":null,"afterFx":0},{"text":"Et cette fois…","pause":1000,"fx":null,"afterFx":0},{"text":"Ne regardez rien.","pause":750,"fx":null,"afterFx":0},{"text":"Écoutez.","pause":250,"fx":"water","afterFx":700},{"text":"Dans les profondeurs de San Clemente, on entend encore l’eau circuler.","pause":750,"fx":null,"afterFx":0},{"text":"Lors des fouilles modernes, cette eau posait suffisamment de problèmes pour qu’un dispositif de drainage soit aménagé vers le secteur du Colisée.","pause":800,"fx":null,"afterFx":0},{"text":"C’est peut-être le détail qui résume le mieux toute la visite.","pause":750,"fx":null,"afterFx":0},{"text":"Au-dessus de vous : la basilique du douzième siècle.","pause":650,"fx":null,"afterFx":0},{"text":"Sous elle : la basilique du quatrième siècle.","pause":650,"fx":null,"afterFx":0},{"text":"Sous celle-ci : des bâtiments romains.","pause":650,"fx":null,"afterFx":0},{"text":"Et plus bas encore, les traces d’une ville antérieure aux grands réaménagements impériaux.","pause":800,"fx":null,"afterFx":0},{"text":"Rome n’est pas construite à côté de son passé.","pause":750,"fx":null,"afterFx":0},{"text":"Elle est construite dessus.","pause":800,"fx":null,"afterFx":0},{"text":"Maintenant, remontez.","pause":300,"fx":"stone_steps","afterFx":450},{"text":"Et comptez mentalement les siècles dans l’autre sens.","pause":700,"fx":null,"afterFx":0},{"text":"Rome impériale.","pause":550,"fx":null,"afterFx":0},{"text":"Rome chrétienne.","pause":550,"fx":null,"afterFx":0},{"text":"Rome médiévale.","pause":650,"fx":null,"afterFx":0},{"text":"Puis, quelques escaliers plus tard…","pause":1000,"fx":null,"afterFx":0},{"text":"Retour au vingt-et-unième siècle.","pause":750,"fx":null,"afterFx":0},{"text":"Avec, normalement, un peu moins de certitude sur ce que signifie réellement l’expression : niveau de la rue.","pause":300,"fx":"water","afterFx":700}]}];
const PALATIN=[{"title":"1. Vous êtes sur la colline où Rome commence","cues":[{"text":"Avant de regarder les palais, oubliez-les quelques instants.","pause":750,"fx":null,"afterFx":0},{"text":"Le Palatin est d’abord une colline très ancienne, occupée bien avant les empereurs.","pause":700,"fx":null,"afterFx":0},{"text":"Les fouilles ont retrouvé ici des traces d’habitat remontant à l’âge du Fer, plusieurs siècles avant la République romaine.","pause":800,"fx":null,"afterFx":0},{"text":"Et c’est justement sur cette colline que la tradition romaine place la naissance de la ville.","pause":750,"fx":null,"afterFx":0},{"text":"Selon la légende, Romulus fonde Rome en sept cent cinquante-trois avant notre ère.","pause":750,"fx":null,"afterFx":0},{"text":"La date est traditionnelle.","pause":600,"fx":null,"afterFx":0},{"text":"L’archéologie ne peut évidemment pas nous montrer Romulus en train de tracer le premier sillon.","pause":800,"fx":null,"afterFx":0},{"text":"En revanche, elle confirme qu’un habitat existait ici très tôt.","pause":700,"fx":null,"afterFx":0},{"text":"Autrement dit, la légende et l’archéologie ne racontent pas exactement la même histoire…","pause":1000,"fx":null,"afterFx":0},{"text":"Mais elles pointent toutes les deux vers la même colline.","pause":300,"fx":"wind","afterFx":500},{"text":"Gardez cette idée pendant toute la visite.","pause":650,"fx":null,"afterFx":0},{"text":"Vous allez passer d’un petit habitat de hauteur à l’un des centres de pouvoir les plus prestigieux du monde antique.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. Les cabanes de Romulus — quand Rome ressemblait encore à un village","cues":[{"text":"Cherchez maintenant les zones où le sol rocheux conserve des traces de constructions très anciennes.","pause":750,"fx":null,"afterFx":0},{"text":"Ce que les archéologues ont retrouvé ici n’est pas une maison de marbre.","pause":650,"fx":null,"afterFx":0},{"text":"Ce sont surtout des empreintes dans le tuf.","pause":600,"fx":null,"afterFx":0},{"text":"Des trous de poteaux.","pause":500,"fx":null,"afterFx":0},{"text":"Des traces de foyer.","pause":500,"fx":null,"afterFx":0},{"text":"Les marques laissées par de petites cabanes de bois, de terre et de matériaux végétaux.","pause":750,"fx":null,"afterFx":0},{"text":"L’une des cabanes mises au jour ne mesurait qu’une petite vingtaine de mètres carrés.","pause":750,"fx":null,"afterFx":0},{"text":"Nous sommes donc très loin des immenses salles impériales que vous verrez ensuite.","pause":750,"fx":null,"afterFx":0},{"text":"Mais voici l’anecdote la plus intéressante.","pause":700,"fx":null,"afterFx":0},{"text":"Les Romains de l’Antiquité montraient déjà sur le Palatin une cabane qu’ils considéraient comme la maison de Romulus.","pause":800,"fx":null,"afterFx":0},{"text":"Ils la conservaient et la réparaient lorsqu’elle était endommagée.","pause":700,"fx":null,"afterFx":0},{"text":"Rome possédait donc déjà son propre monument historique consacré à ses origines.","pause":750,"fx":null,"afterFx":0},{"text":"Avec une particularité assez romaine…","pause":1000,"fx":null,"afterFx":0},{"text":"Le monument était une cabane au milieu d’une ville qui allait couvrir le monde de temples, d’arcs et de palais.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. Avant les empereurs — l’adresse chic de Rome","cues":[{"text":"Avancez de quelques siècles.","pause":650,"fx":null,"afterFx":0},{"text":"À la fin de la République, le Palatin n’est plus un village.","pause":700,"fx":null,"afterFx":0},{"text":"Il devient l’une des adresses résidentielles les plus prestigieuses de Rome.","pause":750,"fx":null,"afterFx":0},{"text":"De grandes familles y font construire leurs maisons.","pause":650,"fx":null,"afterFx":0},{"text":"Les raisons sont faciles à comprendre.","pause":600,"fx":null,"afterFx":0},{"text":"La colline est proche du Forum, donc du cœur politique de la ville.","pause":700,"fx":null,"afterFx":0},{"text":"Elle domine également le Circus Maximus.","pause":700,"fx":null,"afterFx":0},{"text":"Et être installé sur une hauteur ancienne, associée aux origines de Rome, n’est pas exactement mauvais pour le prestige.","pause":800,"fx":null,"afterFx":0},{"text":"Les maisons pouvaient comporter des cours, des jardins, des mosaïques et des pièces couvertes de peintures murales.","pause":750,"fx":null,"afterFx":0},{"text":"Autrement dit, le Palatin est devenu un quartier très haut de gamme bien avant de devenir le domaine des empereurs.","pause":750,"fx":null,"afterFx":0},{"text":"De la cabane au mètre carré le plus recherché de Rome…","pause":1000,"fx":null,"afterFx":0},{"text":"L’immobilier avait déjà une certaine logique.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. Auguste choisit son adresse — et le Palatin devient le pouvoir","cues":[{"text":"Puis arrive Octavien, le futur Auguste.","pause":700,"fx":null,"afterFx":0},{"text":"Lorsqu’il devient le maître du monde romain, il choisit lui aussi le Palatin pour résidence.","pause":750,"fx":null,"afterFx":0},{"text":"Ce choix est politique autant que pratique.","pause":650,"fx":null,"afterFx":0},{"text":"En vivant près du lieu associé à Romulus, Auguste se place symboliquement dans la continuité du fondateur de Rome.","pause":800,"fx":null,"afterFx":0},{"text":"Sa résidence est également proche du temple d’Apollon qu’il fait édifier sur la colline.","pause":750,"fx":null,"afterFx":0},{"text":"Pouvoir politique, religion et mémoire des origines se retrouvent donc réunis au même endroit.","pause":800,"fx":null,"afterFx":0},{"text":"À partir de là, les empereurs suivants agrandissent progressivement leurs résidences sur le Palatin.","pause":750,"fx":null,"afterFx":0},{"text":"Et le nom même de la colline finit par voyager dans les langues européennes.","pause":700,"fx":null,"afterFx":0},{"text":"Le latin Palatium donnera notamment palais en français, palace en anglais et palazzo en italien.","pause":850,"fx":"fanfare","afterFx":450},{"text":"Autrement dit, chaque fois que nous parlons d’un palais…","pause":1000,"fx":null,"afterFx":0},{"text":"Nous faisons encore, sans forcément le savoir, référence au Palatin de Rome.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. Ici, un palais n’est pas un bâtiment","cues":[{"text":"C’est maintenant que les ruines peuvent devenir difficiles à lire.","pause":750,"fx":null,"afterFx":0},{"text":"Parce que lorsque nous disons le palais impérial, nous imaginons facilement un seul bâtiment.","pause":750,"fx":null,"afterFx":0},{"text":"Ce n’est pas ce que vous avez devant vous.","pause":700,"fx":null,"afterFx":0},{"text":"Le Palatin est un ensemble de résidences construites, agrandies, transformées et reliées pendant plusieurs générations.","pause":800,"fx":null,"afterFx":0},{"text":"On y trouve notamment la Domus Tiberiana, développée après Auguste, puis de vastes constructions des périodes suivantes.","pause":800,"fx":null,"afterFx":0},{"text":"Sous les Flaviens, à la fin du premier siècle, l’architecte Rabirius conçoit pour Domitien un ensemble monumental qui organise une grande partie du sommet de la colline.","pause":850,"fx":null,"afterFx":0},{"text":"Il faut imaginer ici des appartements privés, des salles d’audience, des salles de banquet, des cours, des fontaines, des jardins et des espaces de service.","pause":850,"fx":null,"afterFx":0},{"text":"Sans oublier les gardes, les esclaves, les administrateurs, les visiteurs et toute la logistique nécessaire à une cour impériale.","pause":800,"fx":"steps_crowd","afterFx":450},{"text":"Le Palatin n’était donc pas simplement la maison de l’empereur.","pause":700,"fx":null,"afterFx":0},{"text":"C’était presque une ville du pouvoir à l’intérieur de la ville.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. La Domus Flavia — l’architecture comme mise en scène du pouvoir","cues":[{"text":"Lorsque vous approchez des grands espaces de réception, changez d’échelle mentalement.","pause":750,"fx":null,"afterFx":0},{"text":"Ici, l’empereur ne reçoit plus comme un particulier.","pause":650,"fx":null,"afterFx":0},{"text":"Il reçoit comme le sommet de l’État romain.","pause":750,"fx":null,"afterFx":0},{"text":"La partie publique du palais de Domitien est généralement appelée Domus Flavia.","pause":750,"fx":null,"afterFx":0},{"text":"Parmi ses espaces les plus impressionnants figurait l’Aula Regia, une immense salle destinée aux audiences officielles.","pause":800,"fx":null,"afterFx":0},{"text":"À proximité se trouvaient d’autres espaces cérémoniels et une grande salle de banquet traditionnellement appelée Coenatio Jovis.","pause":850,"fx":null,"afterFx":0},{"text":"Les surfaces que vous voyez aujourd’hui en brique ou en maçonnerie étaient largement revêtues de marbres, de décors et de couleurs.","pause":800,"fx":null,"afterFx":0},{"text":"Des cours et des fontaines organisaient aussi les perspectives.","pause":700,"fx":null,"afterFx":0},{"text":"Imaginez maintenant un ambassadeur entrant dans cet ensemble.","pause":750,"fx":null,"afterFx":0},{"text":"Avant même d’avoir vu l’empereur, il avait déjà traversé une architecture conçue pour lui rappeler où se trouvait le pouvoir.","pause":850,"fx":null,"afterFx":0},{"text":"La décoration n’était donc pas seulement luxueuse.","pause":650,"fx":null,"afterFx":0},{"text":"Elle faisait partie du message politique.","pause":300,"fx":"fanfare","afterFx":500}]},{"title":"7. Le stade palatin — un stade qui n’en était peut-être pas un","cues":[{"text":"Vous arrivez maintenant devant un vaste espace allongé.","pause":700,"fx":null,"afterFx":0},{"text":"Il ressemble tellement à une piste que son nom traditionnel s’est imposé : le stade palatin.","pause":750,"fx":null,"afterFx":0},{"text":"Mais attention au mot.","pause":650,"fx":null,"afterFx":0},{"text":"Sa fonction exacte reste discutée.","pause":700,"fx":null,"afterFx":0},{"text":"Il ne faut probablement pas l’imaginer comme un véritable stade public comparable au Circus Maximus.","pause":800,"fx":null,"afterFx":0},{"text":"L’interprétation la plus courante y voit plutôt un grand jardin privé ou un espace de promenade associé au palais.","pause":800,"fx":null,"afterFx":0},{"text":"Des activités ou exercices ont pu y avoir lieu, mais nous sommes dans l’espace de la cour impériale, pas dans un grand équipement de spectacle ouvert à la foule.","pause":850,"fx":null,"afterFx":0},{"text":"Regardez sa longueur et ses courbes.","pause":650,"fx":null,"afterFx":0},{"text":"Le dessin imite volontairement la forme des grands lieux de spectacle.","pause":700,"fx":null,"afterFx":0},{"text":"Si vous attendiez la course de chars privée de l’empereur…","pause":1000,"fx":null,"afterFx":0},{"text":"Le nom est probablement plus spectaculaire que la réalité.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. Regardez Rome depuis le Palatin — le pouvoir avait choisi sa vue","cues":[{"text":"Avant de quitter cette partie du Palatin, cherchez un point de vue sur le Forum ou sur le Circus Maximus.","pause":800,"fx":null,"afterFx":0},{"text":"Puis arrêtez-vous.","pause":650,"fx":null,"afterFx":0},{"text":"La géographie explique une partie de l’histoire.","pause":700,"fx":null,"afterFx":0},{"text":"D’un côté, le Forum : cœur politique, religieux et civique de Rome.","pause":750,"fx":null,"afterFx":0},{"text":"De l’autre, le Circus Maximus : l’un des grands lieux de rassemblement et de spectacle de la ville.","pause":800,"fx":null,"afterFx":0},{"text":"Et entre les deux, en hauteur, les résidences impériales.","pause":300,"fx":"wind","afterFx":550},{"text":"La position n’est évidemment pas anodine.","pause":650,"fx":null,"afterFx":0},{"text":"L’empereur vit au-dessus du centre politique et à proximité immédiate des lieux où se rassemble la population.","pause":800,"fx":null,"afterFx":0},{"text":"Au début de notre visite, nous avions quelques cabanes sur une colline.","pause":750,"fx":null,"afterFx":0},{"text":"Quelques siècles plus tard, le même endroit domine symboliquement une grande partie de Rome.","pause":800,"fx":null,"afterFx":0},{"text":"Entre les deux, il s’est produit quelque chose d’assez considérable…","pause":1000,"fx":null,"afterFx":0},{"text":"Rome est devenue un empire.","pause":900,"fx":null,"afterFx":0},{"text":"Vous pouvez maintenant poursuivre vers la Maison d’Auguste.","pause":700,"fx":null,"afterFx":0},{"text":"Là, nous quitterons les grands volumes impériaux pour entrer dans un décor beaucoup plus intime.","pause":900,"fx":null,"afterFx":0}]}];
const MAISON_AUGUSTE=[{"title":"1. Ici commence la maison du premier empereur","cues":[{"text":"Vous êtes maintenant devant ce que l’on appelle la Maison d’Auguste.","pause":750,"fx":null,"afterFx":0},{"text":"Mais essayez d’oublier un instant le mot empereur.","pause":700,"fx":null,"afterFx":0},{"text":"Quand Octavien choisit de s’installer ici, Rome est encore officiellement une République.","pause":750,"fx":null,"afterFx":0},{"text":"Il est né sur le Palatin en soixante-trois avant notre ère.","pause":700,"fx":null,"afterFx":0},{"text":"Plus tard, il achète notamment la maison de l’orateur Hortensius et plusieurs propriétés voisines.","pause":750,"fx":null,"afterFx":0},{"text":"Le choix du lieu n’a rien d’anodin.","pause":700,"fx":null,"afterFx":0},{"text":"À proximité se trouvent les vestiges que les Romains associaient aux origines de leur ville et à Romulus.","pause":800,"fx":null,"afterFx":0},{"text":"Le futur Auguste installe donc sa résidence à quelques pas du lieu où Rome racontait sa propre naissance.","pause":800,"fx":null,"afterFx":0},{"text":"C’est une adresse résidentielle…","pause":950,"fx":null,"afterFx":0},{"text":"Mais aussi une adresse extraordinairement symbolique.","pause":900,"fx":"steps_crowd","afterFx":450}]},{"title":"2. Une maison étonnamment peu monumentale","cues":[{"text":"Regardez maintenant l’échelle des pièces et des murs.","pause":700,"fx":null,"afterFx":0},{"text":"Si vous venez d’imaginer la demeure du maître du monde romain comme un Versailles antique, vous allez être déçu.","pause":800,"fx":null,"afterFx":0},{"text":"La résidence augustéenne n’a rien de comparable aux immenses palais impériaux construits plus tard sur le Palatin.","pause":750,"fx":null,"afterFx":0},{"text":"Les sources antiques insistent même sur la simplicité de la vie domestique d’Auguste.","pause":750,"fx":null,"afterFx":0},{"text":"Suétone raconte que son mobilier était très simple et que sa maison ne se distinguait ni par sa taille ni par un luxe spectaculaire.","pause":800,"fx":null,"afterFx":0},{"text":"Il faut néanmoins garder en tête qu’il s’agit d’un portrait transmis par un auteur antique.","pause":750,"fx":null,"afterFx":0},{"text":"L’archéologie, elle, montre surtout une demeure raffinée, décorée avec énormément de soin.","pause":800,"fx":null,"afterFx":0},{"text":"Donc non, Auguste ne vivait pas dans une cabane.","pause":650,"fx":null,"afterFx":0},{"text":"Mais il ne vivait pas encore non plus dans le gigantesque palais de ses successeurs.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. Une maison privée… et déjà un lieu de pouvoir","cues":[{"text":"La maison était organisée en plusieurs ensembles.","pause":650,"fx":null,"afterFx":0},{"text":"Une partie correspondait davantage à la vie privée.","pause":600,"fx":null,"afterFx":0},{"text":"Une autre servait à la représentation et à la réception.","pause":700,"fx":null,"afterFx":0},{"text":"C’est une distinction importante.","pause":650,"fx":null,"afterFx":0},{"text":"Chez Auguste, la frontière entre maison et pouvoir devient progressivement très mince.","pause":750,"fx":null,"afterFx":0},{"text":"Les sols étaient recouverts de mosaïques.","pause":650,"fx":null,"afterFx":0},{"text":"Les murs, eux, étaient peints de couleurs vives et de compositions extrêmement élaborées.","pause":750,"fx":null,"afterFx":0},{"text":"Ce que nous appelons aujourd’hui le deuxième style romain cherchait souvent à faire disparaître le mur.","pause":800,"fx":null,"afterFx":0},{"text":"Colonnes peintes, ouvertures imaginaires, architectures impossibles et perspectives donnent l’impression que la pièce se prolonge au-delà de ses vraies limites.","pause":850,"fx":null,"afterFx":0},{"text":"Autrement dit, même quand la pièce est petite…","pause":950,"fx":null,"afterFx":0},{"text":"La peinture lui offre quelques mètres carrés supplémentaires.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. La Salle des Masques — un théâtre peint sur les murs","cues":[{"text":"Si la Salle des Masques est visible lors de votre passage, prenez le temps de regarder les parois plutôt que le sol.","pause":800,"fx":null,"afterFx":0},{"text":"Le décor évoque une façade de scène de théâtre.","pause":700,"fx":null,"afterFx":0},{"text":"Les peintres ont créé une architecture qui n’existe pas réellement.","pause":700,"fx":null,"afterFx":0},{"text":"Des colonnes, des ouvertures et des panneaux organisent le mur comme un décor de spectacle.","pause":800,"fx":null,"afterFx":0},{"text":"Les fameux masques qui donnent aujourd’hui son nom à la pièce apparaissent intégrés à cette mise en scène.","pause":750,"fx":null,"afterFx":0},{"text":"Ce qui est intéressant, c’est que vous regardez un mur parfaitement plat…","pause":950,"fx":null,"afterFx":0},{"text":"Mais votre œil est invité à croire qu’il regarde une architecture en profondeur.","pause":800,"fx":null,"afterFx":0},{"text":"Les Romains n’avaient pas inventé la réalité virtuelle.","pause":700,"fx":null,"afterFx":0},{"text":"Mais ils avaient déjà compris le principe : convaincre le cerveau de voir un espace qui n’existe pas.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. La Salle des Festons de pin — moins spectaculaire, pas moins raffinée","cues":[{"text":"La pièce suivante peut sembler plus simple au premier regard.","pause":700,"fx":null,"afterFx":0},{"text":"C’est justement ce qui la rend intéressante.","pause":700,"fx":null,"afterFx":0},{"text":"La Salle des Festons de pin doit son nom aux motifs végétaux de son décor peint.","pause":750,"fx":null,"afterFx":0},{"text":"Ici, l’effet repose moins sur une grande illusion architecturale que sur l’équilibre du décor.","pause":800,"fx":null,"afterFx":0},{"text":"Regardez aussi le contraste entre les murs colorés et les mosaïques du sol.","pause":750,"fx":null,"afterFx":0},{"text":"Le noir et le blanc du pavement sont relativement sobres.","pause":650,"fx":null,"afterFx":0},{"text":"Les parois, elles, apportent la couleur et la profondeur.","pause":700,"fx":null,"afterFx":0},{"text":"C’est un bon rappel d’une chose que les ruines romaines nous font facilement oublier.","pause":750,"fx":null,"afterFx":0},{"text":"La Rome antique n’était pas beige.","pause":700,"fx":null,"afterFx":0},{"text":"Elle était très, très colorée.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. L’oecus — recevoir sans quitter sa maison","cues":[{"text":"Vous arrivez maintenant dans la partie liée davantage à la représentation.","pause":750,"fx":null,"afterFx":0},{"text":"L’une des grandes salles est traditionnellement appelée l’oecus.","pause":700,"fx":null,"afterFx":0},{"text":"Dans une maison romaine, ce type de pièce pouvait servir à recevoir et à réunir des invités.","pause":750,"fx":null,"afterFx":0},{"text":"Ici, la fonction prend évidemment une autre dimension.","pause":700,"fx":null,"afterFx":0},{"text":"Le propriétaire n’est pas simplement un riche Romain.","pause":650,"fx":null,"afterFx":0},{"text":"C’est l’homme autour duquel le nouveau régime romain est en train de s’organiser.","pause":800,"fx":null,"afterFx":0},{"text":"La partie publique de la maison s’ouvrait autrefois vers un péristyle à portiques.","pause":750,"fx":null,"afterFx":0},{"text":"Imaginez donc moins une succession de petites pièces fermées qu’un ensemble organisé autour d’espaces ouverts et de circulations.","pause":850,"fx":null,"afterFx":0},{"text":"Les visiteurs passaient progressivement de la maison privée à un espace où l’architecture participait déjà à la représentation du pouvoir.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. Le studiolo — la petite pièce la plus précieuse","cues":[{"text":"Cherchez maintenant le petit espace que les archéologues appellent le studiolo.","pause":750,"fx":null,"afterFx":0},{"text":"Le nom fait immédiatement penser à un bureau.","pause":650,"fx":null,"afterFx":0},{"text":"Mais attention : il ne faut pas imaginer automatiquement Auguste assis ici avec une pile de dossiers et un stylet.","pause":800,"fx":null,"afterFx":0},{"text":"La fonction exacte de cette petite pièce n’est pas aussi simple à établir.","pause":750,"fx":null,"afterFx":0},{"text":"Ce qui est certain, en revanche, c’est la qualité extraordinaire de son décor.","pause":750,"fx":null,"afterFx":0},{"text":"Les peintures appartiennent aux exemples les plus raffinés du deuxième style romain tardif conservés dans la maison.","pause":800,"fx":null,"afterFx":0},{"text":"Regardez les détails plutôt que l’ensemble.","pause":650,"fx":null,"afterFx":0},{"text":"Les architectures miniatures, les motifs délicats et les couleurs créent un espace presque précieux, beaucoup plus intime que les grandes salles de réception.","pause":850,"fx":null,"afterFx":0},{"text":"C’est peut-être l’un des meilleurs endroits de la visite pour oublier que vous regardez un mur vieux de plus de deux mille ans.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. À quelques pas, Apollon entre dans la maison","cues":[{"text":"La particularité la plus importante de cette résidence se trouve peut-être juste à côté d’elle.","pause":750,"fx":null,"afterFx":0},{"text":"La maison était directement liée au sanctuaire d’Apollon Palatin.","pause":750,"fx":null,"afterFx":0},{"text":"Le temple fut inauguré en vingt-huit avant notre ère.","pause":700,"fx":null,"afterFx":0},{"text":"Et les auteurs antiques racontent une histoire assez spectaculaire sur son emplacement.","pause":750,"fx":null,"afterFx":0},{"text":"Selon Suétone, une partie de la propriété d’Auguste aurait été frappée par la foudre.","pause":750,"fx":"wind","afterFx":450},{"text":"Les devins auraient alors déclaré qu’Apollon réclamait cet endroit.","pause":750,"fx":null,"afterFx":0},{"text":"Auguste y fit construire son temple.","pause":700,"fx":null,"afterFx":0},{"text":"C’est un récit antique, donc pas un procès-verbal météorologique que nous pouvons vérifier aujourd’hui.","pause":800,"fx":null,"afterFx":0},{"text":"Mais il montre parfaitement la manière dont les Romains pouvaient donner un sens religieux à un événement naturel.","pause":800,"fx":null,"afterFx":0},{"text":"Le lien entre la résidence et le sanctuaire était très étroit.","pause":700,"fx":null,"afterFx":0},{"text":"Une rampe permettait de rejoindre la zone du temple depuis le complexe résidentiel.","pause":750,"fx":"stone_steps","afterFx":450},{"text":"Autour du temple se trouvaient aussi des bibliothèques grecque et latine.","pause":750,"fx":null,"afterFx":0},{"text":"Suétone rapporte qu’Auguste y réunit même parfois le Sénat lorsqu’il fut plus âgé.","pause":800,"fx":null,"afterFx":0},{"text":"Maison, sanctuaire, bibliothèque et pouvoir politique se retrouvaient donc à quelques pas les uns des autres.","pause":900,"fx":null,"afterFx":0}]},{"title":"9. Avant de partir — regardez ce qui va changer après Auguste","cues":[{"text":"Avant de quitter la Maison d’Auguste, comparez mentalement ce lieu avec le reste du Palatin.","pause":800,"fx":null,"afterFx":0},{"text":"Ici, la demeure reste encore à l’échelle d’une grande maison aristocratique, même si son rôle est exceptionnel.","pause":800,"fx":null,"afterFx":0},{"text":"Plus tard, les empereurs transformeront progressivement la colline en un immense complexe palatial.","pause":800,"fx":null,"afterFx":0},{"text":"Les résidences deviendront plus vastes.","pause":600,"fx":null,"afterFx":0},{"text":"Les salles de réception plus monumentales.","pause":600,"fx":null,"afterFx":0},{"text":"Et la distance entre la maison d’un homme et le siège d’un empire deviendra de plus en plus difficile à distinguer.","pause":850,"fx":null,"afterFx":0},{"text":"C’est peut-être ce que cette maison raconte le mieux.","pause":700,"fx":null,"afterFx":0},{"text":"On n’est pas encore dans le palais impérial tel que les générations suivantes vont l’imaginer.","pause":800,"fx":null,"afterFx":0},{"text":"Mais tout est déjà en train de se mettre en place.","pause":800,"fx":null,"afterFx":0},{"text":"La résidence.","pause":500,"fx":null,"afterFx":0},{"text":"La religion.","pause":500,"fx":null,"afterFx":0},{"text":"La mémoire de Romulus.","pause":550,"fx":null,"afterFx":0},{"text":"Et le pouvoir.","pause":750,"fx":null,"afterFx":0},{"text":"Vous pouvez maintenant poursuivre votre parcours sur le Palatin avant de descendre vers le Forum et l’arc de Titus.","pause":900,"fx":"wind","afterFx":550}]}];
const ARC_TITUS=[{"title":"1. Un arc pour raconter une victoire","cues":[{"text":"Arrêtez-vous maintenant sous l’Arc de Titus, au sommet de la Via Sacra.","pause":750,"fx":null,"afterFx":0},{"text":"Ce n’est pas une porte de ville.","pause":650,"fx":null,"afterFx":0},{"text":"C’est un monument de mémoire et de pouvoir.","pause":700,"fx":null,"afterFx":0},{"text":"Il fut probablement construit sous Domitien, après la mort de son frère Titus.","pause":750,"fx":null,"afterFx":0},{"text":"L’inscription du côté du Colisée parle d’ailleurs de divus Titus : Titus divinisé.","pause":800,"fx":null,"afterFx":0},{"text":"Le monument commémore surtout la victoire remportée en Judée et la prise de Jérusalem en l’an soixante-dix.","pause":800,"fx":null,"afterFx":0},{"text":"Le triomphe célébré à Rome l’année suivante transforma cette victoire militaire en immense spectacle public.","pause":850,"fx":"fanfare","afterFx":500},{"text":"Un général victorieux défilait dans la ville avec ses soldats, ses prisonniers et son butin.","pause":800,"fx":null,"afterFx":0},{"text":"Et ici, la pierre conserve encore une partie de ce défilé.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. La menorah — le détail que tout le monde cherche","cues":[{"text":"Regardez maintenant le grand relief à l’intérieur du passage.","pause":750,"fx":null,"afterFx":0},{"text":"Cherchez un objet à sept branches.","pause":650,"fx":null,"afterFx":0},{"text":"C’est la menorah, le grand chandelier du Temple de Jérusalem.","pause":750,"fx":null,"afterFx":0},{"text":"Autour d’elle, des hommes portent d’autres objets sacrés pris lors du sac du Temple.","pause":800,"fx":null,"afterFx":0},{"text":"La scène représente donc une partie du butin présenté pendant le triomphe flavien.","pause":750,"fx":null,"afterFx":0},{"text":"Pour Rome, c’est une image de victoire.","pause":650,"fx":null,"afterFx":0},{"text":"Pour l’histoire juive, c’est aussi l’image d’une catastrophe majeure : la destruction du Second Temple.","pause":850,"fx":null,"afterFx":0},{"text":"Ce relief est devenu l’une des représentations les plus célèbres de la menorah antique.","pause":750,"fx":null,"afterFx":0},{"text":"Au Moyen Âge, l’arc était même surnommé l’Arc des Sept Lampes, précisément à cause de cette image.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. Titus entre dans Rome… accompagné par les dieux","cues":[{"text":"Passez maintenant à l’autre grand panneau intérieur.","pause":700,"fx":null,"afterFx":0},{"text":"Cette fois, Titus apparaît sur son char de triomphe.","pause":700,"fx":null,"afterFx":0},{"text":"Mais il n’est pas simplement entouré de soldats.","pause":650,"fx":null,"afterFx":0},{"text":"Des figures symboliques et divines participent elles aussi à la scène.","pause":750,"fx":null,"afterFx":0},{"text":"Une Victoire ailée se tient derrière l’empereur et le couronne.","pause":750,"fx":null,"afterFx":0},{"text":"Le message est très clair.","pause":650,"fx":null,"afterFx":0},{"text":"Cette victoire n’est pas seulement militaire.","pause":650,"fx":null,"afterFx":0},{"text":"Elle est présentée comme légitime, glorieuse et presque soutenue par l’ordre divin.","pause":800,"fx":null,"afterFx":0},{"text":"La propagande romaine ne se contentait donc pas d’annoncer qu’un empereur avait gagné.","pause":750,"fx":null,"afterFx":0},{"text":"Elle expliquait aussi pourquoi tout le monde devait trouver cette victoire admirable.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. Regardez au plafond — Titus devient un dieu","cues":[{"text":"Maintenant, levez les yeux vers le centre de la voûte.","pause":750,"fx":null,"afterFx":0},{"text":"Dans les caissons se trouve une image beaucoup plus discrète.","pause":700,"fx":null,"afterFx":0},{"text":"Titus est représenté montant vers le ciel sur le dos d’un aigle.","pause":800,"fx":"wind","afterFx":450},{"text":"C’est son apothéose.","pause":650,"fx":null,"afterFx":0},{"text":"Après sa mort, Titus fut officiellement divinisé.","pause":700,"fx":null,"afterFx":0},{"text"
