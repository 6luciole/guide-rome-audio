ainage.","pause":850,"fx":null,"afterFx":0},{"text":"Donc si vous revenez un jour ici sous un orage, ne cherchez pas le miracle aérodynamique.","pause":850,"fx":null,"afterFx":0},{"text":"Regardez vos chaussures.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. La lumière se déplace — le Panthéon comme instrument solaire","cues":[{"text":"L’oculus ne sert pas seulement à éclairer la pièce.","pause":750,"fx":null,"afterFx":0},{"text":"Au cours de la journée et des saisons, le disque de lumière se déplace sur la coupole puis sur les murs.","pause":850,"fx":null,"afterFx":0},{"text":"Le bâtiment devient presque un immense cadran solaire.","pause":800,"fx":null,"afterFx":0},{"text":"Au solstice d’été, la lumière forme à l’intérieur un disque dont le diamètre correspond à celui de l’oculus.","pause":850,"fx":null,"afterFx":0},{"text":"Certains chercheurs voient dans ces jeux de lumière une intention symbolique liée au cosmos et au pouvoir impérial.","pause":850,"fx":null,"afterFx":0},{"text":"Là encore, toutes les interprétations ne peuvent pas être démontrées avec la même certitude.","pause":800,"fx":null,"afterFx":0},{"text":"Mais une chose ne fait aucun doute.","pause":700,"fx":null,"afterFx":0},{"text":"La lumière fait partie de l’architecture.","pause":750,"fx":null,"afterFx":0},{"text":"Elle n’éclaire pas simplement le Panthéon.","pause":700,"fx":null,"afterFx":0},{"text":"Elle le met en mouvement.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. Pourquoi le Panthéon est-il si bien conservé ?","cues":[{"text":"Le Panthéon est l’un des monuments antiques les mieux conservés de Rome.","pause":750,"fx":null,"afterFx":0},{"text":"La raison principale tient à un changement de fonction décisif.","pause":750,"fx":null,"afterFx":0},{"text":"En six-cent-neuf, l’empereur byzantin Phocas remet le bâtiment au pape Boniface Quatre.","pause":850,"fx":null,"afterFx":0},{"text":"Le temple est consacré comme église sous le nom de Santa Maria ad Martyres.","pause":800,"fx":null,"afterFx":0},{"text":"Cette utilisation continue l’a largement protégé des destructions et des récupérations de matériaux qui ont touché tant d’autres monuments antiques.","pause":900,"fx":null,"afterFx":0},{"text":"Protégé ne veut toutefois pas dire intact.","pause":700,"fx":null,"afterFx":0},{"text":"Au dix-septième siècle, sous Urbain Huit Barberini, une grande partie du bronze antique du portique est retirée.","pause":850,"fx":null,"afterFx":0},{"text":"C’est à cette intervention qu’est associé le célèbre dicton populaire : ce que les barbares n’ont pas fait, les Barberini l’ont fait.","pause":900,"fx":null,"afterFx":0},{"text":"À la même époque, deux clochers furent ajoutés à la façade.","pause":750,"fx":null,"afterFx":0},{"text":"Les Romains les surnommèrent les oreilles d’âne.","pause":750,"fx":null,"afterFx":0},{"text":"Ils furent finalement supprimés au dix-neuvième siècle.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. Raphaël et les rois d’Italie","cues":[{"text":"Faites maintenant le tour de la rotonde en regardant les chapelles et les tombeaux.","pause":800,"fx":null,"afterFx":0},{"text":"Le plus célèbre est celui de Raphaël.","pause":700,"fx":null,"afterFx":0},{"text":"Le peintre et architecte de la Renaissance avait lui-même souhaité être enterré au Panthéon.","pause":800,"fx":null,"afterFx":0},{"text":"Il meurt en mille-cinq-cent-vingt, à seulement trente-sept ans.","pause":750,"fx":null,"afterFx":0},{"text":"Son tombeau est accompagné d’une épitaphe qui célèbre son talent en affirmant, en substance, que la Nature craignait d’être vaincue par lui.","pause":850,"fx":null,"afterFx":0},{"text":"Après l’unification italienne, le Panthéon reçoit une nouvelle fonction symbolique.","pause":800,"fx":null,"afterFx":0},{"text":"Victor-Emmanuel Deux, premier roi d’Italie, y est enterré.","pause":750,"fx":null,"afterFx":0},{"text":"Puis Humbert Premier et la reine Marguerite de Savoie.","pause":750,"fx":null,"afterFx":0},{"text":"Le temple antique devenu église devient donc aussi un lieu de mémoire nationale.","pause":900,"fx":null,"afterFx":0}]},{"title":"9. Avant de sortir — deux mille ans dans une seule pièce","cues":[{"text":"Revenez maintenant au centre de la rotonde et levez une dernière fois les yeux.","pause":800,"fx":null,"afterFx":0},{"text":"Le bâtiment que vous voyez mélange plusieurs histoires sans en effacer aucune.","pause":800,"fx":null,"afterFx":0},{"text":"Agrippa sur l’inscription.","pause":550,"fx":null,"afterFx":0},{"text":"Hadrien dans l’architecture.","pause":550,"fx":null,"afterFx":0},{"text":"Les ingénieurs romains dans la coupole.","pause":550,"fx":null,"afterFx":0},{"text":"Le christianisme dans les chapelles.","pause":550,"fx":null,"afterFx":0},{"text":"Raphaël et la Renaissance dans les tombeaux.","pause":550,"fx":null,"afterFx":0},{"text":"Puis les rois d’Italie au dix-neuvième siècle.","pause":650,"fx":null,"afterFx":0},{"text":"Et une tradition contemporaine ajoute encore un dernier spectacle à l’oculus.","pause":750,"fx":null,"afterFx":0},{"text":"Chaque Pentecôte, les pompiers de Rome laissent tomber des milliers de pétales de roses rouges depuis l’ouverture de la coupole.","pause":900,"fx":null,"afterFx":0},{"text":"Deux mille ans après sa construction, le grand œil du Panthéon continue donc à servir de scène.","pause":850,"fx":null,"afterFx":0},{"text":"Vous pouvez maintenant poursuivre vers Piazza Navona si le temps le permet, puis vers Castel Sant’Angelo.","pause":900,"fx":null,"afterFx":0}]}];
const PIAZZA_NAVONA=[{"title":"1. La place baroque est en réalité un stade antique","cues":[{"text":"Avant de regarder les fontaines, observez d’abord la forme entière de la place.","pause":800,"fx":null,"afterFx":0},{"text":"Elle est longue, étroite et arrondie à une extrémité.","pause":750,"fx":null,"afterFx":0},{"text":"Ce n’est pas un hasard urbanistique.","pause":650,"fx":null,"afterFx":0},{"text":"Piazza Navona conserve presque exactement la forme du stade construit par l’empereur Domitien au premier siècle de notre ère.","pause":900,"fx":null,"afterFx":0},{"text":"Le monument était consacré aux compétitions athlétiques à la grecque.","pause":800,"fx":null,"afterFx":0},{"text":"Les gradins entouraient une piste beaucoup plus longue que large.","pause":750,"fx":null,"afterFx":0},{"text":"Aujourd’hui, les immeubles qui bordent la place suivent encore le contour des anciennes tribunes.","pause":850,"fx":null,"afterFx":0},{"text":"Autrement dit, vous ne vous tenez pas simplement sur une jolie place.","pause":750,"fx":null,"afterFx":0},{"text":"Vous êtes dans l’empreinte d’un stade vieux de près de deux mille ans.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. D’« in agone » à « Navona »","cues":[{"text":"Le nom de la place lui-même garde un souvenir des jeux antiques.","pause":750,"fx":null,"afterFx":0},{"text":"Les compétitions étaient appelées agones en latin et en grec.","pause":750,"fx":null,"afterFx":0},{"text":"Au Moyen Âge, le secteur est désigné comme in agone, c’est-à-dire dans le lieu des jeux.","pause":850,"fx":null,"afterFx":0},{"text":"Avec le temps, la prononciation évolue.","pause":700,"fx":null,"afterFx":0},{"text":"In agone devient nagone, puis Navona.","pause":800,"fx":null,"afterFx":0},{"text":"C’est l’explication la plus couramment retenue pour le nom actuel.","pause":800,"fx":null,"afterFx":0},{"text":"Donc même le mot « Navona » est une sorte de fossile linguistique du stade de Domitien.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. Les jeux de Domitien — pas des chars, mais des athlètes","cues":[{"text":"Le stade de Domitien n’était pas un cirque comme le Circus Maximus.","pause":800,"fx":null,"afterFx":0},{"text":"On n’y venait pas principalement pour voir des chars.","pause":750,"fx":null,"afterFx":0},{"text":"On y organisait surtout des compétitions athlétiques inspirées du monde grec.","pause":800,"fx":null,"afterFx":0},{"text":"Course à pied, lutte, pugilat et autres épreuves faisaient partie de ce type de programme.","pause":800,"fx":null,"afterFx":0},{"text":"Domitien aimait particulièrement les spectacles et les concours de style grec.","pause":750,"fx":null,"afterFx":0},{"text":"Le stade pouvait accueillir des dizaines de milliers de spectateurs.","pause":800,"fx":null,"afterFx":0},{"text":"Après l’Antiquité, les structures sont progressivement réutilisées comme fondations pour de nouvelles maisons.","pause":850,"fx":null,"afterFx":0},{"text":"C’est ainsi que le stade disparaît visuellement…","pause":950,"fx":null,"afterFx":0},{"text":"tout en continuant à dicter la forme du quartier.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. Innocent X transforme la place en vitrine familiale","cues":[{"text":"La Piazza Navona que vous voyez aujourd’hui est surtout le résultat du dix-septième siècle.","pause":800,"fx":null,"afterFx":0},{"text":"Le pape Innocent Dix appartient à la famille Pamphilj.","pause":750,"fx":null,"afterFx":0},{"text":"Il fait de cette place l’un des grands décors du pouvoir familial.","pause":800,"fx":null,"afterFx":0},{"text":"Regardez le vaste Palazzo Pamphilj sur le côté ouest.","pause":750,"fx":null,"afterFx":0},{"text":"La famille y installe sa résidence monumentale.","pause":700,"fx":null,"afterFx":0},{"text":"L’église Sant’Agnese in Agone vient compléter le décor.","pause":750,"fx":null,"afterFx":0},{"text":"Et au centre, la place reçoit l’une des fontaines les plus célèbres de Rome.","pause":800,"fx":null,"afterFx":0},{"text":"Ce n’est plus seulement une place héritée de l’Antiquité.","pause":750,"fx":null,"afterFx":0},{"text":"C’est désormais une véritable scène baroque.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. La Fontaine des Quatre-Fleuves — quatre continents autour d’un obélisque","cues":[{"text":"Approchez-vous maintenant de la Fontaine des Quatre-Fleuves.","pause":800,"fx":null,"afterFx":0},{"text":"Elle est réalisée par Gian Lorenzo Bernini, le Bernin, entre seize-cent-quarante-huit et seize-cent-cinquante-et-un.","pause":850,"fx":null,"afterFx":0},{"text":"Quatre grandes figures masculines représentent quatre fleuves.","pause":750,"fx":null,"afterFx":0},{"text":"Le Danube pour l’Europe.","pause":600,"fx":null,"afterFx":0},{"text":"Le Gange pour l’Asie.","pause":600,"fx":null,"afterFx":0},{"text":"Le Nil pour l’Afrique.","pause":600,"fx":null,"afterFx":0},{"text":"Et le Río de la Plata pour les Amériques.","pause":750,"fx":null,"afterFx":0},{"text":"Au-dessus d’eux s’élève un obélisque antique de l’époque de Domitien.","pause":800,"fx":null,"afterFx":0},{"text":"Il ne vient pas d’Égypte à l’origine : il a été fabriqué à Rome dans le style égyptien, avec des hiéroglyphes célébrant Domitien.","pause":900,"fx":null,"afterFx":0},{"text":"Bernini transforme donc un monument impérial antique en centre d’une composition baroque consacrée au monde entier.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. La querelle Bernini-Borromini — la légende est meilleure que la chronologie","cues":[{"text":"Regardez maintenant les statues de la fontaine face à l’église Sant’Agnese.","pause":800,"fx":null,"afterFx":0},{"text":"Vous entendrez souvent une histoire très amusante.","pause":700,"fx":null,"afterFx":0},{"text":"Le Río de la Plata lèverait le bras pour se protéger au cas où la façade de Borromini s’écroulerait.","pause":850,"fx":null,"afterFx":0},{"text":"Et le Nil cacherait son visage pour ne pas voir cette architecture qu’il trouverait affreuse.","pause":850,"fx":null,"afterFx":0},{"text":"C’est une excellente légende urbaine.","pause":700,"fx":null,"afterFx":0},{"text":"Mais elle ne fonctionne pas historiquement.","pause":750,"fx":null,"afterFx":0},{"text":"La fontaine est achevée en seize-cent-cinquante-et-un.","pause":750,"fx":null,"afterFx":0},{"text":"Borromini ne commence à travailler sur la façade de Sant’Agnese qu’ensuite.","pause":800,"fx":null,"afterFx":0},{"text":"Les statues ne pouvaient donc pas se moquer d’un bâtiment qui n’existait pas encore sous cette forme.","pause":850,"fx":null,"afterFx":0},{"text":"Rome adore tellement la rivalité entre Bernini et Borromini qu’elle a fini par leur inventer des disputes jusque dans la pierre.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. Sant’Agnese in Agone — la tradition d’Agnès sur le lieu de son martyre","cues":[{"text":"Regardez maintenant Sant’Agnese in Agone.","pause":700,"fx":null,"afterFx":0},{"text":"Le nom « in Agone » renvoie encore une fois au stade antique.","pause":750,"fx":null,"afterFx":0},{"text":"La tradition chrétienne situe ici un épisode du martyre de sainte Agnès au début du quatrième siècle.","pause":850,"fx":null,"afterFx":0},{"text":"Selon le récit, la jeune chrétienne aurait été exposée nue dans un lieu de prostitution installé dans les arcades du stade.","pause":900,"fx":null,"afterFx":0},{"text":"Sa chevelure aurait alors poussé miraculeusement pour couvrir son corps.","pause":850,"fx":null,"afterFx":0},{"text":"Ce récit relève de la tradition hagiographique, pas d’un fait documentable comme une inscription officielle.","pause":850,"fx":null,"afterFx":0},{"text":"L’église actuelle est commencée au milieu du dix-septième siècle.","pause":750,"fx":null,"afterFx":0},{"text":"Plusieurs architectes interviennent, dont Carlo Rainaldi puis Francesco Borromini.","pause":800,"fx":null,"afterFx":0},{"text":"La façade concave de Borromini encadre aujourd’hui la coupole et dialogue directement avec la fontaine centrale.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. Quand Piazza Navona devenait un lac","cues":[{"text":"Piazza Navona possède aussi une tradition beaucoup plus légère.","pause":700,"fx":null,"afterFx":0},{"text":"À partir du dix-septième siècle, certains week-ends d’été, on bouchait les évacuations des fontaines.","pause":850,"fx":null,"afterFx":0},{"text":"L’eau se répandait alors sur la partie basse de la place.","pause":750,"fx":null,"afterFx":0},{"text":"Les Romains parlaient du « lac de Piazza Navona ».","pause":750,"fx":null,"afterFx":0},{"text":"Les carrosses pouvaient traverser l’eau et la population venait profiter de cette attraction estivale.","pause":850,"fx":null,"afterFx":0},{"text":"Il ne faut évidemment pas imaginer toute la place transformée en piscine profonde.","pause":800,"fx":null,"afterFx":0},{"text":"Il s’agissait plutôt d’une grande étendue d’eau peu profonde dans la partie concave de la place.","pause":850,"fx":null,"afterFx":0},{"text":"La coutume disparaît au dix-neuvième siècle.","pause":750,"fx":null,"afterFx":0},{"text":"Mais c’est probablement l’une des meilleures preuves qu’à Rome, même une place baroque pouvait devenir un divertissement public.","pause":900,"fx":null,"afterFx":0}]},{"title":"9. Trois fontaines, un stade disparu et une place toujours vivante","cues":[{"text":"Avant de repartir, regardez la place dans toute sa longueur.","pause":800,"fx":null,"afterFx":0},{"text":"Au nord se trouve la Fontaine de Neptune.","pause":650,"fx":null,"afterFx":0},{"text":"Au centre, la Fontaine des Quatre-Fleuves.","pause":650,"fx":null,"afterFx":0},{"text":"Au sud, la Fontaine du Maure.","pause":650,"fx":null,"afterFx":0},{"text":"Leurs décors actuels appartiennent à plusieurs périodes différentes.","pause":750,"fx":null,"afterFx":0},{"text":"Sous vos pieds, les structures du stade de Domitien sont toujours là.","pause":750,"fx":null,"afterFx":0},{"text":"Autour de vous, la Rome baroque a utilisé son plan au lieu de l’effacer.","pause":800,"fx":null,"afterFx":0},{"text":"C’est ce qui rend Piazza Navona si particulière.","pause":700,"fx":null,"afterFx":0},{"text":"Un monument antique a disparu presque entièrement…","pause":950,"fx":null,"afterFx":0},{"text":"mais sa forme continue à organiser la vie de la ville.","pause":850,"fx":null,"afterFx":0},{"text":"Si votre horaire le permet, profitez encore quelques minutes de la place.","pause":750,"fx":null,"afterFx":0},{"text":"Puis poursuivez vers Castel Sant’Angelo.","pause":900,"fx":null,"afterFx":0}]}];
const CASTEL_SANT_ANGELO=[{"title":"1. Commencez sur le pont — avant le château, il y avait un tombeau","cues":[{"text":"Avant d’entrer, placez-vous sur le Pont Saint-Ange et regardez le château de face.","pause":850,"fx":null,"afterFx":0},{"text":"Essayez maintenant d’oublier les créneaux, les canons, les appartements pontificaux et même l’ange au sommet.","pause":850,"fx":null,"afterFx":0},{"text":"Au départ, tout cela n’existe pas.","pause":700,"fx":null,"afterFx":0},{"text":"Au deuxième siècle, l’empereur Hadrien fait construire ici un immense mausolée pour lui-même et sa famille.","pause":850,"fx":null,"afterFx":0},{"text":"Le chantier commence vers cent-trente-cinq et est achevé sous Antonin le Pieux en cent-trente-neuf, après la mort d’Hadrien.","pause":900,"fx":null,"afterFx":0},{"text":"Le nouveau tombeau est relié au Champ de Mars par un pont construit pour l’occasion : le Pons Aelius, l’actuel Pont Saint-Ange.","pause":900,"fx":null,"afterFx":0},{"text":"Imaginez un immense cylindre de pierre et de marbre, beaucoup plus décoré qu’aujourd’hui, dominant le Tibre.","pause":850,"fx":null,"afterFx":0},{"text":"Le château que vous voyez est donc, au cœur, un tombeau impérial vieux de près de dix-neuf siècles.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. La rampe d’Hadrien — entrer dans un mausolée comme les Romains","cues":[{"text":"En entrant, le parcours vous fait pénétrer dans les structures antiques du mausolée.","pause":800,"fx":null,"afterFx":0},{"text":"Suivez la longue rampe hélicoïdale qui monte à l’intérieur du monument.","pause":800,"fx":null,"afterFx":0},{"text":"Cette rampe appartient à l’organisation funéraire romaine du bâtiment.","pause":750,"fx":null,"afterFx":0},{"text":"Elle permettait d’atteindre la chambre sépulcrale aménagée au cœur de la masse du mausolée.","pause":850,"fx":null,"afterFx":0},{"text":"Plusieurs empereurs et membres de la dynastie antonine puis sévérienne y furent déposés après Hadrien.","pause":850,"fx":null,"afterFx":0},{"text":"Ce qui est remarquable, c’est que la forteresse médiévale et pontificale n’a jamais complètement effacé cette structure romaine.","pause":900,"fx":null,"afterFx":0},{"text":"Vous montez donc dans un château…","pause":950,"fx":null,"afterFx":0},{"text":"en empruntant encore le chemin intérieur d’un tombeau antique.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. Comment un tombeau devient-il une forteresse ?","cues":[{"text":"À partir de l’Antiquité tardive, la fonction du bâtiment change complètement.","pause":800,"fx":null,"afterFx":0},{"text":"Sa masse énorme, sa position au bord du Tibre et le contrôle du pont en font un point défensif idéal.","pause":850,"fx":null,"afterFx":0},{"text":"Le mausolée est intégré aux défenses de Rome et se transforme progressivement en forteresse.","pause":850,"fx":null,"afterFx":0},{"text":"Le marbre et les décorations antiques sont peu à peu récupérés ou disparaissent.","pause":750,"fx":null,"afterFx":0},{"text":"Mais le noyau de béton et de maçonnerie est presque impossible à faire disparaître.","pause":800,"fx":null,"afterFx":0},{"text":"Au Moyen Âge, contrôler le château signifie contrôler l’un des accès les plus stratégiques vers le Vatican.","pause":850,"fx":null,"afterFx":0},{"text":"Le tombeau des empereurs devient ainsi l’une des clés militaires de la Rome des papes.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. Pourquoi « Saint-Ange » ? La peste et l’archange","cues":[{"text":"Le nom actuel du château vient d’une légende située en cinq-cent-quatre-vingt-dix.","pause":800,"fx":null,"afterFx":0},{"text":"Rome est alors frappée par une grave épidémie de peste.","pause":750,"fx":null,"afterFx":0},{"text":"Selon la tradition, le pape Grégoire le Grand organise une procession pénitentielle dans la ville.","pause":800,"fx":null,"afterFx":0},{"text":"En approchant du mausolée d’Hadrien, il aurait vu l’archange Michel apparaître au sommet du monument.","pause":850,"fx":null,"afterFx":0},{"text":"L’ange aurait remis son épée dans son fourreau.","pause":750,"fx":null,"afterFx":0},{"text":"Le geste est interprété comme le signe que l’épidémie prend fin.","pause":800,"fx":null,"afterFx":0},{"text":"C’est une tradition religieuse, pas un événement que l’on peut documenter comme un rapport médical de l’année cinq-cent-quatre-vingt-dix.","pause":900,"fx":null,"afterFx":0},{"text":"Mais elle est si forte qu’elle finit par donner son nom au château et au pont.","pause":850,"fx":null,"afterFx":0},{"text":"Et tout en haut, l’ange brandit encore aujourd’hui son épée.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. Le Passetto — la sortie de secours des papes","cues":[{"text":"En avançant dans les parties fortifiées, cherchez les vues en direction du Vatican.","pause":800,"fx":null,"afterFx":0},{"text":"Castel Sant’Angelo est relié aux palais pontificaux par un corridor fortifié : le Passetto di Borgo.","pause":850,"fx":null,"afterFx":0},{"text":"Le système défensif s’est développé sur plusieurs siècles.","pause":750,"fx":null,"afterFx":0},{"text":"La connexion du Passetto au bastion du château est notamment organisée sous Nicolas Trois à la fin du treizième siècle.","pause":850,"fx":null,"afterFx":0},{"text":"Plus tard, Alexandre Six fait aménager un passage couvert plus sûr.","pause":800,"fx":null,"afterFx":0},{"text":"Son utilité est très simple : permettre au pape de rejoindre la forteresse sans traverser les rues de Rome.","pause":850,"fx":null,"afterFx":0},{"text":"Une sorte de sortie de secours pontificale d’environ huit-cents mètres.","pause":800,"fx":null,"afterFx":0},{"text":"Le Passetto n’est pas systématiquement inclus dans la visite ordinaire.","pause":750,"fx":null,"afterFx":0},{"text":"Mais même fermé, sa présence explique pourquoi ce château est devenu si important pour la papauté.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. 1527 — quand le Passetto sauve réellement un pape","cues":[{"text":"Le six mai mille-cinq-cent-vingt-sept, Rome est prise d’assaut par les troupes impériales lors du terrible Sac de Rome.","pause":900,"fx":null,"afterFx":0},{"text":"Le pape Clément Sept se trouve au Vatican.","pause":750,"fx":null,"afterFx":0},{"text":"Il emprunte le Passetto et se réfugie ici, à Castel Sant’Angelo.","pause":800,"fx":null,"afterFx":0},{"text":"Le château résiste pendant que la ville est pillée.","pause":800,"fx":null,"afterFx":0},{"text":"C’est l’épisode qui a rendu le corridor célèbre comme véritable voie d’évasion.","pause":850,"fx":null,"afterFx":0},{"text":"L’artiste Benvenuto Cellini affirmera plus tard, dans son autobiographie, avoir participé à la défense du château et même tiré sur les assaillants depuis les remparts.","pause":900,"fx":null,"afterFx":0},{"text":"Cellini est un merveilleux raconteur de sa propre vie.","pause":700,"fx":null,"afterFx":0},{"text":"Il vaut donc mieux présenter ses exploits comme son témoignage personnel plutôt que comme une caméra de surveillance du siège.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. Une forteresse, mais aussi une prison","cues":[{"text":"Le château protège les papes, mais il enferme aussi leurs ennemis.","pause":750,"fx":null,"afterFx":0},{"text":"Pendant des siècles, certaines parties servent de prison.","pause":750,"fx":null,"afterFx":0},{"text":"Des personnages célèbres y sont détenus, notamment Benvenuto Cellini lui-même quelques années après avoir défendu le château.","pause":850,"fx":null,"afterFx":0},{"text":"Il est emprisonné en mille-cinq-cent-trente-huit sous Paul Trois.","pause":750,"fx":null,"afterFx":0},{"text":"Dans son autobiographie, il raconte une spectaculaire tentative d’évasion en descendant le long des murailles avec une corde improvisée.","pause":900,"fx":null,"afterFx":0},{"text":"Il chute, se blesse, mais réussit momentanément à s’échapper.","pause":800,"fx":null,"afterFx":0},{"text":"Là encore, nous dépendons largement de son propre récit, toujours très favorable à son auteur.","pause":850,"fx":null,"afterFx":0},{"text":"Castel Sant’Angelo réunit donc une combinaison assez particulière : refuge pour le pape, prison pour les autres.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. Les appartements pontificaux — le luxe derrière les canons","cues":[{"text":"Lorsque vous atteignez les appartements pontificaux, le décor change encore une fois.","pause":800,"fx":null,"afterFx":0},{"text":"Après les rampes austères, les murailles et les cellules, vous entrez dans des salles Renaissance richement décorées.","pause":850,"fx":null,"afterFx":0},{"text":"Les papes n’utilisent pas le château uniquement comme bunker d’urgence.","pause":750,"fx":null,"afterFx":0},{"text":"Ils y aménagent de véritables appartements de représentation.","pause":800,"fx":null,"afterFx":0},{"text":"Sous Paul Trois Farnèse, au seizième siècle, plusieurs salles sont transformées avec des fresques et des décors somptueux.","pause":850,"fx":null,"afterFx":0},{"text":"La Sala Paolina en est l’un des grands exemples.","pause":750,"fx":null,"afterFx":0},{"text":"Le contraste est presque absurde : quelques murs plus loin, une forteresse conçue pour résister à un siège.","pause":850,"fx":null,"afterFx":0},{"text":"Ici, un palais destiné à impressionner les visiteurs.","pause":800,"fx":null,"afterFx":0},{"text":"Castel Sant’Angelo réussit à être les deux en même temps.","pause":900,"fx":null,"afterFx":0}]},{"title":"9. Tosca — le château entre dans l’opéra","cues":[{"text":"En montant vers les terrasses, Castel Sant’Angelo change encore de registre et entre dans la fiction.","pause":800,"fx":null,"afterFx":0},{"text":"Le troisième acte de l’opéra Tosca de Giacomo Puccini se déroule ici.","pause":750,"fx":null,"afterFx":0},{"text":"Cavaradossi doit être exécuté sur la terrasse du château.","pause":750,"fx":null,"afterFx":0},{"text":"Tosca croit que l’exécution sera simulée.","pause":700,"fx":null,"afterFx":0},{"text":"Elle découvre qu’elle a été trompée.","pause":700,"fx":null,"afterFx":0},{"text":"Et à la fin de l’opéra, elle se jette du haut de Castel Sant’Angelo.","pause":850,"fx":null,"afterFx":0},{"text":"C’est évidemment une scène de théâtre, pas un épisode historique du monument.","pause":800,"fx":null,"afterFx":0},{"text":"Mais depuis mille-neuf-cents, cette image est devenue inséparable du château dans l’imaginaire culturel.","pause":900,"fx":null,"afterFx":0}]},{"title":"10. La terrasse de l’Ange — regardez maintenant tout le parcours","cues":[{"text":"Terminez la visite sur la terrasse supérieure, au pied de l’archange.","pause":850,"fx":null,"afterFx":0},{"text":"La statue actuelle est en bronze et date du dix-huitième siècle.","pause":750,"fx":null,"afterFx":0},{"text":"Autour de vous, le panorama permet de relire toute l’histoire du château.","pause":800,"fx":null,"afterFx":0},{"text":"En bas, le Tibre et le Pont Saint-Ange rappellent le mausolée d’Hadrien.","pause":800,"fx":null,"afterFx":0},{"text":"Vers le Vatican, vous comprenez immédiatement pourquoi le Passetto était si stratégique.","pause":800,"fx":null,"afterFx":0},{"text":"Les bastions rappellent la forteresse.","pause":650,"fx":null,"afterFx":0},{"text":"Les salles derrière vous, le palais pontifical.","pause":650,"fx":null,"afterFx":0},{"text":"Et l’ange au-dessus de votre tête, la légende qui a fini par donner son nom à tout le monument.","pause":850,"fx":null,"afterFx":0},{"text":"Peu de bâtiments à Rome ont changé de fonction aussi souvent sans jamais disparaître.","pause":850,"fx":null,"afterFx":0},{"text":"Tombeau.","pause":500,"fx":null,"afterFx":0},{"text":"Forteresse.","pause":500,"fx":null,"afterFx":0},{"text":"Refuge.","pause":500,"fx":null,"afterFx":0},{"text":"Prison.","pause":500,"fx":null,"afterFx":0},{"text":"Palais.","pause":500,"fx":null,"afterFx":0},{"text":"Puis musée.","pause":700,"fx":null,"afterFx":0},{"text":"En sortant, poursuivez à pied vers la place Saint-Pierre.","pause":900,"fx":null,"afterFx":0}]}];
const PLACE_SAINT_PIERRE=[{"title":"1. Arrivez par la Via della Conciliazione — puis laissez la place s’ouvrir","cues":[{"text":"En arrivant depuis Castel Sant’Angelo, avancez vers la basilique par la Via della Conciliazione.","pause":800,"fx":null,"afterFx":0},{"text":"Puis laissez la place Saint-Pierre s’ouvrir devant vous.","pause":800,"fx":null,"afterFx":0},{"text":"La première chose à comprendre est que cette immense composition est beaucoup plus récente que la basilique antique de saint Pierre.","pause":850,"fx":null,"afterFx":0},{"text":"La place actuelle est conçue par Gian Lorenzo Bernini, le Bernin, à la demande du pape Alexandre Sept.","pause":850,"fx":null,"afterFx":0},{"text":"Les travaux de la colonnade commencent au milieu du dix-septième siècle et l’ensemble principal est achevé en seize-cent-soixante-sept.","pause":900,"fx":null,"afterFx":0},{"text":"Le projet doit résoudre un problème délicat.","pause":700,"fx":null,"afterFx":0},{"text":"Créer une place capable d’accueillir des foules immenses sans écraser la façade de la basilique.","pause":850,"fx":null,"afterFx":0},{"text":"Bernini répond par deux grands bras de pierre.","pause":800,"fx":null,"afterFx":0}]},{"title":"2. Les bras de Bernini — 284 colonnes pour fabriquer une étreinte","cues":[{"text":"Regardez maintenant les deux grandes colonnades courbes.","pause":750,"fx":null,"afterFx":0},{"text":"Elles sont composées de deux-cent-quatre-vingt-quatre colonnes et quatre-vingt-huit piliers disposés sur quatre rangées.","pause":900,"fx":null,"afterFx":0},{"text":"Bernini voulait donner à cette architecture le sens d’une immense étreinte.","pause":800,"fx":null,"afterFx":0},{"text":"Les bras de l’Église s’ouvrant vers la ville et vers le monde.","pause":800,"fx":null,"afterFx":0},{"text":"L’ovale mesure près de deux-cents mètres dans sa plus grande dimension.","pause":750,"fx":null,"afterFx":0},{"text":"Pourtant, grâce à la courbe, l’espace paraît étonnamment contenu.","pause":800,"fx":null,"afterFx":0},{"text":"Le baroque n’essaie pas seulement de construire grand.","pause":700,"fx":null,"afterFx":0},{"text":"Il essaie de contrôler la manière dont votre œil et votre corps traversent l’espace.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. Le petit disque de marbre qui fait disparaître trois rangées de colonnes","cues":[{"text":"Cherchez maintenant, de chaque côté de l’obélisque, un petit disque de marbre marqué comme centre de la colonnade.","pause":850,"fx":null,"afterFx":0},{"text":"Placez-vous dessus si l’espace le permet.","pause":750,"fx":null,"afterFx":0},{"text":"Puis regardez l’une des colonnades.","pause":700,"fx":null,"afterFx":0},{"text":"Les quatre rangées de colonnes semblent soudain se superposer parfaitement.","pause":850,"fx":null,"afterFx":0},{"text":"Vous n’en voyez pratiquement plus qu’une seule.","pause":750,"fx":null,"afterFx":0},{"text":"Faites quelques pas de côté.","pause":650,"fx":null,"afterFx":0},{"text":"Les quatre rangées réapparaissent.","pause":700,"fx":null,"afterFx":0},{"text":"C’est une petite démonstration géométrique cachée au milieu d’une place gigantesque.","pause":800,"fx":null,"afterFx":0},{"text":"Et surtout, c’est exactement le genre de détail que l’on peut manquer en traversant la place trop vite.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. L’obélisque — l’objet le plus ancien de toute la place","cues":[{"text":"Revenez maintenant au centre et regardez l’obélisque.","pause":750,"fx":null,"afterFx":0},{"text":"Il est beaucoup plus ancien que la place, la basilique actuelle et même le christianisme.","pause":850,"fx":null,"afterFx":0},{"text":"Son origine égyptienne exacte reste discutée, mais il passe par Alexandrie avant d’être transporté à Rome par Caligula au premier siècle.","pause":900,"fx":null,"afterFx":0},{"text":"Caligula le fait dresser dans son cirque privé, le cirque du Vatican.","pause":800,"fx":null,"afterFx":0},{"text":"La tradition chrétienne associe ensuite ce secteur au martyre de saint Pierre sous Néron.","pause":850,"fx":null,"afterFx":0},{"text":"L’obélisque devient ainsi, pour les chrétiens de Rome, un témoin matériel d’un paysage lié aux premiers martyrs.","pause":850,"fx":null,"afterFx":0},{"text":"Il est aussi particulier parce qu’il ne porte pas de hiéroglyphes.","pause":750,"fx":null,"afterFx":0},{"text":"Et pendant plus de quinze siècles, il reste debout à son emplacement romain d’origine.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. 1586 — déplacer 330 tonnes avec des chevaux, des treuils et beaucoup de nerfs","cues":[{"text":"En mille-cinq-cent-quatre-vingt-six, Sixte Cinq décide de déplacer l’obélisque vers l’emplacement que vous voyez aujourd’hui.","pause":900,"fx":null,"afterFx":0},{"text":"L’opération est dirigée par Domenico Fontana.","pause":750,"fx":null,"afterFx":0},{"text":"Le monolithe mesure plus de vingt-cinq mètres et pèse environ trois-cent-trente tonnes.","pause":850,"fx":null,"afterFx":0},{"text":"Les chiffres officiels donnent neuf-cent-sept hommes, soixante-quinze chevaux et quarante-quatre treuils pour son érection.","pause":900,"fx":null,"afterFx":0},{"text":"Une tradition célèbre raconte que le silence absolu avait été imposé pendant la manœuvre.","pause":800,"fx":null,"afterFx":0},{"text":"Les cordes auraient commencé à se détendre sous l’effort.","pause":750,"fx":null,"afterFx":0},{"text":"Un marin ligure, Benedetto Bresca, aurait alors crié : « Acqua alle funi ! » — de l’eau sur les cordes.","pause":900,"fx":null,"afterFx":0},{"text":"Mouillées, les cordes se seraient resserrées et l’opération aurait été sauvée.","pause":800,"fx":null,"afterFx":0},{"text":"L’anecdote est devenue célèbre dans la tradition romaine.","pause":750,"fx":null,"afterFx":0},{"text":"Ce qui est certain, c’est que le déplacement de l’obélisque fut un exploit d’ingénierie spectaculaire et abondamment documenté par les gravures de l’époque.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. La boule de César qui ne contenait pas César","cues":[{"text":"Avant son déplacement, l’obélisque portait à son sommet une grande sphère de bronze.","pause":800,"fx":null,"afterFx":0},{"text":"Une tradition ancienne prétendait qu’elle contenait les cendres de Jules César.","pause":800,"fx":null,"afterFx":0},{"text":"Lors des travaux de Sixte Cinq, on ouvre donc la sphère.","pause":750,"fx":null,"afterFx":0},{"text":"Et on ne trouve pas César.","pause":750,"fx":null,"afterFx":0},{"text":"La boule était vide, ou ne contenait que de la poussière.","pause":800,"fx":null,"afterFx":0},{"text":"Elle est aujourd’hui conservée aux Musées du Capitole.","pause":750,"fx":null,"afterFx":0},{"text":"La tradition a donc perdu son reliquaire impérial…","pause":950,"fx":null,"afterFx":0},{"text":"mais gagné une excellente anecdote.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. Les deux fontaines — presque jumelles, mais pas vraiment","cues":[{"text":"Regardez maintenant les deux fontaines alignées avec l’obélisque.","pause":750,"fx":null,"afterFx":0},{"text":"Elles paraissent parfaitement jumelles.","pause":700,"fx":null,"afterFx":0},{"text":"En réalité, elles n’ont pas la même histoire.","pause":750,"fx":null,"afterFx":0},{"text":"La fontaine de droite, quand vous regardez la basilique, est réorganisée par Carlo Maderno au début du dix-septième siècle.","pause":850,"fx":null,"afterFx":0},{"text":"Quand Bernini conçoit la nouvelle place, il la déplace légèrement pour l’aligner avec l’obélisque.","pause":800,"fx":null,"afterFx":0},{"text":"Puis une seconde fontaine est construite de l’autre côté pour obtenir la symétrie parfaite de la composition.","pause":850,"fx":null,"afterFx":0},{"text":"Cette seconde fontaine reprend presque exactement le modèle de la première.","pause":750,"fx":null,"afterFx":0},{"text":"La symétrie baroque est donc en partie une illusion rétrospective.","pause":800,"fx":null,"afterFx":0},{"text":"Deux objets d’histoires différentes ont été disciplinés pour paraître nés ensemble.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. Les 140 saints — une foule de pierre au-dessus de la foule","cues":[{"text":"Levez maintenant les yeux au-dessus des colonnades.","pause":750,"fx":null,"afterFx":0},{"text":"Cent-quarante statues de saints occupent la balustrade.","pause":750,"fx":null,"afterFx":0},{"text":"Elles mesurent environ trois mètres de haut.","pause":700,"fx":null,"afterFx":0},{"text":"Elles ont été réalisées entre le dix-septième et le début du dix-huitième siècle par de nombreux sculpteurs travaillant dans l’orbite de Bernini.","pause":850,"fx":null,"afterFx":0},{"text":"Le programme n’est pas aléatoire.","pause":700,"fx":null,"afterFx":0},{"text":"Différentes catégories de saints occupent les différentes parties de la colonnade.","pause":750,"fx":null,"afterFx":0},{"text":"Depuis le sol, il est presque impossible de les identifier toutes.","pause":750,"fx":null,"afterFx":0},{"text":"Mais l’effet recherché est clair : au-dessus de la foule réelle sur la place, une seconde foule de pierre encadre l’espace.","pause":900,"fx":null,"afterFx":0}]},{"title":"9. Avant de partir — façade, fenêtres et repères à retenir","cues":[{"text":"Regardez enfin la façade de la basilique.","pause":700,"fx":null,"afterFx":0},{"text":"Elle est réalisée par Carlo Maderno au début du dix-septième siècle.","pause":750,"fx":null,"afterFx":0},{"text":"Au-dessus, le grand balcon central est la loggia des bénédictions, utilisée notamment pour l’annonce d’un nouveau pape.","pause":850,"fx":null,"afterFx":0},{"text":"À droite de la façade, regardez le Palais apostolique.","pause":750,"fx":null,"afterFx":0},{"text":"La fenêtre utilisée pour l’Angélus dominical se trouve dans l’appartement pontifical donnant sur la place.","pause":800,"fx":null,"afterFx":0},{"text":"Et si vous regardez de nouveau l’ensemble depuis l’axe central, vous voyez maintenant trois époques parfaitement imbriquées.","pause":850,"fx":null,"afterFx":0},{"text":"L’obélisque antique.","pause":550,"fx":null,"afterFx":0},{"text":"La basilique Renaissance et baroque.","pause":550,"fx":null,"afterFx":0},{"text":"Puis la place du Bernin qui les rassemble dans une seule composition.","pause":800,"fx":null,"afterFx":0},{"text":"Pour votre visite, retenez surtout deux petits défis visuels.","pause":750,"fx":null,"afterFx":0},{"text":"Trouver le centre de la colonnade et faire disparaître trois rangées de colonnes.","pause":800,"fx":null,"afterFx":0},{"text":"Puis regarder l’obélisque en pensant qu’il était déjà ici bien avant que le Vatican ressemble au Vatican.","pause":900,"fx":null,"afterFx":0}]}];
const TREVI=[{"title":"1. Avant la fontaine baroque — une eau qui arrive ici depuis l’Antiquité","cues":[{"text":"Avant de regarder les statues, écoutez simplement l’eau quelques secondes.","pause":900,"fx":null,"afterFx":0},{"text":"C’est probablement la meilleure manière de commencer.","pause":700,"fx":null,"afterFx":0},{"text":"La Fontaine de Trevi est le grand point terminal moderne de l’Aqua Virgo, l’aqueduc construit sous Agrippa en dix-neuf avant notre ère.","pause":900,"fx":null,"afterFx":0},{"text":"Sous sa forme restaurée d’Acqua Vergine, cet aqueduc continue encore aujourd’hui à alimenter plusieurs fontaines de Rome.","pause":850,"fx":null,"afterFx":0},{"text":"Cela signifie que derrière cette mise en scène baroque du dix-huitième siècle circule une histoire de l’eau vieille de plus de deux mille ans.","pause":900,"fx":null,"afterFx":0},{"text":"La fontaine moderne est spectaculaire.","pause":650,"fx":null,"afterFx":0},{"text":"Mais l’infrastructure qui lui donne vie est beaucoup plus ancienne.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. La jeune fille qui aurait montré la source aux soldats","cues":[{"text":"Regardez maintenant le grand relief situé à droite, dans la partie haute de la façade.","pause":800,"fx":null,"afterFx":0},{"text":"Il représente la tradition qui explique le nom Aqua Virgo.","pause":750,"fx":null,"afterFx":0},{"text":"Selon ce récit, des soldats romains cherchant de l’eau auraient rencontré une jeune fille.","pause":800,"fx":null,"afterFx":0},{"text":"Elle leur aurait indiqué une source particulièrement pure.","pause":750,"fx":null,"afterFx":0},{"text":"La source aurait ensuite été intégrée à l’aqueduc d’Agrippa.","pause":800,"fx":null,"afterFx":0},{"text":"C’est une belle tradition antique, mais pas une scène dont nous possédons un procès-verbal militaire.","pause":900,"fx":null,"afterFx":0},{"text":"De l’autre côté, un second relief montre Agrippa donnant l’ordre de construire l’aqueduc.","pause":800,"fx":null,"afterFx":0},{"text":"La façade résume donc, en deux images, la légende de la source et l’histoire du chantier romain.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. Nicola Salvi transforme l’arrière d’un palais en théâtre d’eau","cues":[{"text":"Revenez maintenant à l’ensemble de la composition.","pause":700,"fx":null,"afterFx":0},{"text":"La fontaine actuelle est commandée par le pape Clément Douze.","pause":750,"fx":null,"afterFx":0},{"text":"En mille-sept-cent-trente-deux, un concours est organisé et le projet de Nicola Salvi est retenu.","pause":850,"fx":null,"afterFx":0},{"text":"La fontaine est littéralement adossée au Palazzo Poli.","pause":750,"fx":null,"afterFx":0},{"text":"Salvi transforme donc la façade arrière d’un palais en gigantesque décor architectural.","pause":800,"fx":null,"afterFx":0},{"text":"Il meurt avant la fin des travaux.","pause":700,"fx":null,"afterFx":0},{"text":"Giuseppe Pannini achève l’ensemble en mille-sept-cent-soixante-deux.","pause":800,"fx":null,"afterFx":0},{"text":"Le résultat mélange architecture, sculpture, faux rochers et véritable eau jusqu’à rendre presque impossible de savoir où finit le bâtiment et où commence le paysage.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. Au centre, ce n’est pas Neptune","cues":[{"text":"Regardez la grande figure centrale.","pause":700,"fx":null,"afterFx":0},{"text":"On l’appelle souvent Neptune.","pause":700,"fx":null,"afterFx":0},{"text":"Mais l’identification retenue par la présentation officielle du monument est Océan.","pause":800,"fx":null,"afterFx":0},{"text":"Il se tient sur un char en forme de coquille.","pause":700,"fx":null,"afterFx":0},{"text":"Deux tritons conduisent deux chevaux marins très différents.","pause":750,"fx":null,"afterFx":0},{"text":"L’un est calme et docile.","pause":650,"fx":null,"afterFx":0},{"text":"L’autre est beaucoup plus agité.","pause":650,"fx":null,"afterFx":0},{"text":"Ils symbolisent les deux visages de l’eau : paisible ou incontrôlable.","pause":800,"fx":null,"afterFx":0},{"text":"Autour d’eux, la pierre semble presque se dissoudre dans le bassin.","pause":850,"fx":null,"afterFx":0},{"text":"C’est précisément ce mouvement entre architecture et nature qui donne à Trevi son aspect si théâtral.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. Regardez les côtés — Abondance, Santé et détails cachés dans la roche","cues":[{"text":"Avant de regarder uniquement le centre, observez aussi les deux grandes niches latérales.","pause":800,"fx":null,"afterFx":0},{"text":"Elles abritent deux figures allégoriques.","pause":700,"fx":null,"afterFx":0},{"text":"L’Abondance d’un côté.","pause":600,"fx":null,"afterFx":0},{"text":"La Santé de l’autre.","pause":600,"fx":null,"afterFx":0},{"text":"L’idée est claire : cette eau nourrit, soigne et fait prospérer la ville.","pause":800,"fx":null,"afterFx":0},{"text":"Descendez ensuite le regard vers les rochers.","pause":700,"fx":null,"afterFx":0},{"text":"La sculpture est remplie de plantes, d’animaux et de détails naturalistes qui donnent l’impression que le Palazzo Poli est en train de disparaître derrière une falaise.","pause":900,"fx":null,"afterFx":0},{"text":"Trevi ne représente donc pas seulement de l’eau.","pause":700,"fx":null,"afterFx":0},{"text":"Elle essaie de transformer tout un mur de ville en paysage.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. « Marcello, come here! » — La Dolce Vita change l’image de la fontaine","cues":[{"text":"Impossible de parler de Trevi sans évoquer le cinéma.","pause":700,"fx":null,"afterFx":0},{"text":"En mille-neuf-cent-soixante, Federico Fellini en fait le décor de l’une des scènes les plus célèbres de La Dolce Vita.","pause":850,"fx":null,"afterFx":0},{"text":"Anita Ekberg entre dans l’eau en robe du soir et appelle le personnage joué par Marcello Mastroianni.","pause":850,"fx":null,"afterFx":0},{"text":"L’image devient mondiale.","pause":650,"fx":null,"afterFx":0},{"text":"Elle a probablement fait autant pour la célébrité moderne de Trevi que de nombreuses brochures touristiques.","pause":800,"fx":null,"afterFx":0},{"text":"Mais n’essayez surtout pas de rejouer la scène.","pause":750,"fx":null,"afterFx":0},{"text":"Entrer dans l’eau est aujourd’hui interdit et lourdement sanctionné.","pause":800,"fx":null,"afterFx":0},{"text":"La Dolce Vita reste donc beaucoup plus économique à regarder à l’écran.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. Une pièce pour revenir à Rome — puis l’amour et le mariage","cues":[{"text":"Nous arrivons maintenant à la tradition la plus célèbre de Trevi.","pause":750,"fx":null,"afterFx":0},{"text":"Selon la coutume, jeter une pièce dans la fontaine promettrait votre retour à Rome.","pause":800,"fx":null,"afterFx":0},{"text":"La tradition populaire moderne ajoute ensuite une deuxième pièce pour l’amour.","pause":800,"fx":null,"afterFx":0},{"text":"Et une troisième pour entendre bientôt sonner les cloches du mariage.","pause":850,"fx":null,"afterFx":0},{"text":"Ne cherchons pas à transformer cette coutume en rite antique : sa forme actuelle appartient surtout à l’imaginaire touristique moderne.","pause":900,"fx":null,"afterFx":0},{"text":"Mais elle a aujourd’hui une conséquence très concrète.","pause":750,"fx":null,"afterFx":0},{"text":"Les pièces sont régulièrement récupérées et, dans le cadre de l’accord avec la ville, leurs recettes sont attribuées à la Caritas de Rome pour des actions sociales.","pause":900,"fx":null,"afterFx":0},{"text":"En deux-mille-vingt-cinq, la somme collectée a dépassé un million huit-cent-mille euros.","pause":850,"fx":null,"afterFx":0},{"text":"Votre souhait éventuel aura donc au moins une utilité parfaitement vérifiable.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. La fontaine des amoureux — la petite Trevi que presque tout le monde ignore","cues":[{"text":"Avant de partir, cherchez sur le côté droit extérieur de la grande fontaine une petite vasque rectangulaire alimentée par deux becs.","pause":850,"fx":null,"afterFx":0},{"text" const realSounds={};
function getRealSound(name){
  if(!realSounds[name]&&REAL_SOUND_URLS[name]){
    const a=new Audio(REAL_SOUND_URLS[name]);
    a.preload='auto';
    a.playsInline=true;
    realSounds[name]=a;
  }
  return realSounds[name]||null;
}
function primeRealSounds(){
  const names=[...new Set((mode==='immersive'?flat:[]).map(c=>c.fx).filter(n=>REAL_SOUND_URLS[n]))];
  names.forEach(name=>{
    const a=getRealSound(name);
    if(!a||a.dataset.primed)return;
    a.dataset.primed='1';
    a.volume=0.001;
    try{
      const p=a.play();
      if(p&&p.then)p.then(()=>{a.pause();a.currentTime=0;a.volume=1}).catch(()=>{a.volume=1});
    }catch(e){a.volume=1}
  });
}

async function requestWakeLock(){
 if(!('wakeLock' in navigator) || document.visibilityState!=='visible')return;
 try{
   if(!wakeLockSentinel){
     wakeLockSentinel=await navigator.wakeLock.request('screen');
     wakeLockSentinel.addEventListener('release',()=>{wakeLockSentinel=null});
   }
 }catch(e){}
}
async function releaseWakeLock(){
 try{
   if(wakeLockSentinel){
     const w=wakeLockSentinel;
     wakeLockSentinel=null;
     await w.release();
   }
 }catch(e){}
}
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='visible' && running && !paused)requestWakeLock();
});

function openNormal(s){mode='normal';currentStop=s;openPanel(s);$('kicker').textContent='Audioguide';$('chapter').textContent='Prêt';$('currentText').textContent=s.text;$('fulltext').innerHTML=`<details open><summary>Texte</summary><p>${s.text}</p></details>`;$('bar').style.width='0';$('pos').textContent='';$('pct').textContent='';$('playpause').textContent='▶︎'}

function ensureCtx(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}
function stopFx(){nodes.forEach(n=>{try{n.stop()}catch(e){}});nodes=[];$('ambience').textContent=''}
function gain(v){const g=ctx.createGain();g.gain.value=v*Number($('fxvol').value||.55);g.connect(ctx.destination);return g}
function osc(f,d,v=.12,type='sine',when=0){const o=ctx.createOscillator(),g=gain(v);o.type=type;o.frequency.value=f;o.connect(g);const t=ctx.currentTime+when;g.gain.setValueAtTime(v*Number($('fxvol').value||.55),t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d);nodes.push(o)}
function noise(d,v=.1,low=900,when=0){const len=Math.floor(ctx.sampleRate*d),b=ctx.createBuffer(1,len,ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<len;i++)a[i]=Math.random()*2-1;const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=gain(v);f.type='lowpass';f.frequency.value=low;s.buffer=b;s.connect(f);f.connect(g);const t=ctx.currentTime+when;s.start(t);s.stop(t+d);nodes.push(s)}
async function fx(name,id){
if(id!==runId)return;
if(REAL_SOUND_URLS[name]){
  stopFx();
  const a=getRealSound(name);
  if(!a)return;
  $('ambience').textContent='Son réel…';
  try{
    a.pause();a.currentTime=0;
    a.volume=Math.max(0,Math.min(1,Number($('fxvol').value||.55)));
    await a.play();
    await sleep(REAL_SOUND_DURATIONS[name]||2600);
    a.pause();a.currentTime=0;
  }catch(e){}
  if(id===runId){$('ambience').textContent='';await sleep(120)}
  return;
}
ensureCtx();stopFx();$('ambience').textContent='Ambiance sonore…';let d=1.5;
if(name==='fanfare'){d=2.1;[261,329,392,523].forEach((f,k)=>osc(f,.7,.10,'sawtooth',k*.32))}
else if(name==='crowd'||name==='crowd_big'){d=2;noise(d,name==='crowd_big'?.15:.10,1200);[115,155,205,260].forEach((f,k)=>osc(f,d,.016,'sine',k*.05))}
else if(name==='steps_crowd'){d=1.8;noise(d,.07,850);[.15,.45,.75,1.05,1.35].forEach(t=>osc(80,.1,.10,'sine',t))}
else if(name==='gate'){d=1.3;[.05,.38,.75].forEach((t,k)=>osc([620,430,300][k],.35,.15,'square',t))}
else if(name==='roar'){d=1.5;noise(d,.15,270);osc(62,d,.07,'sawtooth')}
else if(name==='swords'){d=1.1;[.08,.48].forEach(t=>{osc(1500,.2,.10,'square',t);osc(2400,.17,.07,'sine',t)})}
else if(name==='wind'){d=1.7;noise(d,.10,550)}
else if(name==='drum'){d=1.5;osc(70,.65,.17,'sine',.05);osc(58,.65,.15,'sine',.72)}
else if(name==='applause'){d=1.9;noise(d,.13,1800)}
else if(name==='finale'){d=2.2;noise(d,.09,1000);[261,329,392,523].forEach((f,k)=>osc(f,.6,.07,'sawtooth',1+k*.27))}
else if(name==='church'){d=2.0;[220,277,330].forEach((f,k)=>osc(f,1.65,.035,'sine',k*.08));osc(660,1.3,.022,'sine',.15)}
else if(name==='stone_steps'){d=1.6;[.12,.42,.72,1.02,1.32].forEach((t,k)=>osc(82-k*3,.13,.105,'sine',t))}
else if(name==='bell'){d=1.8;osc(440,1.55,.075,'sine',.02);osc(880,1.15,.035,'sine',.02);osc(1320,.85,.018,'sine',.02)}
else if(name==='underground'){d=1.8;noise(d,.055,300);osc(54,d,.022,'sine',0)}
else if(name==='metal'){d=1.25;[.08,.58].forEach(t=>{osc(980,.22,.08,'square',t);osc(1760,.18,.035,'sine',t)})}
else if(name==='water'){d=2.4;noise(d,.06,2400);[.22,.66,1.08,1.55,1.96].forEach((t,k)=>osc(1150+k*90,.09,.024,'sine',t))}
else if(name==='fire_soft'){d=1.8;noise(d,.035,500);[.18,.52,.91,1.27,1.53].forEach((t,k)=>osc(95+k*6,.08,.025,'sine',t))}
else if(name==='fire_fade'){d=2.2;noise(d,.028,420);osc(78,1.7,.018,'sine',.05)}
else if(name==='cloth_release'){d=1.2;noise(d,.018,1400);osc(180,.35,.025,'sine',.35)}
await sleep(d*1000);if(id===runId){stopFx();await sleep(120)}}
function speak(text,id){return new Promise(res=>{if(id!==runId)return res();const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=Number($('rate').value)||.96;const v=voices[Number($('voice').value)||0];if(v)u.voice=v;u.onend=res;u.onerror=res;synth.speak(u)})}
function markSelectedChapter(si){
 document.querySelectorAll('.chapterdetail').forEach(d=>{
   d.classList.toggle('selected-chapter',Number(d.dataset.si)===si);
 });
}
function selectChapterFromText(si){
 if(mode!=='immersive'||!flat.length)return;
 if(running||paused)stopAll();
 idx=chapterStart(si);
 transitionShownFor=-1;
 markSelectedChapter(si);
 update();
}
function chapterCount(){
 if(!flat.length)return 0;
 return Math.max(...flat.map(x=>x.si))+1;
}
function currentChapterIndex(){
 if(!flat.length)return 0;
 const safe=Math.min(idx,flat.length-1);
 return flat[safe]?.si??0;
}
function chapterStart(si){
 const n=flat.findIndex(x=>x.si===si);
 return n<0?0:n;
}
function update(){
 if(mode!=='immersive')return;
 const total=flat.length;
 const p=total?Math.round(idx/total*100):0;
 const chapters=chapterCount();
 const si=currentChapterIndex();
 $('bar').style.width=p+'%';
 $('pos').textContent='Chapitre '+Math.min(si+1,chapters)+' / '+chapters;
 $('pct').textContent=p+' %';
 if(idx<total){
   $('chapter').textContent=flat[idx].section;
   $('currentText').textContent=flat[idx].text;
 }
}
async function showChapterTransition(si,id){
 if(id!==runId||transitionShownFor===si)return;
 transitionShownFor=si;
 markSelectedChapter(si);
 const chapters=chapterCount();
 const cue=flat[chapterStart(si)];
 if(!cue)return;
 const scene=document.querySelector('.scene');
 scene.classList.add('chapter-transition');
 $('chapter').textContent='Étape '+(si+1)+' sur '+chapters;
 $('currentText').textContent=cue.section;
 $('ambience').textContent='Nouvelle étape';
 await sleep(si===0?1200:2400);
 if(id!==runId)return;
 scene.classList.remove('chapter-transition');
 $('ambience').textContent='';
 update();
}
async function runImmersive(){
 if(running)return;
 ensureCtx();
 requestWakeLock();
 // Sur iPhone, la première synthèse doit partir directement du geste utilisateur.
 // On évite donc tout délai AVANT la première phrase de la session.
 try{synth.resume()}catch(e){}
 running=true;
 paused=false;
 $('playpause').textContent='Ⅱ';
 const id=runId;
 let firstCueOfSession=true;
 while(idx<flat.length&&id===runId){
   const c=flat[idx];
   if(c.ci===0){
     if(firstCueOfSession){
       // Le titre reste affiché à l'écran, mais on lance la voix immédiatement.
       transitionShownFor=c.si;
     }else{
       await showChapterTransition(c.si,id);
     }
   }
   if(id!==runId)break;
   update();
   await speak(c.text,id);
   firstCueOfSession=false;
   if(id!==runId)break;
   await sleep(c.pause||650);
   if(c.fx){
     await fx(c.fx,id);
     if(id!==runId)break;
     await sleep(c.afterFx||350);
   }
   idx++;
   if(idx<flat.length && flat[idx].si!==c.si){
     // Respiration supplémentaire avant l'écran de transition du chapitre suivant.
     await sleep(900);
   }
   update();
 }
 if(id===runId){
   running=false;
   releaseWakeLock();
   $('playpause').textContent='▶︎';
   if(idx>=flat.length){
     $('chapter').textContent='Visite terminée';
     $('currentText').textContent=(currentStop&&currentStop.endText)||'Visite terminée.';
     $('pos').textContent='Terminé';
     $('pct').textContent='100 %';
     $('bar').style.width='100%';
   }
 }
}
function runNormal(){
 synth.cancel();ensureCtx();requestWakeLock();
 const u=new SpeechSynthesisUtterance(currentStop.text);
 u.lang='fr-FR';u.rate=Number($('rate').value)||.96;
 const v=voices[Number($('voice').value)||0];if(v)u.voice=v;
 running=true;$('playpause').textContent='Ⅱ';
 u.onend=()=>{running=false;releaseWakeLock();$('playpause').textContent='▶︎';$('bar').style.width='100%'};
 synth.speak(u)
}
function stopAll(){
 runId++;
 synth.cancel();
 releaseWakeLock();
 stopFx();
 running=false;
 paused=false;
 $('playpause').textContent='▶︎';
 const scene=document.querySelector('.scene');
 if(scene)scene.classList.remove('chapter-transition');
}
function toggle(){
 ensureCtx();
 primeRealSounds();
 if(running&&!paused){
   paused=true;
   synth.pause();
   releaseWakeLock();
   $('playpause').textContent='▶︎';
   return;
 }
 if(running&&paused){
   paused=false;
   synth.resume();
   requestWakeLock();
   $('playpause').textContent='Ⅱ';
   return;
 }
 mode==='immersive'?runImmersive():runNormal()
}
function goChapter(delta){
 if(mode!=='immersive'||!flat.length)return;
 const wasPlaying=running&&!paused;
 const chapters=chapterCount();
 const current=currentChapterIndex();
 const target=Math.max(0,Math.min(chapters-1,current+delta));
 if(target===current && delta<0){
   // "Previous" at the first chapter simply restarts it.
   stopAll();
   idx=chapterStart(current);
   transitionShownFor=-1;
   markSelectedChapter(current);
   update();
   if(wasPlaying)setTimeout(runImmersive,80);
   return;
 }
 if(target===current)return;
 stopAll();
 idx=chapterStart(target);
 transitionShownFor=-1;
 markSelectedChapter(target);
 update();
 if(wasPlaying)setTimeout(runImmersive,80);
}
$('playpause').onclick=toggle;
$('prev').onclick=()=>goChapter(-1);
$('next').onclick=()=>goChapter(1);
</script>
</body></html>
