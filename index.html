:"L’aigle joue ici le rôle de véhicule céleste.","pause":650,"fx":null,"afterFx":0},{"text":"Donc, en quelques mètres seulement, l’arc raconte deux choses.","pause":750,"fx":null,"afterFx":0},{"text":"En bas : l’empereur victorieux parmi les hommes.","pause":650,"fx":null,"afterFx":0},{"text":"Au-dessus : l’empereur devenu dieu.","pause":700,"fx":null,"afterFx":0},{"text":"C’est assez difficile de faire plus efficace en matière de communication politique.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. Un monument antique devenu forteresse médiévale","cues":[{"text":"L’Arc de Titus n’a pas toujours ressemblé à ce que vous voyez aujourd’hui.","pause":750,"fx":null,"afterFx":0},{"text":"Au Moyen Âge, il fut intégré aux fortifications de la puissante famille Frangipane.","pause":800,"fx":null,"afterFx":0},{"text":"Autrement dit, ce monument impérial devint un élément défensif.","pause":700,"fx":null,"afterFx":0},{"text":"Des constructions médiévales l’entouraient et l’emprisonnaient partiellement.","pause":750,"fx":null,"afterFx":0},{"text":"Cela a profondément modifié son apparence.","pause":650,"fx":null,"afterFx":0},{"text":"Mais paradoxalement, cette réutilisation a aussi contribué à sa conservation.","pause":800,"fx":null,"afterFx":0},{"text":"À Rome, être transformé en mur de château peut donc parfois constituer une stratégie de survie architecturale.","pause":850,"fx":"stone_steps","afterFx":450}]},{"title":"6. Le grand démontage — l’arc antique que vous voyez est aussi moderne","cues":[{"text":"Au début du dix-neuvième siècle, les bâtiments médiévaux autour de l’arc sont progressivement supprimés.","pause":800,"fx":null,"afterFx":0},{"text":"Entre les années dix-huit-cent-douze et dix-huit-cent-vingt-trois, l’arc est démonté puis reconstruit.","pause":850,"fx":null,"afterFx":0},{"text":"Les architectes Raffaele Stern puis Giuseppe Valadier dirigent l’intervention.","pause":750,"fx":null,"afterFx":0},{"text":"Les parties antiques sont conservées autant que possible.","pause":700,"fx":null,"afterFx":0},{"text":"Les éléments manquants sont complétés avec un matériau volontairement différent : du travertin.","pause":800,"fx":null,"afterFx":0},{"text":"Regardez bien.","pause":650,"fx":null,"afterFx":0},{"text":"Une partie de ce que vous prenez spontanément pour l’Arc de Titus antique appartient donc au grand chantier de restauration du dix-neuvième siècle.","pause":850,"fx":null,"afterFx":0},{"text":"Et c’est précisément ce qui rend cette restauration intéressante.","pause":700,"fx":null,"afterFx":0},{"text":"On complète le monument sans essayer de faire passer le neuf pour de l’ancien.","pause":800,"fx":null,"afterFx":0},{"text":"Avant de repartir, regardez une dernière fois l’ensemble.","pause":750,"fx":null,"afterFx":0},{"text":"Un triomphe romain.","pause":550,"fx":null,"afterFx":0},{"text":"Une catastrophe pour Jérusalem.","pause":550,"fx":null,"afterFx":0},{"text":"Une divinisation impériale.","pause":550,"fx":null,"afterFx":0},{"text":"Une forteresse médiévale.","pause":550,"fx":null,"afterFx":0},{"text":"Puis un laboratoire du restaurateur moderne.","pause":700,"fx":null,"afterFx":0},{"text":"Pas mal pour un monument que l’on traverse en quelques secondes.","pause":800,"fx":null,"afterFx":0},{"text":"Vous pouvez maintenant descendre la Via Sacra vers la Maison des Vestales.","pause":900,"fx":"steps_crowd","afterFx":500}]}];
const VESTALES=[{"title":"1. Avant la maison — commencez par Vesta","cues":[{"text":"Avant d’entrer dans la Maison des Vestales, regardez d’abord le petit temple circulaire juste à côté.","pause":800,"fx":null,"afterFx":0},{"text":"C’est le temple de Vesta.","pause":700,"fx":null,"afterFx":0},{"text":"Sa forme ronde le distingue immédiatement des grands temples rectangulaires du Forum.","pause":750,"fx":null,"afterFx":0},{"text":"À l’intérieur brûlait le feu sacré de Rome.","pause":800,"fx":"fire_soft","afterFx":500},{"text":"Ce feu symbolisait la continuité de la cité.","pause":700,"fx":null,"afterFx":0},{"text":"Tant qu’il brûlait, Rome continuait.","pause":750,"fx":null,"afterFx":0},{"text":"Et celles qui avaient la responsabilité de l’entretenir vivaient juste à côté.","pause":750,"fx":null,"afterFx":0},{"text":"Les Vestales n’étaient donc pas de simples prêtresses parmi d’autres.","pause":750,"fx":null,"afterFx":0},{"text":"Elles étaient liées à l’un des symboles les plus essentiels de l’État romain.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. Six jeunes filles choisies pour trente ans","cues":[{"text":"Le collège comptait normalement six Vestales.","pause":700,"fx":null,"afterFx":0},{"text":"Elles étaient choisies très jeunes, traditionnellement entre six et dix ans.","pause":750,"fx":null,"afterFx":0},{"text":"La sélection était placée sous l’autorité du grand pontife, le Pontifex Maximus.","pause":750,"fx":null,"afterFx":0},{"text":"Une fois choisie, la jeune fille quittait l’autorité juridique ordinaire de son père pour entrer dans une institution religieuse directement liée à l’État.","pause":850,"fx":null,"afterFx":0},{"text":"Son service durait trente ans.","pause":700,"fx":null,"afterFx":0},{"text":"La tradition romaine le divisait en trois périodes : dix ans pour apprendre, dix ans pour exercer pleinement, puis dix ans pour transmettre.","pause":850,"fx":null,"afterFx":0},{"text":"À la fin de ces trente années, une Vestale pouvait quitter le collège et même se marier.","pause":750,"fx":null,"afterFx":0},{"text":"Mais après avoir passé l’essentiel de sa vie adulte dans l’une des institutions les plus prestigieuses de Rome, le retour à une existence ordinaire devait être… assez relatif.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. Le feu sacré — une responsabilité quotidienne","cues":[{"text":"La mission la plus célèbre des Vestales était l’entretien du feu sacré.","pause":750,"fx":null,"afterFx":0},{"text":"Il devait rester allumé en permanence, sauf lors de son renouvellement rituel annuel.","pause":800,"fx":"fire_soft","afterFx":450},{"text":"S’il s’éteignait accidentellement, ce n’était pas simplement un problème de chauffage.","pause":750,"fx":null,"afterFx":0},{"text":"C’était un mauvais présage pour Rome.","pause":700,"fx":null,"afterFx":0},{"text":"La Vestale tenue pour responsable pouvait être punie.","pause":700,"fx":null,"afterFx":0},{"text":"Mais leur rôle ne se limitait pas au feu.","pause":650,"fx":null,"afterFx":0},{"text":"Elles participaient à de nombreuses cérémonies publiques et préparaient des substances rituelles utilisées dans les sacrifices.","pause":800,"fx":null,"afterFx":0},{"text":"Leur présence était donc intégrée à la vie religieuse de la cité tout entière.","pause":800,"fx":null,"afterFx":0},{"text":"À Rome, religion et politique ne formaient jamais vraiment deux mondes séparés.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. Des femmes avec des privilèges presque inimaginables à Rome","cues":[{"text":"Voici maintenant ce qui rend les Vestales particulièrement fascinantes.","pause":750,"fx":null,"afterFx":0},{"text":"Dans une société où la vie juridique des femmes était fortement encadrée, elles disposaient de privilèges exceptionnels.","pause":800,"fx":null,"afterFx":0},{"text":"Elles pouvaient posséder et administrer leurs biens.","pause":650,"fx":null,"afterFx":0},{"text":"Elles pouvaient faire un testament.","pause":650,"fx":null,"afterFx":0},{"text":"Elles occupaient des places d’honneur lors de certains spectacles et cérémonies.","pause":750,"fx":null,"afterFx":0},{"text":"Elles bénéficiaient aussi d’un prestige public immense.","pause":700,"fx":null,"afterFx":0},{"text":"Les auteurs antiques racontent même qu’un condamné rencontré fortuitement par une Vestale sur son chemin pouvait, dans certaines circonstances, être gracié.","pause":850,"fx":null,"afterFx":0},{"text":"Ce détail vient de la tradition antique et doit être pris comme tel.","pause":750,"fx":null,"afterFx":0},{"text":"Mais il montre bien jusqu’où pouvait aller le caractère sacré attaché à leur personne.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. Le prix de ce statut — une discipline extrême","cues":[{"text":"Ces privilèges avaient une contrepartie très lourde.","pause":750,"fx":null,"afterFx":0},{"text":"Pendant leur service, les Vestales devaient respecter un vœu de chasteté.","pause":750,"fx":null,"afterFx":0},{"text":"La violation de ce vœu était considérée comme une faute religieuse majeure, appelée incestum.","pause":800,"fx":null,"afterFx":0},{"text":"La peine traditionnelle était terrible.","pause":750,"fx":null,"afterFx":0},{"text":"La Vestale condamnée était enfermée vivante dans une chambre souterraine à l’extérieur de l’ancienne ville.","pause":850,"fx":null,"afterFx":0},{"text":"Le rituel évitait ainsi de verser directement le sang d’une personne considérée comme sacrée.","pause":800,"fx":null,"afterFx":0},{"text":"Les sources antiques racontent plusieurs procès de ce type.","pause":700,"fx":null,"afterFx":0},{"text":"Mais il faut rester prudent avec les récits les plus dramatiques : ils mêlent faits, tradition religieuse et mise en scène morale.","pause":850,"fx":null,"afterFx":0},{"text":"Ce qui est certain, c’est que le statut extraordinaire des Vestales reposait sur des obligations tout aussi extraordinaires.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. La Maison des Vestales — une résidence au cœur du Forum","cues":[{"text":"Regardez maintenant la grande cour allongée devant vous.","pause":750,"fx":null,"afterFx":0},{"text":"C’est le cœur de l’Atrium Vestae, la Maison des Vestales.","pause":750,"fx":null,"afterFx":0},{"text":"L’ensemble que vous voyez aujourd’hui résulte de plusieurs phases de reconstruction, notamment après les grands incendies qui ont touché le Forum.","pause":850,"fx":null,"afterFx":0},{"text":"La cour était bordée de portiques.","pause":650,"fx":null,"afterFx":0},{"text":"Elle comportait des bassins, des espaces de réception et des pièces d’habitation réparties autour.","pause":800,"fx":null,"afterFx":0},{"text":"Il ne faut donc pas imaginer un couvent au sens moderne.","pause":700,"fx":null,"afterFx":0},{"text":"C’était à la fois une résidence prestigieuse, un lieu de travail religieux et une institution publique.","pause":800,"fx":null,"afterFx":0},{"text":"Les Vestales vivaient littéralement au milieu du centre politique, judiciaire et religieux de Rome.","pause":850,"fx":"steps_crowd","afterFx":500},{"text":"Le Forum était leur quartier quotidien.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. Les statues — le tableau d’honneur des Vestales","cues":[{"text":"Le long de la cour, regardez les socles et les statues.","pause":750,"fx":null,"afterFx":0},{"text":"Ils appartenaient au véritable tableau d’honneur de l’institution.","pause":750,"fx":null,"afterFx":0},{"text":"Plusieurs statues représentaient des Vestales maximales, c’est-à-dire les prêtresses placées à la tête du collège.","pause":800,"fx":null,"afterFx":0},{"text":"Les inscriptions indiquaient leur nom et leurs qualités.","pause":700,"fx":null,"afterFx":0},{"text":"Certaines ont été retrouvées incomplètes ou remaniées.","pause":700,"fx":null,"afterFx":0},{"text":"L’une des curiosités du lieu est justement l’existence d’un socle dont le nom a été volontairement effacé dans l’Antiquité tardive.","pause":850,"fx":null,"afterFx":0},{"text":"Les historiens ont proposé plusieurs identifications, sans certitude absolue.","pause":750,"fx":null,"afterFx":0},{"text":"C’est un bon exemple de ce que l’archéologie laisse parfois volontairement ouvert.","pause":750,"fx":null,"afterFx":0},{"text":"Un nom effacé peut être presque aussi intéressant qu’un nom parfaitement lisible.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. La fin des Vestales — quand Rome change de religion","cues":[{"text":"Le collège des Vestales a traversé une grande partie de l’histoire romaine.","pause":750,"fx":null,"afterFx":0},{"text":"Mais à la fin du quatrième siècle, l’Empire romain est en train de changer profondément.","pause":800,"fx":null,"afterFx":0},{"text":"Le christianisme devient la religion dominante du pouvoir impérial.","pause":750,"fx":null,"afterFx":0},{"text":"Les anciens cultes publics perdent progressivement leurs financements et leur statut.","pause":800,"fx":null,"afterFx":0},{"text":"Le collège des Vestales disparaît alors à la fin du quatrième siècle.","pause":800,"fx":null,"afterFx":0},{"text":"Le feu qui symbolisait depuis des siècles la continuité de Rome cesse d’être entretenu.","pause":850,"fx":"fire_fade","afterFx":600},{"text":"Et pourtant, le lieu reste au cœur de la ville.","pause":700,"fx":null,"afterFx":0},{"text":"Regardez une dernière fois la cour.","pause":700,"fx":null,"afterFx":0},{"text":"Pendant des siècles, six femmes y ont occupé une position presque unique dans la société romaine.","pause":800,"fx":null,"afterFx":0},{"text":"À la fois très libres…","pause":950,"fx":null,"afterFx":0},{"text":"Et extrêmement contraintes.","pause":800,"fx":null,"afterFx":0},{"text":"C’est probablement ce paradoxe qui rend encore aujourd’hui les Vestales aussi fascinantes.","pause":900,"fx":null,"afterFx":0},{"text":"Vous pouvez maintenant poursuivre vers le temple de Saturne et le reste du Forum.","pause":900,"fx":"steps_crowd","afterFx":500}]}];
const SATURNE=[{"title":"1. Huit colonnes pour l’un des plus vieux sanctuaires du Forum","cues":[{"text":"Arrêtez-vous devant les huit grandes colonnes au pied du Capitole.","pause":750,"fx":null,"afterFx":0},{"text":"Vous êtes devant le Temple de Saturne.","pause":700,"fx":null,"afterFx":0},{"text":"C’est l’un des plus anciens lieux de culte du Forum romain.","pause":750,"fx":null,"afterFx":0},{"text":"La tradition place sa consécration dans les toutes premières années de la République.","pause":800,"fx":null,"afterFx":0},{"text":"La date exacte faisait déjà débat chez les auteurs antiques.","pause":750,"fx":null,"afterFx":0},{"text":"Ce qui est sûr, c’est que le sanctuaire était ancien bien avant que le Forum ne prenne l’aspect monumental que nous lui connaissons aujourd’hui.","pause":850,"fx":null,"afterFx":0},{"text":"Et les huit colonnes que vous voyez ne sont pas celles du premier temple.","pause":800,"fx":null,"afterFx":0},{"text":"Comme beaucoup de monuments romains, celui-ci a été reconstruit plusieurs fois.","pause":800,"fx":null,"afterFx":0},{"text":"À Rome, l’ancienneté ne signifie presque jamais qu’un bâtiment soit resté intact depuis son premier jour.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. Saturne — agriculture, abondance et âge d’or","cues":[{"text":"Saturne était un dieu ancien, étroitement lié à l’agriculture et aux semailles.","pause":750,"fx":null,"afterFx":0},{"text":"Les Romains l’associaient aussi à un âge d’or mythique.","pause":750,"fx":null,"afterFx":0},{"text":"Un temps idéal où l’humanité aurait vécu dans l’abondance, avant les grandes hiérarchies et les contraintes du monde ordinaire.","pause":850,"fx":null,"afterFx":0},{"text":"Cette idée est importante pour comprendre les Saturnales.","pause":700,"fx":null,"afterFx":0},{"text":"Pendant quelques jours, l’ordre social romain se relâchait symboliquement.","pause":800,"fx":null,"afterFx":0},{"text":"Comme si, chaque année, Rome essayait brièvement de rejouer ce monde ancien et plus libre attribué au règne de Saturne.","pause":850,"fx":null,"afterFx":0},{"text":"Ce temple n’était donc pas seulement consacré à un dieu agricole.","pause":750,"fx":null,"afterFx":0},{"text":"Il portait aussi avec lui l’image d’un passé mythique que les Romains aimaient réinventer.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. Le trésor public était ici","cues":[{"text":"Voici maintenant la particularité la plus surprenante du temple.","pause":750,"fx":null,"afterFx":0},{"text":"Il abritait l’Aerarium, le trésor public de l’État romain.","pause":800,"fx":"metal","afterFx":450},{"text":"Autrement dit, une partie des finances de Rome était conservée dans un sanctuaire.","pause":800,"fx":null,"afterFx":0},{"text":"Cela peut sembler étrange avec nos catégories modernes.","pause":700,"fx":null,"afterFx":0},{"text":"Pour les Romains, cela l’était beaucoup moins.","pause":700,"fx":null,"afterFx":0},{"text":"Religion, droit et administration publique étaient profondément imbriqués.","pause":750,"fx":null,"afterFx":0},{"text":"Les fonds de l’État bénéficiaient ainsi de la protection matérielle du bâtiment…","pause":950,"fx":null,"afterFx":0},{"text":"Et de la protection symbolique du dieu.","pause":800,"fx":null,"afterFx":0},{"text":"Le temple a également été lié à la conservation et à la publication de documents publics.","pause":800,"fx":null,"afterFx":0},{"text":"En résumé : sanctuaire, archives et trésor public au même endroit.","pause":750,"fx":null,"afterFx":0},{"text":"Le ministère des Finances romain avait simplement une façade un peu plus impressionnante.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. La statue aux pieds attachés","cues":[{"text":"À l’intérieur se trouvait autrefois une grande statue de Saturne.","pause":750,"fx":null,"afterFx":0},{"text":"Et les sources antiques rapportent un détail étrange.","pause":750,"fx":null,"afterFx":0},{"text":"Les pieds du dieu étaient liés par des bandes de laine pendant l’année.","pause":800,"fx":null,"afterFx":0},{"text":"Puis, le jour de sa fête, ces liens étaient dénoués.","pause":750,"fx":"cloth_release","afterFx":450},{"text":"Le dieu était symboliquement libéré.","pause":700,"fx":null,"afterFx":0},{"text":"Et au même moment, la ville entrait dans la période des Saturnales.","pause":800,"fx":null,"afterFx":0},{"text":"On comprend facilement pourquoi ce geste a été associé à l’idée de liberté temporaire qui caractérisait la fête.","pause":800,"fx":null,"afterFx":0},{"text":"C’est l’un de ces petits détails rituels qui rendent la religion romaine beaucoup plus concrète.","pause":800,"fx":null,"afterFx":0},{"text":"Un dieu n’était pas seulement une idée.","pause":650,"fx":null,"afterFx":0},{"text":"On habillait son image, on la liait…","pause":950,"fx":null,"afterFx":0},{"text":"Puis on la libérait pour sa fête.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. Les Saturnales — quelques jours où Rome desserre sa cravate","cues":[{"text":"Les Saturnales commençaient le dix-sept décembre, jour de la dédicace du temple.","pause":800,"fx":"crowd","afterFx":450},{"text":"Avec le temps, les célébrations s’étendirent sur plusieurs jours.","pause":750,"fx":null,"afterFx":0},{"text":"On organisait des repas.","pause":600,"fx":null,"afterFx":0},{"text":"On échangeait de petits cadeaux.","pause":600,"fx":null,"afterFx":0},{"text":"Les jeux de hasard, normalement très encadrés, étaient plus largement tolérés.","pause":750,"fx":null,"afterFx":0},{"text":"Et surtout, les règles sociales habituelles semblaient momentanément se relâcher.","pause":800,"fx":null,"afterFx":0},{"text":"Les sources évoquent notamment des repas où maîtres et esclaves partageaient la fête dans un ordre moins strict qu’à l’ordinaire.","pause":850,"fx":null,"afterFx":0},{"text":"Attention cependant à une image trop moderne.","pause":700,"fx":null,"afterFx":0},{"text":"Les Saturnales n’abolissaient évidemment pas l’esclavage pendant une semaine.","pause":750,"fx":null,"afterFx":0},{"text":"Elles mettaient temporairement en scène un monde où les hiérarchies étaient brouillées.","pause":800,"fx":null,"afterFx":0},{"text":"Et les Romains adoraient ça.","pause":700,"fx":null,"afterFx":0},{"text":"Le cri traditionnel était : Io Saturnalia !","pause":850,"fx":"crowd_big","afterFx":500}]},{"title":"6. Les Saturnales sont-elles l’ancêtre direct de Noël ?","cues":[{"text":"Vous entendrez souvent une affirmation très simple : Noël serait directement l’héritier des Saturnales.","pause":800,"fx":null,"afterFx":0},{"text":"C’est beaucoup trop net pour l’histoire réelle.","pause":750,"fx":null,"afterFx":0},{"text":"Oui, les Saturnales avaient lieu en décembre.","pause":650,"fx":null,"afterFx":0},{"text":"Oui, on échangeait des cadeaux.","pause":650,"fx":null,"afterFx":0},{"text":"Oui, les fêtes de l’hiver romain ont pu influencer certaines pratiques culturelles ultérieures.","pause":800,"fx":null,"afterFx":0},{"text":"Mais cela ne suffit pas à démontrer qu’une fête moderne descend directement, coutume par coutume, des Saturnales.","pause":850,"fx":null,"afterFx":0},{"text":"Les traditions changent, se mélangent et se réinventent pendant des siècles.","pause":750,"fx":null,"afterFx":0},{"text":"Donc, plutôt que de dire : les Saturnales étaient le Noël romain…","pause":950,"fx":null,"afterFx":0},{"text":"Il vaut mieux dire qu’elles faisaient partie du grand paysage des fêtes d’hiver de Rome.","pause":850,"fx":null,"afterFx":0},{"text":"C’est moins spectaculaire.","pause":650,"fx":null,"afterFx":0},{"text":"Mais historiquement beaucoup plus propre.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. L’inscription — et les huit colonnes qui ont survécu","cues":[{"text":"Avant de repartir, levez les yeux vers l’inscription au-dessus des colonnes.","pause":750,"fx":null,"afterFx":0},{"text":"Elle dit en substance que le Sénat et le peuple romain ont restauré le temple après sa destruction par un incendie.","pause":800,"fx":null,"afterFx":0},{"text":"Cette restauration tardive explique une partie de ce que vous voyez aujourd’hui.","pause":750,"fx":null,"afterFx":0},{"text":"Le monument a été reconstruit avec des éléments provenant de phases antérieures et avec des matériaux réemployés.","pause":850,"fx":null,"afterFx":0},{"text":"Les huit colonnes sont donc moins le reste intact d’un seul bâtiment que le dernier état visible d’une très longue histoire architecturale.","pause":850,"fx":null,"afterFx":0},{"text":"C’est presque une définition de Rome.","pause":700,"fx":null,"afterFx":0},{"text":"On bâtit.","pause":500,"fx":null,"afterFx":0},{"text":"On brûle.","pause":500,"fx":null,"afterFx":0},{"text":"On restaure.","pause":500,"fx":null,"afterFx":0},{"text":"On récupère les matériaux disponibles.","pause":600,"fx":null,"afterFx":0},{"text":"Et deux mille ans plus tard, huit colonnes suffisent encore à dominer une extrémité du Forum.","pause":850,"fx":null,"afterFx":0},{"text":"Vous pouvez maintenant poursuivre vers le Capitole.","pause":900,"fx":"stone_steps","afterFx":500}]}];
const IMMERSIVES={colisee:IMMERSIVE,san_clemente:SAN_CLEMENTE,palatin:PALATIN,maison_auguste:MAISON_AUGUSTE,arc_titus:ARC_TITUS,vestales:VESTALES,saturne:SATURNE};
const synth=window.speechSynthesis;
let voices=[],day=0,mode=null,flat=[],idx=0,running=false,paused=false,runId=0,currentStop=null,transitionShownFor=-1;
let ctx=null,nodes=[],wakeLockSentinel=null;
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function requestWakeLock(){
 if(!('wakeLock' in navigator) || document.visibilityState!=='visible')return;
 try{
   if(!wakeLockSentinel){
     wakeLockSentinel=await navigator.wakeLock.request('screen');
     wakeLockSentinel.addEventListener('release',()=>{wakeLockSentinel=null});
   }
 }catch(e){}
}
async function releaseWakeLock(){
 try{
   if(wakeLockSentinel){
     const w=wakeLockSentinel;
     wakeLockSentinel=null;
     await w.release();
   }
 }catch(e){}
}
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='visible' && running && !paused)requestWakeLock();
});
function loadVoices(){voices=synth.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith('fr'));$('voice').innerHTML='';voices.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v.name;if(/Audrey|Thomas|Marie|Amélie|Siri/i.test(v.name)&&!$('voice').dataset.p){o.selected=true;$('voice').dataset.p='1'}$('voice').appendChild(o)})}
loadVoices();if('onvoiceschanged'in synth)synth.onvoiceschanged=loadVoices;

function renderTabs(){$('tabs').innerHTML='';ROUTES.forEach((r,i)=>{const b=document.createElement('button');b.className='tab'+(i===day?' active':'');b.textContent=r.day||r.name;b.onclick=()=>{day=i;renderTabs();renderStops()};$('tabs').appendChild(b)})}
function renderStops(){$('stops').innerHTML='';ROUTES[day].stops.forEach(s=>{const a=document.createElement('article');a.className='stop'+(s.immersive?' special':'');a.innerHTML=`${s.immersive?'<div class="badge">✦ visite immersive</div>':''}<h2>${s.title}</h2><p>${s.immersive?'Narration guidée + ambiances synchronisées':'Audioguide du lieu'}</p><div class="actions"><button class="play">${s.immersive?'Commencer':'Écouter'}</button><a class="map" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lon}">⌖</a></div>`;a.querySelector('.play').onclick=()=>s.immersive?openImmersive(s):openNormal(s);$('stops').appendChild(a)})}
renderTabs();renderStops();

function openPanel(s){$('panel').classList.add('open');$('controls').classList.add('show');$('panelTitle').textContent=s.title;$('title').textContent=s.title;document.body.style.overflow='hidden'}
function closePanel(){stopAll();$('panel').classList.remove('open');$('controls').classList.remove('show');document.body.style.overflow='';mode=null}
$('back').onclick=closePanel;

function openImmersive(s){
 mode='immersive';
 currentStop=s;
 openPanel(s);
 flat=[];
 const dataset=IMMERSIVES[s.immersiveKey||'colisee']||IMMERSIVE;
 dataset.forEach((sec,si)=>sec.cues.forEach((c,ci)=>flat.push({...c,section:sec.title,si,ci})));
 idx=0;
 transitionShownFor=-1;
 $('kicker').textContent='Visite immersive';
 $('fulltext').innerHTML=dataset.map((x,si)=>`<details class="chapterdetail" data-si="${si}"><summary>${x.title}</summary><p>${x.cues.map(c=>c.text).join(' ')}</p></details>`).join('');
 document.querySelectorAll('.chapterdetail').forEach(d=>{
   d.addEventListener('toggle',()=>{
     if(d.open)selectChapterFromText(Number(d.dataset.si));
   });
 });
 markSelectedChapter(0);
 update();
}
function openNormal(s){mode='normal';currentStop=s;openPanel(s);$('kicker').textContent='Audioguide';$('chapter').textContent='Prêt';$('currentText').textContent=s.text;$('fulltext').innerHTML=`<details open><summary>Texte</summary><p>${s.text}</p></details>`;$('bar').style.width='0';$('pos').textContent='';$('pct').textContent='';$('playpause').textContent='▶︎'}

function ensureCtx(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}
function stopFx(){nodes.forEach(n=>{try{n.stop()}catch(e){}});nodes=[];$('ambience').textContent=''}
function gain(v){const g=ctx.createGain();g.gain.value=v*Number($('fxvol').value||.55);g.connect(ctx.destination);return g}
function osc(f,d,v=.12,type='sine',when=0){const o=ctx.createOscillator(),g=gain(v);o.type=type;o.frequency.value=f;o.connect(g);const t=ctx.currentTime+when;g.gain.setValueAtTime(v*Number($('fxvol').value||.55),t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d);nodes.push(o)}
function noise(d,v=.1,low=900,when=0){const len=Math.floor(ctx.sampleRate*d),b=ctx.createBuffer(1,len,ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<len;i++)a[i]=Math.random()*2-1;const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=gain(v);f.type='lowpass';f.frequency.value=low;s.buffer=b;s.connect(f);f.connect(g);const t=ctx.currentTime+when;s.start(t);s.stop(t+d);nodes.push(s)}
async function fx(name,id){if(id!==runId)return;ensureCtx();stopFx();$('ambience').textContent='Ambiance sonore…';let d=1.5;
if(name==='fanfare'){d=2.1;[261,329,392,523].forEach((f,k)=>osc(f,.7,.10,'sawtooth',k*.32))}
else if(name==='crowd'||name==='crowd_big'){d=2;noise(d,name==='crowd_big'?.15:.10,1200);[115,155,205,260].forEach((f,k)=>osc(f,d,.016,'sine',k*.05))}
else if(name==='steps_crowd'){d=1.8;noise(d,.07,850);[.15,.45,.75,1.05,1.35].forEach(t=>osc(80,.1,.10,'sine',t))}
else if(name==='gate'){d=1.3;[.05,.38,.75].forEach((t,k)=>osc([620,430,300][k],.35,.15,'square',t))}
else if(name==='roar'){d=1.5;noise(d,.15,270);osc(62,d,.07,'sawtooth')}
else if(name==='swords'){d=1.1;[.08,.48].forEach(t=>{osc(1500,.2,.10,'square',t);osc(2400,.17,.07,'sine',t)})}
else if(name==='wind'){d=1.7;noise(d,.10,550)}
else if(name==='drum'){d=1.5;osc(70,.65,.17,'sine',.05);osc(58,.65,.15,'sine',.72)}
else if(name==='applause'){d=1.9;noise(d,.13,1800)}
else if(name==='finale'){d=2.2;noise(d,.09,1000);[261,329,392,523].forEach((f,k)=>osc(f,.6,.07,'sawtooth',1+k*.27))}
else if(name==='church'){d=2.0;[220,277,330].forEach((f,k)=>osc(f,1.65,.035,'sine',k*.08));osc(660,1.3,.022,'sine',.15)}
else if(name==='stone_steps'){d=1.6;[.12,.42,.72,1.02,1.32].forEach((t,k)=>osc(82-k*3,.13,.105,'sine',t))}
else if(name==='bell'){d=1.8;osc(440,1.55,.075,'sine',.02);osc(880,1.15,.035,'sine',.02);osc(1320,.85,.018,'sine',.02)}
else if(name==='underground'){d=1.8;noise(d,.055,300);osc(54,d,.022,'sine',0)}
else if(name==='metal'){d=1.25;[.08,.58].forEach(t=>{osc(980,.22,.08,'square',t);osc(1760,.18,.035,'sine',t)})}
else if(name==='water'){d=2.4;noise(d,.06,2400);[.22,.66,1.08,1.55,1.96].forEach((t,k)=>osc(1150+k*90,.09,.024,'sine',t))}
else if(name==='fire_soft'){d=1.8;noise(d,.035,500);[.18,.52,.91,1.27,1.53].forEach((t,k)=>osc(95+k*6,.08,.025,'sine',t))}
else if(name==='fire_fade'){d=2.2;noise(d,.028,420);osc(78,1.7,.018,'sine',.05)}
else if(name==='cloth_release'){d=1.2;noise(d,.018,1400);osc(180,.35,.025,'sine',.35)}
await sleep(d*1000);if(id===runId){stopFx();await sleep(120)}}
function speak(text,id){return new Promise(res=>{if(id!==runId)return res();const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=Number($('rate').value)||.96;const v=voices[Number($('voice').value)||0];if(v)u.voice=v;u.onend=res;u.onerror=res;synth.speak(u)})}
function markSelectedChapter(si){
 document.querySelectorAll('.chapterdetail').forEach(d=>{
   d.classList.toggle('selected-chapter',Number(d.dataset.si)===si);
 });
}
function selectChapterFromText(si){
 if(mode!=='immersive'||!flat.length)return;
 if(running||paused)stopAll();
 idx=chapterStart(si);
 transitionShownFor=-1;
 markSelectedChapter(si);
 update();
}
function chapterCount(){
 if(!flat.length)return 0;
 return Math.max(...flat.map(x=>x.si))+1;
}
function currentChapterIndex(){
 if(!flat.length)return 0;
 const safe=Math.min(idx,flat.length-1);
 return flat[safe]?.si??0;
}
function chapterStart(si){
 const n=flat.findIndex(x=>x.si===si);
 return n<0?0:n;
}
function update(){
 if(mode!=='immersive')return;
 const total=flat.length;
 const p=total?Math.round(idx/total*100):0;
 const chapters=chapterCount();
 const si=currentChapterIndex();
 $('bar').style.width=p+'%';
 $('pos').textContent='Chapitre '+Math.min(si+1,chapters)+' / '+chapters;
 $('pct').textContent=p+' %';
 if(idx<total){
   $('chapter').textContent=flat[idx].section;
   $('currentText').textContent=flat[idx].text;
 }
}
async function showChapterTransition(si,id){
 if(id!==runId||transitionShownFor===si)return;
 transitionShownFor=si;
 markSelectedChapter(si);
 const chapters=chapterCount();
 const cue=flat[chapterStart(si)];
 if(!cue)return;
 const scene=document.querySelector('.scene');
 scene.classList.add('chapter-transition');
 $('chapter').textContent='Étape '+(si+1)+' sur '+chapters;
 $('currentText').textContent=cue.section;
 $('ambience').textContent='Nouvelle étape';
 await sleep(si===0?1200:2400);
 if(id!==runId)return;
 scene.classList.remove('chapter-transition');
 $('ambience').textContent='';
 update();
}
async function runImmersive(){
 if(running)return;
 ensureCtx();
 requestWakeLock();
 // Sur iPhone, la première synthèse doit partir directement du geste utilisateur.
 // On évite donc tout délai AVANT la première phrase de la session.
 try{synth.resume()}catch(e){}
 running=true;
 paused=false;
 $('playpause').textContent='Ⅱ';
 const id=runId;
 let firstCueOfSession=true;
 while(idx<flat.length&&id===runId){
   const c=flat[idx];
   if(c.ci===0){
     if(firstCueOfSession){
       // Le titre reste affiché à l'écran, mais on lance la voix immédiatement.
       transitionShownFor=c.si;
     }else{
       await showChapterTransition(c.si,id);
     }
   }
   if(id!==runId)break;
   update();
   await speak(c.text,id);
   firstCueOfSession=false;
   if(id!==runId)break;
   await sleep(c.pause||650);
   if(c.fx){
     await fx(c.fx,id);
     if(id!==runId)break;
     await sleep(c.afterFx||350);
   }
   idx++;
   if(idx<flat.length && flat[idx].si!==c.si){
     // Respiration supplémentaire avant l'écran de transition du chapitre suivant.
     await sleep(900);
   }
   update();
 }
 if(id===runId){
   running=false;
   releaseWakeLock();
   $('playpause').textContent='▶︎';
   if(idx>=flat.length){
     $('chapter').textContent='Visite terminée';
     $('currentText').textContent=(currentStop&&currentStop.endText)||'Visite terminée.';
     $('pos').textContent='Terminé';
     $('pct').textContent='100 %';
     $('bar').style.width='100%';
   }
 }
}
function runNormal(){
 synth.cancel();ensureCtx();requestWakeLock();
 const u=new SpeechSynthesisUtterance(currentStop.text);
 u.lang='fr-FR';u.rate=Number($('rate').value)||.96;
 const v=voices[Number($('voice').value)||0];if(v)u.voice=v;
 running=true;$('playpause').textContent='Ⅱ';
 u.onend=()=>{running=false;releaseWakeLock();$('playpause').textContent='▶︎';$('bar').style.width='100%'};
 synth.speak(u)
}
function stopAll(){
 runId++;
 synth.cancel();
 releaseWakeLock();
 stopFx();
 running=false;
 paused=false;
 $('playpause').textContent='▶︎';
 const scene=document.querySelector('.scene');
 if(scene)scene.classList.remove('chapter-transition');
}
function toggle(){
 ensureCtx();
 if(running&&!paused){
   paused=true;
   synth.pause();
   releaseWakeLock();
   $('playpause').textContent='▶︎';
   return;
 }
 if(running&&paused){
   paused=false;
   synth.resume();
   requestWakeLock();
   $('playpause').textContent='Ⅱ';
   return;
 }
 mode==='immersive'?runImmersive():runNormal()
}
function goChapter(delta){
 if(mode!=='immersive'||!flat.length)return;
 const wasPlaying=running&&!paused;
 const chapters=chapterCount();
 const current=currentChapterIndex();
 const target=Math.max(0,Math.min(chapters-1,current+delta));
 if(target===current && delta<0){
   // "Previous" at the first chapter simply restarts it.
   stopAll();
   idx=chapterStart(current);
   transitionShownFor=-1;
   markSelectedChapter(current);
   update();
   if(wasPlaying)setTimeout(runImmersive,80);
   return;
 }
 if(target===current)return;
 stopAll();
 idx=chapterStart(target);
 transitionShownFor=-1;
 markSelectedChapter(target);
 update();
 if(wasPlaying)setTimeout(runImmersive,80);
}
$('playpause').onclick=toggle;
$('prev').onclick=()=>goChapter(-1);
$('next').onclick=()=>goChapter(1);
</script>
</body></html>
