<script>
const ROUTES=[{"id":"lundi","name":"Lundi 26 - Colisée et San Clemente","color":"#c94139","stops":[{"title":"Le Colisée · 8 h 45","text":"Visite immersive en neuf séquences : extérieur, entrée, arène, souterrains, gladiateurs, point de vue depuis l’arène, spectacles, empereur et conclusion. La narration utilise la voix française de l’iPhone avec des respirations et des effets sonores insérés uniquement dans les silences.","lat":41.8902102,"lon":12.4922309,"n":1,"immersive":true,"immersiveKey":"colisee","endText":"Vous pouvez maintenant poursuivre vers l’arc de Constantin, juste à côté du Colisée."},{"title":"L’arc de Constantin","text":"Regardez l’arc de Constantin, juste à côté du Colisée. Il célèbre la victoire de l’empereur Constantin sur Maxence, en 312. Les reliefs réutilisent des éléments de monuments plus anciens : les souverains changeaient, mais les images de prestige conservaient leur force. Vous le voyez depuis l’espace public, sans billet. Ne vous attardez pas si vous avez votre rendez-vous à San Clemente à onze heures.","lat":41.88975,"lon":12.49065,"n":2},{"title":"Les fouilles de San Clemente · 11 h","text":"Visite immersive en huit séquences : basilique supérieure, première descente, ancienne basilique, saint Cyrille, niveau romain, mithraeum, rue antique et eau souterraine.","lat":41.88934,"lon":12.49752,"n":3,"immersive":true,"immersiveKey":"san_clemente","endText":"La visite de San Clemente est terminée. Remontez tranquillement vers la basilique supérieure avant de poursuivre votre parcours."}]},{"id":"lundi_a","name":"Lundi 26 - Après-midi A : Cælius et Aventin","color":"#d76a27","stops":[{"title":"Le Clivus Scauri et le Cælius","text":"En quittant San Clemente, longez les rues du Cælius jusqu’au Clivus Scauri. Les murs et les arches qui enjambent la voie racontent l’épaisseur d’une ville transformée sans être effacée. Vous passez près de la basilique des Saints-Jean-et-Paul : la visite de l’église est distincte des maisons romaines souterraines, qui demandent un autre billet. Ce parcours reste une promenade extérieure et libre.","lat":41.88585,"lon":12.4925,"n":1},{"title":"Le Circo Massimo","text":"Le Circo Massimo n’était pas un amphithéâtre : cette immense piste accueillait surtout les courses de chars. Imaginez les équipes tournant autour de la longue barrière centrale, sous les regards d’une foule répartie sur des gradins aujourd’hui disparus. La forme allongée du terrain reste parfaitement lisible depuis les abords. Vous pouvez vous arrêter ici gratuitement, puis monter vers l’Aventin.","lat":41.8853,"lon":12.4853,"n":2},{"title":"Le jardin des Orangers","text":"Vous êtes sur l'Aventin, l'une des sept collines de Rome. Le jardin des Orangers, officiellement parc Savello, occupe l'emplacement d'une ancienne forteresse médiévale. Les orangers et les allées symétriques créent une pause très différente des ruines monumentales.\n\nAvancez vers la terrasse. La vue suit le Tibre et rejoint la coupole de Saint-Pierre. Observez comment les différentes hauteurs de Rome se répondent : le Janicule au loin, les quartiers autour du fleuve et les dômes qui émergent des toits. En fin de journée, la lumière rend ce panorama particulièrement agréable.\n\nÀ proximité se trouve la basilique Sainte-Sabine, remarquable pour son architecture paléochrétienne. Un peu plus loin, le célèbre trou de serrure du prieuré de l'ordre de Malte cadre parfaitement la coupole de Saint-Pierre. La file d'attente peut être longue ; considérez-le comme un complément, non comme une obligation. Ce jardin marque surtout un changement de rythme : après Caracalla et le Cirque Maxime, prenez le temps de vous asseoir et de regarder Rome comme un paysage.","lat":41.8851338,"lon":12.48039,"n":3}]},{"id":"lundi_b","name":"Lundi 26 - Après-midi B : Monti","color":"#3164bd","stops":[{"title":"Santi Quattro Coronati","text":"Cette basilique fortifiée a une allure presque défensive. Ses cours successives et ses murs massifs font sentir le passage de la Rome antique à la Rome médiévale. Entrez dans l’église si elle est ouverte ; le cloître peut avoir des horaires ou une contribution distincts. Le détour est facultatif si vous préférez déjeuner plus tôt.","lat":41.88875,"lon":12.4984,"n":1},{"title":"San Pietro in Vincoli","text":"La basilique conserve le célèbre Moïse sculpté par Michel-Ange pour le tombeau du pape Jules deux. Regardez la tension des bras, le mouvement de la barbe et cette impression que le personnage pourrait se lever. Le monument funéraire réalisé est beaucoup plus modeste que le projet gigantesque imaginé au départ. La visite de l’église vous mène ensuite naturellement vers les rues de Monti.","lat":41.89333,"lon":12.49297,"n":2},{"title":"Le quartier de Monti","text":"Vous terminez le parcours dans Monti, un quartier qui permet de passer de la Rome monumentale à la ville habitée. Son nom signifie les monts, car l'ancien district s'étendait sur plusieurs collines. Dans l'Antiquité, une partie de cette zone appartenait à la Subure, quartier dense, populaire, bruyant et souvent mal famé, où se mêlaient logements, ateliers, boutiques et tavernes.\n\nEn marchant dans les rues étroites, observez le contraste avec les grandes perspectives impériales. Les façades colorées, les escaliers, les plantes aux fenêtres et les petites places racontent une autre Rome, construite par couches successives. La piazza della Madonna dei Monti constitue un bon point de pause. Sa fontaine attire encore les habitants comme les visiteurs.\n\nMonti n'est pas un site antique figé, mais il aide à comprendre une réalité essentielle : autour des forums et des palais vivaient des dizaines de milliers de personnes ordinaires. Prenez le temps de vous arrêter dans une rue calme, puis regardez en direction des forums. En quelques centaines de mètres, vous êtes passé de la résidence des empereurs à l'échelle quotidienne d'un quartier romain.","lat":41.8947077,"lon":12.4925226,"n":3}]},{"id":"mardi","name":"Mardi 27 - Palatin et Forum, sans musée","color":"#15835f","stops":[{"title":"Le Palatin","text":"Vous montez maintenant sur le Palatin, la colline la plus liée aux origines de Rome. Selon la tradition, c'est ici que Romulus aurait fondé la ville en 753 avant notre ère. Les archéologues ont bien retrouvé des traces d'habitations très anciennes, même si la légende et l'histoire ne se confondent pas exactement. Le mot palais vient d'ailleurs de Palatin : à partir d'Auguste, la colline devint la résidence privilégiée des empereurs.\n\nEn avançant, observez l'échelle des ruines. Vous traversez les restes de plusieurs résidences impériales, agrandies au fil des règnes. Certaines salles étaient destinées aux cérémonies officielles, d'autres aux appartements privés, aux jardins ou aux banquets. Depuis les terrasses, la vue domine à la fois le Forum et le Cirque Maxime. Cette position permettait à l'empereur d'être symboliquement au-dessus du centre politique tout en restant proche des spectacles populaires.\n\nCherchez les fragments de sols, les murs de briques, les arcs et les traces de marbre. Les surfaces aujourd'hui nues étaient autrefois recouvertes de couleurs, de stucs, de mosaïques et de revêtements précieux. Le Palatin n'était pas un château isolé, mais un ensemble de palais reliés entre eux, avec jardins, fontaines et passages de service. Prenez quelques minutes pour regarder le Forum depuis la hauteur : vous comprendrez mieux comment la géographie de Rome organisait le pouvoir.","lat":41.8886559,"lon":12.4875481,"n":1},{"title":"La maison d’Auguste","text":"Sur le Palatin, la maison d’Auguste rappelle qu’un empereur pouvait associer résidence privée et centre du pouvoir. Les décors peints, lorsqu’ils sont accessibles, donnent une idée de l’élégance intérieure, loin de la seule image des grands bâtiments de marbre. L’accès fait partie des sites SUPER liés à votre billet ; les conditions d’ouverture des pièces peuvent changer. Poursuivez dans le même périmètre vers les jardins Farnèse avant de descendre au Forum : votre billet ne permet qu’une entrée dans l’ensemble Forum et Palatin.","lat":41.88788,"lon":12.48565,"n":2},{"title":"L’arc de Titus","text":"Arrêtez-vous sous l'arc de Titus, au sommet de la voie qui descend vers le Forum. Il fut élevé après la mort de l'empereur Titus, à la fin du premier siècle. Il commémore notamment la victoire romaine en Judée et la prise de Jérusalem en l'an 70. Regardez les reliefs à l'intérieur du passage. Sur l'un d'eux, des soldats portent le butin du Temple de Jérusalem, dont la grande menorah à sept branches. Sur l'autre, Titus apparaît sur un char de triomphe, accompagné de figures symboliques.\n\nCet arc ne servait pas de porte défensive. C'était un monument de mémoire et de propagande. Il transformait un événement militaire en récit officiel, visible par tous ceux qui empruntaient la voie Sacrée. Le triomphe romain était une cérémonie spectaculaire : le général victorieux traversait la ville avec ses soldats, ses prisonniers et son butin, avant de rejoindre le Capitole.\n\nObservez aussi l'inscription monumentale tournée vers le Colisée. Elle rappelle que le Sénat et le peuple romain dédièrent l'arc au divin Titus. Le mot divin indique qu'il avait été divinisé après sa mort. En continuant vers le Forum, retournez-vous un instant. L'arc encadre le Colisée comme une image : deux monuments de la dynastie flavienne se répondent à près de deux mille ans de distance.","lat":41.8907044,"lon":12.4885842,"n":3},{"title":"La maison des Vestales","text":"Vous êtes devant l'un des lieux les plus singuliers de la Rome antique : la maison des Vestales. Ces prêtresses entretenaient dans le temple voisin le feu sacré de Vesta, symbole de la continuité de Rome. Six Vestales étaient choisies très jeunes dans les familles patriciennes. Leur service durait trente ans : dix années d'apprentissage, dix de service complet et dix consacrées à transmettre leur savoir.\n\nLeur statut était exceptionnel. Elles disposaient de privilèges rares pour des femmes romaines : elles géraient leurs biens, bénéficiaient de places d'honneur et pouvaient intervenir en faveur de condamnés. Mais leur discipline était extrêmement sévère. Laisser s'éteindre le feu sacré était une faute grave. Rompre le vœu de chasteté exposait à une mort rituelle, car le sang d'une Vestale ne devait pas être versé directement.\n\nRegardez la longue cour centrale, autrefois agrémentée de bassins, puis les socles et statues de grandes Vestales. Les pièces d'habitation, les espaces de réception et les installations domestiques rappellent qu'il s'agissait à la fois d'une résidence et d'une institution religieuse. Fermez un instant les yeux et imaginez le bruit de l'eau, les pas sur les portiques et le feu entretenu jour et nuit. Ici, la religion romaine n'était pas séparée de la politique : préserver la flamme revenait symboliquement à préserver l'État.","lat":41.8914083,"lon":12.4866391,"n":4},{"title":"Le temple de Saturne","text":"Les huit colonnes que vous voyez appartiennent au temple de Saturne, l'un des monuments les plus anciens du Forum. Le sanctuaire fut plusieurs fois reconstruit, et les vestiges actuels datent surtout de l'Antiquité tardive. Saturne était associé à l'âge d'or, à l'agriculture et à l'abondance. Son temple abritait aussi le trésor public de Rome, l'aerarium. Voilà pourquoi un édifice religieux occupait une place centrale dans la vie financière de la République.\n\nChaque mois de décembre, les Saturnales bouleversaient temporairement l'ordre social. On échangeait des cadeaux, on organisait des banquets et les rôles entre maîtres et esclaves pouvaient être symboliquement inversés. L'atmosphère était si libre que les auteurs antiques en parlent comme d'une parenthèse dans les règles ordinaires.\n\nDepuis ce point, regardez autour de vous. Vous êtes au pied du Capitole, à proximité de la tribune des orateurs et des grands édifices civiques. Le Forum n'était pas une place parfaitement ordonnée : c'était un paysage construit pendant des siècles, où temples, basiliques, arcs et monuments commémoratifs se superposaient. Le temple de Saturne résume bien cette Rome où religion, argent et pouvoir politique ne formaient qu'un seul système.","lat":41.8925403,"lon":12.4842589,"n":5},{"title":"Le Capitole, vue extérieure","text":"Vous êtes sur la place du Capitole, redessinée à partir du seizième siècle selon un projet de Michel-Ange. Remarquez un détail essentiel : la place tourne le dos au Forum antique et s'ouvre vers la ville moderne et le Vatican. Ce changement d'orientation traduit le passage de la Rome antique à la Rome pontificale.\n\nAu centre se trouve une copie de la statue équestre de Marc Aurèle ; l'original est conservé dans les musées. La statue a survécu au Moyen Âge parce qu'on la croyait alors associée à l'empereur chrétien Constantin. Regardez le pavement en étoile, les façades ordonnées et le grand escalier d'accès, la Cordonata. Tout est conçu pour transformer une colline irrégulière en scène cérémonielle.\n\nLes musées du Capitole occupent les palais qui bordent la place. Leur origine remonte à la donation d'un ensemble de bronzes antiques au peuple romain en 1471, ce qui en fait l'une des plus anciennes collections publiques du monde. Même sans tout visiter, retenez que le Capitole fut successivement le centre religieux de la Rome antique, un symbole civique médiéval et une grande composition de la Renaissance.","lat":41.8929428,"lon":12.4825577,"n":6},{"title":"Le théâtre de Marcellus","text":"Devant vous se dresse le théâtre de Marcellus, commencé sous Jules César et inauguré par Auguste. Il porte le nom de Marcellus, neveu et gendre d'Auguste, mort très jeune. À première vue, sa façade peut rappeler le Colisée, mais ce monument est plus ancien et sa forme est différente : un théâtre romain est un demi-cercle, alors qu'un amphithéâtre est une ellipse complète.\n\nLes spectateurs regardaient des pièces, des spectacles musicaux et des cérémonies. La façade associait des arcades à différents ordres architecturaux. Au fil des siècles, le bâtiment changea totalement de fonction. Il devint forteresse, puis palais. Regardez les étages supérieurs : ils appartiennent à des aménagements résidentiels construits au-dessus des structures antiques. C'est un exemple spectaculaire de réutilisation plutôt que de disparition.\n\nÀ proximité, le portique d'Octavie rappelle que ce secteur était autrefois un vaste ensemble monumental. Plus tard, il fut intégré au quartier juif de Rome. En quelques pas, vous pouvez donc lire plusieurs villes superposées : la Rome d'Auguste, la ville médiévale fortifiée, les palais aristocratiques et la Rome contemporaine.","lat":41.8919308,"lon":12.4799083,"n":7},{"title":"Le portique d’Octavie","text":"Le portique d’Octavie fut consacré par Auguste à sa sœur. Ses vestiges ont traversé deux mille ans de changements et se trouvent aujourd’hui au cœur de l’ancien quartier juif. Ici, histoire de Rome antique et histoire des habitants de Rome se rejoignent. Giggetto se situe tout près si vous choisissez d’y déjeuner ; prenez le temps de regarder le monument avant de poursuivre vers l’île Tibérine.","lat":41.89202,"lon":12.47843,"n":8}]},{"id":"mercredi","name":"Mercredi 28 - Marchés, Panthéon, château","color":"#7747ae","stops":[{"title":"Les marchés de Trajan · 9 h 30","text":"Cet ensemble à étages épouse la pente de la colline du Quirinal. Son nom de marchés évoque des boutiques, mais les chercheurs débattent des fonctions exactes de ses différents espaces : commerces, administrations et services y ont probablement coexisté. Observez les voûtes en briques et la grande rue intérieure, la Via Biberatica. À travers les ouvertures, replacer ces bâtiments face au forum de Trajan permet de mesurer l’ampleur du projet impérial. Vous avez un billet pour neuf heures trente ; explorez les lieux comme un morceau de ville ancienne, sans obligation de vous attarder devant chaque vitrine.","lat":41.8967,"lon":12.486,"n":1},{"title":"La colonne de Trajan","text":"Levez les yeux vers la colonne de Trajan. Haute d'environ trente mètres pour son fût, elle fut inaugurée au début du deuxième siècle et raconte les guerres menées par l'empereur contre les Daces, dans l'actuelle Roumanie. Une frise sculptée s'enroule autour du monument comme un rouleau de pierre. Si on la déroulait, elle mesurerait près de deux cents mètres.\n\nTrajan apparaît de nombreuses fois, mais le récit ne montre pas seulement les batailles. On voit les soldats construire des camps, franchir des fleuves, bâtir des ponts, négocier et accomplir des cérémonies. L'armée romaine est présentée comme une force disciplinée, organisée et presque invincible. Les scènes étaient probablement peintes, ce qui les rendait beaucoup plus lisibles qu'aujourd'hui.\n\nÀ l'intérieur, un escalier en spirale monte jusqu'au sommet. La base accueillait les cendres de Trajan et de son épouse Plotine. La statue actuelle de saint Pierre a remplacé au seizième siècle celle de l'empereur. Observez aussi le niveau du sol : la colonne indiquait symboliquement la hauteur de la colline qui avait été excavée pour aménager le forum de Trajan. C'est donc à la fois un récit militaire, un tombeau impérial et un repère des gigantesques travaux urbains.","lat":41.895833,"lon":12.484299,"n":2},{"title":"Largo di Torre Argentina","text":"Depuis le bord de la place, regardez en contrebas les quatre temples républicains. Ils sont désignés par les lettres A, B, C et D, car leurs dédicaces ne sont pas toutes connues avec certitude. Ces sanctuaires sont antérieurs à une grande partie des monuments impériaux visités le premier jour. Le niveau antique se trouve plusieurs mètres sous la ville actuelle, ce qui montre combien Rome s'est élevée au fil des siècles.\n\nLe lieu est surtout associé à la mort de Jules César. Il ne fut pas assassiné exactement au milieu des temples, mais dans la curie de Pompée, qui appartenait au grand complexe voisin. Le 15 mars de l'an 44 avant notre ère, un groupe de sénateurs le frappa de plusieurs coups de poignard. Cet événement déclencha une nouvelle période de guerres civiles et favorisa finalement l'ascension d'Octave, le futur Auguste.\n\nLe site est aussi célèbre pour ses chats, pris en charge depuis longtemps par une association installée à proximité des ruines. Ce contraste entre un épisode majeur de l'histoire politique et la vie quotidienne des animaux donne au lieu une atmosphère très romaine : ici, l'Antiquité n'est jamais totalement séparée du présent.","lat":41.8960403,"lon":12.4768916,"n":3},{"title":"Le Panthéon · 12 h","text":"Placez-vous d'abord sur la place pour observer le portique du Panthéon. L'inscription attribue le monument à Agrippa, proche d'Auguste, mais l'édifice actuel date principalement du règne d'Hadrien, au deuxième siècle. Il a conservé le nom et la dédicace du bâtiment antérieur.\n\nEntrez et laissez votre regard monter vers la coupole. Son diamètre est presque égal à la hauteur intérieure, ce qui donne l'impression d'être dans une sphère parfaite. Au centre, l'oculus de neuf mètres environ est la seule grande source de lumière naturelle. Il est ouvert : lorsqu'il pleut, l'eau tombe réellement à l'intérieur et s'écoule grâce à de petits drains dans le sol. Les caissons de la coupole allègent la structure, tandis que le béton devient progressivement plus léger en montant.\n\nLe Panthéon a été remarquablement préservé parce qu'il fut transformé en église au début du septième siècle. Il abrite notamment les tombeaux de Raphaël et de plusieurs rois d'Italie. Regardez les marbres colorés du sol et des parois, puis la lumière qui se déplace avec le soleil. Plus qu'un simple exploit technique, l'édifice met en scène une image du cosmos : la coupole évoque la voûte céleste et l'oculus ouvre le bâtiment vers le ciel.","lat":41.8986108,"lon":12.4768729,"n":4},{"title":"Piazza Navona · selon le temps disponible","text":"Regardez la forme très allongée de la place : elle conserve exactement le plan du stade de Domitien, construit au premier siècle pour des compétitions athlétiques. Les immeubles actuels ont pris place sur les anciennes tribunes, ce qui explique les courbes des extrémités.\n\nAu centre, la fontaine des Quatre-Fleuves fut réalisée par le Bernin au dix-septième siècle. Les quatre figures personnifient de grands fleuves associés aux continents alors connus des Européens : le Danube, le Gange, le Nil et le Rio de la Plata. Au-dessus s'élève un obélisque antique réutilisé dans une composition baroque spectaculaire. En face, la façade de l'église Sainte-Agnès-en-Agone est liée notamment à Borromini, souvent présenté comme le grand rival du Bernin.\n\nUne légende raconte que l'une des statues détourne son regard de l'église par peur qu'elle ne s'effondre. L'histoire est amusante mais impossible : la fontaine fut achevée avant la façade actuelle. La place rappelle ainsi que Rome adore transformer les rivalités artistiques en anecdotes. Faites lentement le tour de la fontaine pour voir comment l'eau, les rochers, les animaux et les figures créent un théâtre de pierre au cœur de la ville.","lat":41.8991328,"lon":12.4732921,"n":5},{"title":"Le château Saint-Ange · 15 h","text":"Le château Saint-Ange était à l'origine le mausolée de l'empereur Hadrien, construit au deuxième siècle. Imaginez-le couvert de marbre, surmonté de statues et relié à la ville par un pont monumental. Au Moyen Âge, sa position près du Tibre et du Vatican en fit une forteresse idéale.\n\nLe bâtiment fut intégré aux défenses pontificales et relié au Vatican par le Passetto di Borgo, un passage surélevé permettant au pape de se réfugier dans le château. Lors du sac de Rome de 1527, le pape Clément VII l'emprunta pour échapper aux troupes impériales. Le monument servit aussi de prison et de résidence.\n\nSon nom vient d'une tradition selon laquelle l'archange Michel serait apparu au sommet, rengainant son épée pour annoncer la fin d'une épidémie. La statue de l'ange rappelle cette histoire. Depuis le pont, observez la masse cylindrique du mausolée enveloppée par les fortifications. Peu de monuments résument aussi clairement les transformations de Rome : tombeau impérial, forteresse médiévale, refuge des papes, prison puis musée.","lat":41.9030632,"lon":12.466276,"n":6},{"title":"La place Saint-Pierre, vue extérieure","text":"Restez au centre de la place et regardez les deux grandes colonnades dessinées par le Bernin au dix-septième siècle. Elles forment comme deux bras ouverts, image voulue d'une Église accueillant les fidèles. Les quatre rangées de colonnes créent un effet spectaculaire. Cherchez au sol l'un des disques marquant le centre géométrique d'une colonnade : placé dessus, vous verrez les quatre rangées s'aligner et donner l'impression de n'en former qu'une seule.\n\nL'obélisque au centre est antique. Il fut transporté d'Égypte à Rome et se trouvait autrefois dans le cirque de Néron. Son déplacement jusqu'à la place actuelle, au seizième siècle, fut une prouesse technique. Les deux fontaines équilibrent la composition et accompagnent le mouvement de la colonnade.\n\nLa façade de la basilique est l'œuvre de Carlo Maderno. Depuis certains points de la place, la coupole de Michel-Ange paraît partiellement masquée par cette façade, conséquence des transformations successives du projet. Sans entrer dans le Vatican, vous pouvez déjà lire la place comme une immense scène : l'architecture organise les foules, cadre les cérémonies et conduit naturellement le regard vers le balcon central et la basilique.","lat":41.9022225,"lon":12.4567283,"n":7}]},{"id":"soir","name":"Un soir - La fontaine de Trevi","color":"#a26516","stops":[{"title":"La fontaine de Trevi","text":"La fontaine de Trevi occupe la façade du palais Poli. Au centre, l’Océan se tient sur son char ; les chevaux marins et les cascades transforment la petite place en scène de théâtre. Le monument célèbre l’arrivée de l’eau par l’aqueduc de l’Aqua Virgo, commencé dans l’Antiquité. Regardez comment l’architecture semble surgir de la roche. De nuit, la lumière rend la façade particulièrement spectaculaire. Depuis deux mille vingt-six, l’accès à la zone basse près de l’eau coûte deux euros pour les visiteurs non résidents pendant les horaires de visite, avec dernier accès à vingt et une heures ; depuis la place, la fontaine reste visible gratuitement, y compris après vingt-deux heures. Le lundi vingt-six octobre, l’accès au périmètre intérieur ne commence exceptionnellement qu’à quatorze heures.","lat":41.90092,"lon":12.48333,"n":1}]}];
const IMMERSIVE=[{"title":"1. Devant le Colisée","cues":[{"text":"Prenez quelques secondes pour regarder le Colisée dans son ensemble.","pause":750,"fx":null,"afterFx":0},{"text":"Oui…","pause":950,"fx":null,"afterFx":0},{"text":"Même après près de deux mille ans, il sait encore faire son petit effet.","pause":700,"fx":null,"afterFx":0},{"text":"Son vrai nom est l’amphithéâtre Flavien.","pause":650,"fx":null,"afterFx":0},{"text":"Le nom « Colisée » est venu plus tard, probablement à cause d’une immense statue de Néron qui se dressait autrefois tout près d’ici.","pause":750,"fx":null,"afterFx":0},{"text":"La construction commence sous l’empereur Vespasien, vers l’an soixante-dix de notre ère.","pause":650,"fx":null,"afterFx":0},{"text":"Le bâtiment est inauguré par son fils Titus, en l’an quatre-vingts.","pause":300,"fx":"fanfare","afterFx":650},{"text":"À l’époque, vous n’auriez pas vu cette pierre beige un peu romantique.","pause":650,"fx":null,"afterFx":0},{"text":"Une grande partie de la façade était recouverte de travertin clair.","pause":600,"fx":null,"afterFx":0},{"text":"Des statues occupaient les arcades, et du marbre décorait l’intérieur.","pause":750,"fx":null,"afterFx":0},{"text":"Bref…","pause":950,"fx":null,"afterFx":0},{"text":"Beaucoup moins « ruine antique ».","pause":650,"fx":null,"afterFx":0},{"text":"Beaucoup plus « vitrine impériale flambant neuve ».","pause":750,"fx":null,"afterFx":0},{"text":"Regardez maintenant les différents étages.","pause":650,"fx":null,"afterFx":0},{"text":"Les trois premiers niveaux sont formés de grandes arcades.","pause":600,"fx":null,"afterFx":0},{"text":"Les architectes ont superposé plusieurs styles de colonnes, du plus simple au plus décoré.","pause":700,"fx":null,"afterFx":0},{"text":"Les Romains avaient donc déjà compris qu’un bâtiment de plusieurs étages pouvait être fonctionnel…","pause":1000,"fx":null,"afterFx":0},{"text":"Sans ressembler à un parking.","pause":750,"fx":null,"afterFx":0},{"text":"Le Colisée pouvait accueillir des dizaines de milliers de spectateurs.","pause":300,"fx":"crowd_big","afterFx":600},{"text":"Et tout ce monde n’entrait pas par une seule porte.","pause":650,"fx":null,"afterFx":0},{"text":"Il existait de nombreuses entrées numérotées, reliées à un réseau de couloirs et d’escaliers.","pause":650,"fx":null,"afterFx":0},{"text":"Un système vieux de près de deux mille ans…","pause":1000,"fx":null,"afterFx":0},{"text":"Que nos grands stades utilisent encore aujourd’hui.","pause":850,"fx":null,"afterFx":0}]},{"title":"2. En entrant","cues":[{"text":"Une fois à l’intérieur, regardez la pente des gradins.","pause":700,"fx":null,"afterFx":0},{"text":"Dans la Rome antique, votre place dépendait directement de votre position dans la société.","pause":700,"fx":null,"afterFx":0},{"text":"Les sénateurs et les personnages les plus importants étaient installés tout près de l’arène.","pause":650,"fx":null,"afterFx":0},{"text":"Plus on montait, plus on descendait dans l’échelle sociale.","pause":750,"fx":null,"afterFx":0},{"text":"Les spectateurs disposaient de billets ou de jetons indiquant leur entrée et leur secteur.","pause":650,"fx":null,"afterFx":0},{"text":"Imaginez donc des dizaines de milliers de Romains circulant dans les couloirs, chacun à la recherche de sa place.","pause":300,"fx":"steps_crowd","afterFx":550},{"text":"Et, statistiquement, il devait déjà y avoir quelqu’un pour dire : « Je suis sûr que c’est par là. »","pause":800,"fx":null,"afterFx":0},{"text":"Alors que non.","pause":850,"fx":null,"afterFx":0},{"text":"Le Colisée était conçu pour faire entrer, répartir puis faire sortir une foule considérable avec une efficacité remarquable.","pause":850,"fx":null,"afterFx":0}]},{"title":"3. Regardez l’arène","cues":[{"text":"Regardez maintenant le centre du Colisée.","pause":700,"fx":null,"afterFx":0},{"text":"Aujourd’hui, vous voyez une grande partie des structures souterraines.","pause":650,"fx":null,"afterFx":0},{"text":"Dans l’Antiquité, elles étaient presque entièrement cachées sous un plancher de bois recouvert de sable.","pause":700,"fx":null,"afterFx":0},{"text":"C’est d’ailleurs de ce sable que vient notre mot « arène ».","pause":700,"fx":null,"afterFx":0},{"text":"Le sable absorbait les liquides et pouvait être remplacé rapidement entre les spectacles.","pause":650,"fx":null,"afterFx":0},{"text":"Et, compte tenu du programme de certaines journées…","pause":1000,"fx":null,"afterFx":0},{"text":"Disons simplement que ce n’était pas un détail inutile.","pause":800,"fx":null,"afterFx":0},{"text":"Sous le plancher se trouvait l’hypogée.","pause":300,"fx":"gate","afterFx":550},{"text":"C’était l’immense espace technique du Colisée.","pause":650,"fx":null,"afterFx":0},{"text":"On y préparait les animaux, les décors, les accessoires et les combattants.","pause":700,"fx":null,"afterFx":0},{"text":"Le public, lui, ne devait voir que le résultat final.","pause":650,"fx":null,"afterFx":0},{"text":"Les coulisses restaient cachées.","pause":850,"fx":null,"afterFx":0}]},{"title":"4. Dans les souterrains","cues":[{"text":"Vous êtes maintenant dans l’une des parties les plus fascinantes du Colisée : les souterrains.","pause":800,"fx":null,"afterFx":0},{"text":"Imaginez cet endroit beaucoup plus sombre.","pause":750,"fx":null,"afterFx":0},{"text":"Au-dessus de votre tête se trouvait le plancher de l’arène.","pause":650,"fx":null,"afterFx":0},{"text":"Autour de vous circulaient les hommes chargés d’organiser les spectacles, mais aussi les animaux et les combattants qui attendaient leur entrée.","pause":750,"fx":null,"afterFx":0},{"text":"Des couloirs, des cages, des monte-charges et des trappes permettaient de faire apparaître hommes, animaux et décors directement dans l’arène.","pause":700,"fx":null,"afterFx":0},{"text":"À certains endroits, des plateformes étaient hissées grâce à des mécanismes actionnés par plusieurs hommes.","pause":700,"fx":null,"afterFx":0},{"text":"Imaginez maintenant la scène depuis les gradins.","pause":750,"fx":null,"afterFx":0},{"text":"Vous voyez seulement du sable.","pause":700,"fx":null,"afterFx":0},{"text":"Puis une trappe s’ouvre.","pause":250,"fx":"gate","afterFx":450},{"text":"Et soudain…","pause":950,"fx":null,"afterFx":0},{"text":"Un animal surgit.","pause":250,"fx":"roar","afterFx":600},{"text":"Effet garanti.","pause":750,"fx":null,"afterFx":0},{"text":"Pas d’écran géant.","pause":600,"fx":null,"afterFx":0},{"text":"Pas d’effets numériques.","pause":600,"fx":null,"afterFx":0},{"text":"Mais les Romains savaient déjà parfaitement fabriquer une entrée spectaculaire.","pause":800,"fx":null,"afterFx":0},{"text":"Les animaux pouvaient venir de très loin dans l’Empire.","pause":650,"fx":null,"afterFx":0},{"text":"Lions, léopards, ours, sangliers, autruches et bien d’autres espèces.","pause":800,"fx":null,"afterFx":0},{"text":"Faire arriver ici un animal exotique était aussi une démonstration de puissance.","pause":700,"fx":null,"afterFx":0},{"text":"Le message était assez simple…","pause":1000,"fx":null,"afterFx":0},{"text":"Rome peut aller le chercher très loin…","pause":1000,"fx":null,"afterFx":0},{"text":"Et vous le montrer ici.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. Les gladiateurs","cues":[{"text":"Parlons maintenant des stars du lieu : les gladiateurs.","pause":300,"fx":"swords","afterFx":500},{"text":"Première idée à oublier.","pause":750,"fx":null,"afterFx":0},{"text":"Un combat de gladiateurs ne se terminait pas systématiquement par la mort de l’un des deux hommes.","pause":700,"fx":null,"afterFx":0},{"text":"Former un bon gladiateur demandait du temps et coûtait cher.","pause":650,"fx":null,"afterFx":0},{"text":"Le perdre à chaque spectacle aurait été une assez mauvaise politique de gestion.","pause":800,"fx":null,"afterFx":0},{"text":"Les gladiateurs étaient entraînés dans des écoles spécialisées.","pause":650,"fx":null,"afterFx":0},{"text":"La plus célèbre de Rome se trouvait juste à côté du Colisée : le Ludus Magnus.","pause":750,"fx":null,"afterFx":0},{"text":"Il existait plusieurs catégories de combattants, avec des armes et des protections différentes.","pause":650,"fx":null,"afterFx":0},{"text":"Certains portaient un grand bouclier.","pause":600,"fx":null,"afterFx":0},{"text":"D’autres combattaient plus légèrement.","pause":600,"fx":null,"afterFx":0},{"text":"Certains utilisaient même un filet et un trident.","pause":700,"fx":null,"afterFx":0},{"text":"Les affrontements étaient organisés de manière à opposer des styles différents.","pause":650,"fx":null,"afterFx":0},{"text":"Le but était bien sûr de gagner.","pause":600,"fx":null,"afterFx":0},{"text":"Mais il fallait surtout offrir un bon spectacle.","pause":750,"fx":null,"afterFx":0},{"text":"Certains gladiateurs devenaient extrêmement populaires.","pause":650,"fx":null,"afterFx":0},{"text":"Leur nom pouvait être gravé sur les murs, et le public avait ses favoris.","pause":700,"fx":null,"afterFx":0},{"text":"Les champions, les supporters, la célébrité…","pause":1000,"fx":null,"afterFx":0},{"text":"Finalement, nous n’avons pas tout inventé.","pause":650,"fx":null,"afterFx":0},{"text":"Nous avons surtout remplacé le glaive par le maillot.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. Sur l’arène","cues":[{"text":"Si vous avez accès au plancher de l’arène, avancez de quelques mètres.","pause":750,"fx":null,"afterFx":0},{"text":"Puis arrêtez-vous.","pause":700,"fx":null,"afterFx":0},{"text":"Et regardez autour de vous.","pause":800,"fx":null,"afterFx":0},{"text":"Essayez maintenant d’oublier les ruines.","pause":750,"fx":null,"afterFx":0},{"text":"Imaginez les gradins entièrement reconstruits.","pause":650,"fx":null,"afterFx":0},{"text":"Des dizaines de milliers de personnes.","pause":250,"fx":"crowd_big","afterFx":500},{"text":"Le bruit.","pause":600,"fx":null,"afterFx":0},{"text":"Les cris.","pause":600,"fx":null,"afterFx":0},{"text":"La chaleur.","pause":700,"fx":null,"afterFx":0},{"text":"Et vous…","pause":1000,"fx":null,"afterFx":0},{"text":"Au milieu.","pause":900,"fx":null,"afterFx":0},{"text":"Vu depuis les gradins, le Colisée est impressionnant.","pause":650,"fx":null,"afterFx":0},{"text":"Vu depuis l’arène, il devient beaucoup plus intimidant.","pause":800,"fx":null,"afterFx":0},{"text":"Les spectateurs dominaient littéralement la scène.","pause":650,"fx":null,"afterFx":0},{"text":"Au-dessus d’eux, une immense toile appelée le velum pouvait protéger une partie du public du soleil.","pause":250,"fx":"wind","afterFx":500},{"text":"Elle était fixée à des mâts installés au sommet du bâtiment et manipulée par des équipes spécialisées, probablement avec l’aide de marins habitués aux cordages.","pause":750,"fx":null,"afterFx":0},{"text":"Imaginez un parasol assez grand pour couvrir une partie du Colisée.","pause":700,"fx":null,"afterFx":0},{"text":"Puis imaginez devoir le replier correctement.","pause":750,"fx":null,"afterFx":0},{"text":"On comprend assez vite pourquoi il fallait des professionnels.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. Les spectacles","cues":[{"text":"Les combats de gladiateurs ne représentaient qu’une partie du programme.","pause":700,"fx":null,"afterFx":0},{"text":"Le public pouvait également assister à de grandes chasses avec des animaux sauvages.","pause":250,"fx":"roar","afterFx":500},{"text":"Des chasseurs spécialisés affrontaient certaines de ces bêtes dans l’arène.","pause":700,"fx":null,"afterFx":0},{"text":"Il y avait aussi des exécutions publiques.","pause":700,"fx":null,"afterFx":0},{"text":"Certaines pouvaient être mises en scène comme de véritables spectacles, parfois inspirés de récits mythologiques.","pause":750,"fx":null,"afterFx":0},{"text":"Aujourd’hui, cette violence nous paraît évidemment difficile à concevoir comme un divertissement.","pause":800,"fx":null,"afterFx":0},{"text":"Mais pour comprendre le Colisée, il faut aussi comprendre ce qu’il représentait pour la société romaine.","pause":700,"fx":null,"afterFx":0},{"text":"Ces spectacles mettaient en scène l’ordre du monde romain.","pause":650,"fx":null,"afterFx":0},{"text":"La puissance de l’empereur.","pause":600,"fx":null,"afterFx":0},{"text":"La domination de Rome sur ses territoires.","pause":600,"fx":null,"afterFx":0},{"text":"La victoire.","pause":550,"fx":null,"afterFx":0},{"text":"La discipline.","pause":550,"fx":null,"afterFx":0},{"text":"Et parfois la mort.","pause":250,"fx":"drum","afterFx":650},{"text":"Le Colisée était donc beaucoup plus qu’un stade.","pause":700,"fx":null,"afterFx":0},{"text":"C’était à la fois un lieu de spectacle, un théâtre politique et une gigantesque vitrine de la puissance impériale.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. L’empereur entre en scène","cues":[{"text":"Cherchez maintenant la zone où se trouvait la tribune impériale.","pause":700,"fx":null,"afterFx":0},{"text":"Lorsque l’empereur assistait aux jeux, il ne venait pas simplement passer une bonne après-midi.","pause":700,"fx":null,"afterFx":0},{"text":"Sa présence faisait partie du spectacle.","pause":250,"fx":"fanfare","afterFx":500},{"text":"Offrir des jeux permettait au pouvoir de montrer sa générosité envers le peuple.","pause":650,"fx":null,"afterFx":0},{"text":"Les spectacles étaient généralement gratuits pour le public.","pause":650,"fx":null,"afterFx":0},{"text":"Mais, évidemment, quelqu’un les finançait.","pause":750,"fx":null,"afterFx":0},{"text":"Et celui qui les finançait ne manquait pas de rappeler à qui l’on devait cette magnifique journée de divertissement.","pause":700,"fx":null,"afterFx":0},{"text":"Communication politique, version Empire romain.","pause":750,"fx":null,"afterFx":0},{"text":"Pas de réseaux sociaux.","pause":700,"fx":null,"afterFx":0},{"text":"Mais des dizaines de milliers de personnes réunies au même endroit…","pause":300,"fx":"applause","afterFx":550},{"text":"Ce n’est déjà pas un mauvais taux d’engagement.","pause":900,"fx":null,"afterFx":0}]},{"title":"9. Avant de quitter le Colisée","cues":[{"text":"Avant de repartir, regardez une dernière fois l’ensemble du monument.","pause":750,"fx":null,"afterFx":0},{"text":"Essayez maintenant de ne plus voir seulement une ruine.","pause":750,"fx":null,"afterFx":0},{"text":"Imaginez les murs recouverts de marbre.","pause":600,"fx":null,"afterFx":0},{"text":"Les statues.","pause":500,"fx":null,"afterFx":0},{"text":"Les tissus.","pause":500,"fx":null,"afterFx":0},{"text":"Les gradins remplis.","pause":500,"fx":null,"afterFx":0},{"text":"Les vendeurs.","pause":500,"fx":null,"afterFx":0},{"text":"Les gardes.","pause":500,"fx":null,"afterFx":0},{"text":"Les animaux.","pause":500,"fx":null,"afterFx":0},{"text":"Les gladiateurs.","pause":700,"fx":null,"afterFx":0},{"text":"Et, sous l’arène, toute cette mécanique invisible qui faisait fonctionner le spectacle.","pause":800,"fx":null,"afterFx":0},{"text":"Le Colisée réunit deux choses que Rome maîtrisait particulièrement bien : l’ingénierie…","pause":1000,"fx":null,"afterFx":0},{"text":"Et la mise en scène.","pause":800,"fx":null,"afterFx":0},{"text":"C’est probablement ce qui le rend toujours aussi impressionnant aujourd’hui.","pause":700,"fx":null,"afterFx":0},{"text":"Près de deux mille ans plus tard, le bâtiment est partiellement détruit.","pause":650,"fx":null,"afterFx":0},{"text":"Le marbre a presque entièrement disparu.","pause":600,"fx":null,"afterFx":0},{"text":"Les gradins aussi.","pause":650,"fx":null,"afterFx":0},{"text":"Les empereurs, heureusement, ne posent plus de problème de circulation.","pause":850,"fx":null,"afterFx":0},{"text":"Mais le Colisée continue de remplir sa fonction la plus élémentaire.","pause":650,"fx":null,"afterFx":0},{"text":"Faire lever les yeux aux gens qui arrivent devant lui.","pause":750,"fx":null,"afterFx":0},{"text":"Et visiblement…","pause":1000,"fx":null,"afterFx":0},{"text":"Ça fonctionne encore très bien.","pause":300,"fx":"finale","afterFx":700},{"text":"Vous pouvez maintenant poursuivre vers l’arc de Constantin, juste à côté du Colisée.","pause":900,"fx":null,"afterFx":0}]}];
const SAN_CLEMENTE=[{"title":"1. Avant de descendre — commencez par lever les yeux","cues":[{"text":"Avant de filer vers les escaliers, prenez quelques secondes pour regarder la basilique actuelle.","pause":750,"fx":null,"afterFx":0},{"text":"Parce que le piège de San Clemente, c’est justement de vouloir descendre tout de suite.","pause":700,"fx":null,"afterFx":0},{"text":"Et ce serait dommage.","pause":800,"fx":null,"afterFx":0},{"text":"Vous êtes dans une basilique construite au début du douzième siècle.","pause":650,"fx":"church","afterFx":500},{"text":"Regardez le sol de marbre aux motifs géométriques, puis l’abside au fond de l’église.","pause":700,"fx":null,"afterFx":0},{"text":"La grande mosaïque est l’un des éléments les plus spectaculaires du lieu.","pause":650,"fx":null,"afterFx":0},{"text":"Mais regardez aussi la clôture de marbre qui encadre le chœur.","pause":650,"fx":null,"afterFx":0},{"text":"Elle a quelque chose de particulier…","pause":1000,"fx":null,"afterFx":0},{"text":"Elle est plus ancienne que l’église dans laquelle vous vous trouvez.","pause":750,"fx":null,"afterFx":0},{"text":"Une partie de ces marbres provient de la basilique précédente, située juste en dessous.","pause":700,"fx":null,"afterFx":0},{"text":"San Clemente annonce donc la couleur dès le départ.","pause":650,"fx":null,"afterFx":0},{"text":"Ici, rien ne disparaît vraiment.","pause":650,"fx":null,"afterFx":0},{"text":"On démonte.","pause":500,"fx":null,"afterFx":0},{"text":"On récupère.","pause":500,"fx":null,"afterFx":0},{"text":"On remplit.","pause":500,"fx":null,"afterFx":0},{"text":"On reconstruit dessus.","pause":700,"fx":null,"afterFx":0},{"text":"Bienvenue à Rome.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. Premier escalier — vous venez de perdre huit siècles","cues":[{"text":"Commencez maintenant à descendre.","pause":350,"fx":"stone_steps","afterFx":450},{"text":"Quelques marches seulement…","pause":1000,"fx":null,"afterFx":0},{"text":"Et vous venez de remonter près onzième siècle.","pause":700,"fx":null,"afterFx":0},{"text":"Cherchez notamment les scènes les mieux conservées.","pause":650,"fx":null,"afterFx":0},{"text":"L’une des plus célèbres raconte l’histoire de Sisinnius.","pause":650,"fx":null,"afterFx":0},{"text":"Et elle contient un détail délicieux.","pause":700,"fx":null,"afterFx":0},{"text":"Dans les inscriptions, les personnages ne s’expriment plus seulement dans le latin solennel des monuments.","pause":700,"fx":null,"afterFx":0},{"text":"On voit apparaître une forme très ancienne d’italien parlé.","pause":700,"fx":null,"afterFx":0},{"text":"Et ce premier italien écrit n’est pas exactement une déclaration d’amour.","pause":750,"fx":null,"afterFx":0},{"text":"Il contient des ordres assez grossiers lancés par un personnage particulièrement énervé.","pause":750,"fx":null,"afterFx":0},{"text":"Plusieurs siècles d’histoire religieuse…","pause":1000,"fx":null,"afterFx":0},{"text":"Et même ici, quelqu’un finit par perdre patience.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. Saint Cyrille — Rome rencontre le monde slave","cues":[{"text":"Dans cette ancienne basilique se trouve également un lieu important pour de nombreux visiteurs venus d’Europe centrale et orientale.","pause":750,"fx":null,"afterFx":0},{"text":"Il est associé à saint Cyrille.","pause":300,"fx":"bell","afterFx":500},{"text":"Cyrille et son frère Méthode furent missionnaires auprès des peuples slaves au neuvième siècle.","pause":700,"fx":null,"afterFx":0},{"text":"Cyrille mourut à Rome en huit cent soixante-neuf.","pause":700,"fx":null,"afterFx":0},{"text":"Une précision au passage.","pause":650,"fx":null,"afterFx":0},{"text":"On lui attribue traditionnellement la création de l’alphabet glagolitique, utilisé pour traduire les textes chrétiens en langue slave.","pause":750,"fx":null,"afterFx":0},{"text":"L’alphabet que nous appelons aujourd’hui cyrillique a été développé plus tard dans le milieu de ses disciples.","pause":750,"fx":null,"afterFx":0},{"text":"Son nom lui rend donc hommage, mais il ne l’a probablement pas dessiné lui-même.","pause":750,"fx":null,"afterFx":0},{"text":"Sous une église italienne se trouve ainsi aussi un morceau essentiel de l’histoire culturelle du monde slave.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. Deuxième descente — la Rome impériale","cues":[{"text":"Cherchez maintenant l’escalier qui descend encore.","pause":350,"fx":"stone_steps","afterFx":450},{"text":"Cette fois, le changement est beaucoup plus radical.","pause":750,"fx":null,"afterFx":0},{"text":"Vous quittez la Rome chrétienne.","pause":650,"fx":null,"afterFx":0},{"text":"Et vous arrivez dans la Rome impériale.","pause":300,"fx":"underground","afterFx":500},{"text":"Au premier siècle, le niveau du sol de ce quartier était beaucoup plus bas qu’aujourd’hui.","pause":700,"fx":null,"afterFx":0},{"text":"Les fouilles ont révélé ici des constructions romaines très anciennes, liées aux transformations du secteur après le grand incendie de Rome de l’an soixante-quatre.","pause":800,"fx":null,"afterFx":0},{"text":"Vous êtes désormais à un niveau proche de celui de la ville dans laquelle vivaient les contemporains de Néron.","pause":750,"fx":null,"afterFx":0},{"text":"Et regardez autour de vous.","pause":700,"fx":null,"afterFx":0},{"text":"Le décor change complètement.","pause":650,"fx":null,"afterFx":0},{"text":"Plus de grande nef.","pause":550,"fx":null,"afterFx":0},{"text":"Des couloirs.","pause":500,"fx":null,"afterFx":0},{"text":"Des pièces.","pause":500,"fx":null,"afterFx":0},{"text":"Des murs beaucoup plus anciens.","pause":700,"fx":null,"afterFx":0},{"text":"Vous venez de changer non seulement d’époque…","pause":1000,"fx":null,"afterFx":0},{"text":"Mais aussi de monde.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. Le mithraeum — un culte dans la pénombre","cues":[{"text":"Vous arrivez maintenant dans l’une des parties les plus étranges du complexe.","pause":750,"fx":null,"afterFx":0},{"text":"Cet espace appartenait à l’origine au niveau semi-enterré d’une maison romaine.","pause":700,"fx":null,"afterFx":0},{"text":"Vers la fin du deuxième siècle, une partie de ces pièces est transformée en mithraeum.","pause":750,"fx":null,"afterFx":0},{"text":"Un sanctuaire dédié au dieu Mithra.","pause":300,"fx":"underground","afterFx":500},{"text":"Regardez sa forme.","pause":650,"fx":null,"afterFx":0},{"text":"La pièce est longue, étroite, presque comme une petite salle à manger souterraine.","pause":700,"fx":null,"afterFx":0},{"text":"Le long des côtés se trouvaient des banquettes.","pause":650,"fx":null,"afterFx":0},{"text":"Les membres du culte pouvaient s’y installer pour partager des repas rituels.","pause":750,"fx":null,"afterFx":0},{"text":"Au centre, l’autel représente Mithra mettant à mort un taureau.","pause":750,"fx":null,"afterFx":0},{"text":"Le culte de Mithra reste encore partiellement mystérieux.","pause":700,"fx":null,"afterFx":0},{"text":"Il nous a laissé beaucoup d’images, mais peu de textes expliquant directement ses rites.","pause":750,"fx":null,"afterFx":0},{"text":"Imaginez maintenant cet espace sans éclairage moderne.","pause":750,"fx":null,"afterFx":0},{"text":"Quelques lampes à huile.","pause":600,"fx":null,"afterFx":0},{"text":"Un peu de fumée.","pause":600,"fx":null,"afterFx":0},{"text":"Des ombres sur les murs.","pause":700,"fx":null,"afterFx":0},{"text":"Nous sommes à quelques centaines de mètres du Colisée…","pause":1000,"fx":null,"afterFx":0},{"text":"Mais l’ambiance ne pourrait pas être plus différente.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. Traversez la ruelle — et changez encore de bâtiment","cues":[{"text":"En quittant la maison romaine, vous traversez ce qui était autrefois une petite rue.","pause":750,"fx":null,"afterFx":0},{"text":"Essayez de garder cela en tête.","pause":650,"fx":null,"afterFx":0},{"text":"Vous ne passez pas simplement d’une salle à une autre.","pause":700,"fx":null,"afterFx":0},{"text":"Vous traversez une rue de la Rome antique.","pause":750,"fx":"stone_steps","afterFx":450},{"text":"De l’autre côté se trouve un bâtiment très différent.","pause":650,"fx":null,"afterFx":0},{"text":"Les murs sont massifs.","pause":550,"fx":null,"afterFx":0},{"text":"De grands blocs de tuf.","pause":550,"fx":null,"afterFx":0},{"text":"Des pièces voûtées.","pause":650,"fx":null,"afterFx":0},{"text":"Un ensemble beaucoup plus fonctionnel que la maison que vous venez de quitter.","pause":750,"fx":null,"afterFx":0},{"text":"Les chercheurs ont proposé qu’il puisse avoir été lié à la Moneta, la monnaie impériale.","pause":700,"fx":null,"afterFx":0},{"text":"Mais cette identification reste une hypothèse, pas une certitude absolue.","pause":300,"fx":"metal","afterFx":500},{"text":"Et c’est justement intéressant.","pause":650,"fx":null,"afterFx":0},{"text":"L’archéologie ne consiste pas à regarder une vieille pierre et à déclarer immédiatement : bureau numéro douze de la Monnaie impériale.","pause":800,"fx":null,"afterFx":0},{"text":"On rassemble des indices.","pause":550,"fx":null,"afterFx":0},{"text":"On compare.","pause":550,"fx":null,"afterFx":0},{"text":"On propose une interprétation.","pause":650,"fx":null,"afterFx":0},{"text":"Et parfois, une nouvelle découverte oblige tout le monde à revoir sa copie.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. Écoutez — la ville antique coule encore sous vos pieds","cues":[{"text":"Avant de remonter, arrêtez-vous.","pause":750,"fx":null,"afterFx":0},{"text":"Et cette fois…","pause":1000,"fx":null,"afterFx":0},{"text":"Ne regardez rien.","pause":750,"fx":null,"afterFx":0},{"text":"Écoutez.","pause":250,"fx":"water","afterFx":700},{"text":"Dans les profondeurs de San Clemente, on entend encore l’eau circuler.","pause":750,"fx":null,"afterFx":0},{"text":"Lors des fouilles modernes, cette eau posait suffisamment de problèmes pour qu’un dispositif de drainage soit aménagé vers le secteur du Colisée.","pause":800,"fx":null,"afterFx":0},{"text":"C’est peut-être le détail qui résume le mieux toute la visite.","pause":750,"fx":null,"afterFx":0},{"text":"Au-dessus de vous : la basilique du douzième siècle.","pause":650,"fx":null,"afterFx":0},{"text":"Sous elle : la basilique du quatrième siècle.","pause":650,"fx":null,"afterFx":0},{"text":"Sous celle-ci : des bâtiments romains.","pause":650,"fx":null,"afterFx":0},{"text":"Et plus bas encore, les traces d’une ville antérieure aux grands réaménagements impériaux.","pause":800,"fx":null,"afterFx":0},{"text":"Rome n’est pas construite à côté de son passé.","pause":750,"fx":null,"afterFx":0},{"text":"Elle est construite dessus.","pause":800,"fx":null,"afterFx":0},{"text":"Maintenant, remontez.","pause":300,"fx":"stone_steps","afterFx":450},{"text":"Et comptez mentalement les siècles dans l’autre sens.","pause":700,"fx":null,"afterFx":0},{"text":"Rome impériale.","pause":550,"fx":null,"afterFx":0},{"text":"Rome chrétienne.","pause":550,"fx":null,"afterFx":0},{"text":"Rome médiévale.","pause":650,"fx":null,"afterFx":0},{"text":"Puis, quelques escaliers plus tard…","pause":1000,"fx":null,"afterFx":0},{"text":"Retour au vingt-et-unième siècle.","pause":750,"fx":null,"afterFx":0},{"text":"Avec, normalement, un peu moins de certitude sur ce que signifie réellement l’expression : niveau de la rue.","pause":300,"fx":"water","afterFx":700}]}];

function gain(v){const g=ctx.createGain();g.gain.value=v*Number($('fxvol').value||.55);g.connect(ctx.destination);return g}
function osc(f,d,v=.12,type='sine',when=0){const o=ctx.createOscillator(),g=gain(v);o.type=type;o.frequency.value=f;o.connect(g);const t=ctx.currentTime+when;g.gain.setValueAtTime(v*Number($('fxvol').value||.55),t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d);nodes.push(o)}
function noise(d,v=.1,low=900,when=0){const len=Math.floor(ctx.sampleRate*d),b=ctx.createBuffer(1,len,ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<len;i++)a[i]=Math.random()*2-1;const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=gain(v);f.type='lowpass';f.frequency.value=low;s.buffer=b;s.connect(f);f.connect(g);const t=ctx.currentTime+when;s.start(t);s.stop(t+d);nodes.push(s)}
async function fx(name,id){if(id!==runId)return;ensureCtx();stopFx();$('ambience').textContent='Ambiance sonore…';let d=1.5;
if(name==='fanfare'){d=2.1;[261,329,392,523].forEach((f,k)=>osc(f,.7,.10,'sawtooth',k*.32))}
else if(name==='crowd'||name==='crowd_big'){d=2;noise(d,name==='crowd_big'?.15:.10,1200);[115,155,205,260].forEach((f,k)=>osc(f,d,.016,'sine',k*.05))}
else if(name==='steps_crowd'){d=1.8;noise(d,.07,850);[.15,.45,.75,1.05,1.35].forEach(t=>osc(80,.1,.10,'sine',t))}
else if(name==='gate'){d=1.3;[.05,.38,.75].forEach((t,k)=>osc([620,430,300][k],.35,.15,'square',t))}
else if(name==='roar'){d=1.5;noise(d,.15,270);osc(62,d,.07,'sawtooth')}
else if(name==='swords'){d=1.1;[.08,.48].forEach(t=>{osc(1500,.2,.10,'square',t);osc(2400,.17,.07,'sine',t)})}
else if(name==='wind'){d=1.7;noise(d,.10,550)}
else if(name==='drum'){d=1.5;osc(70,.65,.17,'sine',.05);osc(58,.65,.15,'sine',.72)}
else if(name==='applause'){d=1.9;noise(d,.13,1800)}
else if(name==='finale'){d=2.2;noise(d,.09,1000);[261,329,392,523].forEach((f,k)=>osc(f,.6,.07,'sawtooth',1+k*.27))}
else if(name==='church'){d=2.0;[220,277,330].forEach((f,k)=>osc(f,1.65,.035,'sine',k*.08));osc(660,1.3,.022,'sine',.15)}
else if(name==='stone_steps'){d=1.6;[.12,.42,.72,1.02,1.32].forEach((t,k)=>osc(82-k*3,.13,.105,'sine',t))}
else if(name==='bell'){d=1.8;osc(440,1.55,.075,'sine',.02);osc(880,1.15,.035,'sine',.02);osc(1320,.85,.018,'sine',.02)}
else if(name==='underground'){d=1.8;noise(d,.055,300);osc(54,d,.022,'sine',0)}
else if(name==='metal'){d=1.25;[.08,.58].forEach(t=>{osc(980,.22,.08,'square',t);osc(1760,.18,.035,'sine',t)})}
else if(name==='water'){d=2.4;noise(d,.06,2400);[.22,.66,1.08,1.55,1.96].forEach((t,k)=>osc(1150+k*90,.09,.024,'sine',t))}
await sleep(d*1000);if(id===runId){stopFx();await sleep(120)}}
function speak(text,id){return new Promise(res=>{if(id!==runId)return res();const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=Number($('rate').value)||.96;const v=voices[Number($('voice').value)||0];if(v)u.voice=v;u.onend=res;u.onerror=res;synth.speak(u)})}
function chapterCount(){
 if(!flat.length)return 0;
 return Math.max(...flat.map(x=>x.si))+1;
}
function currentChapterIndex(){
 if(!flat.length)return 0;
 const safe=Math.min(idx,flat.length-1);
 return flat[safe]?.si??0;
}
function chapterStart(si){
 const n=flat.findIndex(x=>x.si===si);
 return n<0?0:n;
}
function update(){
 if(mode!=='immersive')return;
 const total=flat.length;
 const p=total?Math.round(idx/total*100):0;
 const chapters=chapterCount();
 const si=currentChapterIndex();
 $('bar').style.width=p+'%';
 $('pos').textContent='Chapitre '+Math.min(si+1,chapters)+' / '+chapters;
 $('pct').textContent=p+' %';
 if(idx<total){
   $('chapter').textContent=flat[idx].section;
   $('currentText').textContent=flat[idx].text;
 }
}
async function showChapterTransition(si,id){
 if(id!==runId||transitionShownFor===si)return;
 transitionShownFor=si;
 const chapters=chapterCount();
 const cue=flat[chapterStart(si)];
 if(!cue)return;
 const scene=document.querySelector('.scene');
 scene.classList.add('chapter-transition');
 $('chapter').textContent='Étape '+(si+1)+' sur '+chapters;
 $('currentText').textContent=cue.section;
 $('ambience').textContent='Nouvelle étape';
 await sleep(si===0?1200:2400);
 if(id!==runId)return;
 scene.classList.remove('chapter-transition');
 $('ambience').textContent='';
 update();
}
async function runImmersive(){
 if(running)return;
 ensureCtx();
 // Sur iPhone, la première synthèse doit partir directement du geste utilisateur.
 // On évite donc tout délai AVANT la première phrase de la session.
 try{synth.resume()}catch(e){}
 running=true;
 paused=false;
 $('playpause').textContent='Ⅱ';
 const id=runId;
 let firstCueOfSession=true;
 while(idx<flat.length&&id===runId){
   const c=flat[idx];
   if(c.ci===0){
     if(firstCueOfSession){
       // Le titre reste affiché à l'écran, mais on lance la voix immédiatement.
       transitionShownFor=c.si;
     }else{
       await showChapterTransition(c.si,id);
     }
   }
   if(id!==runId)break;
   update();
   await speak(c.text,id);
   firstCueOfSession=false;
   if(id!==runId)break;
   await sleep(c.pause||650);
   if(c.fx){
     await fx(c.fx,id);
     if(id!==runId)break;
     await sleep(c.afterFx||350);
   }
   idx++;
   if(idx<flat.length && flat[idx].si!==c.si){
     // Respiration supplémentaire avant l'écran de transition du chapitre suivant.
     await sleep(900);
   }
   update();
 }
 if(id===runId){
   running=false;
   $('playpause').textContent='▶︎';
   if(idx>=flat.length){
     $('chapter').textContent='Visite terminée';
     $('currentText').textContent=(currentStop&&currentStop.endText)||'Visite terminée.';
     $('pos').textContent='Terminé';
     $('pct').textContent='100 %';
     $('bar').style.width='100%';
   }
 }
}
function runNormal(){
 synth.cancel();ensureCtx();
 const u=new SpeechSynthesisUtterance(currentStop.text);
 u.lang='fr-FR';u.rate=Number($('rate').value)||.96;
 const v=voices[Number($('voice').value)||0];if(v)u.voice=v;
 running=true;$('playpause').textContent='Ⅱ';
 u.onend=()=>{running=false;$('playpause').textContent='▶︎';$('bar').style.width='100%'};
 synth.speak(u)
}
function stopAll(){
 runId++;
 synth.cancel();
 stopFx();
 running=false;
 paused=false;
 $('playpause').textContent='▶︎';
 const scene=document.querySelector('.scene');
 if(scene)scene.classList.remove('chapter-transition');
}
function toggle(){
 ensureCtx();
 if(running&&!paused){
   paused=true;
   synth.pause();
   $('playpause').textContent='▶︎';
   return;
 }
 if(running&&paused){
   paused=false;
   synth.resume();
   $('playpause').textContent='Ⅱ';
   return;
 }
 mode==='immersive'?runImmersive():runNormal()
}
function goChapter(delta){
 if(mode!=='immersive'||!flat.length)return;
 const wasPlaying=running&&!paused;
 const chapters=chapterCount();
 const current=currentChapterIndex();
 const target=Math.max(0,Math.min(chapters-1,current+delta));
 if(target===current && delta<0){
   // "Previous" at the first chapter simply restarts it.
   stopAll();
   idx=chapterStart(current);
   transitionShownFor=-1;
   update();
   if(wasPlaying)setTimeout(runImmersive,80);
   return;
 }
 if(target===current)return;
 stopAll();
 idx=chapterStart(target);
 transitionShownFor=-1;
 update();
 if(wasPlaying)setTimeout(runImmersive,80);
}
$('playpause').onclick=toggle;
$('prev').onclick=()=>goChapter(-1);
$('next').onclick=()=>goChapter(1);
</script>
</body></html>
