le joue ici le rôle de véhicule céleste.","pause":650,"fx":null,"afterFx":0},{"text":"Donc, en quelques mètres seulement, l’arc raconte deux choses.","pause":750,"fx":null,"afterFx":0},{"text":"En bas : l’empereur victorieux parmi les hommes.","pause":650,"fx":null,"afterFx":0},{"text":"Au-dessus : l’empereur devenu dieu.","pause":700,"fx":null,"afterFx":0},{"text":"C’est assez difficile de faire plus efficace en matière de communication politique.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. Un monument antique devenu forteresse médiévale","cues":[{"text":"L’Arc de Titus n’a pas toujours ressemblé à ce que vous voyez aujourd’hui.","pause":750,"fx":null,"afterFx":0},{"text":"Au Moyen Âge, il fut intégré aux fortifications de la puissante famille Frangipane.","pause":800,"fx":null,"afterFx":0},{"text":"Autrement dit, ce monument impérial devint un élément défensif.","pause":700,"fx":null,"afterFx":0},{"text":"Des constructions médiévales l’entouraient et l’emprisonnaient partiellement.","pause":750,"fx":null,"afterFx":0},{"text":"Cela a profondément modifié son apparence.","pause":650,"fx":null,"afterFx":0},{"text":"Mais paradoxalement, cette réutilisation a aussi contribué à sa conservation.","pause":800,"fx":null,"afterFx":0},{"text":"À Rome, être transformé en mur de château peut donc parfois constituer une stratégie de survie architecturale.","pause":850,"fx":null,"afterFx":450}]},{"title":"6. Le grand démontage — l’arc antique que vous voyez est aussi moderne","cues":[{"text":"Au début du dix-neuvième siècle, les bâtiments médiévaux autour de l’arc sont progressivement supprimés.","pause":800,"fx":null,"afterFx":0},{"text":"Entre les années dix-huit-cent-douze et dix-huit-cent-vingt-trois, l’arc est démonté puis reconstruit.","pause":850,"fx":null,"afterFx":0},{"text":"Les architectes Raffaele Stern puis Giuseppe Valadier dirigent l’intervention.","pause":750,"fx":null,"afterFx":0},{"text":"Les parties antiques sont conservées autant que possible.","pause":700,"fx":null,"afterFx":0},{"text":"Les éléments manquants sont complétés avec un matériau volontairement différent : du travertin.","pause":800,"fx":null,"afterFx":0},{"text":"Regardez bien.","pause":650,"fx":null,"afterFx":0},{"text":"Une partie de ce que vous prenez spontanément pour l’Arc de Titus antique appartient donc au grand chantier de restauration du dix-neuvième siècle.","pause":850,"fx":null,"afterFx":0},{"text":"Et c’est précisément ce qui rend cette restauration intéressante.","pause":700,"fx":null,"afterFx":0},{"text":"On complète le monument sans essayer de faire passer le neuf pour de l’ancien.","pause":800,"fx":null,"afterFx":0},{"text":"Avant de repartir, regardez une dernière fois l’ensemble.","pause":750,"fx":null,"afterFx":0},{"text":"Un triomphe romain.","pause":550,"fx":null,"afterFx":0},{"text":"Une catastrophe pour Jérusalem.","pause":550,"fx":null,"afterFx":0},{"text":"Une divinisation impériale.","pause":550,"fx":null,"afterFx":0},{"text":"Une forteresse médiévale.","pause":550,"fx":null,"afterFx":0},{"text":"Puis un laboratoire du restaurateur moderne.","pause":700,"fx":null,"afterFx":0},{"text":"Pas mal pour un monument que l’on traverse en quelques secondes.","pause":800,"fx":null,"afterFx":0},{"text":"Vous pouvez maintenant descendre la Via Sacra vers la Maison des Vestales.","pause":900,"fx":null,"afterFx":500}]}];
const VESTALES=[{"title":"1. Avant la maison — commencez par Vesta","cues":[{"text":"Avant d’entrer dans la Maison des Vestales, regardez d’abord le petit temple circulaire juste à côté.","pause":800,"fx":null,"afterFx":0},{"text":"C’est le temple de Vesta.","pause":700,"fx":null,"afterFx":0},{"text":"Sa forme ronde le distingue immédiatement des grands temples rectangulaires du Forum.","pause":750,"fx":null,"afterFx":0},{"text":"À l’intérieur brûlait le feu sacré de Rome.","pause":800,"fx":"fire_real","afterFx":450},{"text":"Ce feu symbolisait la continuité de la cité.","pause":700,"fx":null,"afterFx":0},{"text":"Tant qu’il brûlait, Rome continuait.","pause":750,"fx":null,"afterFx":0},{"text":"Et celles qui avaient la responsabilité de l’entretenir vivaient juste à côté.","pause":750,"fx":null,"afterFx":0},{"text":"Les Vestales n’étaient donc pas de simples prêtresses parmi d’autres.","pause":750,"fx":null,"afterFx":0},{"text":"Elles étaient liées à l’un des symboles les plus essentiels de l’État romain.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. Six jeunes filles choisies pour trente ans","cues":[{"text":"Le collège comptait normalement six Vestales.","pause":700,"fx":null,"afterFx":0},{"text":"Elles étaient choisies très jeunes, traditionnellement entre six et dix ans.","pause":750,"fx":null,"afterFx":0},{"text":"La sélection était placée sous l’autorité du grand pontife, le Pontifex Maximus.","pause":750,"fx":null,"afterFx":0},{"text":"Une fois choisie, la jeune fille quittait l’autorité juridique ordinaire de son père pour entrer dans une institution religieuse directement liée à l’État.","pause":850,"fx":null,"afterFx":0},{"text":"Son service durait trente ans.","pause":700,"fx":null,"afterFx":0},{"text":"La tradition romaine le divisait en trois périodes : dix ans pour apprendre, dix ans pour exercer pleinement, puis dix ans pour transmettre.","pause":850,"fx":null,"afterFx":0},{"text":"À la fin de ces trente années, une Vestale pouvait quitter le collège et même se marier.","pause":750,"fx":null,"afterFx":0},{"text":"Mais après avoir passé l’essentiel de sa vie adulte dans l’une des institutions les plus prestigieuses de Rome, le retour à une existence ordinaire devait être… assez relatif.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. Le feu sacré — une responsabilité quotidienne","cues":[{"text":"La mission la plus célèbre des Vestales était l’entretien du feu sacré.","pause":750,"fx":null,"afterFx":0},{"text":"Il devait rester allumé en permanence, sauf lors de son renouvellement rituel annuel.","pause":800,"fx":null,"afterFx":450},{"text":"S’il s’éteignait accidentellement, ce n’était pas simplement un problème de chauffage.","pause":750,"fx":null,"afterFx":0},{"text":"C’était un mauvais présage pour Rome.","pause":700,"fx":null,"afterFx":0},{"text":"La Vestale tenue pour responsable pouvait être punie.","pause":700,"fx":null,"afterFx":0},{"text":"Mais leur rôle ne se limitait pas au feu.","pause":650,"fx":null,"afterFx":0},{"text":"Elles participaient à de nombreuses cérémonies publiques et préparaient des substances rituelles utilisées dans les sacrifices.","pause":800,"fx":null,"afterFx":0},{"text":"Leur présence était donc intégrée à la vie religieuse de la cité tout entière.","pause":800,"fx":null,"afterFx":0},{"text":"À Rome, religion et politique ne formaient jamais vraiment deux mondes séparés.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. Des femmes avec des privilèges presque inimaginables à Rome","cues":[{"text":"Voici maintenant ce qui rend les Vestales particulièrement fascinantes.","pause":750,"fx":null,"afterFx":0},{"text":"Dans une société où la vie juridique des femmes était fortement encadrée, elles disposaient de privilèges exceptionnels.","pause":800,"fx":null,"afterFx":0},{"text":"Elles pouvaient posséder et administrer leurs biens.","pause":650,"fx":null,"afterFx":0},{"text":"Elles pouvaient faire un testament.","pause":650,"fx":null,"afterFx":0},{"text":"Elles occupaient des places d’honneur lors de certains spectacles et cérémonies.","pause":750,"fx":null,"afterFx":0},{"text":"Elles bénéficiaient aussi d’un prestige public immense.","pause":700,"fx":null,"afterFx":0},{"text":"Les auteurs antiques racontent même qu’un condamné rencontré fortuitement par une Vestale sur son chemin pouvait, dans certaines circonstances, être gracié.","pause":850,"fx":null,"afterFx":0},{"text":"Ce détail vient de la tradition antique et doit être pris comme tel.","pause":750,"fx":null,"afterFx":0},{"text":"Mais il montre bien jusqu’où pouvait aller le caractère sacré attaché à leur personne.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. Le prix de ce statut — une discipline extrême","cues":[{"text":"Ces privilèges avaient une contrepartie très lourde.","pause":750,"fx":null,"afterFx":0},{"text":"Pendant leur service, les Vestales devaient respecter un vœu de chasteté.","pause":750,"fx":null,"afterFx":0},{"text":"La violation de ce vœu était considérée comme une faute religieuse majeure, appelée incestum.","pause":800,"fx":null,"afterFx":0},{"text":"La peine traditionnelle était terrible.","pause":750,"fx":null,"afterFx":0},{"text":"La Vestale condamnée était enfermée vivante dans une chambre souterraine à l’extérieur de l’ancienne ville.","pause":850,"fx":null,"afterFx":0},{"text":"Le rituel évitait ainsi de verser directement le sang d’une personne considérée comme sacrée.","pause":800,"fx":null,"afterFx":0},{"text":"Les sources antiques racontent plusieurs procès de ce type.","pause":700,"fx":null,"afterFx":0},{"text":"Mais il faut rester prudent avec les récits les plus dramatiques : ils mêlent faits, tradition religieuse et mise en scène morale.","pause":850,"fx":null,"afterFx":0},{"text":"Ce qui est certain, c’est que le statut extraordinaire des Vestales reposait sur des obligations tout aussi extraordinaires.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. La Maison des Vestales — une résidence au cœur du Forum","cues":[{"text":"Regardez maintenant la grande cour allongée devant vous.","pause":750,"fx":null,"afterFx":0},{"text":"C’est le cœur de l’Atrium Vestae, la Maison des Vestales.","pause":750,"fx":null,"afterFx":0},{"text":"L’ensemble que vous voyez aujourd’hui résulte de plusieurs phases de reconstruction, notamment après les grands incendies qui ont touché le Forum.","pause":850,"fx":null,"afterFx":0},{"text":"La cour était bordée de portiques.","pause":650,"fx":null,"afterFx":0},{"text":"Elle comportait des bassins, des espaces de réception et des pièces d’habitation réparties autour.","pause":800,"fx":null,"afterFx":0},{"text":"Il ne faut donc pas imaginer un couvent au sens moderne.","pause":700,"fx":null,"afterFx":0},{"text":"C’était à la fois une résidence prestigieuse, un lieu de travail religieux et une institution publique.","pause":800,"fx":null,"afterFx":0},{"text":"Les Vestales vivaient littéralement au milieu du centre politique, judiciaire et religieux de Rome.","pause":850,"fx":null,"afterFx":500},{"text":"Le Forum était leur quartier quotidien.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. Les statues — le tableau d’honneur des Vestales","cues":[{"text":"Le long de la cour, regardez les socles et les statues.","pause":750,"fx":null,"afterFx":0},{"text":"Ils appartenaient au véritable tableau d’honneur de l’institution.","pause":750,"fx":null,"afterFx":0},{"text":"Plusieurs statues représentaient des Vestales maximales, c’est-à-dire les prêtresses placées à la tête du collège.","pause":800,"fx":null,"afterFx":0},{"text":"Les inscriptions indiquaient leur nom et leurs qualités.","pause":700,"fx":null,"afterFx":0},{"text":"Certaines ont été retrouvées incomplètes ou remaniées.","pause":700,"fx":null,"afterFx":0},{"text":"L’une des curiosités du lieu est justement l’existence d’un socle dont le nom a été volontairement effacé dans l’Antiquité tardive.","pause":850,"fx":null,"afterFx":0},{"text":"Les historiens ont proposé plusieurs identifications, sans certitude absolue.","pause":750,"fx":null,"afterFx":0},{"text":"C’est un bon exemple de ce que l’archéologie laisse parfois volontairement ouvert.","pause":750,"fx":null,"afterFx":0},{"text":"Un nom effacé peut être presque aussi intéressant qu’un nom parfaitement lisible.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. La fin des Vestales — quand Rome change de religion","cues":[{"text":"Le collège des Vestales a traversé une grande partie de l’histoire romaine.","pause":750,"fx":null,"afterFx":0},{"text":"Mais à la fin du quatrième siècle, l’Empire romain est en train de changer profondément.","pause":800,"fx":null,"afterFx":0},{"text":"Le christianisme devient la religion dominante du pouvoir impérial.","pause":750,"fx":null,"afterFx":0},{"text":"Les anciens cultes publics perdent progressivement leurs financements et leur statut.","pause":800,"fx":null,"afterFx":0},{"text":"Le collège des Vestales disparaît alors à la fin du quatrième siècle.","pause":800,"fx":null,"afterFx":0},{"text":"Le feu qui symbolisait depuis des siècles la continuité de Rome cesse d’être entretenu.","pause":850,"fx":null,"afterFx":600},{"text":"Et pourtant, le lieu reste au cœur de la ville.","pause":700,"fx":null,"afterFx":0},{"text":"Regardez une dernière fois la cour.","pause":700,"fx":null,"afterFx":0},{"text":"Pendant des siècles, six femmes y ont occupé une position presque unique dans la société romaine.","pause":800,"fx":null,"afterFx":0},{"text":"À la fois très libres…","pause":950,"fx":null,"afterFx":0},{"text":"Et extrêmement contraintes.","pause":800,"fx":null,"afterFx":0},{"text":"C’est probablement ce paradoxe qui rend encore aujourd’hui les Vestales aussi fascinantes.","pause":900,"fx":null,"afterFx":0},{"text":"Vous pouvez maintenant poursuivre vers le temple de Saturne et le reste du Forum.","pause":900,"fx":null,"afterFx":500}]}];
const SATURNE=[{"title":"1. Huit colonnes pour l’un des plus vieux sanctuaires du Forum","cues":[{"text":"Arrêtez-vous devant les huit grandes colonnes au pied du Capitole.","pause":750,"fx":null,"afterFx":0},{"text":"Vous êtes devant le Temple de Saturne.","pause":700,"fx":null,"afterFx":0},{"text":"C’est l’un des plus anciens lieux de culte du Forum romain.","pause":750,"fx":null,"afterFx":0},{"text":"La tradition place sa consécration dans les toutes premières années de la République.","pause":800,"fx":null,"afterFx":0},{"text":"La date exacte faisait déjà débat chez les auteurs antiques.","pause":750,"fx":null,"afterFx":0},{"text":"Ce qui est sûr, c’est que le sanctuaire était ancien bien avant que le Forum ne prenne l’aspect monumental que nous lui connaissons aujourd’hui.","pause":850,"fx":null,"afterFx":0},{"text":"Et les huit colonnes que vous voyez ne sont pas celles du premier temple.","pause":800,"fx":null,"afterFx":0},{"text":"Comme beaucoup de monuments romains, celui-ci a été reconstruit plusieurs fois.","pause":800,"fx":null,"afterFx":0},{"text":"À Rome, l’ancienneté ne signifie presque jamais qu’un bâtiment soit resté intact depuis son premier jour.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. Saturne — agriculture, abondance et âge d’or","cues":[{"text":"Saturne était un dieu ancien, étroitement lié à l’agriculture et aux semailles.","pause":750,"fx":null,"afterFx":0},{"text":"Les Romains l’associaient aussi à un âge d’or mythique.","pause":750,"fx":null,"afterFx":0},{"text":"Un temps idéal où l’humanité aurait vécu dans l’abondance, avant les grandes hiérarchies et les contraintes du monde ordinaire.","pause":850,"fx":null,"afterFx":0},{"text":"Cette idée est importante pour comprendre les Saturnales.","pause":700,"fx":null,"afterFx":0},{"text":"Pendant quelques jours, l’ordre social romain se relâchait symboliquement.","pause":800,"fx":null,"afterFx":0},{"text":"Comme si, chaque année, Rome essayait brièvement de rejouer ce monde ancien et plus libre attribué au règne de Saturne.","pause":850,"fx":null,"afterFx":0},{"text":"Ce temple n’était donc pas seulement consacré à un dieu agricole.","pause":750,"fx":null,"afterFx":0},{"text":"Il portait aussi avec lui l’image d’un passé mythique que les Romains aimaient réinventer.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. Le trésor public était ici","cues":[{"text":"Voici maintenant la particularité la plus surprenante du temple.","pause":750,"fx":null,"afterFx":0},{"text":"Il abritait l’Aerarium, le trésor public de l’État romain.","pause":800,"fx":null,"afterFx":450},{"text":"Autrement dit, une partie des finances de Rome était conservée dans un sanctuaire.","pause":800,"fx":null,"afterFx":0},{"text":"Cela peut sembler étrange avec nos catégories modernes.","pause":700,"fx":null,"afterFx":0},{"text":"Pour les Romains, cela l’était beaucoup moins.","pause":700,"fx":null,"afterFx":0},{"text":"Religion, droit et administration publique étaient profondément imbriqués.","pause":750,"fx":null,"afterFx":0},{"text":"Les fonds de l’État bénéficiaient ainsi de la protection matérielle du bâtiment…","pause":950,"fx":null,"afterFx":0},{"text":"Et de la protection symbolique du dieu.","pause":800,"fx":null,"afterFx":0},{"text":"Le temple a également été lié à la conservation et à la publication de documents publics.","pause":800,"fx":null,"afterFx":0},{"text":"En résumé : sanctuaire, archives et trésor public au même endroit.","pause":750,"fx":null,"afterFx":0},{"text":"Le ministère des Finances romain avait simplement une façade un peu plus impressionnante.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. La statue aux pieds attachés","cues":[{"text":"À l’intérieur se trouvait autrefois une grande statue de Saturne.","pause":750,"fx":null,"afterFx":0},{"text":"Et les sources antiques rapportent un détail étrange.","pause":750,"fx":null,"afterFx":0},{"text":"Les pieds du dieu étaient liés par des bandes de laine pendant l’année.","pause":800,"fx":null,"afterFx":0},{"text":"Puis, le jour de sa fête, ces liens étaient dénoués.","pause":750,"fx":null,"afterFx":450},{"text":"Le dieu était symboliquement libéré.","pause":700,"fx":null,"afterFx":0},{"text":"Et au même moment, la ville entrait dans la période des Saturnales.","pause":800,"fx":null,"afterFx":0},{"text":"On comprend facilement pourquoi ce geste a été associé à l’idée de liberté temporaire qui caractérisait la fête.","pause":800,"fx":null,"afterFx":0},{"text":"C’est l’un de ces petits détails rituels qui rendent la religion romaine beaucoup plus concrète.","pause":800,"fx":null,"afterFx":0},{"text":"Un dieu n’était pas seulement une idée.","pause":650,"fx":null,"afterFx":0},{"text":"On habillait son image, on la liait…","pause":950,"fx":null,"afterFx":0},{"text":"Puis on la libérait pour sa fête.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. Les Saturnales — quelques jours où Rome desserre sa cravate","cues":[{"text":"Les Saturnales commençaient le dix-sept décembre, jour de la dédicace du temple.","pause":800,"fx":"crowd_real","afterFx":450},{"text":"Avec le temps, les célébrations s’étendirent sur plusieurs jours.","pause":750,"fx":null,"afterFx":0},{"text":"On organisait des repas.","pause":600,"fx":null,"afterFx":0},{"text":"On échangeait de petits cadeaux.","pause":600,"fx":null,"afterFx":0},{"text":"Les jeux de hasard, normalement très encadrés, étaient plus largement tolérés.","pause":750,"fx":null,"afterFx":0},{"text":"Et surtout, les règles sociales habituelles semblaient momentanément se relâcher.","pause":800,"fx":null,"afterFx":0},{"text":"Les sources évoquent notamment des repas où maîtres et esclaves partageaient la fête dans un ordre moins strict qu’à l’ordinaire.","pause":850,"fx":null,"afterFx":0},{"text":"Attention cependant à une image trop moderne.","pause":700,"fx":null,"afterFx":0},{"text":"Les Saturnales n’abolissaient évidemment pas l’esclavage pendant une semaine.","pause":750,"fx":null,"afterFx":0},{"text":"Elles mettaient temporairement en scène un monde où les hiérarchies étaient brouillées.","pause":800,"fx":null,"afterFx":0},{"text":"Et les Romains adoraient ça.","pause":700,"fx":null,"afterFx":0},{"text":"Le cri traditionnel était : Io Saturnalia !","pause":850,"fx":null,"afterFx":500}]},{"title":"6. Les Saturnales sont-elles l’ancêtre direct de Noël ?","cues":[{"text":"Vous entendrez souvent une affirmation très simple : Noël serait directement l’héritier des Saturnales.","pause":800,"fx":null,"afterFx":0},{"text":"C’est beaucoup trop net pour l’histoire réelle.","pause":750,"fx":null,"afterFx":0},{"text":"Oui, les Saturnales avaient lieu en décembre.","pause":650,"fx":null,"afterFx":0},{"text":"Oui, on échangeait des cadeaux.","pause":650,"fx":null,"afterFx":0},{"text":"Oui, les fêtes de l’hiver romain ont pu influencer certaines pratiques culturelles ultérieures.","pause":800,"fx":null,"afterFx":0},{"text":"Mais cela ne suffit pas à démontrer qu’une fête moderne descend directement, coutume par coutume, des Saturnales.","pause":850,"fx":null,"afterFx":0},{"text":"Les traditions changent, se mélangent et se réinventent pendant des siècles.","pause":750,"fx":null,"afterFx":0},{"text":"Donc, plutôt que de dire : les Saturnales étaient le Noël romain…","pause":950,"fx":null,"afterFx":0},{"text":"Il vaut mieux dire qu’elles faisaient partie du grand paysage des fêtes d’hiver de Rome.","pause":850,"fx":null,"afterFx":0},{"text":"C’est moins spectaculaire.","pause":650,"fx":null,"afterFx":0},{"text":"Mais historiquement beaucoup plus propre.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. L’inscription — et les huit colonnes qui ont survécu","cues":[{"text":"Avant de repartir, levez les yeux vers l’inscription au-dessus des colonnes.","pause":750,"fx":null,"afterFx":0},{"text":"Elle dit en substance que le Sénat et le peuple romain ont restauré le temple après sa destruction par un incendie.","pause":800,"fx":null,"afterFx":0},{"text":"Cette restauration tardive explique une partie de ce que vous voyez aujourd’hui.","pause":750,"fx":null,"afterFx":0},{"text":"Le monument a été reconstruit avec des éléments provenant de phases antérieures et avec des matériaux réemployés.","pause":850,"fx":null,"afterFx":0},{"text":"Les huit colonnes sont donc moins le reste intact d’un seul bâtiment que le dernier état visible d’une très longue histoire architecturale.","pause":850,"fx":null,"afterFx":0},{"text":"C’est presque une définition de Rome.","pause":700,"fx":null,"afterFx":0},{"text":"On bâtit.","pause":500,"fx":null,"afterFx":0},{"text":"On brûle.","pause":500,"fx":null,"afterFx":0},{"text":"On restaure.","pause":500,"fx":null,"afterFx":0},{"text":"On récupère les matériaux disponibles.","pause":600,"fx":null,"afterFx":0},{"text":"Et deux mille ans plus tard, huit colonnes suffisent encore à dominer une extrémité du Forum.","pause":850,"fx":null,"afterFx":0},{"text":"Vous pouvez maintenant poursuivre vers le Capitole.","pause":900,"fx":null,"afterFx":500}]}];
const CAPITOLE=[{"title":"1. Vous venez de changer de Rome","cues":[{"text":"Vous venez de quitter le Forum antique et vous arrivez maintenant sur le Capitole.","pause":750,"fx":null,"afterFx":450},{"text":"Le changement est presque brutal.","pause":650,"fx":null,"afterFx":0},{"text":"En bas : temples, basiliques et ruines de la Rome impériale.","pause":750,"fx":null,"afterFx":0},{"text":"Ici : une place ordonnée, des façades Renaissance et le siège de la ville moderne.","pause":800,"fx":null,"afterFx":0},{"text":"Pourtant, vous êtes toujours sur l’une des collines les plus importantes de toute l’histoire de Rome.","pause":800,"fx":null,"afterFx":0},{"text":"Le Capitole était à la fois un centre religieux majeur de la Rome antique et, bien plus tard, un centre du pouvoir civique.","pause":850,"fx":null,"afterFx":0},{"text":"Autrement dit, la fonction change…","pause":950,"fx":null,"afterFx":0},{"text":"Mais l’adresse reste prestigieuse.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. Avant Michel-Ange — la colline de Jupiter","cues":[{"text":"Avant de regarder la place actuelle, imaginez la colline dans l’Antiquité.","pause":750,"fx":null,"afterFx":0},{"text":"Sur l’un de ses sommets se dressait le grand temple de Jupiter Optimus Maximus.","pause":800,"fx":null,"afterFx":450},{"text":"Jupiter Très Bon, Très Grand.","pause":700,"fx":null,"afterFx":0},{"text":"C’était l’un des sanctuaires les plus importants de l’État romain.","pause":750,"fx":null,"afterFx":0},{"text":"Les généraux victorieux y achevaient leur triomphe.","pause":750,"fx":null,"afterFx":0},{"text":"Le Capitole dominait donc symboliquement le Forum que vous venez de traverser.","pause":800,"fx":null,"afterFx":0},{"text":"Sur l’autre sommet se trouvait notamment le sanctuaire de Junon Moneta.","pause":800,"fx":null,"afterFx":0},{"text":"Et c’est là qu’apparaît une jolie trace dans notre vocabulaire moderne.","pause":750,"fx":null,"afterFx":0},{"text":"La monnaie romaine fut associée à ce secteur et au nom de Moneta.","pause":750,"fx":null,"afterFx":450},{"text":"De ce nom viennent ensuite des mots comme monnaie en français et money en anglais.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. Les oies qui auraient sauvé Rome","cues":[{"text":"Le sanctuaire de Junon Moneta est aussi lié à l’une des légendes les plus célèbres du Capitole.","pause":800,"fx":null,"afterFx":0},{"text":"La tradition antique raconte qu’au début du quatrième siècle avant notre ère, des Gaulois tentèrent de prendre le Capitole de nuit.","pause":850,"fx":null,"afterFx":0},{"text":"Les chiens n’auraient rien entendu.","pause":650,"fx":null,"afterFx":0},{"text":"Mais les oies sacrées de Junon, elles, se seraient mises à crier.","pause":350,"fx":"geese_real","afterFx":500},{"text":"Le vacarme aurait réveillé les défenseurs et permis de repousser l’attaque.","pause":800,"fx":null,"afterFx":0},{"text":"C’est une histoire transmise par les auteurs antiques, pas un événement que l’archéologie permet de reconstituer minute par minute.","pause":850,"fx":null,"afterFx":0},{"text":"Mais les Romains adoraient ce genre de récit où les dieux, les animaux et le destin de la ville se rencontrent.","pause":800,"fx":null,"afterFx":0},{"text":"Moralité antique : parfois, la sécurité de Rome dépend d’une oie qui fait correctement son travail.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. Le Palais Sénatorial — la Rome médiévale reprend la colline","cues":[{"text":"Regardez maintenant le bâtiment qui ferme la place devant vous.","pause":750,"fx":null,"afterFx":0},{"text":"C’est le Palais Sénatorial.","pause":700,"fx":null,"afterFx":0},{"text":"Il est aujourd’hui le siège de la municipalité de Rome.","pause":750,"fx":null,"afterFx":0},{"text":"Son histoire médiévale commence bien avant la grande transformation de Michel-Ange.","pause":800,"fx":null,"afterFx":0},{"text":"À partir du douzième siècle, le Capitole redevient le cœur du pouvoir civique romain.","pause":800,"fx":null,"afterFx":0},{"text":"Et détail particulièrement romain : le palais s’appuie en partie sur des structures antiques, notamment le Tabularium.","pause":850,"fx":null,"afterFx":0},{"text":"Le Tabularium était un grand bâtiment de la fin de la République lié aux archives publiques.","pause":800,"fx":null,"afterFx":0},{"text":"Encore une fois, Rome ne remplace pas totalement une époque par une autre.","pause":750,"fx":null,"afterFx":0},{"text":"Elle pose la suivante dessus.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. Michel-Ange retourne littéralement le Capitole","cues":[{"text":"Au seizième siècle, la place est profondément réorganisée.","pause":750,"fx":null,"afterFx":0},{"text":"Le pape Paul Trois confie à Michel-Ange le projet de transformation du Capitole.","pause":800,"fx":null,"afterFx":0},{"text":"La statue de Marc Aurèle arrive sur la colline en quinze-cent-trente-huit et devient le point central de la composition.","pause":850,"fx":null,"afterFx":0},{"text":"Mais l’idée la plus spectaculaire est peut-être invisible au premier regard.","pause":750,"fx":null,"afterFx":0},{"text":"Michel-Ange change l’orientation symbolique du lieu.","pause":750,"fx":null,"afterFx":0},{"text":"Dans l’Antiquité, la colline regardait vers le Forum.","pause":700,"fx":null,"afterFx":0},{"text":"La nouvelle place s’ouvre désormais vers la ville moderne et le Champ de Mars.","pause":800,"fx":null,"afterFx":0},{"text":"La Rome des papes tourne littéralement le dos à la Rome des empereurs.","pause":850,"fx":null,"afterFx":0},{"text":"Pas par mépris.","pause":600,"fx":null,"afterFx":0},{"text":"Mais parce que le centre de gravité de la ville a changé.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. La Cordonata — un escalier conçu comme une entrée en scène","cues":[{"text":"Regardez maintenant la grande rampe qui descend vers la ville.","pause":750,"fx":null,"afterFx":0},{"text":"C’est la Cordonata.","pause":650,"fx":null,"afterFx":0},{"text":"Ce n’est pas exactement un escalier ordinaire.","pause":650,"fx":null,"afterFx":0},{"text":"Ses marches sont longues et très peu hautes, de façon à rendre la montée beaucoup plus douce.","pause":800,"fx":null,"afterFx":0},{"text":"Elle pouvait même être empruntée à cheval.","pause":750,"fx":null,"afterFx":450},{"text":"Michel-Ange ne conçoit donc pas seulement un accès pratique.","pause":700,"fx":null,"afterFx":0},{"text":"Il construit une véritable entrée cérémonielle.","pause":750,"fx":null,"afterFx":0},{"text":"En haut, regardez les deux grandes statues qui encadrent l’arrivée.","pause":750,"fx":null,"afterFx":0},{"text":"Ce sont les Dioscures, Castor et Pollux.","pause":700,"fx":null,"afterFx":0},{"text":"Ces groupes antiques furent découverts au seizième siècle puis installés ici en quinze-cent-quatre-vingt-trois.","pause":850,"fx":null,"afterFx":0},{"text":"Même l’accès Renaissance se termine donc avec deux géants venus de l’Antiquité.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. Marc Aurèle — l’empereur qui survécut grâce à une erreur","cues":[{"text":"Au centre de la place, regardez la statue équestre.","pause":750,"fx":null,"afterFx":0},{"text":"Celle que vous voyez dehors est aujourd’hui une copie.","pause":700,"fx":null,"afterFx":0},{"text":"L’original antique est conservé à l’intérieur des Musées du Capitole pour le protéger.","pause":800,"fx":null,"afterFx":0},{"text":"La statue représente Marc Aurèle, empereur du deuxième siècle.","pause":750,"fx":null,"afterFx":0},{"text":"Elle est exceptionnelle parce que très peu de grandes statues équestres en bronze de l’Antiquité ont survécu.","pause":800,"fx":null,"afterFx":0},{"text":"Beaucoup furent fondues au cours des siècles pour récupérer leur métal.","pause":750,"fx":null,"afterFx":450},{"text":"Marc Aurèle eut peut-être une chance extraordinaire.","pause":700,"fx":null,"afterFx":0},{"text":"Au Moyen Âge, le cavalier fut identifié à tort comme Constantin, le premier empereur romain devenu chrétien.","pause":850,"fx":null,"afterFx":0},{"text":"Cette identification erronée est généralement considérée comme l’une des raisons majeures de sa conservation.","pause":800,"fx":null,"afterFx":0},{"text":"Une erreur d’identité vieille de plusieurs siècles…","pause":950,"fx":null,"afterFx":0},{"text":"Et l’un des plus grands bronzes antiques nous est parvenu.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. La place de Michel-Ange… achevée quatre siècles plus tard","cues":[{"text":"Regardez maintenant le sol autour de Marc Aurèle.","pause":750,"fx":null,"afterFx":0},{"text":"Le grand motif géométrique en étoile semble indissociable de la place.","pause":750,"fx":null,"afterFx":0},{"text":"Michel-Ange avait bien imaginé la statue au centre d’un espace ovale organisé par ce dessin.","pause":800,"fx":null,"afterFx":0},{"text":"Mais le motif que vous voyez aujourd’hui n’a été réalisé qu’en mille-neuf-cent-quarante.","pause":850,"fx":null,"afterFx":0},{"text":"Michel-Ange, mort en quinze-cent-soixante-quatre, n’a donc jamais vu la place achevée telle que vous la voyez.","pause":850,"fx":null,"afterFx":0},{"text":"Les bâtiments eux-mêmes furent poursuivis et complétés par d’autres architectes après sa mort.","pause":800,"fx":null,"afterFx":0},{"text":"Les deux palais latéraux abritent aujourd’hui les Musées du Capitole.","pause":750,"fx":null,"afterFx":0},{"text":"Leur collection trouve notamment son origine dans la donation de bronzes antiques faite au peuple romain par le pape Sixte Quatre en quatorze-cent-soixante-et-onze.","pause":850,"fx":null,"afterFx":0},{"text":"Vous êtes donc sur une place Renaissance construite sur une colline sacrée antique, bordée par une institution muséale née de la redécouverte de cette même Antiquité.","pause":900,"fx":null,"afterFx":0},{"text":"Rome adore les boucles temporelles.","pause":750,"fx":null,"afterFx":0},{"text":"Avant de partir, tournez-vous une dernière fois vers la direction du Forum.","pause":750,"fx":null,"afterFx":450},{"text":"En quelques minutes, vous venez de traverser plus de deux mille ans sans quitter la même colline.","pause":850,"fx":null,"afterFx":0},{"text":"Vous pouvez maintenant descendre vers le Théâtre de Marcellus.","pause":900,"fx":null,"afterFx":500}]}];
const MARCELLUS=[{"title":"1. Avant le Colisée, Rome avait déjà son grand théâtre","cues":[{"text":"Regardez maintenant la grande façade courbe devant vous.","pause":750,"fx":null,"afterFx":0},{"text":"Elle rappelle immédiatement le Colisée.","pause":700,"fx":null,"afterFx":0},{"text":"Mais attention à la chronologie.","pause":650,"fx":null,"afterFx":0},{"text":"Le Théâtre de Marcellus est plus ancien d’environ quatre-vingt-dix ans.","pause":800,"fx":null,"afterFx":0},{"text":"Le projet commence sous Jules César.","pause":700,"fx":null,"afterFx":0},{"text":"Il fait exproprier et démolir une partie du quartier pour installer ici un grand théâtre permanent.","pause":800,"fx":null,"afterFx":0},{"text":"Mais César est assassiné avant de voir le projet terminé.","pause":750,"fx":null,"afterFx":0},{"text":"C’est Auguste qui reprend le chantier, l’agrandit et l’achève.","pause":800,"fx":null,"afterFx":0},{"text":"Autrement dit, même avant l’Empire proprement dit, le spectacle est déjà une affaire d’urbanisme monumental.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. Pourquoi s’appelle-t-il Théâtre de Marcellus ?","cues":[{"text":"Le nom du théâtre n’est pas celui d’un empereur.","pause":700,"fx":null,"afterFx":0},{"text":"Il vient de Marcus Claudius Marcellus.","pause":700,"fx":null,"afterFx":0},{"text":"Marcellus était le fils d’Octavie, la sœur d’Auguste.","pause":700,"fx":null,"afterFx":0},{"text":"Il était donc le neveu de l’empereur.","pause":650,"fx":null,"afterFx":0},{"text":"Et surtout, il semblait promis à un avenir politique exceptionnel.","pause":750,"fx":null,"afterFx":0},{"text":"Mais il meurt très jeune, à Baïes, en vingt-sept avant notre ère.","pause":800,"fx":null,"afterFx":0},{"text":"Auguste donne ensuite son nom au théâtre en sa mémoire.","pause":750,"fx":null,"afterFx":0},{"text":"Le bâtiment devient ainsi à la fois un lieu de spectacle et un monument familial.","pause":800,"fx":null,"afterFx":0},{"text":"Chez Auguste, architecture et mémoire personnelle ont souvent une remarquable capacité à se rencontrer.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. L’anecdote littéraire — « Tu Marcellus eris »","cues":[{"text":"La mort de Marcellus a aussi laissé une trace célèbre dans la littérature romaine.","pause":750,"fx":null,"afterFx":0},{"text":"Dans l’Énéide, Virgile fait apparaître le jeune Marcellus parmi les grandes figures de l’avenir de Rome.","pause":800,"fx":null,"afterFx":0},{"text":"Le passage se termine par une formule devenue célèbre : Tu Marcellus eris.","pause":850,"fx":null,"afterFx":0},{"text":"Tu seras Marcellus.","pause":700,"fx":null,"afterFx":0},{"text":"Une tradition tardive raconte que Virgile lut ce passage devant Auguste et Octavie.","pause":800,"fx":null,"afterFx":0},{"text":"En entendant évoquer son fils mort, Octavie se serait évanouie.","pause":800,"fx":null,"afterFx":0},{"text":"L’histoire est touchante.","pause":650,"fx":null,"afterFx":0},{"text":"Mais elle nous vient d’une tradition biographique postérieure et ne peut pas être vérifiée comme un reportage contemporain.","pause":850,"fx":null,"afterFx":0},{"text":"Elle montre néanmoins à quel point le souvenir de Marcellus était associé à l’idée d’un avenir interrompu.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. Regardez la façade — le modèle du théâtre romain","cues":[{"text":"Revenez maintenant au bâtiment lui-même.","pause":700,"fx":null,"afterFx":0},{"text":"Le théâtre faisait environ cent-trente mètres de diamètre.","pause":750,"fx":null,"afterFx":0},{"text":"Il pouvait accueillir environ quinze à vingt mille spectateurs.","pause":800,"fx":null,"afterFx":0},{"text":"La façade comportait trois niveaux.","pause":650,"fx":null,"afterFx":0},{"text":"Les deux niveaux inférieurs conservés aujourd’hui présentent de grandes arcades.","pause":750,"fx":null,"afterFx":0},{"text":"Au premier niveau, les demi-colonnes sont d’ordre dorique.","pause":700,"fx":null,"afterFx":0},{"text":"Au-dessus, elles sont ioniques.","pause":700,"fx":null,"afterFx":0},{"text":"Cette superposition d’ordres architecturaux sera reprise plus tard de manière spectaculaire au Colisée.","pause":850,"fx":null,"afterFx":0},{"text":"Voilà pourquoi l’air de famille est si évident.","pause":700,"fx":null,"afterFx":0},{"text":"Le Colisée n’a pas copié ce théâtre au millimètre…","pause":950,"fx":null,"afterFx":0},{"text":"Mais il appartient clairement au même langage architectural romain.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. Théâtre, pas amphithéâtre","cues":[{"text":"Autre distinction importante : vous êtes devant un théâtre, pas un amphithéâtre.","pause":800,"fx":null,"afterFx":0},{"text":"Le Colisée est fermé sur lui-même, avec une arène centrale entourée de gradins.","pause":800,"fx":null,"afterFx":0},{"text":"Ici, les gradins formaient un demi-cercle face à une scène.","pause":750,"fx":null,"afterFx":0},{"text":"On venait y voir des représentations théâtrales et d’autres spectacles scéniques.","pause":800,"fx":null,"afterFx":0},{"text":"La scène était richement décorée de colonnes et de statues en marbres blancs et colorés.","pause":800,"fx":null,"afterFx":0},{"text":"Un velum pouvait protéger une partie du public du soleil.","pause":750,"fx":null,"afterFx":450},{"text":"Et contrairement à l’image silencieuse des ruines, imaginez plusieurs milliers de personnes entrant, discutant, applaudissant et commentant le spectacle.","pause":850,"fx":"applause_real","afterFx":450},{"text":"Un théâtre romain était tout sauf un lieu calme.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. Les masques géants et les temples voisins","cues":[{"text":"La façade possédait aussi un décor aujourd’hui presque entièrement disparu.","pause":750,"fx":null,"afterFx":0},{"text":"Les clés de certaines arcades portaient de grands masques de théâtre en marbre.","pause":800,"fx":null,"afterFx":0},{"text":"Ils représentaient notamment la tragédie, la comédie et le drame satyrique.","pause":800,"fx":null,"afterFx":0},{"text":"Le spectacle était donc annoncé dès l’extérieur du bâtiment.","pause":750,"fx":null,"afterFx":0},{"text":"Regardez également autour du théâtre.","pause":700,"fx":null,"afterFx":0},{"text":"Le quartier n’était pas consacré uniquement aux divertissements.","pause":700,"fx":null,"afterFx":0},{"text":"Tout près se trouvaient les temples d’Apollon Sosianus et de Bellone.","pause":800,"fx":null,"afterFx":0},{"text":"Les trois colonnes corinthiennes visibles à proximité appartiennent au temple d’Apollon, reconstruit à l’époque augustéenne.","pause":850,"fx":null,"afterFx":0},{"text":"Encore une fois, spectacle, religion et représentation politique partageaient presque le même décor urbain.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. Quand le théâtre devient une forteresse","cues":[{"text":"Puis l’Empire disparaît et le théâtre change complètement de fonction.","pause":750,"fx":null,"afterFx":0},{"text":"Sa position élevée près du Tibre et l’épaisseur de ses structures le rendent très intéressant pour les familles puissantes du Moyen Âge.","pause":850,"fx":null,"afterFx":0},{"text":"Il est transformé en forteresse.","pause":700,"fx":null,"afterFx":0},{"text":"Les Pierleoni puis les Fabi utilisent notamment le complexe.","pause":750,"fx":null,"afterFx":0},{"text":"Le lieu où des milliers de Romains venaient autrefois assister à des spectacles devient donc un élément du système défensif d’une famille aristocratique.","pause":850,"fx":null,"afterFx":0},{"text":"C’est une transformation spectaculaire…","pause":950,"fx":null,"afterFx":0},{"text":"Mais à Rome, elle est presque normale.","pause":700,"fx":null,"afterFx":0},{"text":"Les monuments antiques survivent souvent précisément parce qu’ils trouvent un nouvel usage.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. Regardez en haut — le théâtre est devenu un palais","cues":[{"text":"Maintenant, regardez franchement vers le sommet du bâtiment.","pause":750,"fx":null,"afterFx":0},{"text":"Vous verrez quelque chose que les Romains n’avaient évidemment pas prévu.","pause":750,"fx":null,"afterFx":0},{"text":"Un palais Renaissance repose directement sur la structure du théâtre antique.","pause":800,"fx":null,"afterFx":0},{"text":"Au seizième siècle, Baldassarre Peruzzi construit ce palais pour la famille Savelli.","pause":800,"fx":null,"afterFx":0},{"text":"Deux siècles plus tard, il passe aux Orsini.","pause":750,"fx":null,"afterFx":0},{"text":"C’est probablement l’une des meilleures images de la manière dont Rome se construit.","pause":800,"fx":null,"afterFx":0},{"text":"Un théâtre antique devient forteresse.","pause":650,"fx":null,"afterFx":0},{"text":"La forteresse devient palais.","pause":650,"fx":null,"afterFx":0},{"text":"Et le palais reste perché sur les arcades vieilles de deux mille ans.","pause":800,"fx":null,"afterFx":0},{"text":"Entre mille-neuf-cent-vingt-six et mille-neuf-cent-trente-deux, de grands travaux dégagent de nouveau la partie antique du monument.","pause":850,"fx":null,"afterFx":0},{"text":"Ce que vous voyez aujourd’hui n’est donc pas un théâtre antique resté intact.","pause":800,"fx":null,"afterFx":0},{"text":"C’est le résultat de deux millénaires d’occupations, de transformations et de restaurations.","pause":850,"fx":null,"afterFx":0},{"text":"Et c’est précisément ce qui le rend si romain.","pause":750,"fx":null,"afterFx":0},{"text":"Vous pouvez maintenant poursuivre vers le Portique d’Octavie.","pause":900,"fx":null,"afterFx":500}]}];
const OCTAVIE=[{"title":"1. Un monument dédié à la sœur d’Auguste","cues":[{"text":"Vous arrivez maintenant devant le Portique d’Octavie.","pause":750,"fx":null,"afterFx":0},{"text":"Son nom vient d’Octavie, la sœur de l’empereur Auguste.","pause":750,"fx":null,"afterFx":0},{"text":"Entre vingt-sept et vingt-trois avant notre ère, Auguste fait reconstruire ici un ensemble monumental plus ancien, le Portique de Metellus.","pause":850,"fx":null,"afterFx":0},{"text":"Puis il le dédie à sa sœur.","pause":700,"fx":null,"afterFx":0},{"text":"Octavie n’est pas une figure secondaire de la famille impériale.","pause":700,"fx":null,"afterFx":0},{"text":"Elle est la mère de Marcellus, dont vous venez de voir le théâtre.","pause":750,"fx":null,"afterFx":0},{"text":"En quelques centaines de mètres, l’urbanisme augustéen raconte donc aussi une histoire familiale.","pause":800,"fx":null,"afterFx":0},{"text":"Le théâtre porte le nom du neveu disparu.","pause":650,"fx":null,"afterFx":0},{"text":"Et le portique celui de sa mère.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. Ce que vous voyez n’était que l’entrée","cues":[{"text":"Regardez bien les vestiges devant vous.","pause":700,"fx":null,"afterFx":0},{"text":"Ils peuvent donner l’impression d’un monument relativement compact.","pause":700,"fx":null,"afterFx":0},{"text":"En réalité, vous ne voyez qu’une petite partie d’un ensemble gigantesque.","pause":800,"fx":null,"afterFx":0},{"text":"Le portique formait un vaste quadrilatère d’environ cent-dix-neuf mètres sur cent-trente-deux.","pause":850,"fx":null,"afterFx":0},{"text":"Des colonnades entouraient un grand espace intérieur.","pause":700,"fx":null,"afterFx":0},{"text":"Aujourd’hui, il reste surtout l’angle sud-est et le vestibule monumental d’entrée.","pause":800,"fx":null,"afterFx":0},{"text":"Donc, quand vous regardez ces colonnes…","pause":950,"fx":null,"afterFx":0},{"text":"Imaginez qu’elles ne soient que la porte d’un complexe beaucoup plus vaste qui s’étendait derrière elles.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. Deux temples, deux bibliothèques et une salle de réunion","cues":[{"text":"À l’intérieur du portique se trouvaient plusieurs bâtiments importants.","pause":750,"fx":null,"afterFx":0},{"text":"Il y avait notamment le temple de Junon Regina.","pause":700,"fx":null,"afterFx":0},{"text":"À côté se dressait le temple de Jupiter Stator.","pause":700,"fx":null,"afterFx":0},{"text":"Ce dernier était célèbre comme l’un des premiers grands temples de Rome entièrement construits en marbre.","pause":800,"fx":null,"afterFx":0},{"text":"Le complexe comprenait aussi deux bibliothèques.","pause":700,"fx":null,"afterFx":0},{"text":"L’une pour les textes grecs.","pause":600,"fx":null,"afterFx":0},{"text":"L’autre pour les textes latins.","pause":650,"fx":null,"afterFx":0},{"text":"Et une grande salle de réunion, la Curia Octaviae.","pause":750,"fx":null,"afterFx":0},{"text":"Ce portique n’était donc pas simplement une galerie couverte où l’on venait se promener.","pause":800,"fx":null,"afterFx":0},{"text":"C’était à la fois un espace religieux, culturel, politique et monumental.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. Un musée à ciel ouvert avant l’invention des musées","cues":[{"text":"Le portique abritait également de nombreuses œuvres d’art.","pause":750,"fx":null,"afterFx":0},{"text":"Les auteurs antiques décrivent plusieurs sculptures célèbres exposées dans l’ensemble.","pause":800,"fx":null,"afterFx":0},{"text":"Parmi elles figurait la fameuse turma Alexandri.","pause":750,"fx":null,"afterFx":0},{"text":"Un groupe de bronze attribué au sculpteur grec Lysippe, représentant Alexandre le Grand et ses cavaliers.","pause":850,"fx":null,"afterFx":0},{"text":"Autrement dit, on pouvait venir ici pour un sacrifice, consulter des textes, assister à une réunion…","pause":950,"fx":null,"afterFx":0},{"text":"Et croiser au passage des chefs-d’œuvre de l’art grec.","pause":800,"fx":null,"afterFx":0},{"text":"L’expression musée à ciel ouvert est moderne.","pause":700,"fx":null,"afterFx":0},{"text":"Mais l’expérience, elle, ne l’était pas tant que ça.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. Les colonnes visibles aujourd’hui sont surtout celles d’une reconstruction","cues":[{"text":"Voici maintenant un détail important pour lire correctement le monument.","pause":750,"fx":null,"afterFx":0},{"text":"Le portique augustéen a été endommagé plusieurs fois par le feu.","pause":750,"fx":null,"afterFx":0},{"text":"Après un incendie en cent-quatre-vingt-onze de notre ère, Septime Sévère et son fils Caracalla le font restaurer.","pause":850,"fx":null,"afterFx":0},{"text":"La reconstruction est achevée au début du troisième siècle.","pause":750,"fx":null,"afterFx":0},{"text":"Et la majorité des vestiges monumentaux visibles aujourd’hui appartiennent justement à cette phase sévérienne.","pause":850,"fx":null,"afterFx":0},{"text":"Donc le nom vous renvoie à Auguste…","pause":950,"fx":null,"afterFx":0},{"text":"Mais une grande partie de la pierre que vous avez sous les yeux est plus jeune d’environ deux siècles.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. Puis le portique devient… le grand marché aux poissons","cues":[{"text":"Avec la fin de l’Antiquité, le monument change radicalement de fonction.","pause":750,"fx":null,"afterFx":0},{"text":"Les espaces du portique sont progressivement occupés par des activités commerciales.","pause":750,"fx":null,"afterFx":0},{"text":"Et pendant le Moyen Âge, le secteur devient le grand marché aux poissons de Rome.","pause":350,"fx":"market_real","afterFx":550},{"text":"On l’appelle le Forum piscium, puis la Pescheria Vecchia.","pause":750,"fx":null,"afterFx":0},{"text":"Le marché restera actif jusqu’à la fin du dix-neuvième siècle.","pause":800,"fx":null,"afterFx":0},{"text":"Et il nous a laissé une anecdote particulièrement romaine.","pause":750,"fx":null,"afterFx":0},{"text":"Près du grand arc se trouvait une pierre servant de référence pour mesurer les poissons.","pause":800,"fx":null,"afterFx":0},{"text":"Si un poisson dépassait cette longueur entre la tête et la première nageoire, sa tête devait être remise aux magistrats du Capitole.","pause":850,"fx":null,"afterFx":0},{"text":"Même le poisson frais avait donc son règlement administratif.","pause":750,"fx":null,"afterFx":0},{"text":"Rome n’a manifestement jamais manqué de bureaucratie.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. Sant’Angelo in Pescheria — une église installée dans le monument","cues":[{"text":"Regardez maintenant comment l’église de Sant’Angelo in Pescheria s’insère littéralement dans les vestiges antiques.","pause":800,"fx":null,"afterFx":0},{"text":"Une première église est aménagée ici dans le dernier quart du huitième siècle.","pause":800,"fx":null,"afterFx":0},{"text":"Elle réutilise directement les structures du portique.","pause":750,"fx":null,"afterFx":0},{"text":"Son nom actuel rappelle ensuite le marché aux poissons installé autour d’elle.","pause":750,"fx":null,"afterFx":0},{"text":"C’est encore une fois la logique romaine parfaite.","pause":700,"fx":null,"afterFx":0},{"text":"Un monument païen devient structure d’une église chrétienne.","pause":750,"fx":null,"afterFx":0},{"text":"Et l’église finit par prendre le nom de l’activité commerciale qui se déroule sous ses fenêtres.","pause":850,"fx":null,"afterFx":0},{"text":"En mille-trois-cent-quarante-sept, c’est aussi de ce secteur que Cola di Rienzo part vers le Capitole lors de sa tentative de restaurer une forme de république romaine.","pause":850,"fx":null,"afterFx":0},{"text":"Même après l’Antiquité, le lieu continue donc à produire de l’histoire.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. Du portique antique au cœur du quartier juif","cues":[{"text":"Avant de repartir, regardez maintenant non seulement le monument, mais aussi le quartier autour de vous.","pause":800,"fx":null,"afterFx":0},{"text":"Vous êtes aujourd’hui au cœur de l’un des secteurs les plus liés à l’histoire de la communauté juive de Rome.","pause":800,"fx":null,"afterFx":0},{"text":"Le ghetto imposé par le pouvoir pontifical est créé en quinze-cent-cinquante-cinq dans cette zone proche du Tibre.","pause":850,"fx":null,"afterFx":0},{"text":"Ses limites et son aspect ont profondément changé depuis.","pause":750,"fx":null,"afterFx":0},{"text":"Mais la Via del Portico d’Ottavia reste aujourd’hui l’un des axes emblématiques du quartier juif romain.","pause":850,"fx":null,"afterFx":0},{"text":"Et cela donne au portique une dernière couche d’histoire.","pause":700,"fx":null,"afterFx":0},{"text":"Monument augustéen.","pause":550,"fx":null,"afterFx":0},{"text":"Reconstruction impériale.","pause":550,"fx":null,"afterFx":0},{"text":"Marché médiéval.","pause":550,"fx":null,"afterFx":0},{"text":"Église chrétienne.","pause":550,"fx":null,"afterFx":0},{"text":"Puis repère majeur d’un quartier encore vivant aujourd’hui.","pause":800,"fx":null,"afterFx":0},{"text":"Ici, les différentes Rome ne se succèdent pas vraiment.","pause":750,"fx":null,"afterFx":0},{"text":"Elles continuent à habiter le même endroit.","pause":800,"fx":null,"afterFx":0},{"text":"Vous pouvez maintenant poursuivre votre promenade dans le quartier.","pause":900,"fx":null,"afterFx":0}]}];
const CONSTANTIN=[{"title":"1. Le plus grand arc honorifique conservé à Rome","cues":[{"text":"Placez-vous de façon à voir l’arc dans son ensemble, avec le Colisée à proximité.","pause":750,"fx":null,"afterFx":0},{"text":"Vous êtes devant l’Arc de Constantin.","pause":700,"fx":null,"afterFx":0},{"text":"Avec environ vingt-cinq mètres de haut, c’est le plus grand arc honorifique romain conservé jusqu’à nous.","pause":800,"fx":null,"afterFx":0},{"text":"Il comporte trois passages : une grande arche centrale et deux passages plus petits.","pause":750,"fx":null,"afterFx":0},{"text":"Mais le plus intéressant n’est pas sa taille.","pause":700,"fx":null,"afterFx":0},{"text":"C’est sa date.","pause":600,"fx":null,"afterFx":0},{"text":"Nous sommes en trois-cent-quinze de notre ère.","pause":700,"fx":null,"afterFx":0},{"text":"Le Colisée est déjà vieux de plus de deux siècles.","pause":750,"fx":null,"afterFx":0},{"text":"Et l’Empire romain est en train de changer profondément.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. Une victoire romaine… contre d’autres Romains","cues":[{"text":"L’arc célèbre la victoire de Constantin sur son rival Maxence.","pause":750,"fx":null,"afterFx":0},{"text":"La bataille décisive a lieu le vingt-huit octobre trois-cent-douze, près du pont Milvius, au nord de Rome.","pause":850,"fx":null,"afterFx":0},{"text":"Ce détail est important : Constantin ne vient pas de vaincre une armée étrangère.","pause":800,"fx":null,"afterFx":0},{"text":"Il vient de gagner une guerre civile.","pause":700,"fx":null,"afterFx":0},{"text":"Maxence meurt pendant la bataille, noyé dans le Tibre lors de la retraite de ses troupes.","pause":800,"fx":null,"afterFx":0},{"text":"Constantin entre ensuite dans Rome en vainqueur.","pause":750,"fx":null,"afterFx":0},{"text":"Trois ans plus tard, le Sénat lui dédie cet arc, le vingt-cinq juillet trois-cent-quinze, à l’occasion de ses dix années de règne.","pause":850,"fx":null,"afterFx":0},{"text":"Tout le problème est donc de célébrer un triomphe…","pause":950,"fx":null,"afterFx":0},{"text":"Sans trop insister sur le fait que les vaincus étaient eux aussi romains.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. L’inscription — « sous l’inspiration de la divinité »","cues":[{"text":"Levez maintenant les yeux vers la grande inscription au sommet de l’arc.","pause":750,"fx":null,"afterFx":0},{"text":"À l’origine, les lettres étaient en bronze.","pause":700,"fx":null,"afterFx":0},{"text":"Le métal a disparu, mais les creux et les trous de fixation permettent encore de lire le texte.","pause":800,"fx":null,"afterFx":0},{"text":"L’inscription explique que Constantin a délivré l’État du tyran et de sa faction.","pause":800,"fx":null,"afterFx":0},{"text":"Le tyran, évidemment, c’est Maxence.","pause":700,"fx":null,"afterFx":0},{"text":"Mais une formule a fait couler énormément d’encre.","pause":750,"fx":null,"afterFx":0},{"text":"Instinctu divinitatis.","pause":750,"fx":null,"afterFx":0},{"text":"Sous l’inspiration de la divinité.","pause":750,"fx":null,"afterFx":0},{"text":"Remarquez ce qui manque : le nom de cette divinité.","pause":800,"fx":null,"afterFx":0},{"text":"La formule est assez vague pour pouvoir être comprise dans plusieurs traditions religieuses.","pause":850,"fx":null,"afterFx":0},{"text":"Et pour un monument voté par un Sénat encore largement attaché aux cultes traditionnels, cette ambiguïté était plutôt pratique.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. La vision de Constantin — histoire, tradition et versions différentes","cues":[{"text":"C’est ici qu’intervient l’un des récits les plus célèbres de l’histoire du christianisme.","pause":800,"fx":null,"afterFx":0},{"text":"Selon la tradition chrétienne, Constantin aurait reçu un signe divin avant sa victoire.","pause":800,"fx":null,"afterFx":0},{"text":"Mais attention : nos sources ne racontent pas exactement la même histoire.","pause":800,"fx":null,"afterFx":0},{"text":"Lactance, qui écrit peu après les événements, parle d’un rêve dans lequel Constantin reçoit l’ordre de placer un signe céleste sur les boucliers de ses soldats.","pause":900,"fx":null,"afterFx":0},{"text":"Eusèbe de Césarée raconte plus tard une vision beaucoup plus spectaculaire : un signe lumineux dans le ciel, puis un rêve.","pause":900,"fx":null,"afterFx":0},{"text":"C’est de cette tradition que vient la formule devenue célèbre : par ce signe, tu vaincras.","pause":850,"fx":null,"afterFx":0},{"text":"Impossible aujourd’hui de transformer ces récits en compte rendu journalistique de la veille de la bataille.","pause":850,"fx":null,"afterFx":0},{"text":"Et regardez l’arc lui-même.","pause":700,"fx":null,"afterFx":0},{"text":"Il ne montre ni croix triomphante ni scène explicite de conversion.","pause":800,"fx":null,"afterFx":0},{"text":"Le monument est donc particulièrement intéressant parce qu’il se trouve exactement au moment où le langage du pouvoir romain commence à changer…","pause":950,"fx":null,"afterFx":0},{"text":"Sans avoir encore complètement changé de vocabulaire.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. Le grand puzzle — Trajan, Hadrien et Marc Aurèle recyclés","cues":[{"text":"Regardez maintenant les reliefs de l’arc.","pause":700,"fx":null,"afterFx":0},{"text":"Ils ne datent pas tous du règne de Constantin.","pause":700,"fx":null,"afterFx":0},{"text":"Loin de là.","pause":600,"fx":null,"afterFx":0},{"text":"Une grande partie vient de monuments construits pour des empereurs beaucoup plus anciens.","pause":800,"fx":null,"afterFx":0},{"text":"Les grands éléments liés à Trajan remontent au début du deuxième siècle.","pause":750,"fx":null,"afterFx":0},{"text":"Les médaillons ronds, les tondi, appartiennent à l’époque d’Hadrien.","pause":750,"fx":null,"afterFx":0},{"text":"Et plusieurs grands panneaux de l’attique proviennent de monuments de l’époque de Marc Aurèle.","pause":800,"fx":null,"afterFx":0},{"text":"Les statues de prisonniers daces placées en hauteur viennent elles aussi de l’univers monumental de Trajan.","pause":850,"fx":null,"afterFx":0},{"text":"Ce n’est donc pas un arc décoré avec quelques antiquités trouvées au hasard.","pause":750,"fx":null,"afterFx":0},{"text":"C’est un programme organisé qui convoque délibérément les images de grands empereurs du passé.","pause":850,"fx":null,"afterFx":0},{"text":"Constantin s’installe visuellement dans leur lignée.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. Même les anciens empereurs deviennent Constantin","cues":[{"text":"Le recyclage va encore plus loin.","pause":700,"fx":null,"afterFx":0},{"text":"Sur plusieurs reliefs plus anciens, les visages des empereurs ont été retaillés.","pause":800,"fx":null,"afterFx":0},{"text":"Le but : leur donner les traits de Constantin.","pause":750,"fx":null,"afterFx":0},{"text":"Imaginez la logique.","pause":650,"fx":null,"afterFx":0},{"text":"Une scène sculptée deux siècles plus tôt montre Hadrien ou Marc Aurèle.","pause":750,"fx":null,"afterFx":0},{"text":"On modifie le portrait.","pause":600,"fx":null,"afterFx":0},{"text":"Et la scène participe désormais à la gloire du nouvel empereur.","pause":800,"fx":null,"afterFx":0},{"text":"Ce n’est pas du Photoshop.","pause":650,"fx":null,"afterFx":0},{"text":"C’est beaucoup plus définitif : on travaille directement dans le marbre.","pause":800,"fx":null,"afterFx":0},{"text":"Les anciens empereurs fournissent donc leurs victoires, leurs chasses, leurs sacrifices…","pause":950,"fx":null,"afterFx":0},{"text":"Et parfois même leur corps.","pause":700,"fx":null,"afterFx":0},{"text":"Constantin apporte le visage.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. Cherchez la frise de Constantin — elle raconte la guerre civile","cues":[{"text":"Les reliefs réellement sculptés pour l’arc se trouvent notamment dans la longue frise du niveau inférieur.","pause":800,"fx":null,"afterFx":0},{"text":"Elle raconte la campagne de Constantin contre Maxence.","pause":750,"fx":null,"afterFx":0},{"text":"On y voit le départ de l’armée, des combats, l’entrée victorieuse et des scènes de pouvoir à Rome.","pause":850,"fx":null,"afterFx":0},{"text":"Cherchez notamment la scène où Constantin s’adresse au peuple.","pause":750,"fx":null,"afterFx":0},{"text":"Et celle où il distribue des largesses.","pause":700,"fx":null,"afterFx":0},{"text":"Le message est soigneusement construit.","pause":700,"fx":null,"afterFx":0},{"text":"Constantin n’est pas présenté seulement comme celui qui gagne une bataille.","pause":750,"fx":null,"afterFx":0},{"text":"Il est celui qui restaure l’ordre, parle aux Romains et se montre généreux envers la cité.","pause":850,"fx":null,"afterFx":0},{"text":"L’arc transforme donc une guerre civile en récit de libération.","pause":850,"fx":null,"afterFx":0},{"text":"Le vainqueur n’est plus un prétendant qui a écrasé un autre prétendant.","pause":800,"fx":null,"afterFx":0},{"text":"Il devient le sauveur de Rome face au tyran.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. Ce qui manque aujourd’hui — la Meta Sudans et la route des triomphes","cues":[{"text":"Avant de repartir, regardez l’espace autour de l’arc.","pause":750,"fx":null,"afterFx":0},{"text":"Dans l’Antiquité, le décor était encore plus spectaculaire.","pause":750,"fx":null,"afterFx":0},{"text":"À proximité se dressait la Meta Sudans, une grande fontaine monumentale de l’époque flavienne.","pause":800,"fx":"fountain_real","afterFx":450},{"text":"Sa forme conique rappelait les bornes autour desquelles tournaient les chars dans les cirques.","pause":800,"fx":null,"afterFx":0},{"text":"L’eau ruisselait sur sa surface, d’où le nom Sudans : celle qui transpire.","pause":800,"fx":null,"afterFx":0},{"text":"Ses vestiges furent finalement démolis dans les années mille-neuf-cent-trente lors des grands réaménagements du secteur.","pause":850,"fx":null,"afterFx":0},{"text":"L’arc, lui, se trouvait sur la route empruntée par les grandes processions triomphales entre le Cirque Maxime et le Forum.","pause":850,"fx":null,"afterFx":0},{"text":"Vous êtes donc à un carrefour extraordinairement théâtral de la Rome impériale.","pause":800,"fx":null,"afterFx":0},{"text":"D’un côté, le Colisée.","pause":600,"fx":null,"afterFx":0},{"text":"À côté, la grande fontaine aujourd’hui disparue.","pause":650,"fx":null,"afterFx":0},{"text":"Devant vous, l’arc qui réécrit deux siècles d’histoire impériale pour les mettre au service de Constantin.","pause":850,"fx":null,"afterFx":0},{"text":"Et tout cela pour célébrer une victoire remportée sur d’autres Romains.","pause":800,"fx":null,"afterFx":0},{"text":"C’est probablement ce qui résume le mieux le monument.","pause":750,"fx":null,"afterFx":0},{"text":"À première vue, un arc de triomphe.","pause":650,"fx":null,"afterFx":0},{"text":"À y regarder de plus près, une gigantesque opération de communication politique en marbre.","pause":850,"fx":null,"afterFx":0},{"text":"Vous pouvez maintenant poursuivre vers San Clemente.","pause":900,"fx":null,"afterFx":500}]}];
const CIRCO_MASSIMO=[{"title":"1. Pour comprendre le Circus Maximus, commencez par regarder le vide","cues":[{"text":"Arrêtez-vous un instant et regardez toute la longueur de la vallée.","pause":750,"fx":null,"afterFx":0},{"text":"Le premier réflexe est parfois de se demander où est passé le monument.","pause":750,"fx":null,"afterFx":0},{"text":"La réponse est simple : vous êtes dedans.","pause":750,"fx":null,"afterFx":0},{"text":"Le Circus Maximus occupait cette immense vallée entre le Palatin et l’Aventin.","pause":800,"fx":null,"afterFx":0},{"text":"À son apogée, l’ensemble atteignait environ six-cents mètres de longueur pour environ cent-quarante mètres de largeur.","pause":850,"fx":null,"afterFx":0},{"text":"C’était le plus grand édifice de spectacle de Rome.","pause":750,"fx":null,"afterFx":0},{"text":"Les gradins monumentaux ont presque disparu, mais la forme du terrain vous donne encore l’échelle.","pause":800,"fx":null,"afterFx":0},{"text":"Pour une fois à Rome, le vide est lui-même un vestige.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. Avant les courses — la légende de l’enlèvement des Sabines","cues":[{"text":"Le Circus Maximus est associé par la tradition romaine à une histoire bien plus ancienne que les grands monuments de pierre.","pause":850,"fx":null,"afterFx":0},{"text":"Selon la légende, Romulus aurait organisé des jeux et invité les peuples voisins.","pause":800,"fx":null,"afterFx":0},{"text":"Pendant la fête, les Romains auraient enlevé des jeunes femmes sabines afin de donner des épouses à la nouvelle cité.","pause":850,"fx":null,"afterFx":0},{"text":"C’est le célèbre enlèvement des Sabines.","pause":750,"fx":null,"afterFx":0},{"text":"Les auteurs antiques relient cet épisode aux jeux célébrés dans cette vallée et au culte de Consus.","pause":850,"fx":null,"afterFx":0},{"text":"Mais nous sommes ici dans le récit des origines de Rome, pas dans un événement documenté comme une bataille historique.","pause":850,"fx":null,"afterFx":0},{"text":"Ce qui est intéressant, c’est que les Romains plaçaient eux-mêmes l’une de leurs légendes fondatrices dans ce paysage.","pause":850,"fx":null,"afterFx":0},{"text":"Avant même les quadriges, le cirque faisait donc déjà partie de la mémoire mythique de la ville.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. Des rois étrusques à Jules César — le cirque devient monumental","cues":[{"text":"La vallée est utilisée très tôt pour des compétitions et des rassemblements.","pause":750,"fx":null,"afterFx":0},{"text":"La tradition fait remonter les premiers aménagements à l’époque des rois Tarquins.","pause":800,"fx":null,"afterFx":0},{"text":"Pendant des siècles, le site évolue par étapes.","pause":700,"fx":null,"afterFx":0},{"text":"Puis Jules César lui donne au premier siècle avant notre ère une dimension véritablement monumentale.","pause":850,"fx":null,"afterFx":0},{"text":"Les gradins entourent désormais presque complètement la piste.","pause":750,"fx":null,"afterFx":0},{"text":"Sous l’Empire, incendies, reconstructions et agrandissements se succèdent.","pause":800,"fx":null,"afterFx":0},{"text":"Trajan reconstruit une grande partie du cirque au début du deuxième siècle.","pause":800,"fx":null,"afterFx":0},{"text":"Une grande partie des structures archéologiques encore visibles appartient justement à cette phase.","pause":850,"fx":null,"afterFx":0},{"text":"Le Circus Maximus n’est donc pas un monument construit une fois pour toutes.","pause":750,"fx":null,"afterFx":0},{"text":"C’est une machine de spectacle perfectionnée pendant des siècles.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. Comment se déroulait une course","cues":[{"text":"Imaginez maintenant la piste pleine.","pause":700,"fx":null,"afterFx":0},{"text":"À l’une des extrémités se trouvaient les carceres, les stalles de départ.","pause":750,"fx":null,"afterFx":0},{"text":"Les portes s’ouvraient presque simultanément pour donner à chaque attelage une chance comparable d’entrer dans la course.","pause":850,"fx":null,"afterFx":0},{"text":"Au centre de la piste s’étendait une longue barrière décorée que nous appelons généralement la spina.","pause":800,"fx":null,"afterFx":0},{"text":"Aux extrémités, les chars tournaient autour des metae, les bornes de virage.","pause":750,"fx":null,"afterFx":0},{"text":"C’était là que tout pouvait basculer.","pause":700,"fx":null,"afterFx":0},{"text":"Prendre le virage au plus près faisait gagner du terrain.","pause":700,"fx":null,"afterFx":0},{"text":"Quelques centimètres de trop pouvaient provoquer un accident en chaîne.","pause":800,"fx":null,"afterFx":0},{"text":"Les courses comptaient généralement sept tours.","pause":700,"fx":null,"afterFx":0},{"text":"Pour aider tout le monde à suivre, de grands œufs puis des dauphins mobiles servaient de compte-tours visibles depuis les gradins.","pause":850,"fx":null,"afterFx":0},{"text":"Pas besoin d’écran géant.","pause":650,"fx":null,"afterFx":0},{"text":"Rome avait trouvé une solution beaucoup plus monumentale.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. L’aurige — debout derrière quatre chevaux lancés à pleine vitesse","cues":[{"text":"Le conducteur du char s’appelait l’aurige.","pause":700,"fx":null,"afterFx":0},{"text":"Dans la course la plus emblématique, il conduisait un quadrige : quatre chevaux attelés de front.","pause":800,"fx":null,"afterFx":0},{"text":"Imaginez maintenant les attelages lancés sur la ligne droite.","pause":350,"fx":"horses_real","afterFx":600},{"text":"L’aurige conduisait debout dans un char léger, conçu pour la vitesse plutôt que pour la protection.","pause":800,"fx":null,"afterFx":0},{"text":"Les rênes pouvaient être passées autour de son corps afin de mieux contrôler les chevaux.","pause":800,"fx":null,"afterFx":0},{"text":"Technique efficace… jusqu’au moment où le char se renversait.","pause":800,"fx":null,"afterFx":0},{"text":"Les conducteurs portaient donc un couteau qui pouvait servir à couper les rênes pour éviter d’être traînés derrière l’attelage.","pause":850,"fx":null,"afterFx":0},{"text":"Les Romains appelaient certains accidents naufragia, des naufrages.","pause":800,"fx":null,"afterFx":0},{"text":"Le mot donne assez bien une idée du chaos.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. Vert, bleu, rouge ou blanc — choisissez votre camp","cues":[{"text":"Les courses n’opposaient pas seulement des individus.","pause":700,"fx":null,"afterFx":0},{"text":"Les auriges couraient pour de grandes factions, reconnaissables à leurs couleurs.","pause":750,"fx":null,"afterFx":0},{"text":"Les quatre couleurs classiques étaient le vert, le bleu, le rouge et le blanc.","pause":800,"fx":null,"afterFx":0},{"text":"Et les spectateurs avaient leurs favoris.","pause":650,"fx":null,"afterFx":0},{"text":"Ils encourageaient leur faction, criaient des slogans et suivaient les vedettes avec passion.","pause":350,"fx":"crowd_real","afterFx":550},{"text":"Nous sommes beaucoup plus près de la culture des supporters modernes que d’un public silencieux admirant poliment des chevaux.","pause":850,"fx":null,"afterFx":0},{"text":"Les factions avaient leurs chevaux, leur personnel, leurs stratégies et leurs stars.","pause":800,"fx":null,"afterFx":0},{"text":"Changer de faction pouvait même devenir un événement dans la carrière d’un grand aurige.","pause":850,"fx":null,"afterFx":0},{"text":"Le sport-spectacle n’a décidément pas attendu notre époque pour devenir une industrie.","pause":900,"fx":null,"afterFx":0}]},{"title":"7. Dioclès — une carrière gravée dans la pierre","cues":[{"text":"Nous connaissons plusieurs vedettes des courses grâce aux inscriptions antiques.","pause":750,"fx":null,"afterFx":0},{"text":"L’une des plus extraordinaires est Gaius Appuleius Diocles, originaire de Lusitanie, dans la péninsule Ibérique.","pause":850,"fx":null,"afterFx":0},{"text":"Une longue inscription résume sa carrière avec une précision presque statistique.","pause":800,"fx":null,"afterFx":0},{"text":"Elle lui attribue quatre-mille-deux-cent-cinquante-sept courses.","pause":750,"fx":null,"afterFx":0},{"text":"Mille-quatre-cent-soixante-deux victoires.","pause":750,"fx":null,"afterFx":0},{"text":"Et plus de trente-cinq millions de sesterces de gains cumulés.","pause":800,"fx":null,"afterFx":0},{"text":"Il courut pendant vingt-quatre ans et atteignit une quarantaine d’années, ce qui est déjà remarquable pour un métier aussi dangereux.","pause":850,"fx":null,"afterFx":0},{"text":"On le présente parfois aujourd’hui comme l’athlète le mieux payé de l’histoire après conversion en monnaie moderne.","pause":850,"fx":null,"afterFx":0},{"text":"Cette comparaison est très spéculative : convertir proprement un sesterce en euros ou en dollars n’a pas beaucoup de sens.","pause":850,"fx":null,"afterFx":0},{"text":"Mais le chiffre antique, lui, suffit à montrer une chose.","pause":750,"fx":null,"afterFx":0},{"text":"Une immense vedette du cirque pouvait devenir extraordinairement riche.","pause":900,"fx":null,"afterFx":0}]},{"title":"8. La spina — statues, dauphins et deux obélisques aujourd’hui ailleurs","cues":[{"text":"Revenez mentalement au centre de la piste.","pause":700,"fx":null,"afterFx":0},{"text":"La longue barrière centrale n’était pas vide.","pause":700,"fx":null,"afterFx":0},{"text":"Elle accumulait statues, monuments, compte-tours et décors.","pause":750,"fx":null,"afterFx":0},{"text":"Auguste y fit dresser un obélisque égyptien apporté d’Héliopolis.","pause":800,"fx":null,"afterFx":0},{"text":"Vous pouvez encore le voir à Rome aujourd’hui.","pause":700,"fx":null,"afterFx":0},{"text":"Mais plus ici : il se trouve maintenant sur la Piazza del Popolo.","pause":800,"fx":null,"afterFx":0},{"text":"Au quatrième siècle, Constance Deux fit installer dans le cirque un second obélisque encore plus gigantesque, venu de Karnak.","pause":850,"fx":null,"afterFx":0},{"text":"Celui-là se dresse aujourd’hui devant Saint-Jean-de-Latran.","pause":800,"fx":null,"afterFx":0},{"text":"Le Circus Maximus est donc un drôle de monument.","pause":700,"fx":null,"afterFx":0},{"text":"Une partie de son décor existe toujours…","pause":950,"fx":null,"afterFx":0},{"text":"Simplement dispersée dans Rome.","pause":900,"fx":null,"afterFx":0}]},{"title":"9. Après les derniers chars","cues":[{"text":"Les courses continuent ici jusque dans les premières décennies du sixième siècle.","pause":800,"fx":null,"afterFx":0},{"text":"Puis le gigantesque édifice perd sa fonction.","pause":700,"fx":null,"afterFx":0},{"text":"Les structures sont progressivement dépouillées de leurs matériaux.","pause":750,"fx":null,"afterFx":0},{"text":"La vallée devient en partie une zone agricole.","pause":700,"fx":null,"afterFx":0},{"text":"Bien plus tard, au dix-neuvième et au début du vingtième siècle, le secteur accueille des installations industrielles, des entrepôts et même des équipements liés au gaz.","pause":850,"fx":null,"afterFx":0},{"text":"Puis l’archéologie et les aménagements modernes redonnent progressivement au site son identité antique.","pause":800,"fx":null,"afterFx":0},{"text":"Avant de repartir, regardez encore une fois toute la longueur du terrain.","pause":750,"fx":null,"afterFx":0},{"text":"Essayez maintenant de remettre les gradins sur les côtés.","pause":700,"fx":null,"afterFx":0},{"text":"La spina au milieu.","pause":600,"fx":null,"afterFx":0},{"text":"Les couleurs des factions.","pause":600,"fx":null,"afterFx":0},{"text":"Et les attelages qui disparaissent au bout de la piste avant de revenir à pleine vitesse.","pause":800,"fx":null,"afterFx":0},{"text":"Le Circus Maximus fonctionne mieux quand on cesse de chercher ce qui reste…","pause":950,"fx":null,"afterFx":0},{"text":"Et qu’on reconstruit mentalement ce qui manque.","pause":850,"fx":null,"afterFx":0},{"text":"Vous pouvez maintenant poursuivre vers l’Aventin et le Jardin des Orangers.","pause":900,"fx":null,"afterFx":0}]}];
const ORANGERS=[{"title":"1. L’Aventin — la colline de Remus dans la légende","cues":[{"text":"Vous êtes maintenant sur l’Aventin, l’une des sept collines historiques de Rome.","pause":750,"fx":null,"afterFx":0},{"text":"Après le bruit et l’immensité du Circus Maximus, le changement d’atmosphère est assez spectaculaire.","pause":800,"fx":null,"afterFx":0},{"text":"L’Aventin est plus calme, plus résidentiel et plus retiré du centre antique que le Palatin.","pause":800,"fx":null,"afterFx":0},{"text":"Mais dans la tradition romaine, il est présent dès les origines de la ville.","pause":750,"fx":null,"afterFx":0},{"text":"Selon l’un des récits transmis par Tite-Live, Remus vient observer les oiseaux sur l’Aventin pendant que Romulus prend position sur le Palatin.","pause":900,"fx":null,"afterFx":0},{"text":"Les deux frères cherchent ainsi un signe divin pour savoir lequel donnera son nom et son autorité à la nouvelle cité.","pause":850,"fx":null,"afterFx":0},{"text":"Vous connaissez la suite : la tradition donne la victoire à Romulus.","pause":750,"fx":null,"afterFx":0},{"text":"Nous sommes évidemment dans le récit légendaire des origines, pas dans un épisode que l’archéologie permettrait de filmer image par image.","pause":900,"fx":null,"afterFx":0},{"text":"Mais il est assez agréable de penser qu’en venant du Palatin, vous venez justement de passer d’une colline de frère à l’autre.","pause":900,"fx":null,"afterFx":0}]},{"title":"2. Avant les orangers, une forteresse médiévale","cues":[{"text":"Regardez maintenant les grosses murailles qui entourent le jardin.","pause":750,"fx":null,"afterFx":0},{"text":"Elles ne sont pas antiques.","pause":650,"fx":null,"afterFx":0},{"text":"Le Jardin des Orangers occupe l’emplacement d’une forteresse construite par la famille Savelli vers la fin du treizième siècle.","pause":850,"fx":null,"afterFx":0},{"text":"Cette forteresse avait elle-même été bâtie sur un château plus ancien, appartenant au dixième siècle à la famille Crescenzi.","pause":850,"fx":null,"afterFx":0},{"text":"Dans les murs, on peut encore reconnaître des traces des anciennes tours et du dispositif du pont-levis.","pause":800,"fx":null,"afterFx":0},{"text":"Le bâtiment principal a presque entièrement disparu au début du dix-septième siècle.","pause":800,"fx":null,"afterFx":0},{"text":"Mais son enceinte a survécu.","pause":700,"fx":null,"afterFx":0},{"text":"Le paisible jardin où vous vous promenez est donc installé dans ce qui fut autrefois un espace défensif.","pause":850,"fx":null,"afterFx":0},{"text":"Les forteresses ont rarement une seconde vie aussi tranquille.","pause":900,"fx":null,"afterFx":0}]},{"title":"3. Le jardin est beaucoup plus récent qu’il n’en a l’air","cues":[{"text":"Le jardin lui-même n’est ni antique ni médiéval.","pause":700,"fx":null,"afterFx":0},{"text":"Il date de mille-neuf-cent-trente-deux.","pause":700,"fx":null,"afterFx":0},{"text":"L’architecte Raffaele De Vico aménage alors le Parc Savello à l’intérieur des anciennes murailles.","pause":800,"fx":null,"afterFx":0},{"text":"Regardez son organisation.","pause":650,"fx":null,"afterFx":0},{"text":"Le dessin est volontairement simple et symétrique.","pause":700,"fx":null,"afterFx":0},{"text":"Une grande allée centrale vous conduit directement vers le belvédère.","pause":750,"fx":null,"afterFx":0},{"text":"Autrement dit, le panorama n’arrive pas par hasard au bout de votre promenade.","pause":800,"fx":null,"afterFx":0},{"text":"Tout le jardin est construit pour vous y conduire.","pause":900,"fx":null,"afterFx":0}]},{"title":"4. Pourquoi des orangers ? L’histoire de saint Dominique","cues":[{"text":"Les arbres ont donné au parc son nom populaire : le Jardin des Orangers.","pause":750,"fx":null,"afterFx":0},{"text":"Ils rappellent la présence de saint Dominique et du couvent voisin de Santa Sabina.","pause":800,"fx":null,"afterFx":0},{"text":"Dominique fonde ici un couvent au début du treizième siècle.","pause":750,"fx":null,"afterFx":0},{"text":"La tradition locale conserve même un oranger associé au saint.","pause":800,"fx":null,"afterFx":0},{"text":"Il se trouve dans le cloître de Santa Sabina et peut être aperçu à travers une ouverture du portique de l’église.","pause":850,"fx":null,"afterFx":0},{"text":"La tradition raconte que Dominique aurait prêché auprès de cet arbre.","pause":800,"fx":null,"afterFx":0},{"text":"Il faut donc distinguer deux choses.","pause":700,"fx":null,"afterFx":0},{"text":"La présence ancienne de la communauté dominicaine est historique.","pause":750,"fx":null,"afterFx":0},{"text":"L’association précise de cet oranger au saint appartient, elle, à la tradition du lieu.","pause":900,"fx":null,"afterFx":0}]},{"title":"5. Le belvédère — Rome devient un paysage","cues":[{"text":"Avancez maintenant jusqu’au belvédère.","pause":800,"fx":null,"afterFx":0},{"text":"Ici, ne cherchez rien tout de suite.","pause":700,"fx":null,"afterFx":0},{"text":"Regardez simplement l’ensemble.","pause":900,"fx":null,"afterFx":0},{"text":"Sous vous coule le Tibre.","pause":700,"fx":null,"afterFx":0},{"text":"En face et sur les hauteurs, vous distinguez notamment le Janicule.","pause":750,"fx":null,"afterFx":0},{"text":"Et plus loin, la coupole de Saint-Pierre émerge au-dessus de la ville.","pause":800,"fx":null,"afterFx":0},{"text":"C’est l’un des endroits où l’on comprend particulièrement bien que Rome n’est pas construite sur un plan horizontal.","pause":850,"fx":null,"afterFx":0},{"text":"Les collines, le fleuve, les dômes et les quartiers se superposent.","pause":800,"fx":null,"afterFx":0},{"text":"Après plusieurs heures passées à chercher des détails dans les monuments…","pause":950,"fx":null,"afterFx":0},{"text":"Ici, vous avez le droit de ne rien chercher du tout.","pause":900,"fx":null,"afterFx":0}]},{"title":"6. Santa Sabina — quinze siècles juste à côté","cues":[{"text":"À quelques mètres du jardin se trouve la basilique Santa Sabina.","pause":750,"fx":null,"afterFx":0},{"text":"Même si vous n’entrez pas
